wn appointment/removal)\n4. **Personal responsibility**, independent judgement\n5. **Avoid conflicts of interest** – **no competing** with the company", "tags": ["midterm"]}, {"id": "bl-u5-loyalty-mandatory", "unit_no": 5, "section": "5.1 Directors' obligations & duties", "front": "Can the by-laws limit the duty of loyalty? Can directors be exempted?", "back": "The loyalty regime is **mandatory** – by-law clauses limiting it are void. But the **GM** may **exempt** a director in a specific case (use of assets, business opportunity, third-party advantage) when no damage to the company is expected (art. **230 LSC**).", "tags": ["midterm", "trap"]}, {"id": "bl-u5-bjr", "unit_no": 5, "section": "5.2 Business judgment rule & risk monitoring", "front": "What is the **business judgment rule** (art. 226 LSC)?", "back": "In **strategic and business decisions**, the orderly-entrepreneur standard is **deemed met** if the director acted:\n1. in **good faith**\n2. **without personal interest**\n3. with **sufficient information**\n4. following an **adequate decision procedure**", "tags": ["midterm"], "explain": "It protects directors' freedom to decide (**managerial discretion**): a bad *result* alone does not mean a breach. It is a **rebuttable presumption** – whoever sues must prove the standards weren't met. Memory trick **G-N-I-P**: Good faith, No interest, Information, Procedure."}, {"id": "bl-u5-bjr-excl", "unit_no": 5, "section": "5.2 Business judgment rule & risk monitoring", "front": "Which decisions are **excluded** from the business judgment rule?", "back": "Decisions that **personally affect other directors or related persons**, especially those authorising **art. 230** operations (conflicts of interest).", "tags": ["midterm", "trap"]}, {"id": "bl-u5-risk-mon", "unit_no": 5, "section": "5.2 Business judgment rule & risk monitoring", "front": "Why is **risk monitoring** part of the duty of care?", "back": "Directors must have an internal **information system** that detects gradual deterioration (profitability, finance) **in time**. No monitoring → possible **liability in vigilando** (breach of duty of care). **Unpredictable** events (e.g. **Covid-19**) are **not** a breach.", "tags": ["midterm"]}, {"id": "bl-u5-two-types", "unit_no": 5, "section": "5.3 Liability of directors", "front": "Two types of directors' financial liability?", "back": "1. **Liability for debts** (of the company, in crisis situations)\n2. **Liability for damages** (any damage caused by breach)\n(+ possible **criminal** liability, outside the course)", "tags": ["midterm"]}, {"id": "bl-u5-debts-nature", "unit_no": 5, "section": "5.3 Liability of directors", "front": "Is liability for company debts **direct** or **subsidiary**?", "back": "**Subsidiary** – creditors can claim from directors only if the company **cannot** pay (not merely doesn't want to).", "tags": ["midterm"]}, {"id": "bl-u5-debts-cases", "unit_no": 5, "section": "5.3 Liability of directors", "front": "Two cases of **liability for debts**?", "back": "1. Not filing for **insolvency** within **2 months** of insolvency → liable for debts arising **after** it should have been filed (culpable insolvency, art. 444 TRLC)\n2. Not **convening the GM** to dissolve when losses reduce **equity < ½ of capital** (art. 363.1.e LSC) → liable for debts arising **after** that point", "tags": ["midterm", "numbers"], "explain": "Key: only **later debts**, not earlier ones."}, {"id": "bl-u5-art236", "unit_no": 5, "section": "5.3 Liability of directors", "front": "Three requirements of liability for damages (art. 236 LSC)?", "back": "1. Act/omission **contrary to law/by-laws or duties**, with **fraud or fault**\n2. **Damage**\n3. **Causal link**\nFault is **presumed** if the act is contrary to law or by-laws.", "tags": ["midterm"]}, {"id": "bl-u5-gm-ratify", "unit_no": 5, "section": "5.3 Liability of directors", "front": "Director: \"The GM approved my decision, so I'm not liable.\" Correct?", "back": "**No.** Authorisation or ratification by the GM **never exonerates** (art. 236.2 LSC).", "tags": ["midterm", "trap"]}, {"id": "bl-u5-de-facto", "unit_no": 5, "section": "5.3 Liability of directors", "front": "Who is a **de facto director**? Are they liable?", "back": "A person who in reality performs director functions **without title**, with a **null/expired** title, or under another title, **or** the person whose **instructions** the directors follow. **Yes** – same liability as a de jure director (art. 236.3).", "tags": ["midterm"]}, {"id": "bl-u5-art237", "unit_no": 5, "section": "5.3 Liability of directors", "front": "Board adopts a harmful resolution. Who is liable (art. 237 LSC)?", "back": "**All members** who adopted/executed it, **jointly and severally** – except those who **prove** they (a) **expressly opposed** it, (b) were **unaware** of it, or (c) knowing it, did **everything possible** to avoid the damage.", "tags": ["midterm"], "explain": "Burden of proof is on the **director**."}, {"id": "bl-u5-actions", "unit_no": 5, "section": "5.4 Liability actions", "front": "Two **liability actions** against directors?", "back": "1. **Corporate action** (art. 238) – damage to the **company**\n2. **Individual action** (art. 241) – **direct** damage to **members or third parties**", "tags": ["midterm"]}, {"id": "bl-u5-corp-action", "unit_no": 5, "section": "5.4 Liability actions", "front": "Who can bring the **corporate liability action**, in which order?", "back": "1. The **company** (GM resolution – even **not on the agenda**; it implies **removal** of the directors)\n2. **Members with ≥ 5%** if: GM not convened when requested, company doesn't sue within **1 month**, or GM voted against (for **loyalty** breaches they may sue **directly**)\n3. **Creditors** if not brought by company/members and the company's assets are **insufficient** (art. 240)", "tags": ["midterm", "numbers"]}, {"id": "bl-u5-ind-action", "unit_no": 5, "section": "5.4 Liability actions", "front": "Requirements of the **individual action**?", "back": "- **Direct damage** to members/third parties\n- **Act of directors** in office\n- **Unlawfulness**\n- **Causal link** – burden of proof on the claimant", "tags": ["midterm"]}, {"id": "bl-u6-who-amends", "unit_no": 6, "section": "6.1 Amending the by-laws", "front": "Who amends the by-laws?", "back": "As a rule **only the general meeting** (art. 285.1 LSC). The GM may amend freely unless unlawful or against the principles of the company type (art. 28).", "tags": ["midterm"]}, {"id": "bl-u6-reqs", "unit_no": 6, "section": "6.1 Amending the by-laws", "front": "Requirements for a by-law amendment?", "back": "1. Points clearly stated in the **notice/agenda**\n2. Full **text** of the proposal (+ **written report** in the **S.A.**, art. 286)\n3. Notice states members' right to **examine/receive** the documents free\n4. Adopted with legal **quorum & majorities** (arts. 194, 201)\n5. **Public deed** + **Registry**", "tags": ["midterm"]}, {"id": "bl-u6-office-change", "unit_no": 6, "section": "6.1 Amending the by-laws", "front": "Who can move the **registered office**?", "back": "**Within Spain**: the **directors** (unless the by-laws expressly deny it) – art. **285.2 LSC**. **Abroad**: GM (structural change, RDL 5/2023).", "tags": ["midterm", "trap", "mock"], "explain": "Mock Q17(d) \"GM has no power to approve a transfer within Spain, exclusive competence of directors\" → **false**. Correct: (c)."}, {"id": "bl-u6-consent", "unit_no": 6, "section": "6.1 Amending the by-laws", "front": "When does an amendment need the **consent of the affected member**?", "back": "When it creates **new obligations** for members (e.g. payments to compensate losses, ancillary commitments) or, in the **S.A.**, restricts the **transfer** of registered shares or affects **classes** of shares (art. 291 ff.).", "tags": ["midterm"]}, {"id": "bl-u6-exit", "unit_no": 6, "section": "6.1 Amending the by-laws", "front": "What is the **right to exit** (derecho de separación) and when for a corporate purpose change?", "back": "The right to **leave** the company and get the **fair value** of the shares/stakes. Granted when the GM **substitutes or substantially modifies the corporate purpose** (art. **346 LSC**) – the nature of the investment changes.", "tags": ["midterm"]}, {"id": "bl-u6-inc-ways", "unit_no": 6, "section": "6.2 Capital increase", "front": "Two **ways** to increase capital?", "back": "1. **Issue new shares / create new stakes**\n2. **Increase the par value** of existing ones (art. 295.1 LSC)", "tags": ["midterm"]}, {"id": "bl-u6-inc-types", "unit_no": 6, "section": "6.2 Capital increase", "front": "Four types of capital increase by **exchange value** (contravalor)?", "back": "1. **Cash** contributions\n2. **Non-cash** contributions\n3. **Offsetting loans** (credit compensation)\n4. Charged to **profits or reserves**", "tags": ["midterm"], "explain": "Mind map: **Cash, Non-cash, Loans, Reserves**."}, {"id": "bl-u6-inc-who", "unit_no": 6, "section": "6.2 Capital increase", "front": "Who decides a capital increase? Can it be delegated?", "back": "The **GM** (by-law amendment). In the **S.A.**, the GM may **delegate** to the directors within limits (art. 297 LSC).", "tags": ["midterm"]}, {"id": "bl-u6-inc-steps", "unit_no": 6, "section": "6.2 Capital increase", "front": "Three general steps of a capital increase?", "back": "1. **Resolution** of the GM (directors' report, art. 286)\n2. **Execution** – subscription/take-up and payment\n3. **Registration** of resolution **and** execution **simultaneously** (art. 315)", "tags": ["midterm"]}, {"id": "bl-u6-art315", "unit_no": 6, "section": "6.2 Capital increase", "front": "Why must resolution and execution be registered **together**?", "back": "So the Registry publishes only increases that **actually happened** (who subscribed, how it was paid) – otherwise capital would lose credibility as a solvency indicator.", "tags": ["midterm"]}, {"id": "bl-u6-inc-cash", "unit_no": 6, "section": "6.2 Capital increase", "front": "Effect of a **cash** increase on equity and liquidity?", "back": "**+ cash → + capital → + equity**. More immediate liquidity and better long-term solvency. Need a **bank certificate**.", "tags": ["midterm"]}, {"id": "bl-u6-inc-noncash", "unit_no": 6, "section": "6.2 Capital increase", "front": "Effect of a **non-cash** increase? Extra requirement in S.A.?", "back": "**+ net assets → + capital → + equity**; liquidity not necessarily. **S.A.**: **independent expert report** (Registrar); not required in S.L.", "tags": ["midterm"]}, {"id": "bl-u6-inc-loans", "unit_no": 6, "section": "6.2 Capital increase", "front": "Capital increase by **offsetting loans**: effect and requirements?", "back": "**− debt → + capital → + equity** (no new cash). **S.A.**: ≥ **25%** of the loans **liquid, mature and payable** and the rest due within **5 years** + **auditor's certificate**. **S.L.**: **100%** liquid, mature and payable (art. 301).", "tags": ["midterm", "numbers", "mock"], "explain": "Mock Q20 → (c): increase by offsetting loans **does** increase equity."}, {"id": "bl-u6-inc-reserves", "unit_no": 6, "section": "6.2 Capital increase", "front": "Capital increase charged to **reserves**: effect on equity?", "back": "**Equity unchanged** – just a reclassification (reserves → capital). Requires a balance sheet (audited if mandatory) approved **≤ 6 months** before (art. 303). Effect: reserves become **unavailable** capital → stronger solvency image.", "tags": ["midterm", "trap", "numbers", "mock"], "explain": "Mock Q20(a) \"always increases equity\" → false; (d) \"increases equity if made by reserves\" → false."}, {"id": "bl-u6-premium", "unit_no": 6, "section": "6.2 Capital increase", "front": "What is a **share premium** (prima de emisión) and why use it?", "back": "Paying **more than par value** for new shares/stakes (art. 298), fully paid on subscription. Used when **new members** enter: compensates the old members for **reserves and expectations** built before → avoids **dilution of value**.", "tags": ["midterm"]}, {"id": "bl-u6-pre-emptive", "unit_no": 6, "section": "6.3 Pre-emptive right", "front": "What is the **pre-emptive right**? In which increases?", "back": "The old members' right to subscribe/take up new shares/stakes **in proportion** to their par value **before third parties** – in increases with **cash contributions** (art. 304 LSC). Called \"preferential subscription right\" in S.A.", "tags": ["midterm", "trap"], "explain": "Purpose: keep their **relative share** (% of capital)."}, {"id": "bl-u6-pre-period", "unit_no": 6, "section": "6.3 Pre-emptive right", "front": "Period to exercise the pre-emptive right?", "back": "Set by the directors, **not less than one month** (different for listed companies).", "tags": ["midterm", "numbers"]}, {"id": "bl-u6-pre-loss", "unit_no": 6, "section": "6.3 Pre-emptive right", "front": "What do members risk if they don't exercise the pre-emptive right?", "back": "Lower % → **smaller dividends**; drop in **book value** per share (unless a premium is charged); and they may fall **below 5%**, losing minority rights (e.g. requesting a GM, liability action).", "tags": ["midterm"]}, {"id": "bl-u6-pre-waive", "unit_no": 6, "section": "6.3 Pre-emptive right", "front": "How can the pre-emptive right be removed?", "back": "The **GM** may **exclude** it fully/partly (with specific requirements), or each member may **individually waive** it.", "tags": ["midterm"]}, {"id": "bl-u6-red-ways", "unit_no": 6, "section": "6.4 Capital reduction", "front": "Three ways to reduce capital (art. 317.2)?", "back": "1. **Reduce par value**\n2. **Redeem** (amortise) shares/stakes\n3. **Group** them to exchange them", "tags": ["midterm"]}, {"id": "bl-u6-red-purposes", "unit_no": 6, "section": "6.4 Capital reduction", "front": "Purposes of a capital reduction (art. 317.1)?", "back": "1. **Restore balance** between capital and equity reduced by **losses**\n2. Create/increase **legal or voluntary reserves**\n3. **Refund** contributions to members\n4. S.A.: **release** members from **called-up capital**", "tags": ["midterm"], "explain": "Mind map: balance restoration, reserve creation, refund contributions. Forms: voluntary, mandatory, **accordion**."}, {"id": "bl-u6-red-mandatory", "unit_no": 6, "section": "6.4 Capital reduction", "front": "When is a capital reduction **mandatory**?", "back": "Only in the **S.A.**: when losses reduce **equity below 2/3 of capital** and it isn't recovered within **one fiscal year** (art. **327 LSC**). It must affect all shares proportionally (art. 320).", "tags": ["midterm", "numbers", "trap"], "explain": "Don't mix up: **2/3 + 1 year → mandatory reduction (S.A.)** vs **½ → mandatory dissolution cause (S.A. and S.L.)**."}, {"id": "bl-u6-red-annex", "unit_no": 6, "section": "6.4 Capital reduction", "front": "Annex: S.A. capital €100,000, losses €50,000. Equity? Reduction of €30,000 – result?", "back": "Equity = €50,000 = 50% < 2/3 → after 1 year reduction mandatory. Reduce by €30,000: capital **€70,000**, losses **€20,000**, equity still **€50,000** = **71%** of capital > 2/3 ✔.\nBook entry: €30,000 (Capital) to (Accumulated losses) €30,000 – **no money moves**.", "tags": ["midterm", "numbers"]}, {"id": "bl-u6-red-steps", "unit_no": 6, "section": "6.4 Capital reduction", "front": "Steps of a capital reduction?", "back": "1. **GM resolution** (by-law amendment; directors' report justifying reason, amount, procedure…)\n2. **Execution**\n3. **Creditors' right to oppose** (S.A., certain cases)\n4. **Registration**", "tags": ["midterm"]}, {"id": "bl-u6-creditor-opp", "unit_no": 6, "section": "6.4 Capital reduction", "front": "When do creditors have a **right to oppose** a capital reduction?", "back": "In the **S.A.**, when the reduction **really reduces equity** (refund of contributions, release from called-up capital). **Not** when it restores the balance after losses or funds reserves (art. 335). Exercise within **1 month** of the last announcement; the reduction can't be executed until the debt is **secured** (e.g. bank guarantee).", "tags": ["midterm", "numbers", "mock", "trap"], "explain": "Mock Q15 → (a). (c) \"always granted\" → false; (b) \"directors decide\" → false."}, {"id": "bl-u6-accordion", "unit_no": 6, "section": "6.4 Capital reduction", "front": "What is the **\"accordion\"** operation (art. 343 LSC)?", "back": "A **reduction to compensate losses below the legal minimum** combined with a **simultaneous increase**. Conditions: (a) increased to **≥ legal minimum**, (b) **pre-emptive right** respected, (c) reduction **conditional** on the increase being executed, (d) **registered together**.", "tags": ["midterm"], "explain": "Alternative to avoid dissolution: **transform** the S.A. into an **S.L.** (min €3,000)."}, {"id": "bl-u7-sc-law", "unit_no": 7, "section": "7.1 Structural changes", "front": "Which law regulates **structural changes**?", "back": "**Real Decreto-ley 5/2023, of 28 June (RDLME)** – applies to all commercial companies (and partnerships).", "tags": ["midterm"]}, {"id": "bl-u7-sc-list", "unit_no": 7, "section": "7.1 Structural changes", "front": "Closed list of structural changes?", "back": "1. **Transformation**\n2. **Merger**\n3. **Division** (demerger)\n4. **Global assignment of assets and liabilities**\n(+ international transfer of registered office) – domestic and cross-border.", "tags": ["midterm"]}, {"id": "bl-u7-sc-phases", "unit_no": 7, "section": "7.1 Structural changes", "front": "Three phases of the merger procedure?", "back": "1. **Preparation**\n2. **Approval**\n3. **Execution**", "tags": ["midterm"]}, {"id": "bl-u7-merger-def", "unit_no": 7, "section": "7.2 Mergers", "front": "Legal definition of a **merger**?", "back": "A corporate operation affecting **two or more companies** that leads to the **extinction of all or some** of them and the **integration of their assets and members** into a **single company**.", "tags": ["midterm"]}, {"id": "bl-u7-merger-types", "unit_no": 7, "section": "7.2 Mergers", "front": "Two types of merger?", "back": "1. **By creation of a new company** – **all** merging companies are extinguished; a new one acquires everything by universal succession\n2. **By absorption** – one company **absorbs** the others, which are dissolved and extinguished (absorber usually **increases capital**)", "tags": ["midterm"], "explain": "Mock Q18(d) merger by absorption is a distractor – the block transfer where the transferring company receives shares is **segregation**."}, {"id": "bl-u7-merger-why", "unit_no": 7, "section": "7.2 Mergers", "front": "Typical economic reasons for mergers?", "back": "**Synergies, economies of scale, vertical integration, optimised financing**, growth in size.", "tags": ["midterm"]}, {"id": "bl-u7-draft", "unit_no": 7, "section": "7.2 Mergers", "front": "What is the **common draft terms of merger** (art. 39 RDLME) and its timing?", "back": "Drawn up by the **managing bodies of all companies**; published in the **Registry or on each website** at least **1 month** before the GMs. Must be approved within **6 months** of signature, otherwise it **lapses**.", "tags": ["midterm", "numbers"]}, {"id": "bl-u7-reports", "unit_no": 7, "section": "7.2 Mergers", "front": "Which reports accompany the merger draft?", "back": "A **directors' report** of each company justifying it + an **independent expert** report – **mandatory when any company is an S.A.**", "tags": ["midterm"]}, {"id": "bl-u7-exchange", "unit_no": 7, "section": "7.2 Mergers", "front": "What is the **exchange ratio** (exchange equation)?", "back": "The number of shares/stakes in the absorbing/new company given to members of the extinguished companies **in proportion to their participation**, calculated at **fair value** – so the value of members' equity is **not reduced**.", "tags": ["midterm"]}, {"id": "bl-u7-approval", "unit_no": 7, "section": "7.2 Mergers", "front": "Approval phase of a merger?", "back": "**GM of every company** approves the **common draft** strictly (art. 47), with LSC quorums/majorities. Notice **≥ 1 month** before; **merger balance sheet** ≤ **6 months** old (audited if required). **Consent** needed from members who become **unlimitedly liable**.", "tags": ["midterm", "numbers"]}, {"id": "bl-u7-universal-merger", "unit_no": 7, "section": "7.2 Mergers", "front": "Can merger formalities be simplified by unanimity?", "back": "Yes: if approved at a **universal GM by unanimity** in **each** company → no prior publication/deposit and **no directors' report** needed.", "tags": ["midterm"]}, {"id": "bl-u7-execution", "unit_no": 7, "section": "7.2 Mergers", "front": "Execution phase of a merger? When is it legally effective?", "back": "After the **1-month creditor opposition** period → **public deed** → **registration** in the Mercantile Registry. The merger takes legal effect **upon registration**. Afterwards it can only be challenged for breach of the RDLME, within **3 months**.", "tags": ["midterm", "numbers"]}, {"id": "bl-u7-special", "unit_no": 7, "section": "7.2 Mergers", "front": "What are **special mergers** (art. 53 ff. RDLME)?", "back": "Simplified mergers where the **same persons decide** in all companies. Main case: **absorption of a wholly-owned (100%) subsidiary** – simplified draft, **no expert reports**, **no capital increase** of the absorber, **no GM approval** of the absorbed company.", "tags": ["midterm", "case"], "explain": "This is exactly **Case 2, Facts 3** (PATINETES absorbs PTEL S.L.U.)."}, {"id": "bl-u7-division-why", "unit_no": 7, "section": "7.3 Divisions", "front": "Why divide a company?", "back": "To **reorganise**: separate activities or production phases into different companies, or distribute assets according to different financial needs. The opposite of a merger; merger rules apply (art. 63).", "tags": ["midterm"]}, {"id": "bl-u7-total", "unit_no": 7, "section": "7.3 Divisions", "front": "**Total demerger** (split-up), art. 59?", "back": "The company is **extinguished**; all its assets are divided into **two or more blocks**, each transferred to a new or existing company; the **members** receive shares of the beneficiaries in proportion.", "tags": ["midterm", "mock"], "explain": "Mock Q4 → (d): members of the divided company become members of the beneficiaries and the divided company is **extinguished**."}, {"id": "bl-u7-partial", "unit_no": 7, "section": "7.3 Divisions", "front": "**Partial demerger** (spin-off), art. 60?", "back": "Block transfer of **one or more parts** of the assets to beneficiaries; the **members** receive their shares; the divided company **survives** but **reduces its capital**.", "tags": ["midterm"]}, {"id": "bl-u7-segregation", "unit_no": 7, "section": "7.3 Divisions", "front": "**Segregation**, art. 61?", "back": "Block transfer of one or more parts of the assets to beneficiaries, but the **transferring company itself** receives the shares → **parent–subsidiary** relationship.", "tags": ["midterm", "mock", "trap"], "explain": "Mock Q18 → (a) segregation. Mock Q4(b) is wrong: in segregation members do **not** become direct owners of the beneficiaries' shares."}, {"id": "bl-u7-who-receives", "unit_no": 7, "section": "7.3 Divisions", "front": "Quick test: who receives the beneficiary's shares, and does the original company survive?", "back": "- **Total demerger**: members · company **extinguished**\n- **Partial demerger**: members · company **survives** (capital ↓)\n- **Segregation**: **the company itself** · company **survives**", "tags": ["midterm"]}, {"id": "bl-u7-three-phases-end", "unit_no": 7, "section": "7.4 Dissolution, liquidation, extinction", "front": "Three phases of company termination?", "back": "1. **Dissolution** (declaratory act)\n2. **Liquidation**\n3. **Extinction** (termination)", "tags": ["midterm", "trap"], "explain": "The company does **not** end in a single act. Mock Q19(d) → false."}, {"id": "bl-u7-causes", "unit_no": 7, "section": "7.4 Dissolution, liquidation, extinction", "front": "Causes of dissolution (art. 363 LSC + voluntary)?", "back": "1. **Term** in by-laws expires\n2. **GM resolution**\n3. **Cessation** of the activity / **impossibility** of the corporate purpose\n4. **Paralysis** of corporate bodies\n5. **Losses** → equity **< ½ of capital** (unless capital increased/reduced enough, and if insolvency isn't due)\n6. Capital **below the legal minimum**", "tags": ["midterm", "mock"], "explain": "Mock Q19 → (b): the law sets **legal causes** of mandatory dissolution."}, {"id": "bl-u7-paralysis", "unit_no": 7, "section": "7.4 Dissolution, liquidation, extinction", "front": "Example of **paralysis of corporate bodies**?", "back": "Two members with **50% each** who always vote opposite → no resolutions possible in GM or managing body → legal cause of dissolution.", "tags": ["midterm", "case"], "explain": "Very relevant for Case 1 (Pedro & María 50/50!) → use a shareholders' agreement with a deadlock clause."}, {"id": "bl-u7-dissolution-who", "unit_no": 7, "section": "7.4 Dissolution, liquidation, extinction", "front": "Who declares dissolution and what if the GM doesn't?", "back": "The **GM**. With a legal cause, directors **must convene** it (any member may request it, art. 365.1). If the GM rejects or can't agree → directors must request **judicial dissolution**. Failure → directors liable for debts arising **after** the cause. Formalised in **public deed + Registry** (or court judgment).", "tags": ["midterm"]}, {"id": "bl-u7-liquidation", "unit_no": 7, "section": "7.4 Dissolution, liquidation, extinction", "front": "What happens in **liquidation**?", "back": "The company **keeps legal personality**, adds \"**en liquidación**\" to its name, stops its corporate purpose. **Directors cease**; **liquidators** take over (art. 375). Tasks: **inventory & balance** within **3 months**, **pay creditors**, final balance, **distribute** the remainder to members in proportion to their capital.", "tags": ["midterm", "numbers"]}, {"id": "bl-u7-extinction", "unit_no": 7, "section": "7.4 Dissolution, liquidation, extinction", "front": "When is the company **extinguished**?", "back": "When, after liquidation and distribution, the liquidators grant a **public deed of extinction** and its entries are **cancelled** in the Registry; books are deposited there. → **End of legal personality**.", "tags": ["midterm"]}, {"id": "bl-u7-simplified-end", "unit_no": 7, "section": "7.4 Dissolution, liquidation, extinction", "front": "Can dissolution, liquidation and extinction happen in one act?", "back": "Yes – if there are **no assets or liabilities** left, a deed of **dissolution and extinction** can be granted in the same act (initial balance = final balance).", "tags": ["midterm"]}, {"id": "bl-u10-c1-form", "unit_no": 10, "section": "Case 1 – Setting up the start-up", "front": "Case 1: Pedro & María want to grow, attract Business Angels then VC, and sell. Which company type?", "back": "A **capital company** – most likely an **S.L.** now (low capital, flexible, cheap), possibly **transformed into an S.A.** later (many investors, free transfer, listing).", "tags": ["midterm"], "explain": "Growth + investors + exit ⇒ limited liability and a capital split into transferable units. A partnership doesn't fit (unlimited liability, no transfer without consent)."}, {"id": "bl-u10-c1-why-capital", "unit_no": 10, "section": "Case 1 – Setting up the start-up", "front": "Case 1: why a capital company rather than a partnership (María wants to protect her wealth)?", "back": "- Members **not personally liable** (art. 1 LSC) – María risks only her contribution\n- Easier **entry of investors** and **transfer** of shares/stakes\n- **Separation** of ownership/management (investors don't need to manage)\n- Credibility, standard for VC", "tags": ["midterm"], "explain": "In a general partnership she would be **personally, unlimitedly, jointly & severally** liable."}, {"id": "bl-u10-c1-sl-sa", "unit_no": 10, "section": "Case 1 – Setting up the start-up", "front": "Case 1: S.L. or S.A.? Arguments.", "back": "**S.L.**: min **€3,000**, 100% paid, **no expert report**, fewer formalities, flexible by-laws (vote allocation, transfer restrictions keep control).\n**S.A.**: min **€60,000**, shares **freely transferable**, needed for **listing**, more formalities.\n→ **S.L. now**, transform later if needed.", "tags": ["midterm"]}, {"id": "bl-u10-c1-steps", "unit_no": 10, "section": "Case 1 – Setting up the start-up", "front": "Case 1: main steps to set up the S.L.?", "back": "1. **Name certificate** (Central Mercantile Registry)\n2. **Bank account** + deposit capital → **bank certificate**\n3. Provisional **NIF** (tax ID)\n4. Draft **by-laws**\n5. **Deed of incorporation before a notary**\n6. Tax formalities\n7. **Register** in the Mercantile Registry of the province (within 1 year) → legal personality; definitive NIF", "tags": ["midterm"]}, {"id": "bl-u10-c1-capital", "unit_no": 10, "section": "Case 1 – Setting up the start-up", "front": "Case 1: capital amount, proportions, Pedro's work, investing via a company?", "back": "- Capital: at least **€3,000** (more for credibility/needs)\n- Proportions: **free** (e.g. 50/50 – but beware **deadlock = paralysis**; add a deadlock clause)\n- Pedro's **work** can't be capital (art. 58.2) → **ancillary commitment** (art. 86)\n- **Yes**, they can invest through their own S.L. (legal persons can be members/founders)", "tags": ["midterm"]}, {"id": "bl-u10-c1-sha", "unit_no": 10, "section": "Case 1 – Setting up the start-up", "front": "Case 1: what is a **shareholders' agreement** (pacto de socios)?", "back": "A **private contract** between (some) shareholders regulating their relationship beyond the by-laws. Binds **only signatories** (not the company/third parties), **confidential**, not registered.", "tags": ["midterm"], "explain": "Not in the unit notes – needed for the case answer."}, {"id": "bl-u10-c1-sha-content", "unit_no": 10, "section": "Case 1 – Setting up the start-up", "front": "Case 1: typical content of a shareholders' agreement + when to sign?", "back": "Governance (board seats, **reserved matters/veto**), **transfer restrictions** (lock-up, **right of first refusal**, **tag-along**, **drag-along**), **anti-dilution**, founders' **dedication & non-compete**, **vesting / good & bad leaver**, **deadlock** resolution, exit.\nSign **at incorporation** (founders) and **renegotiate** when investors enter.", "tags": ["midterm"]}, {"id": "bl-u10-c2-impair", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: equity €30,000, capital €90,000 (S.L.). Legal situation?", "back": "Equity = **33% < ½ of capital** → **legal cause of mandatory dissolution** (art. 363.1.e LSC), unless capital is increased/reduced enough (or insolvency applies). (The **2/3 mandatory reduction** applies only to the **S.A.**)", "tags": ["midterm", "numbers"], "explain": "Calculation: 30,000 ÷ 90,000 = 0.33; threshold ½ × 90,000 = 45,000 > 30,000."}, {"id": "bl-u10-c2-liab", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: are Pedro & María liable – as directors? as shareholders?", "back": "**As directors**: yes, if they don't **convene the GM** (within **2 months**) to dissolve or fix the situation (or request judicial dissolution) → **liable for company debts arising after** the cause (subsidiary, joint & several).\n**As shareholders**: **no** – capital company.", "tags": ["midterm"]}, {"id": "bl-u10-c2-models", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: other management systems? Would a board change their liability?", "back": "S.L./S.A.: **sole director, joint & several, joint (S.A. max 2), board** (min 3; S.L. max 12). On a board the regime is the same: **all members who adopted** the harmful decision are **jointly and severally liable** unless they prove they opposed, didn't know, or did everything to avoid it (art. 237).", "tags": ["midterm"]}, {"id": "bl-u10-c2-fix", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: how to reverse the capital impairment?", "back": "- **Capital increase** (e.g. the Business Angel's €100,000 in cash; or offsetting shareholder loans)\n- **Capital reduction to compensate losses** (S.L. capital ≥ €3,000)\n- **Accordion** (reduction + simultaneous increase)\n- Members' **contributions to equity** / returning to profit\nGoal: equity **≥ ½ of capital**.", "tags": ["midterm"]}, {"id": "bl-u10-c2-type", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: type of capital increase for the Business Angel? Steps?", "back": "A **cash** increase by **creating new stakes with a share premium**. Steps: **directors' report** & proposal → **GM resolution** (by-law amendment, S.L. > ½ of all votes) → **pre-emptive right** handled (waiver) → **subscription & payment** (bank certificate) → **public deed** → **registration** of resolution + execution.", "tags": ["midterm"]}, {"id": "bl-u10-c2-preempt", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: do Pedro & María have a pre-emptive right? How to manage it?", "back": "**Yes** – cash increase. They **individually waive** it (or the GM **excludes** it) so the stakes can go to the Business Angel.", "tags": ["midterm"]}, {"id": "bl-u10-c2-valuation", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: BA invests €100,000 for 10%. Pre-money value?", "back": "Post-money = 100,000 ÷ 10% = **€1,000,000** → pre-money = **€900,000** → **€10 per existing stake** (900,000 ÷ 90,000).", "tags": ["midterm", "numbers"]}, {"id": "bl-u10-c2-numbers", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: capital €90,000 in €1 stakes. Fill in the capital increase for 10% at €100,000.", "back": "New stakes N: N ÷ (90,000 + N) = 10% → **N = 10,000**.\n- Increase: **€10,000**, 10,000 new stakes numbered **90,001–100,000**\n- Total stakes **100,000** of €1\n- Premium: **€90,000** total = **€9 per stake**\n- Capital + premium = **€100,000**\n- New capital **€100,000** (stakes 1–100,000)", "tags": ["midterm", "numbers"], "explain": "The **share premium** is the anti-dilution mechanism: the BA pays €10 per stake (€1 par + €9 premium) = the real value, so the founders' value isn't diluted. Bonus: equity becomes 30,000 + 100,000 = **€130,000 > ½ × 100,000** → the impairment is fixed."}, {"id": "bl-u10-c2-absorber", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: which company should absorb which?", "back": "**PATINETES ELÉCTRICOS S.L. absorbs PTEL S.L.U.** – Patinetes holds the 40 employees, all client/supplier contracts, IP rights and **licences/permits**; absorbing the other way would require transferring all of these (and licences may not be transferable).", "tags": ["midterm"]}, {"id": "bl-u10-c2-merger-type", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: what type of merger, and what can be avoided?", "back": "**Merger by absorption of a wholly-owned subsidiary** (special merger, art. 53 RDLME): simplified draft; **no exchange ratio**, **no directors' and experts' reports**, **no capital increase** of the absorber, **no approval by the absorbed company's GM**.", "tags": ["midterm"]}, {"id": "bl-u10-c2-procedure", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: order of the merger procedure?", "back": "1. **Common draft terms** signed by both managing bodies\n2. **Publication/deposit** (Registry or websites) ≥ **1 month** before the GM\n3. **Merger balance sheets** (≤ 6 months)\n4. **GM approval** of Patinetes (within 6 months of the draft)\n5. **Publication** of the resolution (BORME + newspaper, or individual notice)\n6. **1-month creditor opposition** period\n7. **Public deed** of merger\n8. **Registration** → effective; PTEL extinguished & cancelled", "tags": ["midterm"]}, {"id": "bl-u10-c2-reasons", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: reasons for the merger?", "back": "PTEL lost its purpose (only serves the parent): **simplify the structure**, **cut costs** (one set of accounts, filings, governance), **synergies**, concentrate employees/assets. Stating them (draft/report) helps **transparency** and justifies **valid economic reasons** (e.g. for tax neutrality).", "tags": ["midterm"]}];
const MCQ = [{"id": "b101", "unit": 1, "q": "A Royal Decree appointing Mr. García as Director-General of a ministry:", "opts": ["Is a legal rule because it is enacted by the Government.", "Is not a legal rule because it lacks generality.", "Is a legal rule because it is published in the BOE.", "Is not a legal rule because it lacks coercibility."], "ans": 1, "why": "It addresses one specific person → no generality. Publication or the author doesn't make it a rule.", "src": "bank"}, {"id": "b102", "unit": 1, "q": "Unless the rule provides otherwise, a Spanish state rule enters into force:", "opts": ["On the day of its publication in the BOE.", "20 days after its publication in the BOE.", "One month after its approval by Parliament.", "When the citizens affected have been notified."], "ans": 1, "why": "20 days after publication = default vacatio legis.", "src": "bank"}, {"id": "b103", "unit": 1, "q": "The period between the publication of a rule and its entry into force is called:", "opts": ["Vacatio legis.", "Tacit repeal.", "Purposive approach.", "Lex specialis."], "ans": 0, "why": "Vacatio legis.", "src": "bank"}, {"id": "b104", "unit": 1, "q": "A new act regulates the same matter as an older act of the same rank in a different way, without mentioning it:", "opts": ["Both remain fully in force until the older one is expressly repealed.", "The older act is tacitly repealed in everything inconsistent.", "The older act prevails because it was first.", "A court must decide which applies through case law, which is a source of law."], "ans": 1, "why": "Tacit repeal: same or higher rank rule regulating differently invalidates the old one where inconsistent.", "src": "bank"}, {"id": "b105", "unit": 1, "q": "According to art. 1 CC, the sources of the Spanish legal system are:", "opts": ["Law, case law and custom.", "Law, custom and general principles of law.", "Constitution, acts and regulations.", "Law, custom, general principles and Supreme Court case law."], "ans": 1, "why": "Case law only complements the system.", "src": "bank"}, {"id": "b106", "unit": 1, "q": "Custom applies:", "opts": ["Always before the law, given Business Law's customary origins.", "Only in the absence of applicable law, if not contrary to morals or public order and if proven.", "Only if it has been confirmed by the Supreme Court.", "Never, since it has been replaced by general principles."], "ans": 1, "why": "Art. 1.3 CC.", "src": "bank"}, {"id": "b107", "unit": 1, "q": "Which statement about mandatory rules is correct?", "opts": ["They apply only if the parties have not agreed otherwise.", "Acts contrary to them are void by operation of law.", "Art. 314 CCom on interest on loans is an example.", "They can be excluded by a written contract."], "ans": 1, "why": "Art. 6.3 CC. Art. 314 CCom is dispositive.", "src": "bank"}, {"id": "b108", "unit": 1, "q": "A Royal Decree contradicts a Royal Legislative Decree. Which is correct?", "opts": ["The Royal Decree prevails because it is more recent.", "The contradicting precept of the Royal Decree is null and void.", "Both have the same rank, so the later one prevails.", "The Autonomous Communities decide which applies."], "ans": 1, "why": "RLD has the status of an act; a Royal Decree is lower.", "src": "bank"}, {"id": "b109", "unit": 1, "q": "A Royal Decree-Law is:", "opts": ["A rule of the Government with the status of an act, for cases of extraordinary and urgent need.", "A rule of Parliament delegating power to the Government.", "A regulation developing an act, below it in rank.", "An EU rule directly applicable in Spain."], "ans": 0, "why": "RDL = urgency; RLD = express delegation through a framework law.", "src": "bank"}, {"id": "b110", "unit": 1, "q": "An international treaty containing stipulations contrary to the Spanish Constitution:", "opts": ["Prevails over the Constitution, as supranational law.", "Requires prior amendment of the Constitution (art. 95 CE).", "Is automatically void.", "Applies only in the Autonomous Communities that accept it."], "ans": 1, "why": "Art. 95.1 CE.", "src": "bank"}, {"id": "b111", "unit": 1, "q": "The GDPR (Regulation (EU) 2016/679) is:", "opts": ["A Directive that Spain had to transpose.", "Directly applicable to citizens without any internal rule.", "Primary EU legislation.", "A Spanish regulation below an act."], "ans": 1, "why": "EU Regulations are directly applicable.", "src": "bank"}, {"id": "b112", "unit": 1, "q": "Which is NOT part of interpretation criteria in art. 3 CC?", "opts": ["The proper meaning of the words.", "The historical and legislative background.", "The social reality of the time when applied.", "The personal opinion of the judge on fairness."], "ans": 3, "why": "Words, context, background, social reality, spirit and purpose.", "src": "bank"}, {"id": "b113", "unit": 1, "q": "The relationship between national law and EU law is in principle one of competence, but in case of conflict:", "opts": ["National law prevails.", "EU law prevails.", "The more recent rule prevails.", "The Constitutional Court applies custom."], "ans": 1, "why": "Primacy of EU law.", "src": "bank"}, {"id": "b201", "unit": 2, "q": "Business Law is best defined as:", "opts": ["All rules that affect businesses, including tax and employment law.", "The part of private law for entrepreneurs and their legal status, regarding their market activities carried out through an enterprise.", "Public law regulating State intervention in the economy.", "The law of companies registered in the Mercantile Registry."], "ans": 1, "why": "Tax and employment law are separate disciplines.", "src": "bank"}, {"id": "b202", "unit": 2, "q": "According to art. 2 CCom, acts of commerce are governed, failing the Commerce Code, by:", "opts": ["Ordinary civil law.", "Business practice observed in each place, and then civil law.", "Supreme Court case law.", "EU Directives."], "ans": 1, "why": "Code → business usage → civil law (but art. 50 CCom for contracts).", "src": "bank"}, {"id": "b203", "unit": 2, "q": "Competence over commercial legislation in Spain belongs to:", "opts": ["The Autonomous Communities.", "Both State and Autonomous Communities equally.", "Exclusively the State (art. 149.1.6 CE).", "The European Commission."], "ans": 2, "why": "Market unity.", "src": "bank"}, {"id": "b204", "unit": 2, "q": "The enterprise (empresa):", "opts": ["Has its own legal personality from registration.", "Lacks legal personality and must be linked to a natural or legal person.", "Is the same as the entrepreneur.", "Is the holder of the obligations arising from the business."], "ans": 1, "why": "The enterprise is an organised set of capital and work; the holder of rights and obligations is the entrepreneur.", "src": "bank"}, {"id": "b205", "unit": 2, "q": "The general manager of a company, who signs contracts every day on its behalf, is:", "opts": ["An entrepreneur, since he organises the activity.", "Not an entrepreneur, because he acts in the name of another.", "An entrepreneur if he holds shares.", "An entrepreneur in the legal sense but not in the economic sense."], "ans": 1, "why": "Legal entrepreneur = in whose name the activity is carried out. (He's an 'entrepreneur' only in the economic sense.)", "src": "bank"}, {"id": "b206", "unit": 2, "q": "Registration in the Mercantile Registry is:", "opts": ["Mandatory for all entrepreneurs.", "Optional for individual entrepreneurs and mandatory for companies.", "Optional for all.", "Mandatory only for public limited companies."], "ans": 1, "why": "", "src": "bank"}, {"id": "b207", "unit": 2, "q": "A 16-year-old inherits his father's shop. Which is correct?", "opts": ["He cannot be an entrepreneur until he is 18.", "He can be an entrepreneur, acting through his legal representatives.", "He becomes an entrepreneur only with judicial authorisation and acts personally.", "The shop must be sold."], "ans": 1, "why": "Exception to preserve the enterprise.", "src": "bank"}, {"id": "b208", "unit": 2, "q": "A director competes with his company without its consent and signs a contract with a bona fide client. The contract is:", "opts": ["Void.", "Valid; the director may be removed and liable for damages.", "Voidable at the request of the company.", "Valid only if ratified by the general meeting."], "ans": 1, "why": "Breach doesn't invalidate contracts vs bona fide third parties.", "src": "bank"}, {"id": "b209", "unit": 2, "q": "A judge who wants to run a business in the province where he serves faces:", "opts": ["An absolute incompatibility.", "A relative incompatibility.", "A prohibition to compete.", "A disqualification."], "ans": 1, "why": "Judges/prosecutors: relative (territorial).", "src": "bank"}, {"id": "b210", "unit": 2, "q": "Which is NOT a professional duty of every entrepreneur?", "opts": ["Keeping orderly accounts.", "Respecting free and fair competition.", "Registering in the Mercantile Registry as an individual.", "Documenting its operations."], "ans": 2, "why": "Registration is optional for individuals.", "src": "bank"}, {"id": "b211", "unit": 2, "q": "A company operating without registration in the Mercantile Registry:", "opts": ["Has no liability at all.", "Is an irregular company: members answer like general partners and managers jointly and severally.", "Is treated as a capital company if its by-laws say so.", "Only answers with its own assets."], "ans": 1, "why": "Art. 120 CCom.", "src": "bank"}, {"id": "b212", "unit": 2, "q": "The liability of a general partner for the partnership's debts is:", "opts": ["Limited to his contribution.", "Personal, unlimited, subsidiary and joint and several.", "Direct and limited.", "Only internal towards the other partners."], "ans": 1, "why": "", "src": "bank"}, {"id": "b213", "unit": 2, "q": "In a limited partnership (sociedad comanditaria), limited partners:", "opts": ["Manage the partnership.", "Must appear in the business name.", "Answer only up to their contribution and cannot manage.", "Answer unlimitedly."], "ans": 2, "why": "", "src": "bank"}, {"id": "b214", "unit": 2, "q": "Mr. Ruiz lets his name be used in the name of a general partnership although he is not a partner:", "opts": ["He has no liability.", "He is jointly and severally liable as if he were a partner (art. 126 CCom).", "He is liable only up to €3,000.", "The partnership must change its name; no liability arises."], "ans": 1, "why": "", "src": "bank"}, {"id": "b215", "unit": 2, "q": "Lifting the corporate veil means:", "opts": ["Removing directors who breached their duties.", "Disregarding the company's separate personality to hold members personally liable for abuse.", "Publishing the company's accounts.", "Dissolving the company by court order."], "ans": 1, "why": "Arts. 6.4 and 7 CC.", "src": "bank"}, {"id": "b216", "unit": 2, "q": "Which is a capital company under the LSC?", "opts": ["General partnership.", "Limited partnership.", "Partnership limited by shares.", "Cooperative."], "ans": 2, "why": "S.A., S.L. and comanditaria por acciones.", "src": "bank"}, {"id": "b217", "unit": 2, "q": "The 'hybrid' character of the S.L. means:", "opts": ["Members are partly personally liable.", "It's capitalist towards third parties but allows personalistic elements internally (e.g. votes not proportional to capital).", "It can issue shares on the stock exchange.", "It combines a sole director with a board."], "ans": 1, "why": "", "src": "bank"}, {"id": "b218", "unit": 2, "q": "A newborn baby who owns a bank account has:", "opts": ["Neither legal capacity nor capacity to operate.", "Legal capacity but not capacity to operate.", "Capacity to operate but not legal capacity.", "Both."], "ans": 1, "why": "", "src": "bank"}, {"id": "b219", "unit": 2, "q": "According to art. 116 CCom, a trading company:", "opts": ["Acquires legal personality once incorporated according to the Code.", "Never has legal personality.", "Has legal personality only if it is a capital company.", "Acquires legal personality when it starts trading."], "ans": 0, "why": "", "src": "bank"}, {"id": "b220", "unit": 2, "q": "The size of the enterprise:", "opts": ["Determines a different legal status for SMEs.", "Doesn't change the general status, but special rules (e.g. accounting) may differ.", "Is irrelevant in all legal matters.", "Is defined by the Commerce Code."], "ans": 1, "why": "SME definition: Commission Regulation (EU) 651/2014.", "src": "bank"}, {"id": "b301", "unit": 3, "q": "A capital company acquires legal personality as such:", "opts": ["When the founders sign a private contract.", "When the deed is executed before a notary.", "When the deed of incorporation is registered in the Mercantile Registry.", "When it opens a bank account."], "ans": 2, "why": "", "src": "bank"}, {"id": "b302", "unit": 3, "q": "Which statement about single-member companies is correct?", "opts": ["Spanish law requires at least two founders.", "An S.A. or S.L. can be formed by one person (S.A.U./S.L.U.).", "Only S.L. can be single-member.", "A company that becomes single-member after incorporation must dissolve."], "ans": 1, "why": "Later sole proprietorship → deed + registration.", "src": "bank"}, {"id": "b303", "unit": 3, "q": "In an S.A. with €200,000 capital, the minimum that must be paid up at incorporation is:", "opts": ["€200,000", "€60,000", "€50,000 (25%)", "€15,000"], "ans": 2, "why": "25% of each share's par value; rest = called-up capital.", "src": "bank"}, {"id": "b304", "unit": 3, "q": "In an S.L., at incorporation the capital must be:", "opts": ["Paid up at least 25%.", "Fully subscribed and fully paid up.", "Paid within one year.", "At least €60,000."], "ans": 1, "why": "", "src": "bank"}, {"id": "b305", "unit": 3, "q": "A founder of an S.A. contributes a building. Which is required?", "opts": ["Nothing special.", "A report by an independent expert appointed by the Registrar, as a rule.", "A report by the company's auditor only.", "Unanimous approval of all creditors."], "ans": 1, "why": "S.L.: no report, but contributor liable for value (art. 30).", "src": "bank"}, {"id": "b306", "unit": 3, "q": "If the by-laws say nothing, the company's fiscal year ends on:", "opts": ["30 June", "31 December", "The anniversary of the deed", "31 March"], "ans": 1, "why": "", "src": "bank"}, {"id": "b307", "unit": 3, "q": "Acts performed in the name of a company in formation that were NOT necessary for registration:", "opts": ["Automatically bind the company after registration.", "Bind the company only if it expressly accepts them after registration.", "Are void.", "Bind only the notary."], "ans": 1, "why": "Art. 36 LSC.", "src": "bank"}, {"id": "b308", "unit": 3, "q": "If a company is not registered within one year of the deed:", "opts": ["It is automatically dissolved.", "Any member may request dissolution and refund of contributions.", "It becomes an S.L. by law.", "Nothing happens."], "ans": 1, "why": "Arts. 39–40 LSC.", "src": "bank"}, {"id": "b309", "unit": 3, "q": "Ancillary commitments (prestaciones accesorias):", "opts": ["Form part of share capital.", "Are services by members beyond their contribution, not part of capital.", "Are mandatory in every S.L.", "Can only be free of charge."], "ans": 1, "why": "Art. 86 LSC.", "src": "bank"}, {"id": "b310", "unit": 3, "q": "Which right is NOT a basic member right under the LSC?", "opts": ["Right to dividends.", "Pre-emptive right.", "Right to manage the company.", "Right to information."], "ans": 2, "why": "Management belongs to directors.", "src": "bank"}, {"id": "b311", "unit": 3, "q": "A company has capital €100,000 (1,000 shares) and equity €160,000. The book value per share is:", "opts": ["€100", "€160", "€60", "€260"], "ans": 1, "why": "160,000 ÷ 1,000.", "src": "bank"}, {"id": "b312", "unit": 3, "q": "Fair value of a share equals:", "opts": ["Par value × 2", "Book value ± expectations", "Capital ÷ shares", "Equity − capital"], "ans": 1, "why": "", "src": "bank"}, {"id": "b313", "unit": 3, "q": "The principle that capital may not fall below €60,000 / €3,000 during the life of the company is the principle of:", "opts": ["Determination", "Integrity", "Minimum outlay (minimum capital)", "Full subscription"], "ans": 2, "why": "", "src": "bank"}, {"id": "b314", "unit": 3, "q": "Which must appear in the company name?", "opts": ["The names of all founders.", "The indication S.A. or S.R.L./S.L.", "The corporate purpose.", "The registered office."], "ans": 1, "why": "", "src": "bank"}, {"id": "b315", "unit": 3, "q": "The registered office of a Spanish capital company:", "opts": ["Can be anywhere in the EU.", "Must be in Spain, where effective management is or the main establishment.", "Must be in Madrid.", "Must be where the majority shareholder lives."], "ans": 1, "why": "", "src": "bank"}, {"id": "b316", "unit": 3, "q": "In an S.L., attendance at general meetings:", "opts": ["Can be restricted to holders of a minimum number of stakes.", "Cannot be restricted.", "Is reserved to directors.", "Requires 5% of capital."], "ans": 1, "why": "S.A. may require a minimum number of shares.", "src": "bank"}, {"id": "b317", "unit": 3, "q": "Equity at incorporation is €50,000 (= capital). After years, reserves are €30,000 and there are no losses. Then:", "opts": ["Book value = par value.", "Book value > par value.", "Book value < par value.", "Fair value must equal book value."], "ans": 1, "why": "", "src": "bank"}, {"id": "b318", "unit": 3, "q": "Which is a correct pair?", "opts": ["S.A. – stakes – assume; S.L. – shares – subscribe", "S.A. – shares – subscribe; S.L. – stakes – take up/assume", "Both – shares – subscribe", "S.A. – stakes – subscribe; S.L. – shares – assume"], "ans": 1, "why": "", "src": "bank"}, {"id": "b401", "unit": 4, "q": "Which is NOT a competence of the general meeting under art. 160 LSC?", "opts": ["Approval of the annual accounts.", "Capital increase.", "Hiring the company's employees.", "Merger."], "ans": 2, "why": "Day-to-day management belongs to directors.", "src": "bank"}, {"id": "b402", "unit": 4, "q": "The sale of an asset worth 30% of total assets on the last balance sheet:", "opts": ["Can be decided by the directors alone.", "Is a competence of the general meeting (core asset > 25%).", "Needs creditors' consent.", "Needs approval of the Registrar."], "ans": 1, "why": "", "src": "bank"}, {"id": "b403", "unit": 4, "q": "The ordinary general meeting must be held:", "opts": ["Within the first three months of the fiscal year.", "Within the first six months of the fiscal year.", "At any time during the year.", "Within one month after the year-end."], "ans": 1, "why": "Art. 164 LSC.", "src": "bank"}, {"id": "b404", "unit": 4, "q": "Members holding at least ___ of capital can require the directors to convene a general meeting.", "opts": ["1%", "3%", "5%", "10%"], "ans": 2, "why": "", "src": "bank"}, {"id": "b405", "unit": 4, "q": "The minimum notice period for a general meeting is:", "opts": ["15 days in both S.A. and S.L.", "One month in S.A. and 15 days in S.L.", "One month in both.", "Two months in S.A."], "ans": 1, "why": "", "src": "bank"}, {"id": "b406", "unit": 4, "q": "A universal general meeting requires:", "opts": ["Prior notice published on the website.", "All capital present or represented and unanimous agreement to hold it and on the agenda.", "A quorum of 50%.", "The presence of the Registrar."], "ans": 1, "why": "Art. 178 LSC.", "src": "bank"}, {"id": "b407", "unit": 4, "q": "A minimum quorum to validly constitute the general meeting is required:", "opts": ["In both S.A. and S.L.", "Only in the S.A.", "Only in the S.L.", "In neither."], "ans": 1, "why": "", "src": "bank"}, {"id": "b408", "unit": 4, "q": "The general meeting may adopt resolutions on matters NOT on the agenda only for:", "opts": ["Capital increases.", "Removal of directors and bringing a liability action against them.", "Approval of the accounts.", "Any matter if 75% agree."], "ans": 1, "why": "", "src": "bank"}, {"id": "b409", "unit": 4, "q": "A member who voted against a resolution validly adopted by the general meeting:", "opts": ["Is not bound by it.", "Is bound by it but may challenge it in court under legal conditions.", "May veto it.", "Is automatically entitled to exit."], "ans": 1, "why": "", "src": "bank"}, {"id": "b410", "unit": 4, "q": "Directors of a capital company:", "opts": ["Must always be members.", "Need not be members unless the by-laws require it.", "Must be natural persons.", "Must be Spanish nationals."], "ans": 1, "why": "Art. 212.2 LSC; legal persons can be directors.", "src": "bank"}, {"id": "b411", "unit": 4, "q": "With joint and several directors (administradores solidarios):", "opts": ["Each director can act alone with full powers.", "All must sign together.", "They decide by majority in sessions.", "Only the oldest can act."], "ans": 0, "why": "", "src": "bank"}, {"id": "b412", "unit": 4, "q": "An S.A. wants four directors who must act together. It must:", "opts": ["Appoint four joint directors.", "Set up a board of directors.", "Become an S.L.", "Appoint a sole director."], "ans": 1, "why": "Max 2 joint directors in an S.A.", "src": "bank"}, {"id": "b413", "unit": 4, "q": "The board of directors of an S.L. may have:", "opts": ["2 to 12 members", "3 to 12 members", "3 members minimum, no maximum", "5 to 15 members"], "ans": 1, "why": "", "src": "bank"}, {"id": "b414", "unit": 4, "q": "The general meeting approved a decision of the directors that caused damage to the company. The directors:", "opts": ["Are exonerated.", "Remain liable (GM approval never exonerates).", "Are liable only if the decision wasn't on the agenda.", "Become liable together with all shareholders."], "ans": 1, "why": "Art. 236.2 LSC.", "src": "bank"}, {"id": "b415", "unit": 4, "q": "Which person cannot be appointed director?", "opts": ["A legal person.", "A non-member.", "A person disqualified under the Insolvency Act.", "A foreigner."], "ans": 2, "why": "Art. 213 LSC.", "src": "bank"}, {"id": "b416", "unit": 4, "q": "A change in the way the managing body is organised:", "opts": ["Can be decided informally by the directors.", "Requires a public deed and registration in the Mercantile Registry.", "Requires CNMC authorisation.", "Is not possible after incorporation."], "ans": 1, "why": "Art. 210.4 LSC.", "src": "bank"}, {"id": "b501", "unit": 5, "q": "The standard of diligence required of directors is that of:", "opts": ["A good family father.", "An orderly entrepreneur.", "A faithful representative.", "An expert auditor."], "ans": 1, "why": "Loyalty uses 'faithful representative'; care uses 'orderly entrepreneur'.", "src": "bank"}, {"id": "b502", "unit": 5, "q": "Under the business judgment rule (art. 226 LSC), the standard of diligence is met in business decisions if the director acted:", "opts": ["With a positive result for the company.", "In good faith, without personal interest, with sufficient information and an adequate procedure.", "With the approval of the general meeting.", "Following the advice of external consultants."], "ans": 1, "why": "", "src": "bank"}, {"id": "b503", "unit": 5, "q": "The business judgment rule does NOT apply to:", "opts": ["Strategic investment decisions.", "Decisions personally affecting other directors or related persons.", "Expansion into new markets.", "Pricing decisions."], "ans": 1, "why": "Art. 226.2.", "src": "bank"}, {"id": "b504", "unit": 5, "q": "The duty of secrecy of directors:", "opts": ["Ends when they leave office.", "Continues even after they leave office, except when the law allows/requires disclosure.", "Applies only to listed companies.", "Can be excluded by the by-laws."], "ans": 1, "why": "", "src": "bank"}, {"id": "b505", "unit": 5, "q": "The duty of loyalty regime:", "opts": ["Can be freely limited by the by-laws.", "Is mandatory, but the GM may grant exemptions in specific cases (art. 230).", "Applies only to boards of directors.", "Applies only in S.A."], "ans": 1, "why": "", "src": "bank"}, {"id": "b506", "unit": 5, "q": "A pandemic causes heavy losses. Directors had no risk-monitoring system for this event:", "opts": ["They breached the duty of care.", "Unforeseeable exogenous events are not a breach of the duty of care.", "They are automatically liable for all debts.", "They must resign."], "ans": 1, "why": "Covid example in the notes.", "src": "bank"}, {"id": "b507", "unit": 5, "q": "Directors' liability for company debts is:", "opts": ["Direct and primary.", "Subsidiary – only if the company cannot pay.", "Limited to their remuneration.", "Only towards the Tax Agency."], "ans": 1, "why": "", "src": "bank"}, {"id": "b508", "unit": 5, "q": "Directors failed to file for insolvency within the legal period. They may be liable for:", "opts": ["All company debts, earlier and later.", "Debts arising after the moment the filing should have been made.", "Nothing, as insolvency is the company's matter.", "Only debts towards employees."], "ans": 1, "why": "", "src": "bank"}, {"id": "b509", "unit": 5, "q": "Losses reduce equity below half of the capital and directors don't convene the GM. They become liable for:", "opts": ["Debts existing before the cause.", "Company debts arising after the legal cause of dissolution.", "The losses themselves.", "Nothing if they are also shareholders."], "ans": 1, "why": "", "src": "bank"}, {"id": "b510", "unit": 5, "q": "Which is NOT a requirement for directors' liability for damages (art. 236)?", "opts": ["Act contrary to law, by-laws or duties with fraud or fault.", "Damage.", "Causal link.", "That the company is insolvent."], "ans": 3, "why": "", "src": "bank"}, {"id": "b511", "unit": 5, "q": "When a director's act is contrary to the law or the by-laws:", "opts": ["Fault must be proven by the claimant.", "Fault is presumed unless proven otherwise.", "No liability arises without criminal conviction.", "Only the company can sue."], "ans": 1, "why": "", "src": "bank"}, {"id": "b512", "unit": 5, "q": "A board member who voted against a harmful resolution:", "opts": ["Is jointly liable anyway.", "Can be exonerated if he proves he expressly opposed it.", "Is liable for 50%.", "Is exonerated only if he resigned."], "ans": 1, "why": "Art. 237.", "src": "bank"}, {"id": "b513", "unit": 5, "q": "A businessman who controls a company through a 'front' director without holding a post is:", "opts": ["Not liable, since he isn't registered.", "A de facto director, liable as a de jure director.", "Liable only criminally.", "A shareholder with no duties."], "ans": 1, "why": "Art. 236.3.", "src": "bank"}, {"id": "b514", "unit": 5, "q": "The corporate liability action is first brought by:", "opts": ["Creditors.", "The company, by GM resolution.", "Any shareholder individually.", "The CNMC."], "ans": 1, "why": "", "src": "bank"}, {"id": "b515", "unit": 5, "q": "Shareholders may bring the corporate action subsidiarily if they hold at least:", "opts": ["1%", "3%", "5%", "10%"], "ans": 2, "why": "", "src": "bank"}, {"id": "b516", "unit": 5, "q": "A director's negligent false statement causes direct loss to a supplier. The supplier should bring:", "opts": ["The corporate liability action.", "The individual liability action (art. 241).", "A claim before the CNMC.", "A challenge of the GM resolution."], "ans": 1, "why": "", "src": "bank"}, {"id": "b517", "unit": 5, "q": "The GM resolution to bring a corporate liability action against directors:", "opts": ["Must appear on the agenda.", "Can be adopted even if not on the agenda and implies removal of the affected directors.", "Needs unanimity.", "Needs creditors' approval."], "ans": 1, "why": "", "src": "bank"}, {"id": "b518", "unit": 5, "q": "Creditors may bring the corporate liability action:", "opts": ["Always first.", "Only if company and members haven't, and the company's assets are insufficient.", "Never.", "Only in an S.A."], "ans": 1, "why": "Art. 240.", "src": "bank"}, {"id": "b601", "unit": 6, "q": "As a rule, by-law amendments are approved by:", "opts": ["The directors.", "The general meeting.", "The Registrar.", "Members with 5%."], "ans": 1, "why": "Art. 285.1 LSC.", "src": "bank"}, {"id": "b602", "unit": 6, "q": "Unless the by-laws provide otherwise, moving the registered office from Barcelona to Madrid can be decided by:", "opts": ["Only the general meeting.", "The directors.", "The Registrar.", "The Autonomous Community."], "ans": 1, "why": "Art. 285.2.", "src": "bank"}, {"id": "b603", "unit": 6, "q": "Moving the registered office to Portugal:", "opts": ["Is decided by the directors.", "Is a structural change decided by the general meeting.", "Is forbidden.", "Needs only a notarial deed."], "ans": 1, "why": "", "src": "bank"}, {"id": "b604", "unit": 6, "q": "A by-law amendment imposing new obligations on members (e.g. ancillary commitments):", "opts": ["Needs only the ordinary majority.", "Needs the consent of the affected members.", "Is forbidden.", "Can be decided by the directors."], "ans": 1, "why": "Art. 291 ff.", "src": "bank"}, {"id": "b605", "unit": 6, "q": "The GM substantially changes the corporate purpose. A dissenting member:", "opts": ["Must accept it.", "Has a right to exit and obtain fair value (art. 346).", "Can veto it.", "Can only sell to the majority at par value."], "ans": 1, "why": "", "src": "bank"}, {"id": "b606", "unit": 6, "q": "Which capital increase does NOT increase equity?", "opts": ["Cash contributions.", "Non-cash contributions.", "Offsetting loans.", "Charged to reserves."], "ans": 3, "why": "", "src": "bank"}, {"id": "b607", "unit": 6, "q": "In an S.A., a capital increase by offsetting loans requires:", "opts": ["100% of loans liquid, mature and payable.", "At least 25% liquid, mature and payable, the rest maturing within 5 years, plus an auditor's certificate.", "Creditors' unanimous consent only.", "An expert appointed by the Registrar."], "ans": 1, "why": "S.L.: 100% liquid, mature, payable.", "src": "bank"}, {"id": "b608", "unit": 6, "q": "The pre-emptive right exists in capital increases with:", "opts": ["Any contribution.", "Cash contributions.", "Non-cash contributions only.", "Reserves only."], "ans": 1, "why": "", "src": "bank"}, {"id": "b609", "unit": 6, "q": "The minimum period to exercise the pre-emptive right (non-listed) is:", "opts": ["15 days", "One month", "Two months", "Six months"], "ans": 1, "why": "", "src": "bank"}, {"id": "b610", "unit": 6, "q": "A share premium is charged in a capital increase mainly to:", "opts": ["Pay the notary.", "Compensate old members for reserves and expectations created before new members enter.", "Increase the par value of old shares.", "Avoid registration."], "ans": 1, "why": "", "src": "bank"}, {"id": "b611", "unit": 6, "q": "A capital increase must be registered:", "opts": ["When the GM adopts the resolution.", "Together with its execution (art. 315).", "Within 6 months, before execution.", "Only in S.A."], "ans": 1, "why": "", "src": "bank"}, {"id": "b612", "unit": 6, "q": "In an S.A., the GM may delegate the decision to increase capital to:", "opts": ["The directors, within legal limits.", "The auditors.", "Any shareholder with 5%.", "Nobody."], "ans": 0, "why": "Art. 297.", "src": "bank"}, {"id": "b613", "unit": 6, "q": "A capital increase charged to reserves requires a balance sheet approved by the GM no more than:", "opts": ["One month before.", "Six months before.", "One year before.", "Two years before."], "ans": 1, "why": "Art. 303.", "src": "bank"}, {"id": "b614", "unit": 6, "q": "Mandatory capital reduction to compensate losses applies:", "opts": ["To S.A. and S.L. when equity < ½ capital.", "Only to S.A. when equity < 2/3 of capital and not recovered within one fiscal year.", "Only to S.L.", "Whenever there are any losses."], "ans": 1, "why": "Art. 327.", "src": "bank"}, {"id": "b615", "unit": 6, "q": "Creditors' right to oppose a capital reduction exists when the reduction:", "opts": ["Restores the balance after losses.", "Funds the legal reserve.", "Refunds contributions to members (S.A.).", "Is mandatory."], "ans": 2, "why": "", "src": "bank"}, {"id": "b616", "unit": 6, "q": "Creditors must exercise their right to oppose within:", "opts": ["15 days of the GM.", "One month after the last announcement.", "Three months.", "One year."], "ans": 1, "why": "", "src": "bank"}, {"id": "b617", "unit": 6, "q": "An S.A. reduces its capital to €10,000 to compensate losses and simultaneously increases it to €80,000. This is:", "opts": ["Illegal, below minimum.", "The 'accordion' operation, valid if the reduction is conditional on the increase and both are registered together.", "A transformation.", "A merger."], "ans": 1, "why": "Art. 343.", "src": "bank"}, {"id": "b618", "unit": 6, "q": "Which is a valid alternative to avoid dissolution when an S.A.'s capital must be reduced below €60,000?", "opts": ["Ignore the minimum.", "Transform into an S.L.", "Ask the CNMC.", "Issue bonds."], "ans": 1, "why": "", "src": "bank"}, {"id": "b619", "unit": 6, "q": "Which is NOT a way to reduce capital?", "opts": ["Reducing par value.", "Redeeming shares.", "Grouping shares to exchange them.", "Issuing new shares."], "ans": 3, "why": "", "src": "bank"}, {"id": "b620", "unit": 6, "q": "A capital reduction to compensate losses:", "opts": ["Reduces equity.", "Leaves equity unchanged – it's a book entry between capital and losses.", "Requires paying members.", "Needs creditor consent."], "ans": 1, "why": "Annex example.", "src": "bank"}, {"id": "b701", "unit": 7, "q": "Structural changes are regulated by:", "opts": ["The Commerce Code.", "Real Decreto-ley 5/2023 (RDLME).", "The Trademarks Act.", "The LDC."], "ans": 1, "why": "", "src": "bank"}, {"id": "b702", "unit": 7, "q": "Which is NOT a structural change under the RDLME?", "opts": ["Transformation", "Merger", "Capital increase", "Global assignment of assets and liabilities"], "ans": 2, "why": "", "src": "bank"}, {"id": "b703", "unit": 7, "q": "In a merger by creation of a new company:", "opts": ["Only one company is extinguished.", "All merging companies are extinguished.", "No company is extinguished.", "The members keep shares in the old companies."], "ans": 1, "why": "", "src": "bank"}, {"id": "b704", "unit": 7, "q": "The common draft terms of merger must be approved by the GMs within:", "opts": ["One month.", "Six months from signature, otherwise it lapses.", "One year.", "Three months."], "ans": 1, "why": "", "src": "bank"}, {"id": "b705", "unit": 7, "q": "An independent expert report on the merger draft is mandatory when:", "opts": ["Any participating company is an S.A.", "All companies are S.L.", "The merger is by absorption.", "Never."], "ans": 0, "why": "", "src": "bank"}, {"id": "b706", "unit": 7, "q": "The exchange ratio is calculated on the basis of:", "opts": ["Par value.", "Fair value.", "Book value only.", "The number of employees."], "ans": 1, "why": "", "src": "bank"}, {"id": "b707", "unit": 7, "q": "A merger becomes legally effective:", "opts": ["When the GMs approve it.", "When the draft is signed.", "Upon registration in the Mercantile Registry.", "After the 1-month creditor period."], "ans": 2, "why": "", "src": "bank"}, {"id": "b708", "unit": 7, "q": "After registration, a merger can be challenged:", "opts": ["Never.", "Only for breach of the RDLME, within three months.", "Freely within one year.", "Only by the CNMC."], "ans": 1, "why": "", "src": "bank"}, {"id": "b709", "unit": 7, "q": "In the absorption of a wholly-owned subsidiary, which is NOT required?", "opts": ["Common draft terms.", "Registration.", "Capital increase of the absorbing company.", "Public deed."], "ans": 2, "why": "Art. 53 RDLME.", "src": "bank"}, {"id": "b711", "unit": 7, "q": "In a partial demerger (spin-off):", "opts": ["The company is extinguished.", "The company survives, reduces capital, and its members receive shares of the beneficiaries.", "The company receives the beneficiaries' shares.", "Members lose all participation."], "ans": 1, "why": "", "src": "bank"}, {"id": "b712", "unit": 7, "q": "After a segregation, the relationship between the segregated company and the beneficiary is:", "opts": ["None.", "Parent–subsidiary.", "Merger.", "Partnership."], "ans": 1, "why": "", "src": "bank"}, {"id": "b714", "unit": 7, "q": "Two members with 50% each block every decision. This is:", "opts": ["Not relevant legally.", "Paralysis of corporate bodies – a legal cause of dissolution.", "A ground for merger.", "A competition infringement."], "ans": 1, "why": "", "src": "bank"}, {"id": "b715", "unit": 7, "q": "Losses reduce an S.L.'s equity to 40% of its capital. This is:", "opts": ["A cause of mandatory capital reduction.", "A legal cause of dissolution unless capital is increased/reduced sufficiently (if insolvency isn't due).", "Irrelevant for S.L.", "A cause for merger."], "ans": 1, "why": "Art. 363.1.e.", "src": "bank"}, {"id": "b716", "unit": 7, "q": "During liquidation:", "opts": ["The company loses legal personality.", "The company keeps legal personality and adds 'en liquidación' to its name.", "Directors keep managing.", "Members can distribute assets before paying creditors."], "ans": 1, "why": "", "src": "bank"}, {"id": "b717", "unit": 7, "q": "With the opening of liquidation:", "opts": ["Directors become liquidators by force of law in all cases and nothing changes.", "Directors cease and liquidators assume representation.", "The GM ceases to exist.", "The Registrar manages the company."], "ans": 1, "why": "Art. 375.", "src": "bank"}, {"id": "b718", "unit": 7, "q": "Liquidators must draw up an inventory and balance sheet within:", "opts": ["One month.", "Three months.", "Six months.", "One year."], "ans": 1, "why": "", "src": "bank"}, {"id": "b720", "unit": 7, "q": "The legal personality of a capital company ends:", "opts": ["With the dissolution resolution.", "With the start of liquidation.", "When its entries are cancelled in the Registry after liquidation.", "When the directors resign."], "ans": 2, "why": "", "src": "bank"}, {"id": "w01", "unit": 1, "q": "A rule says \"No vehicles in the park\". A judge lets an ambulance in because the rule exists to protect visitors' safety. Which criterion is the judge mainly using?", "opts": ["The literal meaning of the words.", "The spirit and purpose of the rule (purposive approach).", "Custom as a source of law.", "Case law as a formal source of law."], "ans": 1, "why": "Art. 3.1 CC: rules are interpreted fundamentally by their spirit and purpose. Literally, an ambulance is a vehicle.", "src": "weak", "topic": "interp"}, {"id": "w02", "unit": 1, "q": "When is the purposive approach typically needed?", "opts": ["Only when the rule was published more than 20 years ago.", "Never – Spanish judges must apply the literal words.", "When the wording leaves a gap, is ambiguous or leads to a result contrary to the rule's aim.", "Only for EU Directives."], "ans": 2, "why": "Purpose fills gaps, resolves ambiguity and avoids absurd literal results.", "src": "weak", "topic": "interp"}, {"id": "w03", "unit": 1, "q": "The Government approves urgent economic measures with the status of an act because of an extraordinary and urgent need. Which is correct?", "opts": ["It is a Royal Legislative Decree and needs a prior delegation law.", "It is a Royal Decree-Law and Congress must validate it within 30 days.", "It is a Royal Decree with lower rank than an act.", "It may freely regulate fundamental rights."], "ans": 1, "why": "Art. 86 CE: Royal Decree-Law = urgency, provisional, convalidación by Congress within 30 days; excluded matters include fundamental rights.", "src": "weak", "topic": "rdl"}, {"id": "w04", "unit": 1, "q": "Parliament passes a law asking the Government to merge several scattered laws into one consolidated text. The resulting text is:", "opts": ["A Royal Decree-Law.", "A Royal Legislative Decree (texto refundido) with the status of an act.", "A ministerial order.", "A Royal Decree (regulation) ranking below acts."], "ans": 1, "why": "Delegated legislation (arts. 82–85 CE). Example: the LSC, Royal Legislative Decree 1/2010.", "src": "weak", "topic": "rdl"}, {"id": "w05", "unit": 1, "q": "Which of these is a legal rule?", "opts": ["A decree appointing Ms. López as ambassador.", "A resolution granting XYZ S.L. a €50,000 subsidy.", "A rule obliging every S.L. to deposit its annual accounts.", "A decision dismissing one specific civil servant."], "ans": 2, "why": "Only the rule addressed to a category (all S.L.s, now and in future) has generality. The others target one specific addressee.", "src": "weak", "topic": "general"}, {"id": "w06", "unit": 1, "q": "Saying \"good morning\" to your professor is NOT a legal rule mainly because:", "opts": ["It lacks generality.", "It cannot be enforced by the state – it has no coercibility.", "It has been tacitly repealed.", "It is a custom contrary to public order."], "ans": 1, "why": "It is a social norm: breaking it only brings social disapproval, never state enforcement.", "src": "weak", "topic": "general"}, {"id": "w07", "unit": 1, "q": "A validly concluded international treaty, officially published in Spain:", "opts": ["Ranks above the Constitution.", "Ranks below the Constitution but above acts; a later act cannot modify it.", "Has the same rank as an act, so a later act prevails.", "Ranks below Royal Decrees."], "ans": 1, "why": "Art. 96 CE: treaties form part of internal law and can only be changed by their own procedures. Art. 95: the Constitution stays on top.", "src": "weak", "topic": "treaty"}, {"id": "w08", "unit": 2, "q": "Two companies sign a commercial sale. The Commerce Code is silent on a point, and a well-established business usage in that market differs from the Civil Code rule. What applies?", "opts": ["The Civil Code, because written law always beats usage.", "The business usage of that place.", "Whatever the judge finds fairest.", "Nothing – the contract is void."], "ans": 1, "why": "Art. 2 CCom: Commerce Code → usage of each place → civil law. In commerce, usage comes before the Civil Code.", "src":
