mous Communities that accept it."], "ans": 1, "why": "Art. 95.1 CE.", "src": "bank"}, {"id": "b111", "unit": 1, "q": "The GDPR (Regulation (EU) 2016/679) is:", "opts": ["A Directive that Spain had to transpose.", "Directly applicable to citizens without any internal rule.", "Primary EU legislation.", "A Spanish regulation below an act."], "ans": 1, "why": "EU Regulations are directly applicable.", "src": "bank"}, {"id": "b112", "unit": 1, "q": "Which is NOT part of interpretation criteria in art. 3 CC?", "opts": ["The proper meaning of the words.", "The historical and legislative background.", "The social reality of the time when applied.", "The personal opinion of the judge on fairness."], "ans": 3, "why": "Words, context, background, social reality, spirit and purpose.", "src": "bank"}, {"id": "b113", "unit": 1, "q": "The relationship between national law and EU law is in principle one of competence, but in case of conflict:", "opts": ["National law prevails.", "EU law prevails.", "The more recent rule prevails.", "The Constitutional Court applies custom."], "ans": 1, "why": "Primacy of EU law.", "src": "bank"}, {"id": "b201", "unit": 2, "q": "Business Law is best defined as:", "opts": ["All rules that affect businesses, including tax and employment law.", "The part of private law for entrepreneurs and their legal status, regarding their market activities carried out through an enterprise.", "Public law regulating State intervention in the economy.", "The law of companies registered in the Mercantile Registry."], "ans": 1, "why": "Tax and employment law are separate disciplines.", "src": "bank"}, {"id": "b202", "unit": 2, "q": "According to art. 2 CCom, acts of commerce are governed, failing the Commerce Code, by:", "opts": ["Ordinary civil law.", "Business practice observed in each place, and then civil law.", "Supreme Court case law.", "EU Directives."], "ans": 1, "why": "Code → business usage → civil law (but art. 50 CCom for contracts).", "src": "bank"}, {"id": "b203", "unit": 2, "q": "Competence over commercial legislation in Spain belongs to:", "opts": ["The Autonomous Communities.", "Both State and Autonomous Communities equally.", "Exclusively the State (art. 149.1.6 CE).", "The European Commission."], "ans": 2, "why": "Market unity.", "src": "bank"}, {"id": "b204", "unit": 2, "q": "The enterprise (empresa):", "opts": ["Has its own legal personality from registration.", "Lacks legal personality and must be linked to a natural or legal person.", "Is the same as the entrepreneur.", "Is the holder of the obligations arising from the business."], "ans": 1, "why": "The enterprise is an organised set of capital and work; the holder of rights and obligations is the entrepreneur.", "src": "bank"}, {"id": "b205", "unit": 2, "q": "The general manager of a company, who signs contracts every day on its behalf, is:", "opts": ["An entrepreneur, since he organises the activity.", "Not an entrepreneur, because he acts in the name of another.", "An entrepreneur if he holds shares.", "An entrepreneur in the legal sense but not in the economic sense."], "ans": 1, "why": "Legal entrepreneur = in whose name the activity is carried out. (He's an 'entrepreneur' only in the economic sense.)", "src": "bank"}, {"id": "b206", "unit": 2, "q": "Registration in the Mercantile Registry is:", "opts": ["Mandatory for all entrepreneurs.", "Optional for individual entrepreneurs and mandatory for companies.", "Optional for all.", "Mandatory only for public limited companies."], "ans": 1, "why": "", "src": "bank"}, {"id": "b207", "unit": 2, "q": "A 16-year-old inherits his father's shop. Which is correct?", "opts": ["He cannot be an entrepreneur until he is 18.", "He can be an entrepreneur, acting through his legal representatives.", "He becomes an entrepreneur only with judicial authorisation and acts personally.", "The shop must be sold."], "ans": 1, "why": "Exception to preserve the enterprise.", "src": "bank"}, {"id": "b208", "unit": 2, "q": "A director competes with his company without its consent and signs a contract with a bona fide client. The contract is:", "opts": ["Void.", "Valid; the director may be removed and liable for damages.", "Voidable at the request of the company.", "Valid only if ratified by the general meeting."], "ans": 1, "why": "Breach doesn't invalidate contracts vs bona fide third parties.", "src": "bank"}, {"id": "b209", "unit": 2, "q": "A judge who wants to run a business in the province where he serves faces:", "opts": ["An absolute incompatibility.", "A relative incompatibility.", "A prohibition to compete.", "A disqualification."], "ans": 1, "why": "Judges/prosecutors: relative (territorial).", "src": "bank"}, {"id": "b210", "unit": 2, "q": "Which is NOT a professional duty of every entrepreneur?", "opts": ["Keeping orderly accounts.", "Respecting free and fair competition.", "Registering in the Mercantile Registry as an individual.", "Documenting its operations."], "ans": 2, "why": "Registration is optional for individuals.", "src": "bank"}, {"id": "b211", "unit": 2, "q": "A company operating without registration in the Mercantile Registry:", "opts": ["Has no liability at all.", "Is an irregular company: members answer like general partners and managers jointly and severally.", "Is treated as a capital company if its by-laws say so.", "Only answers with its own assets."], "ans": 1, "why": "Art. 120 CCom.", "src": "bank"}, {"id": "b212", "unit": 2, "q": "The liability of a general partner for the partnership's debts is:", "opts": ["Limited to his contribution.", "Personal, unlimited, subsidiary and joint and several.", "Direct and limited.", "Only internal towards the other partners."], "ans": 1, "why": "", "src": "bank"}, {"id": "b213", "unit": 2, "q": "In a limited partnership (sociedad comanditaria), limited partners:", "opts": ["Manage the partnership.", "Must appear in the business name.", "Answer only up to their contribution and cannot manage.", "Answer unlimitedly."], "ans": 2, "why": "", "src": "bank"}, {"id": "b214", "unit": 2, "q": "Mr. Ruiz lets his name be used in the name of a general partnership although he is not a partner:", "opts": ["He has no liability.", "He is jointly and severally liable as if he were a partner (art. 126 CCom).", "He is liable only up to €3,000.", "The partnership must change its name; no liability arises."], "ans": 1, "why": "", "src": "bank"}, {"id": "b215", "unit": 2, "q": "Lifting the corporate veil means:", "opts": ["Removing directors who breached their duties.", "Disregarding the company's separate personality to hold members personally liable for abuse.", "Publishing the company's accounts.", "Dissolving the company by court order."], "ans": 1, "why": "Arts. 6.4 and 7 CC.", "src": "bank"}, {"id": "b216", "unit": 2, "q": "Which is a capital company under the LSC?", "opts": ["General partnership.", "Limited partnership.", "Partnership limited by shares.", "Cooperative."], "ans": 2, "why": "S.A., S.L. and comanditaria por acciones.", "src": "bank"}, {"id": "b217", "unit": 2, "q": "The 'hybrid' character of the S.L. means:", "opts": ["Members are partly personally liable.", "It's capitalist towards third parties but allows personalistic elements internally (e.g. votes not proportional to capital).", "It can issue shares on the stock exchange.", "It combines a sole director with a board."], "ans": 1, "why": "", "src": "bank"}, {"id": "b218", "unit": 2, "q": "A newborn baby who owns a bank account has:", "opts": ["Neither legal capacity nor capacity to operate.", "Legal capacity but not capacity to operate.", "Capacity to operate but not legal capacity.", "Both."], "ans": 1, "why": "", "src": "bank"}, {"id": "b219", "unit": 2, "q": "According to art. 116 CCom, a trading company:", "opts": ["Acquires legal personality once incorporated according to the Code.", "Never has legal personality.", "Has legal personality only if it is a capital company.", "Acquires legal personality when it starts trading."], "ans": 0, "why": "", "src": "bank"}, {"id": "b220", "unit": 2, "q": "The size of the enterprise:", "opts": ["Determines a different legal status for SMEs.", "Doesn't change the general status, but special rules (e.g. accounting) may differ.", "Is irrelevant in all legal matters.", "Is defined by the Commerce Code."], "ans": 1, "why": "SME definition: Commission Regulation (EU) 651/2014.", "src": "bank"}, {"id": "b301", "unit": 3, "q": "A capital company acquires legal personality as such:", "opts": ["When the founders sign a private contract.", "When the deed is executed before a notary.", "When the deed of incorporation is registered in the Mercantile Registry.", "When it opens a bank account."], "ans": 2, "why": "", "src": "bank"}, {"id": "b302", "unit": 3, "q": "Which statement about single-member companies is correct?", "opts": ["Spanish law requires at least two founders.", "An S.A. or S.L. can be formed by one person (S.A.U./S.L.U.).", "Only S.L. can be single-member.", "A company that becomes single-member after incorporation must dissolve."], "ans": 1, "why": "Later sole proprietorship → deed + registration.", "src": "bank"}, {"id": "b303", "unit": 3, "q": "In an S.A. with €200,000 capital, the minimum that must be paid up at incorporation is:", "opts": ["€200,000", "€60,000", "€50,000 (25%)", "€15,000"], "ans": 2, "why": "25% of each share's par value; rest = called-up capital.", "src": "bank"}, {"id": "b304", "unit": 3, "q": "In an S.L., at incorporation the capital must be:", "opts": ["Paid up at least 25%.", "Fully subscribed and fully paid up.", "Paid within one year.", "At least €60,000."], "ans": 1, "why": "", "src": "bank"}, {"id": "b305", "unit": 3, "q": "A founder of an S.A. contributes a building. Which is required?", "opts": ["Nothing special.", "A report by an independent expert appointed by the Registrar, as a rule.", "A report by the company's auditor only.", "Unanimous approval of all creditors."], "ans": 1, "why": "S.L.: no report, but contributor liable for value (art. 30).", "src": "bank"}, {"id": "b306", "unit": 3, "q": "If the by-laws say nothing, the company's fiscal year ends on:", "opts": ["30 June", "31 December", "The anniversary of the deed", "31 March"], "ans": 1, "why": "", "src": "bank"}, {"id": "b307", "unit": 3, "q": "Acts performed in the name of a company in formation that were NOT necessary for registration:", "opts": ["Automatically bind the company after registration.", "Bind the company only if it expressly accepts them after registration.", "Are void.", "Bind only the notary."], "ans": 1, "why": "Art. 36 LSC.", "src": "bank"}, {"id": "b308", "unit": 3, "q": "If a company is not registered within one year of the deed:", "opts": ["It is automatically dissolved.", "Any member may request dissolution and refund of contributions.", "It becomes an S.L. by law.", "Nothing happens."], "ans": 1, "why": "Arts. 39–40 LSC.", "src": "bank"}, {"id": "b309", "unit": 3, "q": "Ancillary commitments (prestaciones accesorias):", "opts": ["Form part of share capital.", "Are services by members beyond their contribution, not part of capital.", "Are mandatory in every S.L.", "Can only be free of charge."], "ans": 1, "why": "Art. 86 LSC.", "src": "bank"}, {"id": "b310", "unit": 3, "q": "Which right is NOT a basic member right under the LSC?", "opts": ["Right to dividends.", "Pre-emptive right.", "Right to manage the company.", "Right to information."], "ans": 2, "why": "Management belongs to directors.", "src": "bank"}, {"id": "b311", "unit": 3, "q": "A company has capital €100,000 (1,000 shares) and equity €160,000. The book value per share is:", "opts": ["€100", "€160", "€60", "€260"], "ans": 1, "why": "160,000 ÷ 1,000.", "src": "bank"}, {"id": "b312", "unit": 3, "q": "Fair value of a share equals:", "opts": ["Par value × 2", "Book value ± expectations", "Capital ÷ shares", "Equity − capital"], "ans": 1, "why": "", "src": "bank"}, {"id": "b313", "unit": 3, "q": "The principle that capital may not fall below €60,000 / €3,000 during the life of the company is the principle of:", "opts": ["Determination", "Integrity", "Minimum outlay (minimum capital)", "Full subscription"], "ans": 2, "why": "", "src": "bank"}, {"id": "b314", "unit": 3, "q": "Which must appear in the company name?", "opts": ["The names of all founders.", "The indication S.A. or S.R.L./S.L.", "The corporate purpose.", "The registered office."], "ans": 1, "why": "", "src": "bank"}, {"id": "b315", "unit": 3, "q": "The registered office of a Spanish capital company:", "opts": ["Can be anywhere in the EU.", "Must be in Spain, where effective management is or the main establishment.", "Must be in Madrid.", "Must be where the majority shareholder lives."], "ans": 1, "why": "", "src": "bank"}, {"id": "b316", "unit": 3, "q": "In an S.L., attendance at general meetings:", "opts": ["Can be restricted to holders of a minimum number of stakes.", "Cannot be restricted.", "Is reserved to directors.", "Requires 5% of capital."], "ans": 1, "why": "S.A. may require a minimum number of shares.", "src": "bank"}, {"id": "b317", "unit": 3, "q": "Equity at incorporation is €50,000 (= capital). After years, reserves are €30,000 and there are no losses. Then:", "opts": ["Book value = par value.", "Book value > par value.", "Book value < par value.", "Fair value must equal book value."], "ans": 1, "why": "", "src": "bank"}, {"id": "b318", "unit": 3, "q": "Which is a correct pair?", "opts": ["S.A. – stakes – assume; S.L. – shares – subscribe", "S.A. – shares – subscribe; S.L. – stakes – take up/assume", "Both – shares – subscribe", "S.A. – stakes – subscribe; S.L. – shares – assume"], "ans": 1, "why": "", "src": "bank"}, {"id": "b401", "unit": 4, "q": "Which is NOT a competence of the general meeting under art. 160 LSC?", "opts": ["Approval of the annual accounts.", "Capital increase.", "Hiring the company's employees.", "Merger."], "ans": 2, "why": "Day-to-day management belongs to directors.", "src": "bank"}, {"id": "b402", "unit": 4, "q": "The sale of an asset worth 30% of total assets on the last balance sheet:", "opts": ["Can be decided by the directors alone.", "Is a competence of the general meeting (core asset > 25%).", "Needs creditors' consent.", "Needs approval of the Registrar."], "ans": 1, "why": "", "src": "bank"}, {"id": "b403", "unit": 4, "q": "The ordinary general meeting must be held:", "opts": ["Within the first three months of the fiscal year.", "Within the first six months of the fiscal year.", "At any time during the year.", "Within one month after the year-end."], "ans": 1, "why": "Art. 164 LSC.", "src": "bank"}, {"id": "b404", "unit": 4, "q": "Members holding at least ___ of capital can require the directors to convene a general meeting.", "opts": ["1%", "3%", "5%", "10%"], "ans": 2, "why": "", "src": "bank"}, {"id": "b405", "unit": 4, "q": "The minimum notice period for a general meeting is:", "opts": ["15 days in both S.A. and S.L.", "One month in S.A. and 15 days in S.L.", "One month in both.", "Two months in S.A."], "ans": 1, "why": "", "src": "bank"}, {"id": "b406", "unit": 4, "q": "A universal general meeting requires:", "opts": ["Prior notice published on the website.", "All capital present or represented and unanimous agreement to hold it and on the agenda.", "A quorum of 50%.", "The presence of the Registrar."], "ans": 1, "why": "Art. 178 LSC.", "src": "bank"}, {"id": "b407", "unit": 4, "q": "A minimum quorum to validly constitute the general meeting is required:", "opts": ["In both S.A. and S.L.", "Only in the S.A.", "Only in the S.L.", "In neither."], "ans": 1, "why": "", "src": "bank"}, {"id": "b408", "unit": 4, "q": "The general meeting may adopt resolutions on matters NOT on the agenda only for:", "opts": ["Capital increases.", "Removal of directors and bringing a liability action against them.", "Approval of the accounts.", "Any matter if 75% agree."], "ans": 1, "why": "", "src": "bank"}, {"id": "b409", "unit": 4, "q": "A member who voted against a resolution validly adopted by the general meeting:", "opts": ["Is not bound by it.", "Is bound by it but may challenge it in court under legal conditions.", "May veto it.", "Is automatically entitled to exit."], "ans": 1, "why": "", "src": "bank"}, {"id": "b410", "unit": 4, "q": "Directors of a capital company:", "opts": ["Must always be members.", "Need not be members unless the by-laws require it.", "Must be natural persons.", "Must be Spanish nationals."], "ans": 1, "why": "Art. 212.2 LSC; legal persons can be directors.", "src": "bank"}, {"id": "b411", "unit": 4, "q": "With joint and several directors (administradores solidarios):", "opts": ["Each director can act alone with full powers.", "All must sign together.", "They decide by majority in sessions.", "Only the oldest can act."], "ans": 0, "why": "", "src": "bank"}, {"id": "b412", "unit": 4, "q": "An S.A. wants four directors who must act together. It must:", "opts": ["Appoint four joint directors.", "Set up a board of directors.", "Become an S.L.", "Appoint a sole director."], "ans": 1, "why": "Max 2 joint directors in an S.A.", "src": "bank"}, {"id": "b413", "unit": 4, "q": "The board of directors of an S.L. may have:", "opts": ["2 to 12 members", "3 to 12 members", "3 members minimum, no maximum", "5 to 15 members"], "ans": 1, "why": "", "src": "bank"}, {"id": "b414", "unit": 4, "q": "The general meeting approved a decision of the directors that caused damage to the company. The directors:", "opts": ["Are exonerated.", "Remain liable (GM approval never exonerates).", "Are liable only if the decision wasn't on the agenda.", "Become liable together with all shareholders."], "ans": 1, "why": "Art. 236.2 LSC.", "src": "bank"}, {"id": "b415", "unit": 4, "q": "Which person cannot be appointed director?", "opts": ["A legal person.", "A non-member.", "A person disqualified under the Insolvency Act.", "A foreigner."], "ans": 2, "why": "Art. 213 LSC.", "src": "bank"}, {"id": "b416", "unit": 4, "q": "A change in the way the managing body is organised:", "opts": ["Can be decided informally by the directors.", "Requires a public deed and registration in the Mercantile Registry.", "Requires CNMC authorisation.", "Is not possible after incorporation."], "ans": 1, "why": "Art. 210.4 LSC.", "src": "bank"}, {"id": "b501", "unit": 5, "q": "The standard of diligence required of directors is that of:", "opts": ["A good family father.", "An orderly entrepreneur.", "A faithful representative.", "An expert auditor."], "ans": 1, "why": "Loyalty uses 'faithful representative'; care uses 'orderly entrepreneur'.", "src": "bank"}, {"id": "b502", "unit": 5, "q": "Under the business judgment rule (art. 226 LSC), the standard of diligence is met in business decisions if the director acted:", "opts": ["With a positive result for the company.", "In good faith, without personal interest, with sufficient information and an adequate procedure.", "With the approval of the general meeting.", "Following the advice of external consultants."], "ans": 1, "why": "", "src": "bank"}, {"id": "b503", "unit": 5, "q": "The business judgment rule does NOT apply to:", "opts": ["Strategic investment decisions.", "Decisions personally affecting other directors or related persons.", "Expansion into new markets.", "Pricing decisions."], "ans": 1, "why": "Art. 226.2.", "src": "bank"}, {"id": "b504", "unit": 5, "q": "The duty of secrecy of directors:", "opts": ["Ends when they leave office.", "Continues even after they leave office, except when the law allows/requires disclosure.", "Applies only to listed companies.", "Can be excluded by the by-laws."], "ans": 1, "why": "", "src": "bank"}, {"id": "b505", "unit": 5, "q": "The duty of loyalty regime:", "opts": ["Can be freely limited by the by-laws.", "Is mandatory, but the GM may grant exemptions in specific cases (art. 230).", "Applies only to boards of directors.", "Applies only in S.A."], "ans": 1, "why": "", "src": "bank"}, {"id": "b506", "unit": 5, "q": "A pandemic causes heavy losses. Directors had no risk-monitoring system for this event:", "opts": ["They breached the duty of care.", "Unforeseeable exogenous events are not a breach of the duty of care.", "They are automatically liable for all debts.", "They must resign."], "ans": 1, "why": "Covid example in the notes.", "src": "bank"}, {"id": "b507", "unit": 5, "q": "Directors' liability for company debts is:", "opts": ["Direct and primary.", "Subsidiary – only if the company cannot pay.", "Limited to their remuneration.", "Only towards the Tax Agency."], "ans": 1, "why": "", "src": "bank"}, {"id": "b508", "unit": 5, "q": "Directors failed to file for insolvency within the legal period. They may be liable for:", "opts": ["All company debts, earlier and later.", "Debts arising after the moment the filing should have been made.", "Nothing, as insolvency is the company's matter.", "Only debts towards employees."], "ans": 1, "why": "", "src": "bank"}, {"id": "b509", "unit": 5, "q": "Losses reduce equity below half of the capital and directors don't convene the GM. They become liable for:", "opts": ["Debts existing before the cause.", "Company debts arising after the legal cause of dissolution.", "The losses themselves.", "Nothing if they are also shareholders."], "ans": 1, "why": "", "src": "bank"}, {"id": "b510", "unit": 5, "q": "Which is NOT a requirement for directors' liability for damages (art. 236)?", "opts": ["Act contrary to law, by-laws or duties with fraud or fault.", "Damage.", "Causal link.", "That the company is insolvent."], "ans": 3, "why": "", "src": "bank"}, {"id": "b511", "unit": 5, "q": "When a director's act is contrary to the law or the by-laws:", "opts": ["Fault must be proven by the claimant.", "Fault is presumed unless proven otherwise.", "No liability arises without criminal conviction.", "Only the company can sue."], "ans": 1, "why": "", "src": "bank"}, {"id": "b512", "unit": 5, "q": "A board member who voted against a harmful resolution:", "opts": ["Is jointly liable anyway.", "Can be exonerated if he proves he expressly opposed it.", "Is liable for 50%.", "Is exonerated only if he resigned."], "ans": 1, "why": "Art. 237.", "src": "bank"}, {"id": "b513", "unit": 5, "q": "A businessman who controls a company through a 'front' director without holding a post is:", "opts": ["Not liable, since he isn't registered.", "A de facto director, liable as a de jure director.", "Liable only criminally.", "A shareholder with no duties."], "ans": 1, "why": "Art. 236.3.", "src": "bank"}, {"id": "b514", "unit": 5, "q": "The corporate liability action is first brought by:", "opts": ["Creditors.", "The company, by GM resolution.", "Any shareholder individually.", "The CNMC."], "ans": 1, "why": "", "src": "bank"}, {"id": "b515", "unit": 5, "q": "Shareholders may bring the corporate action subsidiarily if they hold at least:", "opts": ["1%", "3%", "5%", "10%"], "ans": 2, "why": "", "src": "bank"}, {"id": "b516", "unit": 5, "q": "A director's negligent false statement causes direct loss to a supplier. The supplier should bring:", "opts": ["The corporate liability action.", "The individual liability action (art. 241).", "A claim before the CNMC.", "A challenge of the GM resolution."], "ans": 1, "why": "", "src": "bank"}, {"id": "b517", "unit": 5, "q": "The GM resolution to bring a corporate liability action against directors:", "opts": ["Must appear on the agenda.", "Can be adopted even if not on the agenda and implies removal of the affected directors.", "Needs unanimity.", "Needs creditors' approval."], "ans": 1, "why": "", "src": "bank"}, {"id": "b518", "unit": 5, "q": "Creditors may bring the corporate liability action:", "opts": ["Always first.", "Only if company and members haven't, and the company's assets are insufficient.", "Never.", "Only in an S.A."], "ans": 1, "why": "Art. 240.", "src": "bank"}, {"id": "b601", "unit": 6, "q": "As a rule, by-law amendments are approved by:", "opts": ["The directors.", "The general meeting.", "The Registrar.", "Members with 5%."], "ans": 1, "why": "Art. 285.1 LSC.", "src": "bank"}, {"id": "b602", "unit": 6, "q": "Unless the by-laws provide otherwise, moving the registered office from Barcelona to Madrid can be decided by:", "opts": ["Only the general meeting.", "The directors.", "The Registrar.", "The Autonomous Community."], "ans": 1, "why": "Art. 285.2.", "src": "bank"}, {"id": "b603", "unit": 6, "q": "Moving the registered office to Portugal:", "opts": ["Is decided by the directors.", "Is a structural change decided by the general meeting.", "Is forbidden.", "Needs only a notarial deed."], "ans": 1, "why": "", "src": "bank"}, {"id": "b604", "unit": 6, "q": "A by-law amendment imposing new obligations on members (e.g. ancillary commitments):", "opts": ["Needs only the ordinary majority.", "Needs the consent of the affected members.", "Is forbidden.", "Can be decided by the directors."], "ans": 1, "why": "Art. 291 ff.", "src": "bank"}, {"id": "b605", "unit": 6, "q": "The GM substantially changes the corporate purpose. A dissenting member:", "opts": ["Must accept it.", "Has a right to exit and obtain fair value (art. 346).", "Can veto it.", "Can only sell to the majority at par value."], "ans": 1, "why": "", "src": "bank"}, {"id": "b606", "unit": 6, "q": "Which capital increase does NOT increase equity?", "opts": ["Cash contributions.", "Non-cash contributions.", "Offsetting loans.", "Charged to reserves."], "ans": 3, "why": "", "src": "bank"}, {"id": "b607", "unit": 6, "q": "In an S.A., a capital increase by offsetting loans requires:", "opts": ["100% of loans liquid, mature and payable.", "At least 25% liquid, mature and payable, the rest maturing within 5 years, plus an auditor's certificate.", "Creditors' unanimous consent only.", "An expert appointed by the Registrar."], "ans": 1, "why": "S.L.: 100% liquid, mature, payable.", "src": "bank"}, {"id": "b608", "unit": 6, "q": "The pre-emptive right exists in capital increases with:", "opts": ["Any contribution.", "Cash contributions.", "Non-cash contributions only.", "Reserves only."], "ans": 1, "why": "", "src": "bank"}, {"id": "b609", "unit": 6, "q": "The minimum period to exercise the pre-emptive right (non-listed) is:", "opts": ["15 days", "One month", "Two months", "Six months"], "ans": 1, "why": "", "src": "bank"}, {"id": "b610", "unit": 6, "q": "A share premium is charged in a capital increase mainly to:", "opts": ["Pay the notary.", "Compensate old members for reserves and expectations created before new members enter.", "Increase the par value of old shares.", "Avoid registration."], "ans": 1, "why": "", "src": "bank"}, {"id": "b611", "unit": 6, "q": "A capital increase must be registered:", "opts": ["When the GM adopts the resolution.", "Together with its execution (art. 315).", "Within 6 months, before execution.", "Only in S.A."], "ans": 1, "why": "", "src": "bank"}, {"id": "b612", "unit": 6, "q": "In an S.A., the GM may delegate the decision to increase capital to:", "opts": ["The directors, within legal limits.", "The auditors.", "Any shareholder with 5%.", "Nobody."], "ans": 0, "why": "Art. 297.", "src": "bank"}, {"id": "b613", "unit": 6, "q": "A capital increase charged to reserves requires a balance sheet approved by the GM no more than:", "opts": ["One month before.", "Six months before.", "One year before.", "Two years before."], "ans": 1, "why": "Art. 303.", "src": "bank"}, {"id": "b614", "unit": 6, "q": "Mandatory capital reduction to compensate losses applies:", "opts": ["To S.A. and S.L. when equity < ½ capital.", "Only to S.A. when equity < 2/3 of capital and not recovered within one fiscal year.", "Only to S.L.", "Whenever there are any losses."], "ans": 1, "why": "Art. 327.", "src": "bank"}, {"id": "b615", "unit": 6, "q": "Creditors' right to oppose a capital reduction exists when the reduction:", "opts": ["Restores the balance after losses.", "Funds the legal reserve.", "Refunds contributions to members (S.A.).", "Is mandatory."], "ans": 2, "why": "", "src": "bank"}, {"id": "b616", "unit": 6, "q": "Creditors must exercise their right to oppose within:", "opts": ["15 days of the GM.", "One month after the last announcement.", "Three months.", "One year."], "ans": 1, "why": "", "src": "bank"}, {"id": "b617", "unit": 6, "q": "An S.A. reduces its capital to €10,000 to compensate losses and simultaneously increases it to €80,000. This is:", "opts": ["Illegal, below minimum.", "The 'accordion' operation, valid if the reduction is conditional on the increase and both are registered together.", "A transformation.", "A merger."], "ans": 1, "why": "Art. 343.", "src": "bank"}, {"id": "b618", "unit": 6, "q": "Which is a valid alternative to avoid dissolution when an S.A.'s capital must be reduced below €60,000?", "opts": ["Ignore the minimum.", "Transform into an S.L.", "Ask the CNMC.", "Issue bonds."], "ans": 1, "why": "", "src": "bank"}, {"id": "b619", "unit": 6, "q": "Which is NOT a way to reduce capital?", "opts": ["Reducing par value.", "Redeeming shares.", "Grouping shares to exchange them.", "Issuing new shares."], "ans": 3, "why": "", "src": "bank"}, {"id": "b620", "unit": 6, "q": "A capital reduction to compensate losses:", "opts": ["Reduces equity.", "Leaves equity unchanged – it's a book entry between capital and losses.", "Requires paying members.", "Needs creditor consent."], "ans": 1, "why": "Annex example.", "src": "bank"}, {"id": "b701", "unit": 7, "q": "Structural changes are regulated by:", "opts": ["The Commerce Code.", "Real Decreto-ley 5/2023 (RDLME).", "The Trademarks Act.", "The LDC."], "ans": 1, "why": "", "src": "bank"}, {"id": "b702", "unit": 7, "q": "Which is NOT a structural change under the RDLME?", "opts": ["Transformation", "Merger", "Capital increase", "Global assignment of assets and liabilities"], "ans": 2, "why": "", "src": "bank"}, {"id": "b703", "unit": 7, "q": "In a merger by creation of a new company:", "opts": ["Only one company is extinguished.", "All merging companies are extinguished.", "No company is extinguished.", "The members keep shares in the old companies."], "ans": 1, "why": "", "src": "bank"}, {"id": "b704", "unit": 7, "q": "The common draft terms of merger must be approved by the GMs within:", "opts": ["One month.", "Six months from signature, otherwise it lapses.", "One year.", "Three months."], "ans": 1, "why": "", "src": "bank"}, {"id": "b705", "unit": 7, "q": "An independent expert report on the merger draft is mandatory when:", "opts": ["Any participating company is an S.A.", "All companies are S.L.", "The merger is by absorption.", "Never."], "ans": 0, "why": "", "src": "bank"}, {"id": "b706", "unit": 7, "q": "The exchange ratio is calculated on the basis of:", "opts": ["Par value.", "Fair value.", "Book value only.", "The number of employees."], "ans": 1, "why": "", "src": "bank"}, {"id": "b707", "unit": 7, "q": "A merger becomes legally effective:", "opts": ["When the GMs approve it.", "When the draft is signed.", "Upon registration in the Mercantile Registry.", "After the 1-month creditor period."], "ans": 2, "why": "", "src": "bank"}, {"id": "b708", "unit": 7, "q": "After registration, a merger can be challenged:", "opts": ["Never.", "Only for breach of the RDLME, within three months.", "Freely within one year.", "Only by the CNMC."], "ans": 1, "why": "", "src": "bank"}, {"id": "b709", "unit": 7, "q": "In the absorption of a wholly-owned subsidiary, which is NOT required?", "opts": ["Common draft terms.", "Registration.", "Capital increase of the absorbing company.", "Public deed."], "ans": 2, "why": "Art. 53 RDLME.", "src": "bank"}, {"id": "b710", "unit": 7, "q": "A merger between 'twin' companies (common 100% shareholder):", "opts": ["Requires no formalities.", "Is simplified, but still requires capital increase and expert report.", "Is prohibited.", "Requires CNMC authorisation in all cases."], "ans": 1, "why": "Art. 49.2.", "src": "bank"}, {"id": "b711", "unit": 7, "q": "In a partial demerger (spin-off):", "opts": ["The company is extinguished.", "The company survives, reduces capital, and its members receive shares of the beneficiaries.", "The company receives the beneficiaries' shares.", "Members lose all participation."], "ans": 1, "why": "", "src": "bank"}, {"id": "b712", "unit": 7, "q": "After a segregation, the relationship between the segregated company and the beneficiary is:", "opts": ["None.", "Parent–subsidiary.", "Merger.", "Partnership."], "ans": 1, "why": "", "src": "bank"}, {"id": "b713", "unit": 7, "q": "Under art. 42 CCom, control is presumed when the parent:", "opts": ["Holds 10% of the votes.", "Holds or may hold the majority of votes, or can appoint/remove the majority of directors.", "Has the same registered office.", "Is a supplier."], "ans": 1, "why": "", "src": "bank"}, {"id": "b714", "unit": 7, "q": "Two members with 50% each block every decision. This is:", "opts": ["Not relevant legally.", "Paralysis of corporate bodies – a legal cause of dissolution.", "A ground for merger.", "A competition infringement."], "ans": 1, "why": "", "src": "bank"}, {"id": "b715", "unit": 7, "q": "Losses reduce an S.L.'s equity to 40% of its capital. This is:", "opts": ["A cause of mandatory capital reduction.", "A legal cause of dissolution unless capital is increased/reduced sufficiently (if insolvency isn't due).", "Irrelevant for S.L.", "A cause for merger."], "ans": 1, "why": "Art. 363.1.e.", "src": "bank"}, {"id": "b716", "unit": 7, "q": "During liquidation:", "opts": ["The company loses legal personality.", "The company keeps legal personality and adds 'en liquidación' to its name.", "Directors keep managing.", "Members can distribute assets before paying creditors."], "ans": 1, "why": "", "src": "bank"}, {"id": "b717", "unit": 7, "q": "With the opening of liquidation:", "opts": ["Directors become liquidators by force of law in all cases and nothing changes.", "Directors cease and liquidators assume representation.", "The GM ceases to exist.", "The Registrar manages the company."], "ans": 1, "why": "Art. 375.", "src": "bank"}, {"id": "b718", "unit": 7, "q": "Liquidators must draw up an inventory and balance sheet within:", "opts": ["One month.", "Three months.", "Six months.", "One year."], "ans": 1, "why": "", "src": "bank"}, {"id": "b719", "unit": 7, "q": "Members who didn't vote for the distribution proposal may challenge it within:", "opts": ["15 days.", "One month.", "Two months.", "Six months."], "ans": 2, "why": "Art. 390.", "src": "bank"}, {"id": "b720", "unit": 7, "q": "The legal personality of a capital company ends:", "opts": ["With the dissolution resolution.", "With the start of liquidation.", "When its entries are cancelled in the Registry after liquidation.", "When the directors resign."], "ans": 2, "why": "", "src": "bank"}, {"id": "b801", "unit": 8, "q": "Industrial property includes:", "opts": ["Copyright and patents.", "Distinctive signs and industrial creations.", "Books and music.", "Trade secrets only."], "ans": 1, "why": "", "src": "bank"}, {"id": "b802", "unit": 8, "q": "The essential element of a trademark is:", "opts": ["Registration in the EU.", "Its distinctiveness.", "Its graphic beauty.", "Its price."], "ans": 1, "why": "", "src": "bank"}, {"id": "b803", "unit": 8, "q": "The right to a Spanish trademark is acquired by:", "opts": ["First use in the market.", "Valid registration at the OEPM.", "Registration in the Mercantile Registry.", "Notarial deed."], "ans": 1, "why": "Constitutive registration (except renowned marks).", "src": "bank"}, {"id": "b804", "unit": 8, "q": "A Spanish trademark lasts:", "opts": ["20 years, not renewable.", "10 years from application, renewable indefinitely for 10-year periods.", "5 years renewable once.", "Indefinitely without renewal."], "ans": 1, "why": "", "src": "bank"}, {"id": "b805", "unit": 8, "q": "A registered trademark not used in Spain for 5 years:", "opts": ["Becomes renowned.", "Lapses and its registration is cancelled.", "Is automatically renewed.", "Becomes a trade name."], "ans": 1, "why": "", "src": "bank"}, {"id": "b806", "unit": 8, "q": "A trademark used by members of an association, which owns it, is a:", "opts": ["Guarantee trademark.", "Collective trademark.", "Renowned trademark.", "Trade name."], "ans": 1, "why": "", "src": "bank"}, {"id": "b807", "unit": 8, "q": "A trademark certifying that products meet common quality requirements is a:", "opts": ["Collective trademark.", "Guarantee (warranty) trademark.", "International trademark.", "Shop sign."], "ans": 1, "why": "", "src": "bank"}, {"id": "b808", "unit": 8, "q": "A renowned trademark:", "opts": ["Is protected only in its class.", "Can be protected beyond its class and even if not registered in Spain.", "Lasts 20 years.", "Doesn't need distinctiveness."], "ans": 1, "why": "Art. 8 LM; ZARA case.", "src": "bank"}, {"id": "b809", "unit": 8, "q": "The nullity action against a trademark registered despite an ABSOLUTE prohibition:", "opts": ["Must be brought within 5 years.", "Has no time limit (imprescriptible).", "Must be brought within 2 months.", "Doesn't exist."], "ans": 1, "why": "", "src": "bank"}, {"id": "b810", "unit": 8, "q": "Which is a RELATIVE prohibition?", "opts": ["A sign devoid of distinctiveness.", "A sign confusable with an earlier registered trademark for similar goods.", "A sign contrary to public order.", "A sign reproducing the Spanish flag."], "ans": 1, "why": "", "src": "bank"}, {"id": "b811", "unit": 8, "q": "'BioFresh 100%' for vegetables that aren't organic would most likely be refused because it is:", "opts": ["Confusable with a competitor.", "Deceptive/descriptive – an absolute prohibition.", "A shop sign.", "Too long."], "ans": 1, "why": "", "src": "bank"}, {"id": "b812", "unit": 8, "q": "The trade name identifies:", "opts": ["Specific products.", "The business/entrepreneur in trade.", "The physical store front.", "The patent owner."], "ans": 1, "why": "", "src": "bank"}, {"id": "b813", "unit": 8, "q": "Shop signs (rótulos de establecimiento):", "opts": ["Are protected by the Trademarks Act.", "Are not protected by the Trademarks Act, but misuse may be unfair competition.", "Are patents.", "Must be registered."], "ans": 1, "why": "", "src": "bank"}, {"id": "b814", "unit": 8, "q": "Which is NOT a patentability requirement?", "opts": ["Novelty", "Inventive step", "Industrial application", "Commercial success"], "ans": 3, "why": "", "src": "bank"}, {"id": "b815", "unit": 8, "q": "Novelty for patent purposes means the invention:", "opts": ["Is not known in Spain.", "Is not part of the state of the art anywhere in the world before filing.", "Has not been patented in the EU.", "Is not sold yet."], "ans": 1, "why": "Absolute novelty.", "src": "bank"}, {"id": "b816", "unit": 8, "q": "Which can be patented?", "opts": ["A mathematical method.", "A new machine with inventive step and industrial application.", "A computer program as such.", "A surgical method."], "ans": 1, "why": "", "src": "bank"}, {"id": "b817", "unit": 8, "q": "A patent lasts:", "opts": ["10 years renewable.", "20 years, not renewable.", "25 years.", "Indefinitely if exploited."], "ans": 1, "why": "", "src": "bank"}, {"id": "b818", "unit": 8, "q": "If a patent is not exploited within 3 years from grant publication (or 4 from filing):", "opts": ["It lapses immediately.", "A compulsory licence may be granted.", "It's extended.", "It becomes a trademark."], "ans": 1, "why": "", "src": "bank"}, {"id": "b819", "unit": 8, "q": "An engineer hired to research develops an invention as part of his job. It belongs to:", "opts": ["The engineer.", "The employer (service invention).", "Both equally.", "The public domain."], "ans": 1, "why": "", "src": "bank"}, {"id": "b820", "unit": 8, "q": "A salesperson (not hired to research) invents something using company resources. The employer:", "opts": ["Owns it automatically.", "May claim ownership or use, paying fair compensation (mixed invention).", "Has no rights.", "Must share it with competitors."], "ans": 1, "why": "", "src": "bank"}, {"id": "b821", "unit": 8, "q": "A compulsory licence may be granted for:", "opts": ["Lack of exploitation, public interest, or anti-competitive practices.", "Any request from a competitor.", "The patent holder's death.", "Trademark disputes."], "ans": 0, "why": "", "src": "bank"}, {"id": "b822", "unit": 8, "q": "Which is NOT considered an invention under the Patents Act?", "opts": ["A new chemical process.", "A scientific discovery.", "A new engine.", "A new manufacturing device."], "ans": 1, "why": "", "src": "bank"}, {"id": "b901", "unit": 9, "q": "The Spanish Defence of Competition Act (LDC) is:", "opts": ["Act 3/1991.", "Act 15/2007.", "Act 17/2001.", "Act 24/2015."], "ans": 1, "why": "3/1991 = Unfair Competition; 17/2001 = Trademarks; 24/2015 = Patents.", "src": "bank"}, {"id": "b902", "unit": 9, "q": "For a collusive practice to be prohibited under art. 1 LDC:", "opts": ["Intent to harm competitors must be proven.", "It's enough that the agreement may restrict competition in all/part of the national market.", "Actual damage to consumers must be proven.", "It must be in writing."], "ans": 1, "why": "Objective prohibition.", "src": "bank"}, {"id": "b903", "unit": 9, "q": "Which is an expressly listed collusive practice?", "opts": ["Opening a new store.", "Sharing markets or sources of supply.", "Advertising lower prices.", "Hiring employees from a competitor."], "ans": 1, "why": "", "src": "bank"}, {"id": "b904", "unit": 9, "q": "Holding a dominant position in the market:", "opts": ["Is always prohibited.", "Is legal; only its abuse is prohibited.", "Requires CNMC authorisation.", "Requires at least 50% share to be illegal."], "ans": 1, "why": "", "src": "bank"}, {"id": "b905", "unit": 9, "q": "Which is an example of abuse of dominant position?", "opts": ["Offering better quality.", "Unjustified refusal to supply.", "Lowering prices thanks to efficiency.", "Patenting an invention."], "ans": 1, "why": "", "src": "bank"}, {"id": "b906", "unit": 9, "q": "Conduct between competitors is of minor importance if their combined market share does not exceed:", "opts": ["5%", "10%", "15%", "30%"], "ans": 1, "why": "Non-competitors: 15% each.", "src": "bank"}, {"id": "b907", "unit": 9, "q": "Two competitors with a combined 4% share fix their selling prices. This is:", "opts": ["Allowed as de minimis.", "Prohibited – price fixing between competitors is never of minor importance.", "Allowed if consumers benefit.", "Only an unfair competition act."], "ans": 1, "why": "", "src": "bank"}, {"id": "b908", "unit": 9, "q": "A concentration must be notified to the CNMC if it reaches a market share of at least:", "opts": ["10%", "25%", "30%", "50%"], "ans": 2, "why": "Or turnover > €240M with ≥2 participants > €60M each.", "src": "bank"}, {"id": "b909", "unit": 9, "q": "Before CNMC authorisation, a notifiable concentration:", "opts": ["Can be executed if notified.", "Is suspended – it cannot be executed.", "Is automatically approved after 15 days.", "Needs only shareholder approval."], "ans": 1, "why": "", "src": "bank"}, {"id": "b910", "unit": 9, "q": "Under EU law, State aid is:", "opts": ["Always allowed.", "In principle incompatible, with exceptions (e.g. natural disasters) and a de minimis of €200,000 over 3 years.", "Prohibited by the Spanish LDC.", "Only controlled by the CNMC."], "ans": 1, "why": "", "src": "bank"}, {"id": "b911", "unit": 9, "q": "A cartel affecting several EU Member States is supervised by:", "opts": ["The CNMC.", "The European Commission.", "The Spanish Supreme Court.", "The OEPM."], "ans": 1, "why": "", "src": "bank"}, {"id": "b912", "unit": 9, "q": "The maximum fine for very serious competition infringements is:", "opts": ["1% of turnover.", "5% of turnover.", "10% of turnover.", "€60,000."], "ans": 2, "why": "Representatives: up to €60,000.", "src": "bank"}, {"id": "b913", "unit": 9, "q": "Under the leniency programme, the first cartel member to provide decisive evidence:", "opts": ["Gets a 10% reduction.", "Can be exempted from the fine.", "Must pay double.", "Is excluded from the market."], "ans": 1, "why": "", "src": "bank"}, {"id": "b914", "unit": 9, "q": "Under the Unfair Competition Act, an act is unfair:", "opts": ["Only if the contract is concluded.", "Whether performed before, during or after a transaction, and whether or not the contract is concluded.", "Only if done by an entrepreneur.", "Only if intentional."], "ans": 1, "why": "", "src": "bank"}, {"id": "b915", "unit": 9, "q": "The general clause (art. 4 LCD) defines as unfair any conduct:", "opts": ["Causing losses to a competitor.", "Objectively contrary to good faith.", "Not authorised by the CNMC.", "Involving low prices."], "ans": 1, "why": "", "src": "bank"}, {"id": "b916", "unit": 9, "q": "Publicly stating true facts about a competitor's personal life to harm its reputation is:", "opts": ["Lawful because true.", "Unfair defamation – personal matters are not appropriate even if true.", "Comparative advertising.", "Misleading omission."], "ans": 1, "why": "", "src": "bank"}, {"id": "b917", "unit": 9, "q": "Comparative advertising is lawful if, among others:", "opts": ["It compares products with different purposes.", "It objectively compares essential, relevant features and is true.", "It mentions only the competitor's weaknesses.", "It uses the competitor's reputation."], "ans": 1, "why": "", "src": "bank"}, {"id": "b918", "unit": 9, "q": "Selling below cost is unfair:", "opts": ["Always.", "Only if systematic and misleading about price levels or aimed at eliminating a competitor.", "Never.", "Only for food."], "ans": 1, "why": "", "src": "bank"}, {"id": "b919", "unit": 9, "q": "An airline advertises 'Barcelona for €1' but offers only two seats at that price. This is:", "opts": ["Lawful marketing.", "Bait advertising – a misleading practice.", "An aggressive practice.", "Comparative advertising."], "ans": 1, "why": "", "src": "bank"}, {"id": "b920", "unit": 9, "q": "A sponsored magazine article not marked as advertising is:", "opts": ["Covert advertising – a misleading practice.", "Lawful journalism.", "Defamation.", "Imitation."], "ans": 0, "why": "", "src": "bank"}, {"id": "b921", "unit": 9, "q": "Repeated unsolicited e-mails after the consumer asked to stop are:", "opts": ["Misleading practices.", "Aggressive practices.", "Lawful if the products are good.", "Collusive practices."], "ans": 1, "why": "", "src": "bank"}, {"id": "b922", "unit": 9, "q": "A pyramid scheme where income comes mainly from recruiting other consumers is:", "opts": ["Lawful if registered.", "Always unfair (misleading practice).", "An abuse of dominant position.", "A concentration."], "ans": 1, "why": "", "src": "bank"}, {"id": "b923", "unit": 9, "q": "Which body resolves competition matters at national level?", "opts": ["OEPM", "CNMC", "BORME", "Registrar"], "ans": 1, "why": "Appeals to the Audiencia Nacional.", "src": "bank"}, {"id": "b924", "unit": 9, "q": "Trade secrets are specifically protected by:", "opts": ["Act 1/2019 on Trade Secrets.", "The Patents Act only.", "The Commerce Code art. 1.", "The LDC."], "ans": 0, "why": "", "src": "bank"}];
