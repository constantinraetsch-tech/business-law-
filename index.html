 "weak", "topic": "art2"}, {"id": "w09", "unit": 2, "q": "For commercial contracts, on matters the Commerce Code doesn't regulate (requirements, modification, effects), art. 50 CCom says:", "opts": ["Business usage applies first, then civil law.", "Civil law applies directly.", "Only usage applies.", "The contract must be renegotiated."], "ans": 1, "why": "Art. 50 CCom is the limit to art. 2: for contracts, no usage in between – straight to civil law.", "src": "weak", "topic": "art2"}, {"id": "w10", "unit": 2, "q": "A general partnership with three partners owes €90,000 and has €30,000 in assets. A creditor:", "opts": ["Must claim €20,000 from each partner.", "First takes the company's assets, then can claim the full remaining €60,000 from any one partner.", "Can claim from the partners before touching the company's assets.", "Can only claim €30,000 in total."], "ans": 1, "why": "Subsidiary (company first) + joint & several (the whole rest from any partner, who claims the others' shares internally).", "src": "weak", "topic": "gp"}, {"id": "w11", "unit": 2, "q": "A partner of a general partnership wants to sell his position to a friend. Which is correct?", "opts": ["He can transfer it freely.", "He needs the consent of the other partners (art. 143 CCom).", "He only needs a notarial deed.", "It is impossible in all cases."], "ans": 1, "why": "Personalistic company based on trust: no change of partner without the others' consent.", "src": "weak", "topic": "gp"}, {"id": "w12", "unit": 2, "q": "Which is NOT an effect of a trading company's legal personality?", "opts": ["It is a subject of its own rights and obligations.", "It acquires the status of entrepreneur itself.", "It owns assets separate from those of its members.", "Its members are never liable for company debts, whatever the company type."], "ans": 3, "why": "Legal personality separates the assets, but in a general partnership partners are still liable (personal, unlimited, subsidiary).", "src": "weak", "topic": "person"}, {"id": "w13", "unit": 2, "q": "Patinetes S.L. buys 50 scooters on credit and then cannot pay. Which is correct?", "opts": ["The seller can claim from Pedro's and María's private assets.", "Only the company's assets answer – the members are not personally liable.", "The members answer subsidiarily and jointly.", "The contract is void because the company has no capacity."], "ans": 1, "why": "The S.L. is the contracting party and owns its assets; members of a capital company are not personally liable (art. 1 LSC).", "src": "weak", "topic": "person"}, {"id": "w14", "unit": 3, "q": "Where may a Spanish S.L. fix its registered office?", "opts": ["Anywhere in the EU.", "At any address in Spain, e.g. a P.O. box chosen for convenience.", "In Spain, where its effective administration is or its main establishment.", "Always in the founders' home town."], "ans": 2, "why": "Art. 9 LSC. If the registered office differs from reality, third parties may rely on either (art. 10).", "src": "weak", "topic": "office"}, {"id": "w15", "unit": 3, "q": "An S.L. moves its registered office from Barcelona to Madrid. The by-laws say nothing on this. Who can decide?", "opts": ["Only the general meeting, unanimously.", "The directors.", "The Mercantile Registrar.", "Nobody – it requires a structural change."], "ans": 1, "why": "Within Spain: directors (art. 285.2 LSC), unless the by-laws deny it. Abroad: structural change, GM.", "src": "weak", "topic": "office"}, {"id": "w16", "unit": 3, "q": "In an S.A., the by-laws may restrict attendance at the general meeting by:", "opts": ["Nothing – attendance can never be restricted.", "Requiring a minimum number of shares, at most one per thousand of the capital.", "Requiring at least 5% of the capital.", "Allowing only directors to attend."], "ans": 1, "why": "Art. 179.2 LSC. In an S.L. attendance cannot be restricted.", "src": "weak", "topic": "sasl"}, {"id": "w17", "unit": 3, "q": "Which statement is correct?", "opts": ["S.L. stakes are negotiable securities and freely transferable.", "S.A. shares are negotiable securities and, in principle, freely transferable.", "Every transfer of S.A. shares needs GM consent.", "S.L. stakes can be listed on the stock exchange."], "ans": 1, "why": "S.A. = anonymous investors, free transfer (by-laws may restrict). S.L. = closed, stakes aren't securities, restricted transfer.", "src": "weak", "topic": "sasl"}, {"id": "w18", "unit": 3, "q": "Unless the by-laws say otherwise, voting rights in an S.L. are:", "opts": ["One vote per member.", "One vote per stake.", "Equal for all members regardless of stakes.", "Only for members with at least 5%."], "ans": 1, "why": "S.L.: one vote per stake (art. 188 LSC). S.A.: votes according to nominal value.", "src": "weak", "topic": "sasl"}, {"id": "w19", "unit": 3, "q": "The by-laws of an S.L. say nothing about duration or the financial year. Which is correct?", "opts": ["The by-laws are invalid and the Registrar must refuse them.", "The company is formed for an unlimited period and its financial year ends on 31 December.", "The company lasts 10 years and its year ends on 30 June.", "The GM must fix both before registration."], "ans": 1, "why": "Arts. 26–27 LSC fill the gaps: unlimited duration, start on the date of the deed, year ends 31 December.", "src": "weak", "topic": "defaults"}, {"id": "w20", "unit": 5, "q": "A director forgot to convene the ordinary GM on time. The same year, a flood destroyed the company's stock. Is he liable for the flood loss under art. 236?", "opts": ["Yes – fault is presumed because he broke the law.", "No – there is no causal link between his omission and the loss.", "Yes – directors are liable for all losses in their term.", "Only if the company becomes insolvent."], "ans": 1, "why": "Liability needs an unlawful act, damage and a causal link. The flood damage would have happened anyway.", "src": "weak", "topic": "damages"}, {"id": "w21", "unit": 5, "q": "In a claim for damages against a director who acted against the by-laws, what must the claimant still prove?", "opts": ["Only that the director was at fault.", "The damage and the causal link.", "Nothing – everything is presumed.", "That the company is insolvent."], "ans": 1, "why": "Fault is presumed when the act is contrary to law or by-laws (art. 236.1), but damage and causal link are not.", "src": "weak", "topic": "damages"}, {"id": "w22", "unit": 5, "q": "Under the \"orderly entrepreneur\" standard, the directors of a large bank compared with those of a small bakery:", "opts": ["Need exactly the same knowledge.", "Need more expertise – professional competence depends on the company's size and complexity.", "Are the only ones bound by a duty of care.", "Can exclude the duty of care in the by-laws."], "ans": 1, "why": "Professional competence is one of the two perspectives of the standard (with prudence).", "src": "weak", "topic": "orderly"}, {"id": "w23", "unit": 5, "q": "A director invests half the company's cash in a speculative asset after reading one social media post. Which aspect of the duty of care is most clearly breached?", "opts": ["The duty of secrecy.", "Prudence.", "The pre-emptive right.", "The duty to convene the GM."], "ans": 1, "why": "Prudence = no risks beyond what is reasonable after planning and analysis.", "src": "weak", "topic": "orderly"}, {"id": "w24", "unit": 5, "q": "Which damage can be claimed through the individual liability action?", "opts": ["The fall in value of a member's shares caused by damage to the company.", "Direct damage to a member's or third party's own assets caused by a director acting as such.", "Damage a director causes in a private car accident.", "Damage suffered by the company itself."], "ans": 1, "why": "Individual action (art. 241): direct damage, by a director in office. Damage to the company → corporate action.", "src": "weak", "topic": "indiv"}, {"id": "w25", "unit": 6, "q": "A shareholder's €20,000 loan to an S.L. is converted into new stakes. Effect on the balance sheet:", "opts": ["Cash ↑ and equity ↑.", "Debt ↓, capital and equity ↑, no new cash.", "Equity unchanged.", "Debt ↑ and capital ↑."], "ans": 1, "why": "Offsetting loans = debt-to-equity swap. The two debts cancel out, so no money moves.", "src": "weak", "topic": "offset"}, {"id": "w26", "unit": 6, "q": "In an S.L., a capital increase by offsetting loans requires the loans to be:", "opts": ["At least 25% liquid, mature and payable.", "100% liquid, mature and payable.", "Approved by all other creditors.", "Secured by a bank guarantee."], "ans": 1, "why": "S.L.: 100% (art. 301). S.A.: ≥ 25%, rest due within 5 years + auditor's certificate.", "src": "weak", "topic": "offset"}, {"id": "w27", "unit": 6, "q": "An S.A. with €1,000,000 capital authorises its directors to increase capital at their discretion (authorised capital). Maximum?", "opts": ["€1,000,000, any type of contribution, within 10 years.", "€500,000, cash contributions only, within 5 years.", "€250,000, non-cash only, within 1 year.", "No limit, as long as the GM approved it."], "ans": 1, "why": "Art. 297.1.b LSC: up to half the capital, cash only, within five years.", "src": "weak", "topic": "deleg"}, {"id": "w28", "unit": 6, "q": "The GM of an S.A. approves a €100,000 capital increase and leaves only the timing and remaining details to the directors. Deadline to carry it out?", "opts": ["One year.", "Five years.", "Six months.", "No deadline."], "ans": 0, "why": "Art. 297.1.a LSC: maximum one year.", "src": "weak", "topic": "deleg"}, {"id": "w29", "unit": 6, "q": "Which capital reduction makes money actually leave the company?", "opts": ["A reduction to compensate losses.", "A reduction to create voluntary reserves.", "A reduction to refund contributions to members.", "None – a capital reduction never moves money."], "ans": 2, "why": "Loss compensation and reserves are book entries. A refund pays members from the company's cash.", "src": "weak", "topic": "reduct"}, {"id": "w30", "unit": 6, "q": "An S.A. reduces its capital by €20,000 to create voluntary reserves. Its equity:", "opts": ["Falls by €20,000.", "Stays the same – the amount moves from capital to reserves.", "Rises by €20,000.", "Falls to zero."], "ans": 1, "why": "Both capital and reserves are part of equity, so the total doesn't change. Creditors have no right to oppose.", "src": "weak", "topic": "reduct"}, {"id": "w31", "unit": 6, "q": "An S.A. has capital €100,000 and losses €50,000. It reduces capital by €30,000 against losses. Result?", "opts": ["Capital €70,000, losses €50,000, equity €20,000.", "Capital €70,000, losses €20,000, equity €50,000 (≈71% of capital).", "Capital €70,000, equity €80,000.", "Members receive €30,000."], "ans": 1, "why": "Capital and losses both fall by €30,000; equity stays €50,000. 50,000 ÷ 70,000 ≈ 71% > 2/3.", "src": "weak", "topic": "twothirds"}, {"id": "w32", "unit": 6, "q": "An S.A. has capital €200,000 and equity €120,000, and it has stayed like this for more than one financial year. Which is correct?", "opts": ["It is in a legal cause of dissolution.", "It must reduce its capital (mandatory reduction), since equity is below 2/3 of capital.", "Nothing is required.", "It must be liquidated immediately."], "ans": 1, "why": "120,000 ÷ 200,000 = 60% < 2/3 → mandatory reduction (art. 327). Dissolution only below 1/2.", "src": "weak", "topic": "twothirds"}, {"id": "w33", "unit": 7, "q": "Two scooter companies merge so they can buy batteries in bulk and run one head office instead of two. This is mainly:", "opts": ["Vertical integration.", "Economies of scale.", "Segregation.", "Paralysis of corporate bodies."], "ans": 1, "why": "Bigger volume → lower cost per unit.", "src": "weak", "topic": "mreasons"}, {"id": "w34", "unit": 7, "q": "A scooter maker merges with its battery supplier. The main economic reason is:", "opts": ["Vertical integration.", "Optimised financing.", "A total demerger.", "Lifting the veil."], "ans": 0, "why": "Merging with a supplier or customer = controlling more of the production chain.", "src": "weak", "topic": "mreasons"}, {"id": "xa1", "unit": 1, "q": "Regarding Royal Decree-Laws and Royal Legislative Decrees:", "opts": ["Both are approved by the Government and have the status of an act, but only the Royal Decree-Law requires an extraordinary and urgent need.", "A Royal Legislative Decree must be validated by Congress within 30 days.", "A Royal Decree-Law requires a prior delegation law from Parliament.", "Both rank below Royal Decrees."], "ans": 0, "why": "Decree-Law: urgency + later validation. Legislative Decree: prior delegation by Parliament.", "src": "mx", "topic": "rdl"}, {"id": "xa2", "unit": 2, "q": "Concerning the rules governing acts of commerce:", "opts": ["Failing the Commerce Code, business usage applies before civil law, whether or not the parties are merchants.", "Civil law always applies before business usage.", "Only acts carried out by merchants are governed by the Commerce Code.", "Business usage applies even against the Commerce Code."], "ans": 0, "why": "Art. 2 CCom: Code → usage → civil law; the nature of the act matters, not who performs it.", "src": "mx", "topic": "art2"}, {"id": "xa3", "unit": 3, "q": "Regarding the by-laws of a capital company:", "opts": ["If they don't state the duration, the company is formed for an unlimited period and starts operating on the date of the deed.", "If they don't state the financial year, it ends on 30 June.", "If they don't state the duration, they are void.", "The company always starts operating on the date of registration."], "ans": 0, "why": "Dispositive defaults of the LSC.", "src": "mx", "topic": "defaults"}, {"id": "xa4", "unit": 5, "q": "Concerning directors' liability for damages:", "opts": ["It requires an unlawful act or omission, damage and a causal link; fault is presumed when the act is contrary to the law or the by-laws.", "It only requires that damage occurred during the director's term.", "It requires the company to be insolvent.", "It is excluded if the general meeting approved the act."], "ans": 0, "why": "Art. 236 LSC; GM approval never exonerates.", "src": "mx", "topic": "damages"}, {"id": "xa5", "unit": 6, "q": "Regarding capital reductions:", "opts": ["A reduction to compensate losses doesn't change equity, and in an S.A. creditors have no right to oppose it.", "Every capital reduction reduces equity.", "Every capital reduction requires a payment to the members.", "Creditors can always oppose any capital reduction."], "ans": 0, "why": "Loss compensation is a book entry; creditor opposition only when assets leave (refunds, release of called-up capital).", "src": "mx", "topic": "reduct"}, {"id": "xa6", "unit": 7, "q": "In a merger by absorption:", "opts": ["The absorbing company survives and as a rule increases its capital; the absorbed company is extinguished without liquidation.", "Both companies survive.", "The absorbing company is extinguished.", "The absorbed company must first be liquidated."], "ans": 0, "why": "Universal succession: assets and members pass to the absorbing company; no liquidation.", "src": "mx", "topic": "mreasons"}, {"id": "xb1", "unit": 1, "q": "Regarding international treaties:", "opts": ["Once officially published in Spain they form part of internal law and cannot be modified by a later act.", "They rank above the Constitution.", "A later act of Parliament can repeal them.", "They apply in Spain without publication."], "ans": 0, "why": "Art. 96 CE; art. 95: below the Constitution.", "src": "mx", "topic": "treaty"}, {"id": "xb2", "unit": 2, "q": "Regarding the general partnership:", "opts": ["A person who is not a partner but allows his name to appear in the firm name is liable as a partner.", "Partners can freely transfer their position to third parties.", "Partners are liable only up to their contribution.", "Creditors must claim from the partners before the partnership."], "ans": 0, "why": "Art. 126 CCom protects third parties who rely on the name.", "src": "mx", "topic": "gp"}, {"id": "xb3", "unit": 3, "q": "Regarding the registered office of a capital company:", "opts": ["It must be in Spain, where effective administration is or the main establishment; if it doesn't match reality, third parties may rely on either.", "It can be fixed anywhere in the EU.", "It can be any address freely chosen by the founders.", "Only the general meeting can ever change it."], "ans": 0, "why": "Arts. 9–10 LSC.", "src": "mx", "topic": "office"}, {"id": "xb4", "unit": 4, "q": "Concerning attendance at the general meeting:", "opts": ["In an S.A., the by-laws may require a minimum number of shares to attend, not exceeding one per thousand of the capital.", "In an S.L., the by-laws may require at least 1% of capital to attend.", "In an S.A., attendance can never be restricted.", "In both company types only members with 5% may attend."], "ans": 0, "why": "Art. 179 LSC: S.L. no restriction; S.A. up to 1/1000.", "src": "mx", "topic": "sasl"}, {"id": "xb5", "unit": 5, "q": "Regarding the individual liability action against directors:", "opts": ["It protects members or third parties directly damaged in their own assets by acts of directors in office.", "It is brought by the company after a GM resolution.", "It requires holding at least 5% of capital.", "It covers damage suffered only indirectly through the company's loss."], "ans": 0, "why": "Art. 241 LSC.", "src": "mx", "topic": "indiv"}, {"id": "xb6", "unit": 6, "q": "Concerning delegation of a capital increase in an S.A.:", "opts": ["The GM may authorise the directors to increase capital up to half of the capital, in cash, within five years.", "The GM may authorise the directors to increase capital up to the full capital with non-cash contributions.", "The directors can never decide a capital increase.", "The authorisation may last up to ten years."], "ans": 0, "why": "Art. 297.1.b LSC.", "src": "mx", "topic": "deleg"}, {"id": "xc1", "unit": 1, "q": "Concerning the characters of legal rules:", "opts": ["A new duty for all public limited companies is a legal rule; a decree appointing one person to a public office is not, because it lacks generality.", "Social norms are coercible because society disapproves of breaking them.", "Generality means the rule applies to one specific person.", "A rule is only legal if everyone obeys it voluntarily."], "ans": 0, "why": "Generality + coercibility.", "src": "mx", "topic": "general"}, {"id": "xc2", "unit": 2, "q": "Regarding the legal personality of a trading company:", "opts": ["Once incorporated, the company is a subject of rights and obligations with its own assets, separate from those of its members.", "The members own the company's assets in proportion to their contribution.", "Only S.A.s have legal personality.", "Legal personality means members are never liable, whatever the company type."], "ans": 0, "why": "Art. 116 CCom; partners of a general partnership remain liable.", "src": "mx", "topic": "person"}, {"id": "xc3", "unit": 3, "q": "Comparing S.A. and S.L.:", "opts": ["S.A. shares are negotiable securities; S.L. stakes are not, and their transfer is restricted.", "S.L. stakes are negotiable securities that can be listed.", "In both, non-cash contributions always require an independent expert report.", "In both, attendance at the GM can be restricted to members with 1/1000 of capital."], "ans": 0, "why": "Expert report only in the S.A. (as a rule); attendance restriction only in the S.A.", "src": "mx", "topic": "sasl"}, {"id": "xc4", "unit": 5, "q": "Regarding the \"orderly entrepreneur\" standard of diligence:", "opts": ["The required professional competence depends on the size and complexity of the company.", "It is identical for every company, whatever its activity.", "It only applies to directors of banks.", "The by-laws may exclude it."], "ans": 0, "why": "Two perspectives: prudence and professional competence.", "src": "mx", "topic": "orderly"}, {"id": "xc5", "unit": 6, "q": "Concerning a capital increase by offsetting loans:", "opts": ["It reduces the company's debts and increases equity without new cash; in an S.L. the loans must be fully liquid, mature and payable.", "It brings new cash into the company.", "It doesn't change the company's equity.", "In an S.L., 25% of the loans being liquid is enough."], "ans": 0, "why": "Debt-to-equity swap; art. 301 LSC.", "src": "mx", "topic": "offset"}, {"id": "xc6", "unit": 6, "q": "An S.A. has capital €200,000 and equity €120,000 for more than one financial year:", "opts": ["It must reduce its capital, because equity is below two thirds of capital.", "It is in a legal cause of dissolution.", "Nothing is required.", "It must transform into an S.L."], "ans": 0, "why": "60% < 2/3 → mandatory reduction (art. 327); dissolution only below 1/2.", "src": "mx", "topic": "twothirds"}, {"id": "n01", "unit": 1, "q": "A party relies on a local custom in court. Which is correct?", "opts": ["Custom applies even if there is a law on the matter.", "Custom applies only if there is no applicable law, it is not contrary to morals or public order, and it is proven.", "Custom never needs to be proven.", "Custom ranks above written law."], "ans": 1, "why": "Art. 1.3 CC.", "src": "mx"}, {"id": "n02", "unit": 1, "q": "General principles of law apply:", "opts": ["Before custom.", "In the absence of law and custom, and they also inform the whole legal system.", "Only in criminal law.", "Only if a court has applied them twice."], "ans": 1, "why": "Art. 1.4 CC. Most are found in the Constitution (justice, freedom, equality).", "src": "mx"}, {"id": "n03", "unit": 1, "q": "Repeated doctrine of the Supreme Court:", "opts": ["Is a formal source of law, like custom.", "Complements the legal system but is not a source of law.", "Ranks above acts.", "Can repeal Royal Decrees."], "ans": 1, "why": "Case law is NOT a source in Spain (art. 1.6 CC).", "src": "new"}, {"id": "n04", "unit": 1, "q": "A new Act states: \"Act 5/2010 is hereby repealed.\" This is:", "opts": ["Tacit repeal.", "Express repeal.", "Vacatio legis.", "Annulment by the Constitutional Court."], "ans": 1, "why": "Express = the new rule says so. Tacit = the new rule regulates the same matter differently.", "src": "mx"}, {"id": "n05", "unit": 1, "q": "Art. 314 CCom: commercial loans bear no interest unless agreed in writing. This rule is:", "opts": ["Mandatory – parties can't agree otherwise.", "Dispositive – it applies only if the parties don't agree otherwise.", "Unconstitutional.", "A general principle of law."], "ans": 1, "why": "Dispositive rules give way to the parties' agreement.", "src": "mx"}, {"id": "n06", "unit": 1, "q": "An EU Directive:", "opts": ["Is directly applicable to citizens without any national rule.", "Binds Member States as to the result and must be transposed into national law.", "Only binds EU institutions.", "Has lower rank than Spanish Royal Decrees."], "ans": 1, "why": "Regulation = directly applicable; Directive = needs transposition.", "src": "new"}, {"id": "n07", "unit": 1, "q": "A Catalan law and a State law conflict on a matter the Constitution reserves exclusively to the State. How is this resolved?", "opts": ["By hierarchy: State law always ranks above regional law.", "By competence: the regional law is invalid because the matter belongs to the State.", "The later law prevails.", "The regional law prevails inside Catalonia."], "ans": 1, "why": "State vs Autonomous Communities = competence, not hierarchy (arts. 148–149 CE).", "src": "mx"}, {"id": "n08", "unit": 1, "q": "A trader is fined and argues he didn't know a rule published in the BOE two months earlier. Which is correct?", "opts": ["He is excused because he didn't know it.", "Ignorance of the law does not excuse from compliance (art. 6.1 CC).", "Rules only bind people who were notified individually.", "He is excused if he is a foreigner."], "ans": 1, "why": "Principle of effectiveness: publication makes the rule binding on everyone.", "src": "new"}, {"id": "n09", "unit": 1, "q": "\"Material sources\" of law are:", "opts": ["The forms rules take: law, custom, general principles.", "The bodies with power to create rules: State, Autonomous Communities, EU.", "Court judgments.", "Legal textbooks."], "ans": 1, "why": "Material = who makes rules; formal = what form they take.", "src": "new"}, {"id": "n10", "unit": 2, "q": "When a company \"buys a business\", in legal terms it acquires:", "opts": ["An enterprise with its own legal personality.", "A business (commercial establishment): assets plus contracts, clients and other relationships.", "Only the buildings and machines.", "The previous owner's status as entrepreneur."], "ans": 1, "why": "The enterprise has no personality; what you buy is the business establishment, usually worth more than its isolated assets.", "src": "mx"}, {"id": "n11", "unit": 2, "q": "Which is NOT a feature of the legal concept of entrepreneur?", "opts": ["Organising means of production.", "Acting professionally (habitually, publicly, for the market).", "Acting in its own name.", "Acting in the name of another person."], "ans": 3, "why": "Directors, attorneys and employees act in someone else's name → not entrepreneurs.", "src": "mx"}, {"id": "n12", "unit": 2, "q": "Under art. 1 CCom, businesspersons are:", "opts": ["Anyone who once sells something.", "People with legal capacity who habitually engage in commerce, and trading companies.", "Only companies registered as S.A.", "Only people registered in the Mercantile Registry."], "ans": 1, "why": "Art. 1 CCom.", "src": "new"}, {"id": "n13", "unit": 2, "q": "A 17-year-old wants to open a new online shop on his own as an individual entrepreneur. Which is correct?", "opts": ["He can, because he has legal capacity from birth.", "He cannot – capacity to operate requires legal age; the exception covers continuing a parent's business through representatives.", "He can if his school agrees.", "He can, but only for one year."], "ans": 1, "why": "Art. 4 CCom: legal age + free disposal of assets.", "src": "new"}, {"id": "n14", "unit": 2, "q": "Which is a professional duty of EVERY entrepreneur?", "opts": ["Registering in the Mercantile Registry.", "Keeping orderly accounts.", "Having at least €3,000 capital.", "Appointing a board of directors."], "ans": 1, "why": "Accounts (art. 25 CCom) apply to all; registration is optional for individuals.", "src": "mx"}, {"id": "n15", "unit": 2, "q": "An S.L. has been trading for two years but its deed was never registered. Which is correct?", "opts": ["Members are protected by limited liability anyway.", "It is an irregular company: members answer like general partners for its debts.", "The contracts it signed are void.", "Only the notary is liable."], "ans": 1, "why": "Limited liability only works after registration.", "src": "mx"}, {"id": "n16", "unit": 2, "q": "Which company types are personalistic (based on trust between partners)?", "opts": ["S.A. and S.L.", "General partnership and limited partnership.", "Only the S.A.", "Partnership limited by shares and S.A."], "ans": 1, "why": "Partnerships = personalistic; S.A./S.L. = capital companies.", "src": "mx"}, {"id": "n17", "unit": 2, "q": "An individual entrepreneur answers for his business debts with:", "opts": ["Only the assets used in the business.", "All his present and future assets, business and private (art. 1911 CC).", "Only the money in the business account.", "Nothing, if he registered in the Mercantile Registry."], "ans": 1, "why": "Universal liability – the reason why single-member companies exist.", "src": "new"}, {"id": "n18", "unit": 2, "q": "A special commercial act and the Commerce Code regulate the same issue differently. Which applies?", "opts": ["The Commerce Code, because it is older.", "The special act (lex specialis).", "Whichever the parties prefer.", "Neither – the Civil Code applies."], "ans": 1, "why": "Special laws prevail over general ones.", "src": "new"}, {"id": "n19", "unit": 3, "q": "What is the correct order of steps to incorporate an S.L.?", "opts": ["Registry → notary → bank → name certificate.", "Name certificate → bank deposit certificate → deed + by-laws before a notary → Mercantile Registry.", "Notary → name certificate → Registry → bank.", "Bank → Registry → notary → name certificate."], "ans": 1, "why": "Personality is acquired on registration.", "src": "mx"}, {"id": "n20", "unit": 3, "q": "The relationship between the deed of incorporation and the by-laws is:", "opts": ["They are the same document.", "The deed includes the by-laws, which are the company's internal rules.", "The by-laws are optional.", "The by-laws are filed only after five years."], "ans": 1, "why": "Art. 22 LSC: the deed contains the by-laws.", "src": "mx"}, {"id": "n21", "unit": 3, "q": "An S.A. is incorporated with €60,000 capital. The minimum that must be paid up at incorporation is:", "opts": ["€60,000", "€15,000", "€3,000", "Nothing"], "ans": 1, "why": "S.A.: at least 25% of each share's par value; the rest is called-up capital.", "src": "mx"}, {"id": "n22", "unit": 3, "q": "A founder of an S.L. contributes a delivery van. Which is correct?", "opts": ["An independent expert report is mandatory.", "No expert report is needed, but the founders are liable for the van's real value.", "Vans can't be contributed.", "The van must be sold first and the cash contributed."], "ans": 1, "why": "Expert report only in the S.A.; in the S.L. the contributors answer for the value.", "src": "mx"}, {"id": "n23", "unit": 3, "q": "A company keeps its profits as reserves for years and has no losses. Which is correct?", "opts": ["Equity = capital.", "Equity > capital.", "Equity < capital.", "Capital rises automatically."], "ans": 1, "why": "Reserves add to equity; capital stays the same number.", "src": "new"}, {"id": "n24", "unit": 3, "q": "An S.A. has 1,000 shares of €100 (capital €100,000) and equity of €250,000. Book value per share is:", "opts": ["€100", "€250", "€150", "€25"], "ans": 1, "why": "Book value = equity ÷ number of shares = 250,000 ÷ 1,000.", "src": "mx"}, {"id": "n25", "unit": 3, "q": "Which is NOT a basic right of members under the LSC?", "opts": ["Share in profits (dividends).", "Pre-emptive right in new issues.", "A guaranteed fixed annual interest on their contribution.", "Information."], "ans": 2, "why": "Rights: dividends, liquidation dividend, pre-emptive right, attend & vote, challenge, information.", "src": "new"}, {"id": "n26", "unit": 3, "q": "Acts that were necessary for registration, carried out while the company was in formation:", "opts": ["Never bind the company.", "Bind the company automatically once it is registered.", "Bind only the notary.", "Bind the company only if the GM approves them unanimously."], "ans": 1, "why": "Art. 36 ff. LSC. Other acts bind it only if it accepts them.", "src": "new"}, {"id": "n27", "unit": 3, "q": "Founders want to create an S.A. with €50,000 capital. Which is correct?", "opts": ["Possible if fully paid up.", "Not possible – the minimum capital of an S.A. is €60,000.", "Possible if there is one founder.", "Possible with an expert report."], "ans": 1, "why": "Minimum outlay principle: €60,000 S.A. / €3,000 S.L. (notes).", "src": "new"}, {"id": "n28", "unit": 4, "q": "Who draws up the annual accounts, and who approves them?", "opts": ["The GM draws them up; the directors approve them.", "The directors draw them up; the GM approves them.", "The auditor does both.", "The Mercantile Registry approves them."], "ans": 1, "why": "Art. 160 a) LSC: approval is a GM competence.", "src": "mx"}, {"id": "n29", "unit": 4, "q": "An S.L.'s directors want to sell a warehouse worth 20% of total assets on the last balance sheet. Who decides?", "opts": ["Always the GM.", "The directors – it isn't a core asset (needs > 25%).", "The Registry.", "All members unanimously."], "ans": 1, "why": "Core asset presumption: value above 25% of total assets.", "src": "mx"}, {"id": "n30", "unit": 4, "q": "An S.L. sends the GM notice 10 days before the meeting. Which is correct?", "opts": ["It's valid – S.L.s need 7 days.", "It's too short – an S.L. needs at least 15 days (unless it's a universal meeting).", "It's too short – an S.L. needs one month.", "Notice is never required in an S.L."], "ans": 1, "why": "S.A. ≥ 1 month; S.L. ≥ 15 days.", "src": "mx"}, {"id": "n31", "unit": 4, "q": "Without any notice, all members of an S.L. meet and unanimously agree to hold a meeting with a given agenda. This is:", "opts": ["Invalid.", "A valid universal meeting.", "Valid only if a notary attends.", "Valid only in an S.A."], "ans": 1, "why": "Art. 178 LSC: 100% of capital + unanimous agreement on holding it and on the agenda.", "src": "new"}, {"id": "n32", "unit": 4, "q": "In an S.A., the minimum quorum for an ordinary resolution at first call is:", "opts": ["No quorum.", "25% of the subscribed capital with voting rights.", "50%.", "100%."], "ans": 1, "why": "Second call: any capital present (art. 193 LSC).", "src": "mx"}, {"id": "n33", "unit": 4, "q": "In an S.L., an ordinary resolution needs (unless by-laws say otherwise):", "opts": ["Unanimity.", "A majority of the votes validly cast, representing at least one third of the votes of all stakes.", "Two thirds of all votes.", "50% quorum at first call."], "ans": 1, "why": "Art. 198 LSC. S.L. has no quorum, but this 1/3 floor.", "src": "new"}, {"id": "n34", "unit": 4, "q": "In an S.L., a by-law amendment or capital increase needs:", "opts": ["One third of the votes.", "More than half of the votes of all the stakes.", "Unanimity.", "Only the directors' decision."], "ans": 1, "why": "Art. 199 a) LSC. Two thirds for transformation, merger, exclusion of pre-emptive right, etc.", "src": "new"}, {"id": "n35", "unit": 4, "q": "In an S.L., a merger needs:", "opts": ["More than half of the votes cast.", "At least two thirds of the votes of all the stakes.", "Unanimity.", "25% of capital."], "ans": 1, "why": "Art. 199 b) LSC.", "src": "new"}, {"id": "n36", "unit": 4, "q": "Can a company be appointed as director of another company?", "opts": ["No, only natural persons.", "Yes – it must designate a natural person to perform the role.", "Only in an S.L.", "Only if it holds 50% of the capital."], "ans": 1, "why": "Directors can be legal persons, acting through a designated natural person.", "src": "mx"}, {"id": "n37", "unit": 5, "q": "Which is NOT an obligation derived from the duty of loyalty?", "opts": ["Keeping company secrets, even after leaving office.", "Abstaining in decisions where they have a conflict of interest.", "Not competing with the company.", "Always following the instructions of the majority shareholder."], "ans": 3, "why": "Directors must exercise independent judgement.", "src": "new"}, {"id": "n38", "unit": 5, "q": "A director must abstain from voting on decisions in which he has a conflict of interest, EXCEPT:", "opts": ["Contracts with his brother's company.", "His own appointment or removal.", "Loans to himself.", "Selling company assets to his wife."], "ans": 1, "why": "Art. 228 c) LSC.", "src": "mx"}, {"id": "n39", "unit": 5, "q": "A director made a decision in good faith, with no personal interest, after gathering enough information and following an adequate procedure. It turned out badly. Which is correct?", "opts": ["He breached the duty of care because the result was bad.", "The business judgment rule protects him – a bad result alone isn't a breach.", "He is automatically liable for the losses.", "He breached the duty of loyalty."], "ans": 1, "why": "Art. 226 LSC.", "src": "new"}, {"id": "n40", "unit": 5, "q": "A former director tells a competitor about the company's secret pricing strategy six months after leaving. Which is correct?", "opts": ["No breach – duties end when he leaves.", "Breach of the duty of secrecy, which continues after leaving office.", "Breach only if he was a member too.", "Only unfair competition, not company law."], "ans": 1, "why": "Secrecy continues after leaving (art. 228 b).", "src": "new"}, {"id": "n41", "unit": 5, "q": "Equity of an S.L. falls below half of its capital. The directors must:", "opts": ["Wait until the next ordinary GM.", "Convene the GM within two months to dissolve the company or restore the balance.", "File for insolvency immediately in every case.", "Reduce capital themselves."], "ans": 1, "why": "Otherwise they become liable for debts arising after the cause.", "src": "mx"}, {"id": "n42", "unit": 5, "q": "When directors don't convene the GM after a legal cause of dissolution, they are liable for:", "opts": ["All company debts, old and new.", "Company debts arising after the legal cause, subsidiarily and jointly.", "Only debts to employees.", "Nothing, if the GM approves later."], "ans": 1, "why": "Art. 367 LSC.", "src": "new"}, {"id": "n43", "unit": 5, "q": "The correct order for bringing the corporate liability action is:", "opts": ["Creditors → members → company.", "Company (GM) → members with 5% → creditors (if company assets are insufficient).", "Any member at any time.", "Only the Mercantile Registrar."], "ans": 1, "why": "Arts. 238–240 LSC.", "src": "mx"}, {"id": "n44", "unit": 5, "q": "A board adopts a harmful resolution. Director Ana was absent, didn't know about it and had no chance to oppose it. Which is correct?", "opts": ["She is liable like everyone else.", "She can be exonerated if she proves she didn't know and didn't take part.", "She is liable only if she is a member.", "Absence never exonerates."], "ans": 1, "why": "Art. 237 LSC.", "src": "mx"}, {"id": "n45", "unit": 5, "q": "Which is a requirement of the individual liability action?", "opts": ["Damage to the company's assets.", "Holding 5% of capital.", "Direct damage to the claimant's own assets.", "A GM resolution."], "ans": 2, "why": "Individual action (art. 241): direct damage + act in office + unlawfulness + causal link.", "src": "mx"}, {"id": "n46", "unit": 6, "q": "Which is a requirement for a by-law amendment?", "opts": ["Only a directors' decision.", "Points clearly stated in the notice, GM majority, public deed and registration.", "A court order.", "Approval by the company's creditors."], "ans": 1, "why": "Art. 285 ff. LSC; S.A. also needs a written report.", "src": "new"}, {"id": "n47", "unit": 6, "q": "How can the pre-emptive right be removed in a capital increase?", "opts": ["The directors can always cancel it.", "The GM can exclude it (with requirements), or each member can waive it individually.", "It can never be removed.", "Only a judge can remove it."], "ans": 1, "why": "Card: GM exclusion or individual waiver.", "src": "mx"}, {"id": "n48", "unit": 6, "q": "An S.L. has 90,000 stakes of €1. Its pre-money value is €900,000. A new investor pays €100,000 for 10%. How many new stakes, and what premium per stake?", "opts": ["100,000 stakes, no premium.", "10,000 stakes, €9 premium each.", "9,000 stakes, €10 premium each.", "10,000 stakes, €1 premium each."], "ans": 1, "why": "Per stake value = 900,000 ÷ 90,000 = €10 → €1 capital + €9 premium; N ÷ (90,000 + N) = 10% → N = 10,000.", "src": "mx"}, {"id": "n49", "unit": 6, "q": "Why is a share premium charged to a new investor?", "opts": ["To pay the notary.", "So the old members' stakes aren't diluted in value – the newcomer pays the real value.", "Because it's required in every capital increase.", "To reduce the company's equity."], "ans": 1, "why": "Premium = price above par for reserves and expectations already built.", "src": "mx"}, {"id": "n50", "unit": 6, "q": "Which is NOT a way to reduce capital?", "opts": ["Reducing the par value of shares.", "Redeeming shares.", "Grouping shares to exchange them.", "Issuing new shares at a premium."], "ans": 3, "why": "Issuing new shares is an increase.", "src": "mx"}, {"id": "n51", "unit": 6, "q": "An S.A. reduces capital to €10,000 to absorb losses and at the same time increases it to €100,000. Which is correct?", "opts": ["Invalid – capital can never go below €60,000.", "Valid accordion operation, if the reduction is conditional on the increase and both are registered together.", "Valid only if creditors consent.", "It automatically transforms the S.A. into an S.L."], "ans": 1, "why": "Art. 343 LSC.", "src": "new"}, {"id": "n52", "unit": 6, "q": "Equity of an S.A. is below half of its capital. Which is correct?", "opts": ["Only a mandatory reduction applies.", "It is a legal cause of dissolution, unless capital is increased or reduced enough (and insolvency isn't due).", "Nothing happens until it reaches zero.", "The company is automatically extinguished."], "ans": 1, "why": "½ → dissolution cause (S.A. and S.L.); ⅔ → mandatory reduction (S.A.).", "src": "new"}, {"id": "n53", "unit": 6, "q": "A capital increase charged to reserves:", "opts": ["Increases equity.", "Leaves equity unchanged – it reclassifies reserves as capital.", "Reduces equity.", "Brings new cash."], "ans": 1, "why": "Only cash, non-cash and offsetting loans increase equity.", "src": "mx"}, {"id": "n54", "unit": 6, "q": "In which capital increase do existing members have a pre-emptive right?", "opts": ["Offsetting loans.", "Non-cash contributions.", "Cash contributions.", "Charged to reserves."], "ans": 2, "why": "Art. 304 LSC.", "src": "new"}, {"id": "n55", "unit": 7, "q": "What is the correct order of the merger procedure?", "opts": ["GM approval → common draft → registration → creditor opposition.", "Common draft → publication → GM approval → publication of the resolution → 1-month creditor opposition → public deed → registration.", "Registration → deed → GM approval.", "Creditor opposition → common draft → GM approval."], "ans": 1, "why": "Preparation → approval → execution.", "src": "mx"}, {"id": "n56", "unit": 7, "q": "Company A's shares have a fair value of €40; company B's stakes €10. A absorbs B. How many A shares does a B member get per B stake?", "opts": ["4 A shares per B stake.", "1 A share per 4 B stakes.", "1 A share per B stake.", "None – B members get cash only."], "ans": 1, "why": "Exchange ratio at fair value: 10 ÷ 40 = ¼ A share per B stake.", "src": "new"}, {"id": "n57", "unit": 7, "q": "In a total demerger:", "opts": ["The company survives and gets shares in the beneficiaries.", "The company is extinguished, its assets are split among beneficiaries, and its members get their shares.", "Two companies combine into one.", "Only part of the company is transferred and it survives."], "ans": 1, "why": "Total demerger (art. 59 RDLME).", "src": "new"}, {"id": "n58", "unit": 7, "q": "Company X transfers its hotel division to Y and receives Y's shares itself. This is:", "opts": ["A merger.", "A partial demerger.", "A segregation.", "A total demerger."], "ans": 2, "why": "Segregation: the company itself gets the shares → parent–subsidiary.", "src": "new"}, {"id": "n59", "unit": 7, "q": "During liquidation, the company:", "opts": ["Loses its legal personality.", "Keeps its legal personality, adds \"en liquidación\" to its name, and liquidators replace the directors.", "Can still start new business activities freely.", "Is managed by the GM directly."], "ans": 1, "why": "Personality ends only on cancellation of the entries.", "src": "mx"}, {"id": "n60", "unit": 7, "q": "Who declares dissolution when a legal cause exists, and what if the GM doesn't agree?", "opts": ["The Registrar declares it automatically.", "The GM; if it doesn't, directors must request judicial dissolution.", "The creditors decide.", "Nobody – the company just continues."], "ans": 1, "why": "Art. 365–366 LSC; otherwise directors become liable for later debts.", "src": "new"}, {"id": "n61", "unit": 7, "q": "Which is a cause of dissolution under the LSC?", "opts": ["A drop in sales of 10%.", "Paralysis of the corporate bodies (e.g. a 50/50 deadlock).", "A change of director.", "Moving the office within Spain."], "ans": 1, "why": "Art. 363 LSC.", "src": "new"}, {"id": "n62", "unit": 7, "q": "In a merger by creation:", "opts": ["One company absorbs the other.", "All merging companies are extinguished and a new company is formed.", "The companies remain but share a board.", "Only the smaller company is extinguished."], "ans": 1, "why": "By creation: A + B → NEW.", "src": "new"}, {"id": "n63", "unit": 7, "q": "Members who did not vote for the liquidation distribution proposal:", "opts": ["Have no remedy.", "Can challenge it within two months.", "Can challenge it within five years.", "Must accept it if the majority approved."], "ans": 1, "why": "Notes: challenge within 2 months.", "src": "mx"}];
const LESSONS = [{"u": 1, "title": "The Law, the Rule & the Legal System", "tldr": "A legal rule is <b>general</b> and <b>enforceable</b>. Rules are born (BOE + 20 days), live and die (repeal). Courts apply <b>law → custom → principles</b>. A lower rule can never beat a higher one. State vs regions = <b>competence</b>, not hierarchy. The EU makes <b>Regulations</b> (directly applicable) and <b>Directives</b> (must be transposed).", "sections": [{"h": "Objective vs subjective law", "body": "\n <p><b>Objective law</b> = the rule book of a society: an organised set of rules that can be imposed by force (Spanish law, German law). All those rules together form the <b>legal system</b>.</p>\n <p><b>Subjective law</b> = <i>your</i> right that comes out of the rule book: \"I have the right to…\". You can go to court to enforce it.</p>\n <div class=\"dia vs\"><div><h5>Objective</h5>The rules<br><small>\"Spanish law says…\"</small></div><div><h5>Subjective</h5>A person's power<br><small>\"I have the right to…\"</small></div></div>"}, {"h": "What makes a rule a legal rule?", "body": "\n <p>Two characters – remember <b>G + C</b>:</p>\n <ul><li><b>Generality</b>: it targets abstract categories, not one person. A new duty for <i>all</i> S.A.s = legal rule. A decree appointing <i>Mr. X</i> to a post = <b>not</b> a legal rule.</li>\n <li><b>Coercibility</b>: if you don't obey, the <b>state</b> (through the courts) can force you. Saying \"good morning\" is a social rule – nobody can force you.</li></ul>\n <p>To work in practice, rules need <b>interpretation</b>, <b>validity</b> and <b>effectiveness</b>.</p>"}, {"h": "Interpretation (art. 3 CC)", "body": "\n <p>Read the <b>words</b> → in their <b>context</b> → with their <b>history</b> → in today's <b>social reality</b> → always looking at their <b>spirit and purpose</b>. When the words aren't enough, use the <b>purposive approach</b>: what did the legislator want to achieve?</p>"}, {"h": "Life of a rule: birth, life, death", "body": "\n <div class=\"dia flow\"><span>Published in the <b>BOE</b><small>enactment</small></span><span><b>Vacatio legis</b><small>20 days by default</small></span><span><b>In force</b><small>binding</small></span><span><b>Repeal</b><small>express or tacit</small></span></div>\n <p><b>Express repeal</b>: the new rule says \"rule X is repealed\". <b>Tacit repeal</b>: a new rule of the same or higher rank regulates the same thing differently – the old one dies where they conflict.</p>\n <p><b>Effectiveness</b> (art. 6 CC): <i>\"Ignorance of the law does not excuse from compliance.\"</i> Once in the BOE, everybody is assumed to know it.</p>"}, {"h": "Mandatory vs dispositive rules", "body": "\n <div class=\"dia vs\"><div><h5>Mandatory</h5>Apply no matter what the parties want. Acts against them are <b>void</b> (art. 6.3 CC).</div><div><h5>Dispositive</h5>Apply only <b>if the parties don't agree otherwise</b>. Example: art. 314 CCom – loans bear no interest unless agreed in writing.</div></div>"}, {"h": "Sources of law and their order", "body": "\n <p>Art. 1 CC: <b>law, custom, general principles of law</b>, in that order.</p>\n <div class=\"dia steps\"><div><b>1 Law</b><small>written rules from the State, regions, EU…</small></div><div><b>2 Custom</b><small>only if no law, not against morals/public order, and <b>proven</b></small></div><div><b>3 General principles</b><small>justice, freedom, equality (mostly in the Constitution)</small></div></div>\n <p><b>Case law is NOT a source</b>. Repeated Supreme Court doctrine only <b>complements</b> the system.</p>\n <p><b>Material</b> sources = <i>who</i> makes rules (State, regions, EU). <b>Formal</b> sources = <i>what form</i> they take (law, custom, principles).</p>"}, {"h": "The hierarchy pyramid", "body": "\n <div class=\"dia pyr\"><div style=\"--w:30%\">Constitution</div><div style=\"--w:46%\">International treaties · EU law</div><div style=\"--w:62%\">Acts (ordinary & organic)</div><div style=\"--w:76%\">Royal Legislative Decree · Royal Decree-Law</div><div style=\"--w:88%\">Royal Decrees (regulations)</div><div style=\"--w:100%\">Ministerial orders & lower rules</div></div>\n <p>Rule: a <b>lower rule can't contradict, invalidate or repeal a higher one</b> (art. 9.3 CE). A Royal Decree that contradicts an act is <b>null</b>.</p>\n <ul><li><b>Act</b>: made by Parliament (Cortes Generales = Congress + Senate).</li>\n <li><b>Royal Decree-Law</b>: Government, <b>urgent</b> need – status of an act.</li>\n <li><b>Royal Legislative Decree</b>: Government, <b>delegated</b> by a framework law – status of an act. (The LSC is RLD 1/2010!)</li>\n <li><b>Royal Decree</b>: Government's own power, e.g. a regulation developing an act.</li></ul>"}, {"h": "State, regions, treaties and the EU", "body": "\n <p><b>State vs Autonomous Communities</b>: <b>competence, not hierarchy</b> (arts. 148–149 CE + Statutes of Autonomy). Regional laws go in their own gazettes (DOGC, BOCM).</p>\n <p><b>Treaties</b>: above all internal law, but below the Constitution – a treaty contrary to it needs a <b>constitutional amendment first</b> (art. 95 CE).</p>\n <p><b>EU</b> (Spain since 1986): competence-based, but EU law <b>prevails</b> in conflicts.</p>\n <div class=\"dia vs\"><div><h5>EU Regulation</h5>Like a European act. <b>Directly applicable</b> to everyone. No transposition. Ex: GDPR.</div><div><h5>EU Directive</h5>Addressed to <b>Member States</b> to harmonise. Must be <b>transposed</b>. National law is interpreted in line with it anyway (STS 428/2007).</div></div>\n <p class=\"tip\">Don't confuse an <b>EU Regulation</b> (top level, like an act) with a Spanish <b>regulation</b> (a Royal Decree under an act).</p>"}], "traps": ["Case law is a source of law → <b>false</b> (it complements).", "State law always ranks above regional law → <b>false</b> (competence).", "All internal law ranks above treaties → <b>false</b> (treaties are above, except the Constitution).", "Directives are directly applicable like Regulations → <b>false</b>.", "A rule enters into force on the day of publication → <b>false</b> (20 days unless stated)."], "check": [["What are the two characters of a legal rule?", "Generality and coercibility."], ["In which order do courts apply the sources?", "Law → custom → general principles."], ["Which ranks higher: an RDL or a Royal Decree?", "The Royal Decree-Law (status of an act)."], ["Regulation or Directive – which needs transposition?", "The Directive."]]}, {"u": 2, "title": "Business Law & the Entrepreneur", "tldr": "Business Law is <b>special private law for entrepreneurs</b>. The <b>enterprise</b> (assets + work) has no legal personality; the <b>entrepreneur</b> (natural or legal person acting in its own name) does. Entrepreneurs must keep accounts, publicise (companies must register) and compete fairly. They answer with <b>all present and future assets</b>. Partners in partnerships are personally liable; members of capital companies are <b>not</b>.", "sections": [{"h": "Where Business Law comes from", "body": "\n <p>Born in the <b>Middle Ages</b> as a <b>customary</b> law of traders (guilds, <i>Consulados del Mar</i> in Barcelona, Valencia, Bilbao…). Codified in the <b>1829</b> Commerce Code and replaced by the <b>1885</b> Commerce Code – still the framework today, though most of it has been replaced by special laws (<b>lex specialis</b>: special laws prevail over general ones).</p>\n <p><b>Definition</b>: the part of <b>private</b> law for <b>entrepreneurs</b> and their <b>legal status</b>, about their <b>market activity through an enterprise</b>. Employment law and tax law affect entrepreneurs but are <b>not</b> Business Law.</p>"}, {"h": "Sources of Business Law", "body": "\n <ul><li><b>Art. 38 CE</b>: free enterprise within a market economy (basis of competition law).</li>\n <li><b>Art. 149.1.6 CE</b>: commercial legislation = <b>exclusive State competence</b> → market unity.</li>\n <li><b>Art. 2 CCom</b>: acts of commerce → <b>Code</b> → <b>business usage</b> → <b>civil law</b>. Usage beats civil law, a leftover from its origins in custom.</li>\n <li><b>Art. 50 CCom</b> limit: for <b>contracts</b>, civil law applies directly (no usage in between).</li>\n <li>Today most rules = EU <b>Regulations</b> applied directly, or <b>Directives</b> transposed.</li></ul>"}, {"h": "Enterprise vs entrepreneur vs business", "body": "\n <div class=\"dia three\"><div><h5>Enterprise</h5>Organised capital + work. <b>No legal personality.</b></div><div><h5>Entrepreneur</h5>Natural or legal person acting <b>in its own name</b>. Holds rights & obligations.</div><div><h5>Business / establishment</h5>Assets <b>+ contracts, staff, reputation</b>. What you buy, sell or lease.</div></div>\n <p>Saying \"I bought an enterprise\" is legally wrong – you buy a <b>business (establishment)</b>, which is usually worth more than its isolated assets because of contracts, brand and clients.</p>\n <p>Three features of the legal entrepreneur – <b>O-P-O</b>: <b>O</b>rganises means, acts <b>P</b>rofessionally (habitually, publicly, for the market), in its <b>O</b>wn name. Directors, attorneys and employees act in someone else's name → <b>not</b> entrepreneurs.</p>"}, {"h": "Types of entrepreneurs", "body": "\n <ul><li><b>Natural person</b> (individual, sole trader) vs <b>legal person</b> (business entity, born from a partnership agreement).</li>\n <li>By <b>size</b>: no different general status, but special rules (accounting plans for SMEs, corporate tax). EU SME definition: Reg. 651/2014.</li>\n <li><b>Private vs public</b>: a public enterprise is held by a public body but carries on an economic activity.</li></ul>"}, {"h": "The legal status: duties, rights, capacity, liability", "body": "\n <div class=\"dia vs\"><div><h5>Duties</h5>1. Keep <b>accounts</b> (art. 25 CCom)<br>2. <b>Publicity</b>: Mercantile Registry – <b>mandatory for companies, optional for individuals</b><br>3. Respect <b>free & fair competition</b></div><div><h5>Rights</h5>1. <b>Compete</b> in the market<br>2. Demand <b>fair</b> competition<br>3. <b>Exclusive</b> trademarks, trade names, patents</div></div>\n <p><b>Legal capacity</b> (from birth: hold rights) vs <b>capacity to operate</b> (18 + not incapacitated: perform valid acts). Individual entrepreneur: legal age + free disposal of assets (art. 4 CCom). Exceptions: a <b>minor heir</b> continuing the parents' business, or an entrepreneur who <b>becomes incapacitated</b>, both acting through representatives.</p>\n <p><b>Restrictions</b>: <b>incompatibilities</b> (absolute: ministers; relative: judges in their territory), <b>prohibitions to compete</b> (agents art. 288 CCom, workers, directors – contracts stay valid), <b>disqualifications</b> (sanction), administrative <b>authorisations</b>.</p>\n <p><b>Liability</b>: for <b>contractual and non-contractual</b> damage, for <b>own acts and dependants'</b>, with <b>all present and future assets</b> (art. 1911 CC). A sole trader doesn't separate private and business assets.</p>"}, {"h": "Business entities & liability", "body": "\n <p>A trading company (art. 116 CCom) gets <b>legal personality</b> once incorporated → own rights, own assets, separate liability. It acts through <b>representatives</b> (legal or voluntary) – \"no hands, no brain\".</p>\n <p>The company always answers with <b>all its assets</b>. The question is whether the <b>members</b> answer too:</p>\n <table class=\"tbl\"><tr><th></th><th>General partnership</th><th>Limited partnership</th><th>S.A. / S.L.</th></tr>\n <tr><td>Members liable?</td><td>Yes: personal, unlimited, <b>subsidiary</b>, joint & several</td><td>General partners yes; limited partners up to contribution</td><td><b>No</b> (art. 1 LSC)</td></tr>\n <tr><td>Character</td><td>Personalistic</td><td>Personalistic (hybrid)</td><td>Capitalist (S.L. hybrid inside)</td></tr>\n <tr><td>Name</td><td>Partners' names + \"y Cía.\" + S.C./S.R.C.</td><td>Only general partners + S.Com.</td><td>Any name + S.A./S.L.</td></tr>\n <tr><td>Transfer</td><td>Needs consent</td><td>Limited partners free</td><td>S.A. free / S.L. restricted</td></tr></table>\n <p><b>Irregular company</b> (not registered): managers jointly & severally liable (art. 120 CCom) and members liable like general partners – <b>even if it's an S.A./S.L.</b></p>\n <p><b>Lifting the veil</b>: if members abuse the company (mix assets, act as if it didn't exist), courts ignore the separation (arts. 6.4, 7 CC).</p>"}], "traps": ["Enterprise = entrepreneur → <b>false</b>.", "All entrepreneurs must register → <b>false</b> (optional for individuals).", "Capacity to act is acquired at birth → <b>false</b> (that's legal capacity).", "Contracts concluded in breach of a prohibition to compete are void → <b>false</b>.", "Members of a capital company are never liable → careful: <b>irregular company</b> or <b>veil lifting</b> can make them liable."], "check": [["Who is the entrepreneur: the S.L. or its manager?", "The S.L. (in whose name the activity is carried out)."], ["Three duties of every entrepreneur?", "Accounts, publicity (registry), fair competition."], ["Liability of a general partner?", "Personal, unlimited, subsidiary, joint & several."]]}, {"u": 3, "title": "Capital Companies: Incorporation", "tldr": "S.A. needs <b>€60,000</b> (25% paid), S.L. <b>€3,000</b> (100% paid). Founders sign a <b>deed before a notary</b> containing the <b>by-laws</b> and <b>register</b> it (within 1 year) → legal personality. Contributions: cash or assets – <b>never work</b>. Capital ≠ equity: equity = capital + reserves ± losses. Value a share three ways: <b>par</b>, <b>book</b>, <b>fair</b>.", "sections": [{"h": "S.A. or S.L.?", "body": "\n <table class=\"tbl\"><tr><th></th><th>S.L. (private limited)</th><th>S.A. (public limited)</th></tr>\n <tr><td>Minimum capital</td><td><b>€3,000</b></td><td><b>€60,000</b></td></tr>\n <tr><td>Paid at incorporation</td><td><b>100%</b></td><td>min <b>25%</b> (rest = called-up capital)</td></tr>\n <tr><td>Non-cash contribution</td><td>No expert report</td><td><b>Independent expert report</b> (as a rule)</td></tr>\n <tr><td>Units</td><td><b>Stakes</b> (participaciones) – not securities</td><td><b>Shares</b> (acciones) – negotiable securities</td></tr>\n <tr><td>Transfer</td><td>Restricted</td><td>Free (by-laws may restrict)</td></tr>\n <tr><td>GM attendance</td><td>Can't be restricted</td><td>Minimum number of shares possible</td></tr>\n <tr><td>Votes</td><td>1 per stake (by-laws can change)</td><td>By nominal value</td></tr>\n <tr><td>Board</td><td>3–12</td><td>3–no max</td></tr>\n <tr><td>Director term</td><td>May be indefinite</td><td>Max 6 years, re-electable</td></tr></table>\n <p>Choose: capital &lt; €60,000 → <b>S.L.</b>; want to be <b>listed</b> → <b>S.A.</b>; otherwise compare formalities vs free transfer. S.L. win in <b>numbers</b> (SMEs); S.A. win in <b>weight</b> (big corporations).</p>"}, {"h": "Incorporation step by step", "body": "\n <div class=\"dia flow\"><span>Name certificate<small>Central Registry</small></span><span>Bank deposit<small>certificate</small></span><span>NIF<small>tax number</small></span><span>Deed + by-laws<small>before a <b>notary</b></small></span><span><b>Mercantile Registry</b><small>within 1 year → personality</small></span></div>\n <p><b>Founders</b> sign the deed and subscribe all shares (S.A.) / take up all stakes (S.L.). <b>No minimum number</b>: one person can form an <b>S.A.U./S.L.U.</b> – a sole trader's way to limit liability.</p>\n <p><b>Deed</b> (art. 22 LSC): founders' identity, contributions & numbering, <b>by-laws</b>, initial directors, (S.A.) incorporation expenses.</p>\n <p><b>By-laws</b> (art. 23 LSC): name (+S.A./S.L., not identical to another), corporate purpose, registered office (in Spain), capital, shares/stakes, management body & GM rules, ancillary commitments. Defaults if silent: unlimited duration, starts on the deed date, year ends <b>31 Dec</b>.</p>"}, {"h": "Company in formation & irregular company", "body": "\n <p>Between the deed and registration = <b>company in formation</b>. Acts <b>needed for registration</b> bind the company automatically; <b>other acts</b> only if the company accepts them after registration – otherwise whoever acted is liable (art. 36).</p>\n <p>Not registered within <b>1 year</b> (or clearly never going to be) → <b>irregular company</b>: any member can ask for dissolution and refund; if it already traded, members answer like <b>general partners</b> for those debts.</p>\n <p><b>Why registration matters</b>: members aren't personally liable, so third parties need public, verified information on capital, directors and accounts → the Registry is a <b>filter of lawfulness + publicity</b>.</p>"}, {"h": "Contributions", "body": "\n <ul><li><b>Cash</b>: in euros, proven with a <b>bank certificate</b>.</li>\n <li><b>Non-cash</b>: any asset with economic value (building, machine, trademark, credit, goodwill). Contributor <b>liable for its value</b> (both types); <b>S.A.</b> also needs an <b>independent expert</b> appointed by the Registrar.</li>\n <li><b>Never work or services</b> (art. 58.2). Work can enter as an <b>ancillary commitment</b> (art. 86) – outside capital, free or paid.</li></ul>"}, {"h": "Capital, equity, reserves", "body": "\n <div class=\"dia bal\"><div class=\"l\"><h5>Assets</h5>goods & rights</div><div class=\"r\"><div class=\"eq\"><h5>Equity (own funds)</h5>Capital + reserves ± losses, grants, premium…</div><div class=\"li\"><h5>Liabilities</h5>debts to third parties</div></div></div>\n <p><b>Equity = assets − liabilities.</b> At incorporation capital = equity. Then profits kept as <b>reserves</b> (legal, statutory, voluntary) push equity <b>above</b> capital; <b>losses</b> push it <b>below</b>.</p>\n <p>Four principles protect capital: <b>determination</b> (fixed in by-laws), <b>full subscription & minimum payment</b>, <b>integrity</b> (real contributions), <b>minimum outlay</b> (€60k/€3k, always).</p>"}, {"h": "Members: obligations & rights", "body": "\n <p>Obligations: only pay <b>called-up capital</b> (S.A.) and do <b>ancillary commitments</b> (if any). Everything else is a right.</p>\n <p>Rights – <b>D-L-P-V-C-I</b>: <b>D</b>ividends, <b>L</b>iquidation dividend, <b>P</b>re-emptive right, <b>V</b>ote & attend, <b>C</b>hallenge resolutions, <b>I</b>nformation.</p>"}, {"h": "Par, book and fair value (annex example)", "body": "\n <div class=\"dia steps\"><div><b>Par value</b><small>chosen freely by founders<br>€75,000 ÷ 750 = <b>€100</b></small></div><div><b>Book value</b><small>equity ÷ shares<br>(75,000 + 100,000 reserves) ÷ 750 = <b>€233.33</b></small></div><div><b>Fair value</b><small>book value ± expectations<br>(175,000 + 200,000) ÷ 750 = <b>€500</b></small></div></div>\n <p>No losses & retained profits → BV &gt; PV. Positive expectations → FV &gt; BV.</p>"}], "traps": ["Capital must always be fully paid → <b>false</b> (S.A. 25%).", "S.L. capital is divided into shares → <b>false</b> (stakes).", "Work can be contributed to an S.L. → <b>false</b>.", "S.L. non-cash contributions need an expert → <b>false</b> (only S.A.).", "Capital and equity are the same → <b>false</b>.", "All shares must have the same par value → <b>false</b>."], "check": [["Minimum paid-up capital of an S.A. with €80,000 capital?", "€20,000 (25%)."], ["What makes members' liability limited?", "Registration of the deed in the Mercantile Registry."], ["Equity €90,000, 1,000 shares. Book value?", "€90 per share."]]}, {"u": 4, "title": "Corporate Bodies I: General Meeting & Directors", "tldr": "Two bodies: the <b>general meeting</b> (members decide, art. 160 closed list) and the <b>managing body</b> (directors manage & represent). Members can't represent the company. GM must be <b>convened</b> (1 month S.A. / 15 days S.L.), <b>constituted</b> (quorum only in S.A.) and <b>vote</b>. Four director models: <b>sole, joint & several, joint (S.A. max 2), board (3–12 in S.L.)</b>.", "sections": [{"h": "Who does what?", "body": "\n <div class=\"dia vs\"><div><h5>General meeting</h5>Members' <b>will</b>. Appoints & removes directors, approves accounts, changes by-laws, capital, structural changes, dissolution.</div><div><h5>Managing body</h5><b>Represents & manages</b> (art. 209). Signs contracts, hires, prepares accounts, convenes GMs.</div></div>\n <p>Members are higher in hierarchy but <b>cannot represent</b> the company. Directors <b>need not be members</b> (art. 212.2), can be legal persons, and the GM <b>cannot interfere</b> in management (but evaluates it yearly).</p>"}, {"h": "Competences of the GM (art. 160)", "body": "\n <ol class=\"cols\"><li>Annual accounts, profit distribution, approval of management</li><li>Appoint/remove directors, liquidators, auditors; liability action</li><li>Amend the by-laws</li><li>Increase/reduce capital</li><li>Remove/limit pre-emptive rights</li><li>Core assets (&gt; 25% of total assets)</li><li>Transformation, merger, division, global assignment, office abroad</li><li>Dissolution</li><li>Final liquidation balance</li><li>Others by law/by-laws</li></ol>\n <p>Closed list: the GM can't decide outside it. No single member – even with 90% – can exercise it alone (except a <b>single-member</b> company).</p>\n <p><b>Ordinary GM</b>: accounts + management + profits, within the <b>first 6 months</b>. Everything else = <b>extraordinary</b> GM.</p>"}, {"h": "Convene → constitute → vote", "body": "\n <div class=\"dia flow\"><span><b>Convene</b><small>directors; website/BORME+paper or individual notice</small></span><span><b>Constitute</b><small>S.A.: quorum (1st/2nd call). S.L.: none</small></span><span><b>Vote</b><small>majorities by law/by-laws</small></span><span><b>Minutes</b><small>minutes book</small></span></div>\n <p><b>Notice</b>: S.A. ≥ <b>1 month</b>, S.L. ≥ <b>15 days</b>. Directors must convene: yearly ordinary GM, when useful, when law/by-laws require, when <b>≥ 5%</b> asks, and when there's a <b>mandatory dissolution cause</b>.</p>\n <p><b>Universal meeting</b>: no notice needed if <b>100% of capital</b> is present and <b>everyone agrees</b> to hold it and on the agenda.</p>\n <p>Only <b>agenda</b> items can be decided – except <b>removal of directors</b> and the <b>liability action</b>.</p>\n <p>Resolutions bind <b>everyone</b>, incl. absent and dissenting members, who may <b>challenge</b> them.</p>"}, {"h": "Quorum & majorities (LSC numbers)", "body": "\n <table class=\"tbl\"><tr><th></th><th>S.A.</th><th>S.L.</th></tr>\n <tr><td>Quorum, ordinary matters</td><td>1st call <b>25%</b> · 2nd call <b>any</b></td><td rowspan=\"2\"><b>No quorum</b></td></tr>\n <tr><td>Quorum, by-law amendment, capital, merger…</td><td>1st call <b>50%</b> · 2nd call <b>25%</b></td></tr>\n <tr><td>Majority, ordinary</td><td>More votes for than against (present)</td><td>Majority of votes cast, ≥ <b>1/3 of all votes</b></td></tr>\n <tr><td>Majority, special matters</td><td>Absolute majority; <b>2/3 of present</b> if only 25–50% attend</td><td>Capital change & by-laws: <b>&gt; ½ of all votes</b><br>Merger, transformation, exclusion of pre-emptive right, member exclusion, director competition: <b>≥ 2/3 of all votes</b></td></tr></table>\n <p class=\"tip\">The notes only say \"see arts. 193–201 LSC\". The numbers above come from the LSC – good to know, but the notes' focus is: <b>quorum only in the S.A.</b> and <b>stricter rules for important decisions</b>.</p>"}, {"h": "Four models for the managing body (art. 210)", "body": "\n <div class=\"dia four\"><div><h5>Sole director</h5>One person does everything.</div><div><h5>Joint & several</h5><i>Solidarios</i>: <b>each acts alone</b> with full power.</div><div><h5>Joint</h5><i>Mancomunados</i>: must <b>act together</b>. <b>S.A.: max 2.</b></div><div><h5>Board</h5>Collegiate, majority. <b>Min 3</b>; S.L. max 12. Listed cos must have one.</div></div>\n <p>The model is in the by-laws; changing it → <b>public deed + registry</b>.</p>\n <p><b>Who can't be director</b>: non-emancipated minors, incapacitated, persons disqualified (insolvency), convicted of certain offences, incompatible public officials (judges…).</p>\n <p><b>Term</b>: S.A. max <b>6 years</b> (re-electable); S.L. <b>can be indefinite</b>. The GM can <b>remove</b> directors any time.</p>"}], "traps": ["Members represent the company → <b>false</b>.", "S.L. needs a quorum → <b>false</b>.", "Joint & several directors must sign together → <b>false</b> (each alone).", "An S.A. can have 3 joint directors → <b>false</b> (max 2, else board).", "Ordinary GM = all matters; extraordinary only when the call failed → <b>false</b>.", "Every director in capital companies: max 6 years → <b>false</b> (only S.A.)."], "check": [["Notice period S.L.?", "15 days."], ["What % can force directors to convene a GM?", "5%."], ["Can a GM decide on removing a director if it's not on the agenda?", "Yes – one of the two exceptions."]]}, {"u": 5, "title": "Corporate Bodies II: Directors' Duties & Liability", "tldr": "Directors act within <b>law + GM/by-laws + duty of care + duty of loyalty</b>. Care = <b>orderly entrepreneur</b> (prudence, competence, dedication, information, vigilance). Loyalty = <b>faithful representative</b> (no conflicts, secrecy, no competing). The <b>business judgment rule</b> protects decisions made in good faith, with enough information and with no personal interest. Liability: for <b>debts</b> (insolvency not filed / dissolution not convened → later debts) and for <b>damages</b> (fault + damage + causal link). Actions: <b>corporate</b> (company → 5% → creditors) and <b>individual</b>.", "sections": [{"h": "The framework of directors' conduct", "body": "\n <div class=\"dia steps\"><div><b>Law</b><small>e.g. prepare accounts, convene GM, file insolvency</small></div><div><b>GM & by-laws</b><small>instructions, unless illegal</small></div><div><b>Duty of care</b><small>art. 225</small></div><div><b>Duty of loyalty</b><small>arts. 227–230</small></div></div>"}, {"h": "Duty of care – the orderly entrepreneur", "body": "\n <p>Art. 225: act with the diligence of an <b>orderly entrepreneur</b>, put the company's interest first, dedicate enough time, and <b>demand information</b>. Five parts – <b>P-P-D-I-S</b>:</p>\n <ul><li><b>Prudence</b> – no unreasonable risks</li><li><b>Professional competence</b> – more for a bank than for a bakery</li><li><b>Dedication</b></li><li><b>Information</b></li><li><b>Surveillance & control</b> – watch collaborators and the business</li></ul>\n <p><b>Risk monitoring</b>: having an early-warning information system is part of diligence. No system → liability <i>in vigilando</i>. But <b>unforeseeable</b> shocks (Covid-19) are not a breach.</p>"}, {"h": "Duty of loyalty – the faithful representative", "body": "\n <p>Art. 227: good faith, best interest of the company. Art. 228 obligations:</p>\n <ul><li>Use powers only for their purpose</li><li><b>Secrecy</b> – also after leaving</li><li><b>Abstain</b> in conflicts (except own appointment/removal)</li><li>Independent, personal judgement</li><li><b>Avoid conflicts</b>, <b>don't compete</b> with the company</li></ul>\n <p>Mandatory – by-laws can't soften it. The <b>GM may exempt</b> a director for a specific case if no harm is expected (art. 230).</p>"}, {"h": "Business judgment rule (art. 226)", "body": "\n <div class=\"dia check\"><div>✔ Good faith</div><div>✔ No personal interest</div><div>✔ Sufficient information</div><div>✔ Adequate procedure</div><div class=\"res\">→ diligence presumed, even if the result is bad</div></div>\n <p>A <b>rebuttable presumption</b>: whoever sues must prove the standard wasn't met. Purpose: no fear of honest mistakes, encourage risk-taking, stop members interfering through lawsuits. <b>Excluded</b>: decisions affecting other directors/related persons personally (art. 230 operations).</p>"}, {"h": "Liability for debts", "body": "\n <p>Directors pay company debts <b>subsidiarily</b> (only if the company <b>can't</b> pay) in two crisis cases:</p>\n <div class=\"dia vs\"><div><h5>Insolvency</h5>Didn't file for insolvency within <b>2 months</b> → culpable insolvency → liable for debts arising <b>after</b> the filing date.</div><div><h5>Losses</h5>Equity &lt; <b>½ of capital</b> and they didn't convene the GM to dissolve (or fix it) → liable for debts arising <b>after</b> the cause.</div></div>"}, {"h": "Liability for damages (art. 236–237)", "body": "\n <div class=\"dia flow\"><span>Breach with <b>fraud or fault</b><small>fault presumed if against law/by-laws</small></span><span><b>Damage</b></span><span><b>Causal link</b></span></div>\n <ul><li>GM <b>approval or ratification never exonerates</b>.</li>\n <li><b>De facto directors</b> (no/expired title, or the person giving instructions behind someone who is director only on paper) are liable too.</li>\n <li>On a board: all who adopted/executed it are <b>jointly & severally</b> liable, unless they <b>prove</b> they opposed, didn't know, or did everything to prevent it.</li></ul>"}, {"h": "Liability actions", "body": "\n <div class=\"dia vs\"><div><h5>Corporate action (art. 238)</h5>Damage to the <b>company</b>.<br>1. Company (GM resolution, even off-agenda → removes directors)<br>2. Members ≥ <b>5%</b> (if GM not convened, company doesn't sue in <b>1 month</b>, or GM says no; loyalty breach: directly)<br>3. Creditors (if assets insufficient, art. 240)</div><div><h5>Individual action (art. 241)</h5><b>Direct</b> damage to a <b>member or third party</b>: act of a director in office + unlawfulness + causal link (claimant proves).</div></div>\n "}], "traps": ["A bad result proves negligence → <b>false</b> (business judgment rule).", "GM approval exonerates directors → <b>false</b>.", "Directors are liable for <i>all</i> company debts → <b>false</b> (only later debts, subsidiarily, in the two cases).", "By-laws can limit loyalty → <b>false</b>.", "Only registered directors are liable → <b>false</b> (de facto too)."], "check": [["Four conditions of the business judgment rule?", "Good faith, no personal interest, sufficient information, adequate procedure."], ["Which debts are directors liable for if they didn't convene the GM?", "Debts arising after the dissolution cause."], ["Who brings the corporate action first?", "The company (GM)."]]}, {"u": 6, "title": "Amendments to the By-laws: Capital Increase & Reduction", "tldr": "Only the <b>GM</b> amends by-laws (directors may move the office <b>within Spain</b>). Capital <b>increases</b>: cash, non-cash, offsetting loans, reserves (reserves don't increase equity). Old members have a <b>pre-emptive right</b> in cash increases (≥ 1 month). A <b>premium</b> avoids value dilution. <b>Reductions</b>: restore balance after losses, reserves, refunds. S.A. must reduce if equity &lt; <b>2/3</b> for a year. S.A. creditors can oppose reductions that really cut equity. <b>Accordion</b> = reduce below minimum + increase at once.", "sections": [{"h": "How to amend the by-laws", "body": "\n <div class=\"dia flow\"><span>Agenda states the change</span><span>Full text<small>+ written report in S.A.</small></span><span>Members can see/receive docs</span><span>GM quorum & majority</span><span>Public deed + Registry</span></div>\n <p><b>Registered office</b>: within Spain → <b>directors</b> (unless by-laws expressly deny it, art. 285.2). Abroad → structural change, GM.</p>\n <p><b>Member protection</b>: new obligations (payments, ancillary commitments) or, in S.A., transfer restrictions/class changes need the <b>affected member's consent</b>. Substantial change of corporate purpose → <b>right to exit</b> at fair value (art. 346).</p>"}, {"h": "Capital increase: two ways, four exchange values", "body": "\n <p><b>Ways</b>: new shares/stakes, or higher par value. <b>Who</b>: GM (S.A. may delegate to directors, art. 297). <b>Steps</b>: resolution → execution (subscription + payment) → <b>register both together</b> (art. 315).</p>\n <table class=\"tbl\"><tr><th>Exchange value</th><th>Equity</th><th>Special rule</th></tr>\n <tr><td><b>Cash</b></td><td>↑ (more cash)</td><td>Bank certificate. Pre-emptive right.</td></tr>\n <tr><td><b>Non-cash</b></td><td>↑ (more assets)</td><td>S.A.: independent expert report</td></tr>\n <tr><td><b>Offsetting loans</b></td><td>↑ (less debt)</td><td>S.A.: ≥ 25% liquid/mature/payable, rest ≤ 5 yrs + auditor. S.L.: 100%</td></tr>\n <tr><td><b>Reserves</b></td><td><b>= (no change)</b></td><td>Balance sheet ≤ 6 months old</td></tr></table>"}, {"h": "Pre-emptive right & share premium", "body": "\n <p>When new members come in, old members' % shrinks. So in <b>cash</b> increases, old members can subscribe <b>in proportion</b> first – period <b>≥ 1 month</b>. Not using it means: smaller dividends, lower book value per share, maybe dropping below <b>5%</b>. It can be <b>excluded by the GM</b> or <b>waived</b> individually.</p>\n <p><b>Premium</b>: new members pay <b>above par</b> to buy into reserves and expectations built before. Example (Case 2): BA pays €10 per €1 stake = €1 capital + €9 premium.</p>\n <div class=\"dia calc\"><div>BA wants <b>10%</b> for <b>€100,000</b></div><div>Post-money = 100,000 ÷ 10% = <b>€1,000,000</b> → pre-money <b>€900,000</b></div><div>90,000 stakes → <b>€10/stake</b></div><div>New stakes: N ÷ (90,000+N) = 10% → <b>N = 10,000</b></div><div>Capital +€10,000 · Premium €90,000 (€9/stake)</div></div>"}, {"h": "Capital reduction", "body": "\n <p><b>Ways</b>: lower par value, redeem, or group shares. <b>Purposes</b>: restore capital/equity balance after <b>losses</b>; create <b>reserves</b>; <b>refund</b> contributions; S.A.: release called-up capital.</p>\n <p><b>Mandatory (S.A. only)</b>: equity &lt; <b>2/3 of capital</b> and not recovered within <b>one fiscal year</b> (art. 327).</p>\n <div class=\"dia calc\"><div>Capital 100,000 · losses 50,000 → equity <b>50,000 = 50%</b> &lt; 2/3</div><div>Reduce capital by 30,000 against losses</div><div>Capital 70,000 · losses 20,000 → equity <b>50,000 = 71%</b> ✔</div><div><small>Book entry only – no money m
