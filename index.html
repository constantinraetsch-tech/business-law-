<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Business Law">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Business Law Kit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky masthead + scrollable section tabs; one centred column (max 980px) of "statute-book" panels; unit colours act as tabs on the page edge. */
:root{
  --bg:#f3f5fa; --paper:#ffffff; --ink:#121733; --muted:#596183; --line:#dde2ee; --soft:#eaeefb;
  --accent:#2747ff; --accent-ink:#ffffff; --hi:#ffd43b; --hi-ink:#2a2200;
  --good:#138a5e; --good-bg:#e3f6ee; --bad:#d63a50; --bad-bg:#fde8ec; --warn:#b86e00; --warn-bg:#fff3d9;
  --u1:#2747ff; --u2:#0f8b8d; --u3:#7a3cff; --u4:#e2522b; --u5:#c2185b; --u6:#2e7d32; --u7:#8d5a00; --u8:#0077c2; --u9:#5c3b9e; --u10:#3d4a63;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px; --shadow:0 1px 0 rgba(18,23,51,.04), 0 6px 22px -12px rgba(18,23,51,.25);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1020; --paper:#151a2e; --ink:#e8ebf7; --muted:#9aa2c3; --line:#272e4a; --soft:#1c2340;
  --accent:#7f95ff; --accent-ink:#0c1020; --hi:#ffd43b; --hi-ink:#2a2200;
  --good:#3ccf93; --good-bg:#10291f; --bad:#ff6b7f; --bad-bg:#33141c; --warn:#ffb547; --warn-bg:#2f2410;
  --u1:#7f95ff; --u2:#3cc6c8; --u3:#a98bff; --u4:#ff8a65; --u5:#f06292; --u6:#6fcf75; --u7:#e0a84a; --u8:#4fb3ff; --u9:#b39ddb; --u10:#9aa8c7;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 26px -14px rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c1020; --paper:#151a2e; --ink:#e8ebf7; --muted:#9aa2c3; --line:#272e4a; --soft:#1c2340;
  --accent:#7f95ff; --accent-ink:#0c1020; --hi:#ffd43b; --hi-ink:#2a2200;
  --good:#3ccf93; --good-bg:#10291f; --bad:#ff6b7f; --bad-bg:#33141c; --warn:#ffb547; --warn-bg:#2f2410;
  --u1:#7f95ff; --u2:#3cc6c8; --u3:#a98bff; --u4:#ff8a65; --u5:#f06292; --u6:#6fcf75; --u7:#e0a84a; --u8:#4fb3ff; --u9:#b39ddb; --u10:#9aa8c7;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 26px -14px rgba(0,0,0,.7); color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4,h5{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
b,strong{font-weight:700}
small{color:var(--muted)}
a{color:var(--accent)}

/* masthead */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1020px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand .mark{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand .mark i{font-style:normal;color:var(--accent)}
.brand .sub{font-size:13px;color:var(--muted);white-space:nowrap}
.count{margin-left:auto;font-family:var(--f-mono);font-size:12px;background:var(--hi);color:var(--hi-ink);padding:4px 9px;border-radius:999px;white-space:nowrap}
nav.tabs{width:100%;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 12px 11px;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{max-width:1020px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 80px}
section.view{display:grid;gap:18px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h1{font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-.025em}
.h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
.lead{color:var(--muted);max-width:65ch;margin:0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--paper);padding:9px 14px;border-radius:10px;font-weight:700;font-size:14.5px;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 11px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.ref{font-family:var(--f-mono);font-size:12px;background:var(--soft);padding:1px 6px;border-radius:5px}
.tip{background:var(--warn-bg);border-left:4px solid var(--warn);padding:10px 12px;border-radius:8px;margin:10px 0}
.muted{color:var(--muted)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;transition:width .4s}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted)}

/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero .panel.big{background:var(--ink);color:var(--paper);border-color:var(--ink);position:relative;overflow:hidden}
.hero .panel.big .eyebrow{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.hero .panel.big h1{font-size:clamp(30px,5.4vw,48px);font-weight:800;letter-spacing:-.03em;margin:6px 0 10px}
.hero .panel.big h1 em{font-style:normal;background:var(--hi);color:var(--hi-ink);padding:0 .15em;border-radius:6px}
.hero .panel.big p{margin:0;color:color-mix(in srgb,var(--paper) 82%,transparent);max-width:52ch}
.para{position:absolute;right:-18px;bottom:-60px;font-family:var(--f-display);font-weight:800;font-size:220px;line-height:1;opacity:.08;pointer-events:none}
.fmt{display:grid;gap:8px}
.fmt div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.fmt div:last-child{border:0}
.unitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ucard{border:1px solid var(--line);border-left:6px solid var(--c);background:var(--paper);border-radius:12px;padding:12px 14px;display:grid;gap:7px;text-align:left}
.ucard h4{font-size:15px}
.ucard .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.next{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* plan */
.day{display:grid;gap:8px}
.day h3{font-size:18px}
.task{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.task input{width:20px;height:20px;accent-color:var(--good);flex:none}
.task span{flex:1;min-width:0}
.task.done span{text-decoration:line-through;color:var(--muted)}

/* lessons */
.lesson-head{border-left:8px solid var(--c);padding-left:14px}
.tldr{background:var(--hi);color:var(--hi-ink);border-radius:var(--r);padding:16px 18px;font-size:16.5px}
.tldr .eyebrow{color:var(--hi-ink);opacity:.75}
.lsec{display:grid;gap:8px}
.lsec h3{font-size:20px;display:flex;gap:10px;align-items:baseline}
.lsec h3 .n{font-family:var(--f-mono);font-size:12px;color:var(--c)}
.lsec p,.lsec li{max-width:70ch}
.lsec ul,.lsec ol{padding-left:20px;margin:6px 0}
.lsec ol.cols{columns:2;column-gap:28px}
@media (max-width:600px){.lsec ol.cols{columns:1}}
.traps{border:2px solid var(--bad);background:var(--bad-bg);border-radius:var(--r);padding:16px 18px}
.traps h3{color:var(--bad);font-size:18px;margin-bottom:6px}
.traps li{margin:4px 0}
.qc{display:grid;gap:8px}
.qc details{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)}
.qc summary{cursor:pointer;font-weight:700}
.qc details p{margin:8px 0 0;color:var(--good);font-weight:700}

/* diagrams */
.dia{margin:10px 0;font-size:14.5px}
.dia h5{font-size:14px;margin-bottom:4px}
.dia small{display:block;font-size:12.5px}
.dia.vs,.dia.three,.dia.four{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.dia.vs>div,.dia.three>div,.dia.four>div{border:1px solid var(--line);border-top:4px solid var(--c,var(--accent));border-radius:10px;padding:10px 12px;background:var(--soft)}
.dia.vs>div:nth-child(2){border-top-color:var(--hi)}
.dia.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.dia.flow span{flex:1 1 120px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 12px;position:relative;font-weight:700}
.dia.flow span small{font-weight:400}
.dia.flow span:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--c,var(--accent));font-weight:800;z-index:1;background:var(--paper);border-radius:50%;width:18px;height:18px;display:grid;place-items:center;font-size:13px}
.dia.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;counter-reset:s}
.dia.steps>div{background:var(--soft);border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.dia.pyr{display:grid;justify-items:center;gap:4px}
.dia.pyr>div{width:var(--w);background:var(--c,var(--accent));color:var(--paper);text-align:center;padding:7px 8px;border-radius:6px;font-weight:700;font-size:13.5px;min-width:0}
.dia.pyr>div:nth-child(1){background:var(--ink)}
.dia.pyr>div:nth-child(2){opacity:.95}.dia.pyr>div:nth-child(3){opacity:.88}.dia.pyr>div:nth-child(4){opacity:.8}.dia.pyr>div:nth-child(5){opacity:.72}.dia.pyr>div:nth-child(6){opacity:.64}
.dia.bal{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:520px}
.dia.bal>div{border-radius:10px;padding:10px}
.dia.bal .l{background:var(--soft);border:1px solid var(--line)}
.dia.bal .r{display:grid;gap:6px;padding:0}
.dia.bal .eq{background:var(--good-bg);border:1px solid var(--good);border-radius:10px;padding:10px}
.dia.bal .li{background:var(--bad-bg);border:1px solid var(--bad);border-radius:10px;padding:10px}
.dia.calc{background:var(--soft);border:1px dashed var(--c,var(--accent));border-radius:10px;padding:10px 14px;display:grid;gap:4px;font-family:var(--f-mono);font-size:13.5px}
.dia.check{display:grid;gap:6px}
.dia.check>div{background:var(--good-bg);border-radius:8px;padding:8px 12px;font-weight:700}
.dia.check>.res{background:var(--ink);color:var(--paper)}
.dia.tree{display:grid;gap:8px;justify-items:center;text-align:center}
.dia.tree .root{background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:10px;font-weight:700}
.dia.tree .kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;width:100%}
.dia.tree .kids>div{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px}
.dia.tree .kids .kids{margin-top:8px}
.dia.tree .kids .kids>div{background:var(--paper)}
.dia.merge,.dia.divs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.dia.merge>div,.dia.divs>div{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:center}
.co{display:inline-grid;place-items:center;min-width:38px;height:38px;padding:0 8px;border-radius:9px;background:var(--paper);border:2px solid var(--c,var(--accent));font-weight:800;margin:6px 2px}
.co.new{background:var(--c,var(--accent));color:var(--paper)}
.co.dead{border-style:dashed;opacity:.55;text-decoration:line-through}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tblwrap{overflow-x:auto}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.tbl th{font-family:var(--f-display);font-size:13.5px;background:var(--soft)}
.tbl td:first-child{font-weight:700}

/* flashcards */
.fc-wrap{display:grid;gap:14px;justify-items:center}
.fc{width:100%;max-width:720px;min-height:300px;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px 22px 18px;display:grid;grid-template-rows:auto 1fr auto;gap:12px;border-top:8px solid var(--c)}
.fc .meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.fc .front{font-family:var(--f-display);font-size:clamp(19px,3.2vw,24px);font-weight:700;letter-spacing:-.01em;line-height:1.3}
.fc .back{border-top:2px dashed var(--line);padding-top:12px;font-size:16.5px}
.fc .back ul,.fc .back ol{padding-left:20px;margin:4px 0}
.fc .explain{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14.5px;margin-top:10px}
.fc .explain b:first-child{color:var(--c)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:720px}
.rate button{border:0;border-radius:12px;padding:12px 6px;font-weight:700;display:grid;gap:2px;justify-items:center}
.rate button small{color:inherit;opacity:.8;font-weight:400}
.r-again{background:var(--bad-bg);color:var(--bad)}.r-hard{background:var(--warn-bg);color:var(--warn)}.r-good{background:var(--good-bg);color:var(--good)}.r-easy{background:var(--soft);color:var(--accent)}
.flip{width:100%;max-width:720px;padding:14px;border-radius:12px;border:0;background:var(--ink);color:var(--paper);font-weight:700;font-size:16px}
.star{border:0;background:none;font-size:20px;line-height:1;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--warn)}
.levels{display:flex;gap:4px;height:10px;border-radius:99px;overflow:hidden;background:var(--soft)}
.levels i{display:block;height:100%}

/* quiz */
.qcard{display:grid;gap:12px}
.qtext{font-family:var(--f-display);font-size:clamp(18px,2.8vw,21px);font-weight:700;line-height:1.3}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start}
.opt .l{font-family:var(--f-mono);font-weight:500;background:var(--soft);border-radius:6px;padding:1px 7px;flex:none}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.why{background:var(--soft);border-radius:10px;padding:10px 12px}
.timer{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.qnav{display:flex;gap:5px;flex-wrap:wrap}
.qnav button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-family:var(--f-mono);font-size:12px}
.qnav button.ans{background:var(--soft);border-color:var(--accent)}
.qnav button.cur{outline:2px solid var(--accent)}
.qnav button.ok{background:var(--good-bg);border-color:var(--good)}
.qnav button.no{background:var(--bad-bg);border-color:var(--bad)}
.score{font-family:var(--f-display);font-weight:800;font-size:56px;letter-spacing:-.03em;line-height:1}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{text-align:left;display:grid;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.mode:hover{border-color:var(--accent)}
.mode h3{font-size:18px}

/* cases */
.facts{background:var(--soft);border-radius:12px;padding:14px 16px}
.cq{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.cq h4{font-size:17px}
.cq textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);resize:vertical}
.model{border-left:4px solid var(--good);background:var(--good-bg);border-radius:8px;padding:12px 14px}
.model ul,.model ol{padding-left:20px}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.keys label{display:inline-flex;gap:6px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--paper)}

/* drills */
.sortq{font-family:var(--f-display);font-size:22px;font-weight:700;text-align:center;padding:22px 10px;min-height:110px;display:grid;place-items:center}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.buckets button{padding:14px 10px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-weight:700}
.buckets button.ok{border-color:var(--good);background:var(--good-bg)}
.buckets button.no{border-color:var(--bad);background:var(--bad-bg)}
.numq{font-size:18px;text-align:center;padding:12px}
.numopts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.numopts button{padding:16px 8px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-family:var(--f-mono);font-size:16px}
.numopts button.ok{border-color:var(--good);background:var(--good-bg)}
.numopts button.no{border-color:var(--bad);background:var(--bad-bg)}

/* explainers */
.stage{position:relative;width:100%;max-width:820px;aspect-ratio:16/9;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:grid;place-items:center;padding:20px;border-top:8px solid var(--c)}
.stage .scene{width:100%;max-height:100%;overflow:auto;display:grid;gap:10px;justify-items:center;text-align:center;animation:enter .55s ease both}
.stage .scene .dia{width:100%;text-align:left}
.stage .scene .dia.pyr.anim>div{animation:grow .5s ease both}
.stage .scene .dia.pyr.anim>div:nth-child(2){animation-delay:.15s}.stage .scene .dia.pyr.anim>div:nth-child(3){animation-delay:.3s}.stage .scene .dia.pyr.anim>div:nth-child(4){animation-delay:.45s}.stage .scene .dia.pyr.anim>div:nth-child(5){animation-delay:.6s}.stage .scene .dia.pyr.anim>div:nth-child(6){animation-delay:.75s}
.stage .scene .dia>*{animation:enter .5s ease both}
.stage .scene .dia>*:nth-child(2){animation-delay:.25s}.stage .scene .dia>*:nth-child(3){animation-delay:.5s}.stage .scene .dia>*:nth-child(4){animation-delay:.75s}.stage .scene .dia>*:nth-child(5){animation-delay:1s}
.sv-big{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,14vw,120px);line-height:1;color:var(--c)}
.sv-t{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,4.5vw,36px);letter-spacing:-.02em}
.sv-s{font-size:clamp(15px,2.4vw,19px);color:var(--muted)}
.sv-rule{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,52px);background:var(--hi);color:var(--hi-ink);padding:4px 16px;border-radius:12px}
.caption{max-width:820px;width:100%;font-size:17px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-height:76px}
.pdots{display:flex;gap:6px}
.pdots i{width:28px;height:5px;border-radius:9px;background:var(--line)}
.pdots i.on{background:var(--c)}
@keyframes enter{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{opacity:.001;transform:scaleX(.6)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* sheet */
.search{width:100%;max-width:420px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--paper)}
.numtbl td:nth-child(2){font-family:var(--f-mono);white-space:nowrap}
.conf{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.conf .panel h4{font-size:16px;margin-bottom:8px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
</style>

<script>
const CARDS=[{"id": "bl-u1-objective", "unit_no": 1, "section": "1.1 Law: objective vs subjective", "front": "What is law in the **objective** sense?", "back": "The **organised set of rules** made by those with power to do so in a society, which can be **imposed coercively** (e.g. \"Spanish law\").", "tags": ["midterm"], "explain": "Think of objective law as *the rule book* of a country. Every rule is part of a structured whole = the **legal system**."}, {"id": "bl-u1-subjective", "unit_no": 1, "section": "1.1 Law: objective vs subjective", "front": "What is law in the **subjective** sense?", "back": "The **power of a person** to do, demand or prohibit something, **protected by objective law**, with the possibility of going to court (\"I have the right to…\").", "tags": ["midterm"], "explain": "Subjective law only exists because objective law recognises it. Objective = the rule book; subjective = *your* right that comes out of it."}, {"id": "bl-u1-two-characters", "unit_no": 1, "section": "1.2 The legal rule: characters", "front": "What are the **two characters** of a legal rule?", "back": "1. **Generality**\n2. **Coercibility** (coercive / enforceable character)", "tags": ["midterm"], "explain": "Mnemonic: a legal rule is **G**eneral and **C**an be forced – **GC**."}, {"id": "bl-u1-generality", "unit_no": 1, "section": "1.2 The legal rule: characters", "front": "What does **generality** of a legal rule mean? Give the example from the notes.", "back": "Rules address **abstract categories**, not individual cases. A new formal obligation for *all* public limited companies = legal rule. A decree **appointing one person** to a public office = **not** a legal rule (no generality).", "tags": ["midterm", "trap"], "explain": "Ask yourself: does it target a *type* of person/situation or *one specific* person? Only the first is a legal rule."}, {"id": "bl-u1-coercibility", "unit_no": 1, "section": "1.2 The legal rule: characters", "front": "What does **coercibility** mean? Why is saying \"good morning\" in class not a legal rule?", "back": "If a rule is not obeyed voluntarily, compliance can be **imposed by institutionalised force** (power given to the **courts**). Greeting someone is a **social rule** – nobody can force you by institutional force.", "tags": ["midterm"], "explain": "Social norms, manners and educational rules regulate coexistence too, but they lack institutionalised enforcement."}, {"id": "bl-u1-three-elements", "unit_no": 1, "section": "1.2 The legal rule: characters", "front": "Which three elements make sure legal rules are applied effectively?", "back": "1. **Interpretation**\n2. **Validity** (birth → death of the rule)\n3. **Effectiveness** (ignorance of the law is no excuse)", "tags": ["midterm"]}, {"id": "bl-u1-art3cc", "unit_no": 1, "section": "1.2 The legal rule: characters", "front": "How must rules be **interpreted** (art. 3 CC)?", "back": "According to the **proper meaning of their words**, in connection with the **context**, their **historical and legislative background** and the **social reality** of the time when applied, attending to their **spirit and purpose**.", "tags": ["midterm"], "explain": "If the literal meaning is not enough, the usual next step is the **purposive approach**: what did the legislator want to achieve with the rule?"}, {"id": "bl-u1-purposive", "unit_no": 1, "section": "1.2 The legal rule: characters", "front": "What is the **purposive approach** to interpretation?", "back": "Interpreting a rule according to its **spirit and purpose** – the reason why the legislator included it – when the literal interpretation is insufficient.", "tags": ["midterm"]}, {"id": "bl-u1-enactment", "unit_no": 1, "section": "1.2 The legal rule: characters", "front": "When is a Spanish state rule **enacted (promulgated)** and when does it **enter into force**?", "back": "Enacted by publication in the **BOE** (Boletín Oficial del Estado). It enters into force **20 days after publication**, unless the rule itself shortens or lengthens that period.", "tags": ["midterm", "numbers"], "explain": "Publication guarantees **legal certainty**: since it's in the BOE, nobody can claim not to know it."}, {"id": "bl-u1-vacatio", "unit_no": 1, "section": "1.2 The legal rule: characters", "front": "What is the **vacatio legis**? Example?", "back": "The period between **publication** and **entry into force**. Example: RDL 8/2019 (employers must record working hours) had a **two-month** vacatio legis to give companies time to adapt.", "tags": ["midterm", "numbers"]}, {"id": "bl-u1-repeal", "unit_no": 1, "section": "1.2 The legal rule: characters", "front": "Express vs tacit **repeal**?", "back": "**Express**: the new rule explicitly derogates the old one.\n**Tacit**: a new rule (same or **higher** rank) regulates the same matter differently → the old rule is invalid in everything inconsistent, even without saying so.", "tags": ["midterm"]}, {"id": "bl-u1-effectiveness", "unit_no": 1, "section": "1.2 The legal rule: characters", "front": "State the **principle of effectiveness** (art. 6 CC).", "back": "\"**Ignorance of the law does not excuse from compliance** thereof.\" Rules bind whether or not people know them, because they were published.", "tags": ["midterm"], "explain": "Practical consequence: entrepreneurs should get advice from lawyers/consultants – not knowing a tax or employment rule is never a defence."}, {"id": "bl-u1-mand-disp", "unit_no": 1, "section": "1.3 Mandatory vs dispositive rules", "front": "**Mandatory** vs **dispositive** rules?", "back": "**Mandatory**: impose or prohibit conduct **absolutely**, even against the will of the parties. Acts against them are **void** (art. 6.3 CC).\n**Dispositive**: apply **only if the parties do not agree otherwise** (supplementary).", "tags": ["midterm"], "explain": "DE: zwingendes Recht vs dispositives (abdingbares) Recht."}, {"id": "bl-u1-art314", "unit_no": 1, "section": "1.3 Mandatory vs dispositive rules", "front": "Art. 314 CCom: loans do not accrue interest unless agreed in writing. Mandatory or dispositive?", "back": "**Dispositive** – parties may agree interest; only if there is **no written agreement** does the default (no interest) apply.", "tags": ["midterm", "trap"]}, {"id": "bl-u1-material-formal", "unit_no": 1, "section": "1.4 Sources of law", "front": "**Material** vs **formal** sources of law?", "back": "**Material**: the **body with power to enact** rules (State, Autonomous Communities, EU institutions…).\n**Formal**: the **forms** the rules take – art. 1 CC: **law, custom, general principles of law**.", "tags": ["midterm"]}, {"id": "bl-u1-art1cc", "unit_no": 1, "section": "1.4 Sources of law", "front": "What are the formal sources of Spanish law and in which **order** do courts apply them (art. 1 CC)?", "back": "1. **Law** (statutes)\n2. **Custom** – only if there is no applicable law, if not contrary to morals/public order, and if **proven**\n3. **General principles of law** – if neither law nor custom", "tags": ["midterm"], "explain": "Mnemonic **L-C-P**: Law → Custom → Principles."}, {"id": "bl-u1-caselaw", "unit_no": 1, "section": "1.4 Sources of law", "front": "Is **case law** a source of law in Spain?", "back": "**No.** Judges don't make rules. But the doctrine **repeatedly** upheld by the **Supreme Court** **complements** the legal system (art. 1.6 CC).", "tags": ["midterm", "trap"], "explain": "Classic MC trap: \"case law is the 4th source of law\" → false. It only *complements*."}, {"id": "bl-u1-custom", "unit_no": 1, "section": "1.4 Sources of law", "front": "What is **custom**?", "back": "A source of law of **spontaneous creation** by social groups through their practices. Historically very important (Business Law was born customary), today less so because legislators regulate almost everything.", "tags": ["midterm"]}, {"id": "bl-u1-principles", "unit_no": 1, "section": "1.4 Sources of law", "front": "Where are most **general principles of law** found? Give examples.", "back": "In the **Constitution**: justice, freedom, equality… They resolve cases with **no law and no custom** and also shape the whole system.", "tags": ["midterm"]}, {"id": "bl-u1-hierarchy-rule", "unit_no": 1, "section": "1.5 Hierarchy of statutes", "front": "State the **principle of hierarchy** (art. 9.3 CE).", "back": "A rule of **lower rank** may not contradict, invalidate or repeal a rule of **higher rank** – the opposite is possible.", "tags": ["midterm"]}, {"id": "bl-u1-pyramid", "unit_no": 1, "section": "1.5 Hierarchy of statutes", "front": "List the Spanish **hierarchy pyramid** from top to bottom.", "back": "1. **Constitution**\n2. **International treaties; EU law**\n3. **Acts** (ordinary & organic)\n4. **Royal Legislative Decrees; Royal Decree-Laws**\n5. **Royal Decrees** (regulations)\n6. Lower rules (ministerial orders…)", "tags": ["midterm"], "explain": "Note: RDL and RLD are made by the Government but have the **status of an act** (same rank in practice). The notes' pyramid draws them just under acts."}, {"id": "bl-u1-act", "unit_no": 1, "section": "1.5 Hierarchy of statutes", "front": "What is an **act** (ley) in the technical sense? Who enacts it?", "back": "A rule enacted by the body with **maximum legislative power**: Parliament = **Cortes Generales** (Congress + Senate).", "tags": ["midterm"]}, {"id": "bl-u1-rdl", "unit_no": 1, "section": "1.5 Hierarchy of statutes", "front": "**Royal Decree-Law** vs **Royal Legislative Decree**?", "back": "Both are made by the **Government** with the **status of an act**.\n- **RDL**: for **extraordinary and urgent need**.\n- **RLD**: by **express delegation** of Parliament through a **framework law** (e.g. the LSC is RLD 1/2010).", "tags": ["midterm"], "explain": "Why delegate? Urgency (Parliament is slow) or technical complexity."}, {"id": "bl-u1-rd", "unit_no": 1, "section": "1.5 Hierarchy of statutes", "front": "What is a **Royal Decree** and what happens if it contradicts an act?", "back": "A rule from the **Government's own power** (not delegated), below acts/RDL/RLD – often a **regulation** developing an act (e.g. IRPF Regulation). If it contradicts an act it is **null and void**.", "tags": ["midterm"]}, {"id": "bl-u1-state-ccaa", "unit_no": 1, "section": "1.6 State, regions, international & EU law", "front": "Is the relationship between **State law** and **Autonomous Communities' law** one of hierarchy?", "back": "**No – it is one of competence.** Arts. **148 and 149 CE** + each **Statute of Autonomy** distribute the matters. Regional laws are published in their own gazettes (DOGC, BOCM…).", "tags": ["midterm", "trap"], "explain": "Mock exam Q7(a) says State rules always rank above regional rules → **false**."}, {"id": "bl-u1-treaties", "unit_no": 1, "section": "1.6 State, regions, international & EU law", "front": "Where do **international treaties** sit and what if one contradicts the Constitution (art. 95 CE)?", "back": "Above all internal statutes, **below the Constitution**. A treaty contrary to the Constitution requires **prior constitutional amendment**.", "tags": ["midterm"]}, {"id": "bl-u1-eu-primary", "unit_no": 1, "section": "1.6 State, regions, international & EU law", "front": "What is EU **primary** legislation?", "back": "The **founding Treaties** – the \"rules of the game\" (similar to a constitution). **Directly applicable**.", "tags": ["midterm"]}, {"id": "bl-u1-eu-secondary", "unit_no": 1, "section": "1.6 State, regions, international & EU law", "front": "What are the two main types of EU **secondary** legislation?", "back": "**Regulations** and **Directives**.", "tags": ["midterm"]}, {"id": "bl-u1-regulation", "unit_no": 1, "section": "1.6 State, regions, international & EU law", "front": "What is an **EU Regulation**? Example?", "back": "Secondary law **directly applicable** to all citizens of Member States as if it were internal law – **no transposition** needed. Example: **GDPR** (Reg. 2016/679), which replaced the national data-protection rules.", "tags": ["midterm", "trap"], "explain": "Don't confuse an **EU Regulation** (like a European act) with a Spanish **regulation** (a Royal Decree below an act)."}, {"id": "bl-u1-directive", "unit_no": 1, "section": "1.6 State, regions, international & EU law", "front": "What is an **EU Directive**?", "back": "Secondary law addressed to **Member States** to **harmonise** their laws; States must **implement (transpose)** it into national law. In principle it binds citizens only after transposition – but the Supreme Court (STS 428/2007) says national law must be **interpreted in accordance with EU law** anyway.", "tags": ["midterm", "mock"], "explain": "Mock exam Q2: \"Directives are secondary EU provisions that standardise Member States' laws\" → **correct statement (d)**."}, {"id": "bl-u1-eu-prec", "unit_no": 1, "section": "1.6 State, regions, international & EU law", "front": "National law vs EU law: competence or hierarchy?", "back": "In principle **competence** (the EU legislates where States gave it competence), but in case of **conflict EU law prevails**. Spain is in the EU since **1986**.", "tags": ["midterm", "numbers"]}, {"id": "bl-u2-origin", "unit_no": 2, "section": "2.1 Business Law: history & concept", "front": "When and why did Business Law arise as a special law?", "back": "In the **Middle Ages**, after the fall of the Roman Empire, as a **customary** law of **traders** (merchants, guilds, **Consulados del Mar**).", "tags": ["midterm"]}, {"id": "bl-u2-codes", "unit_no": 2, "section": "2.1 Business Law: history & concept", "front": "Which Commercial Codes did Spain have?", "back": "**1829** (first, after the French code of **1807**) and the **1885 Commerce Code**, still the framework code today – though heavily \"sifted\" (most articles repealed and replaced by special laws).", "tags": ["midterm", "numbers"]}, {"id": "bl-u2-definition", "unit_no": 2, "section": "2.1 Business Law: history & concept", "front": "Define **Business Law** (notes).", "back": "The part of the **private** legal system for **entrepreneurs** and their **legal status**, dealing with their **activities in the market** carried out **through an enterprise**.", "tags": ["midterm"]}, {"id": "bl-u2-three-notes", "unit_no": 2, "section": "2.1 Business Law: history & concept", "front": "Three fundamental notes of Business Law?", "back": "1. Part of **private law**\n2. **Special** private law (vs general civil law)\n3. The law of **entrepreneurs**", "tags": ["midterm"]}, {"id": "bl-u2-not-bl", "unit_no": 2, "section": "2.1 Business Law: history & concept", "front": "Are **employment law** and **tax law** part of Business Law?", "back": "**No.** They affect entrepreneurs but are separate disciplines. Not every rule affecting entrepreneurs is Business Law.", "tags": ["midterm", "trap"]}, {"id": "bl-u2-art38", "unit_no": 2, "section": "2.2 Sources of Business Law", "front": "What does **art. 38 CE** say and why is it important?", "back": "**Free enterprise** is recognised **within the framework of a market economy**; public authorities guarantee and protect it. It is the constitutional basis of trade activity and of competition law.", "tags": ["midterm"]}, {"id": "bl-u2-art38-impacts", "unit_no": 2, "section": "2.2 Sources of Business Law", "front": "Impacts of the constitutional market-economy framework?", "back": "- Recognition of entrepreneurs' **private initiative**\n- Freedom is subordinate to **general interest** (e.g. anti-competitive practices are illegal)\n- **Market unity**\n- **Protection of consumers and users**", "tags": ["midterm"]}, {"id": "bl-u2-art149", "unit_no": 2, "section": "2.2 Sources of Business Law", "front": "Who has competence over commercial legislation in Spain?", "back": "The **State, exclusively** (art. **149.1.6 CE**) – to guarantee **market unity**.", "tags": ["midterm"]}, {"id": "bl-u2-art2ccom", "unit_no": 2, "section": "2.2 Sources of Business Law", "front": "In what order are **acts of commerce** governed (art. 2 CCom)?", "back": "1. **Commerce Code** (and laws replacing its provisions)\n2. **Business practice/usage** of each place\n3. **Ordinary civil law**", "tags": ["midterm", "trap"], "explain": "Unlike in civil law, **business custom comes before civil law** – a trace of Business Law's customary origin."}, {"id": "bl-u2-art50ccom", "unit_no": 2, "section": "2.2 Sources of Business Law", "front": "What limitation does **art. 50 CCom** add?", "back": "For **business contracts** without a specific law, **general civil law** applies directly – business usage does **not** take precedence. Important limit because contracts are exactly where customs matter most.", "tags": ["midterm", "trap"]}, {"id": "bl-u2-lex-specialis", "unit_no": 2, "section": "2.2 Sources of Business Law", "front": "What is the **lex specialis** principle?", "back": "**Specialised acts prevail over general acts.** It explains the many special commercial laws (LSC, Trademarks Act, LDC…) next to the old CCom.", "tags": ["midterm"]}, {"id": "bl-u2-eu-influence", "unit_no": 2, "section": "2.2 Sources of Business Law", "front": "How does EU law shape Spanish Business Law today?", "back": "Most commercial rules either **apply EU Regulations directly** (trademarks, consumer rights, free competition) or **implement Directives** (company law).", "tags": ["midterm"]}, {"id": "bl-u2-enterprise", "unit_no": 2, "section": "2.3 Enterprise vs entrepreneur", "front": "Define **enterprise** (empresa). Does it have legal personality?", "back": "An **organised set of capital** (material & immaterial elements) **and work** (people) used to produce/distribute goods or services for the market. It has **no legal personality** – it must be linked to a person: the **entrepreneur**.", "tags": ["midterm", "trap"], "explain": "When people say \"the enterprise signed a contract\" they speak figuratively – legally it is the **entrepreneur** (the owner) who holds rights and obligations."}, {"id": "bl-u2-entrepreneur", "unit_no": 2, "section": "2.3 Enterprise vs entrepreneur", "front": "Define **entrepreneur** in the legal sense.", "back": "The **natural or legal person** that, **in its own name** and in an **organised and professional** manner, carries out an economic activity of producing/distributing goods or providing services **for the market**, assuming the **responsibilities** and holding the **rights** arising from it.", "tags": ["midterm"], "explain": "Legal sense ≠ economic sense. Economically the \"entrepreneur\" is whoever makes decisions (directors, managers). Legally it is **in whose name** the activity is run."}, {"id": "bl-u2-three-features", "unit_no": 2, "section": "2.3 Enterprise vs entrepreneur", "front": "Three defining features of the legal concept of entrepreneur?", "back": "1. **Organisational** activity\n2. **Professional** activity (habitual, public, for the market, usually for profit)\n3. Acts **in its own name**", "tags": ["midterm"], "explain": "Mnemonic **O-P-O**: Organises, Professional, Own name."}, {"id": "bl-u2-business-est", "unit_no": 2, "section": "2.3 Enterprise vs entrepreneur", "front": "Why is \"buying an **enterprise**\" legally wrong? What do you buy?", "back": "You buy a **business / business establishment** (negocio, establecimiento mercantil): the assets **plus** pre-existing legal and financial relationships (contracts, employees, reputation, brand). An enterprise as such is just a set of assets/people.", "tags": ["midterm", "mock"], "explain": "Mock exam Q1: \"enterprise\", \"entrepreneur\" and \"business/commercial establishment\" are **different concepts** → answer **(b)**."}, {"id": "bl-u2-business-value", "unit_no": 2, "section": "2.3 Enterprise vs entrepreneur", "front": "Why is a running business usually worth more than the sum of its isolated assets?", "back": "Because of the **legal relationships in force and the track record**: reputation of the brand, profitable contracts, customers. Starting from isolated assets you'd have no market background.", "tags": ["midterm"]}, {"id": "bl-u2-art1ccom", "unit_no": 2, "section": "2.3 Enterprise vs entrepreneur", "front": "Who are businesspersons under **art. 1 CCom**?", "back": "1. Those with legal capacity who engage in commerce **habitually**\n2. **Business or industrial companies** incorporated under the Code", "tags": ["midterm"]}, {"id": "bl-u2-collaborators", "unit_no": 2, "section": "2.3 Enterprise vs entrepreneur", "front": "Are **directors, attorneys or employees** entrepreneurs?", "back": "**No** – they act **in the name and on behalf of another** (the entrepreneur), don't assume the obligations and don't receive the profits.", "tags": ["midterm"]}, {"id": "bl-u2-types", "unit_no": 2, "section": "2.4 Types of entrepreneurs", "front": "Three classifications of entrepreneurs?", "back": "1. **Natural** (individual / sole trader) vs **legal** person (business entity)\n2. By **size**: small, medium, large\n3. **Private** vs **public**", "tags": ["midterm"]}, {"id": "bl-u2-size", "unit_no": 2, "section": "2.4 Types of entrepreneurs", "front": "Does the size of the enterprise change the legal status?", "back": "**No** – the CCom gives one status regardless of size. But special rules differ, e.g. **accounting** (General Accounting Plan vs SME plan; art. 25 CCom) and corporate tax for small companies. SME parameters: **Commission Regulation (EU) 651/2014, Annex I**.", "tags": ["midterm"]}, {"id": "bl-u2-public-ent", "unit_no": 2, "section": "2.4 Types of entrepreneurs", "front": "What is a **public enterprise**?", "back": "An entity held **totally or partly by a public-law body** (town hall, Autonomous Community…) carrying out an **economic activity** with some autonomy from its public functions. Exceptional in a market economy.", "tags": ["midterm"]}, {"id": "bl-u2-status-blocks", "unit_no": 2, "section": "2.5 Legal status of the entrepreneur", "front": "What does the **legal status of the entrepreneur** include?", "back": "1. **Professional duties**\n2. **Rights**\n3. **Legal capacity**\n4. **Liability regime**", "tags": ["midterm"]}, {"id": "bl-u2-duties", "unit_no": 2, "section": "2.5 Legal status of the entrepreneur", "front": "Three **professional duties** of every entrepreneur?", "back": "1. Keep **accounts** and documentation (art. **25** CCom)\n2. **Legal publicity** – registration in the **Mercantile Registry** (mandatory for companies, **optional for individual entrepreneurs**)\n3. Duty to respect **free and fair competition** (LDC + Unfair Competition Act)", "tags": ["midterm", "trap"], "explain": "Trap: registration is **not** mandatory for sole traders."}, {"id": "bl-u2-registry-purpose", "unit_no": 2, "section": "2.5 Legal status of the entrepreneur", "front": "Double purpose of registering in the Mercantile Registry?", "back": "1. **Presumption of legality** of registered elements (filter of lawfulness)\n2. **Market transparency** – publicity of sensitive information for third parties", "tags": ["midterm"]}, {"id": "bl-u2-rights", "unit_no": 2, "section": "2.5 Legal status of the entrepreneur", "front": "Rights conferred by the status of entrepreneur?", "back": "1. **Participate in the market** competing freely\n2. **Demand fair competition** (stop abuse/restrictive practices)\n3. **Exclusive use** of distinctive signs (trademarks, trade names) and **exclusive exploitation** of industrial creations (patents)", "tags": ["midterm"]}, {"id": "bl-u2-capacities", "unit_no": 2, "section": "2.5 Legal status of the entrepreneur", "front": "**Legal capacity** vs **capacity to operate (act)**?", "back": "**Legal capacity**: ability to **hold rights and obligations** – from **birth**, for life.\n**Capacity to operate**: ability to perform acts with legal effect – requires **legal age (18)** and **not being judicially incapacitated**.", "tags": ["midterm", "mock", "trap"], "explain": "Baby example: a newborn can **own** a bank account (legal capacity) but cannot **dispose** of it (no capacity to operate). Mock Q6 → (a)."}, {"id": "bl-u2-art4ccom", "unit_no": 2, "section": "2.5 Legal status of the entrepreneur", "front": "Who can be an **individual entrepreneur** (art. 4 CCom)?", "back": "Those of **legal age** with **free disposal of their assets**.", "tags": ["midterm"]}, {"id": "bl-u2-exceptions", "unit_no": 2, "section": "2.5 Legal status of the entrepreneur", "front": "Two exceptions where minors/incapacitated persons can be entrepreneurs?", "back": "1. A **minor or incapacitated heir** continuing the business of their **parents/testators**\n2. An entrepreneur who **becomes incapacitated** continuing his/her own previous business\n→ in both cases they act **through legal representatives**.", "tags": ["midterm"], "explain": "Justified by the principle of **preserving the enterprise**."}, {"id": "bl-u2-incompat", "unit_no": 2, "section": "2.5 Legal status of the entrepreneur", "front": "**Incompatibilities (conflicts of interest)** – absolute vs relative?", "back": "Restrictions on people with public functions to protect impartiality.\n**Absolute**: no business anywhere in Spain (members of Government, senior management of agencies).\n**Relative**: only in the territory where they serve (**judges, prosecutors**).", "tags": ["midterm"]}, {"id": "bl-u2-prohibitions", "unit_no": 2, "section": "2.5 Legal status of the entrepreneur", "front": "Three legal **prohibitions to compete**?", "back": "1. **Agents/managers/representatives** vs their principal (art. **288 CCom**)\n2. **Workers** vs their employer (Workers' Statute)\n3. **Directors** vs their company (LSC) – unless **express consent** of the company", "tags": ["midterm", "trap"], "explain": "Breach → removal/dismissal + damages, **but contracts concluded remain valid** vs bona fide third parties."}, {"id": "bl-u2-disqual", "unit_no": 2, "section": "2.5 Legal status of the entrepreneur", "front": "What is a **disqualification** (inhabilitación)?", "back": "Prevention of business activity **as a sanction** for irregularities; can be **temporary or perpetual**. Some activities also need **prior administrative authorisation**.", "tags": ["midterm"]}, {"id": "bl-u2-liab-three", "unit_no": 2, "section": "2.6 Liability regime", "front": "Three questions of the entrepreneur's liability?", "back": "1. **For what facts?** Acts/omissions causing damage through fault or negligence – **contractual and non-contractual**\n2. **For whom?** Own acts **and** those of dependants (employees, representatives)\n3. **With what?** **All present and future assets** (art. **1911 CC**)", "tags": ["midterm", "mock"], "explain": "Mock Q5 → (a): liable even for damages caused by workers in the exercise of their job."}, {"id": "bl-u2-universal", "unit_no": 2, "section": "2.6 Liability regime", "front": "Individual entrepreneur: is there a separation between business and private assets?", "back": "As a rule **no** – liable with **all present and future assets**, business and private. (Legislative trend to protect the habitual residence.)", "tags": ["midterm"], "explain": "That's why sole traders often form an **S.L.U.** – a single-member company limits liability to the company's assets."}, {"id": "bl-u2-art116", "unit_no": 2, "section": "2.7 Business entities", "front": "What is a trading company (art. 116 CCom) and when does it get legal personality?", "back": "A contract by which **two or more persons** put goods/industry into a **common fund to obtain profit**. Once incorporated per the Code it has **legal personality** in all its acts and contracts.", "tags": ["midterm"]}, {"id": "bl-u2-personality-effects", "unit_no": 2, "section": "2.7 Business entities", "front": "Three effects of legal personality of a company?", "back": "1. Subject of **rights and obligations** (full capacity externally and internally)\n2. Acquires **business status** (subject to its articles)\n3. **Owns its assets** separate from the members → separation of liability", "tags": ["midterm"]}, {"id": "bl-u2-needs-person", "unit_no": 2, "section": "2.7 Business entities", "front": "Why does a company need natural persons to act?", "back": "\"It has no hands to sign nor a brain to decide\" → **representatives**: **legal** (scope set by law, e.g. directors) or **voluntary** (powers of attorney granted at will).", "tags": ["midterm"]}, {"id": "bl-u2-entity-liab", "unit_no": 2, "section": "2.7 Business entities", "front": "With what does a business entity answer for its debts?", "back": "**Always with all its assets** (art. 1911 CC), whatever its type. *Whether members also answer* depends on the type: yes in partnerships, no in capital companies.", "tags": ["midterm"]}, {"id": "bl-u2-irregular", "unit_no": 2, "section": "2.7 Business entities", "front": "What is an **irregular company** and what liability does it face?", "back": "A company operating **without registration** in the Mercantile Registry. Managers are **jointly and severally liable** to third parties (art. **120 CCom**) and members answer like a **general partnership** (personally) – **even if it is a capital company**.", "tags": ["midterm", "trap"], "explain": "Internal liability agreements between members have no effect against third parties."}, {"id": "bl-u2-art122", "unit_no": 2, "section": "2.7 Business entities", "front": "Four basic types of trading companies (art. 122 CCom)? Closed list?", "back": "1. **General partnership** (S. colectiva)\n2. **Limited partnership** (S. comanditaria)\n3. **Public limited company** (S.A.)\n4. **Private limited company** (S.R.L./S.L.)\nNot closed – \"**as a general rule**\" → the law may create new types.", "tags": ["midterm"]}, {"id": "bl-u2-capital-cos", "unit_no": 2, "section": "2.7 Business entities", "front": "Which are **capital companies** (art. 1 LSC)?", "back": "**S.A.** (public limited), **S.R.L./S.L.** (private limited) and the **sociedad comanditaria por acciones** (partnership limited by shares). Regulated by the **LSC – RLD 1/2010**.", "tags": ["midterm"]}, {"id": "bl-u2-key-difference", "unit_no": 2, "section": "2.7 Business entities", "front": "Most important difference: partnerships vs capital companies?", "back": "The **liability of members**. Partnership members: **personal, unlimited, subsidiary and joint & several**. Capital company members: **not personally liable** for company debts (art. 1 LSC).", "tags": ["midterm", "mock"], "explain": "Mock Q8 → (b): members are liable for company debts **only in personalistic companies (partnerships)**."}, {"id": "bl-u2-subsidiary", "unit_no": 2, "section": "2.7 Business entities", "front": "What do **personal, unlimited, subsidiary, joint & several** mean for a general partner?", "back": "- **Personal**: with own assets\n- **Unlimited**: for all debts, present and future assets\n- **Subsidiary**: only if the partnership can't pay\n- **Joint & several**: creditor can claim **the whole** from any partner, who can later claim the others' shares", "tags": ["midterm"]}, {"id": "bl-u2-veil", "unit_no": 2, "section": "2.7 Business entities", "front": "What is **lifting the corporate veil**?", "back": "When members **abuse** the legal personality (mixing personal and company assets, acting as if the company didn't exist), courts **disregard the separation** and hold them **personally liable** (arts. **6.4 and 7 CC** – abuse of rights/fraud).", "tags": ["midterm"]}, {"id": "bl-u2-gp", "unit_no": 2, "section": "2.7 Business entities", "front": "General partnership: 3 characteristics + name rules?", "back": "1. Partners **liable** (personal, unlimited, subsidiary, joint & several)\n2. **Personalistic** – trust; no transfer of partner status without consent (art. 143 CCom)\n3. Business **name and one signature**: name of all/some partners (+ \"y Cía.\") + \"S.C.\"/\"S.R.C.\". A non-partner whose name appears is **liable as a partner** (art. 126 CCom).", "tags": ["midterm"]}, {"id": "bl-u2-lp", "unit_no": 2, "section": "2.7 Business entities", "front": "Limited partnership: two kinds of partners?", "back": "**General partners**: unlimited liability, **manage**, names in business name.\n**Limited partners**: liable only **up to their contribution**, **no management**, **name not allowed** in the business name, can transfer status **without consent**. Abbr. **S.Com. / S. en C.**", "tags": ["midterm"]}, {"id": "bl-u2-lp-shares", "unit_no": 2, "section": "2.7 Business entities", "front": "Limited partnership vs partnership limited by shares?", "back": "Limited partnership: capital in **stakes**, CCom. Partnership limited by **shares**: capital in **shares** (securities) → treated as a **capital company** (LSC). Both have general + limited partners.", "tags": ["midterm"]}, {"id": "bl-u2-sa-def", "unit_no": 2, "section": "2.7 Business entities", "front": "Define the **S.A.** (public limited company).", "back": "Company of **capitalist character**, capital divided into **shares**, made up of members' contributions, members **not personally liable** for company debts.", "tags": ["midterm"]}, {"id": "bl-u2-sl-def", "unit_no": 2, "section": "2.7 Business entities", "front": "Define the **S.R.L./S.L.** (private limited company). Why \"hybrid\"?", "back": "Capitalist company, capital divided into **stakes (participaciones)**, members not personally liable. **Hybrid**: fully capitalist towards **third parties**, but **internally flexible/personalistic** – e.g. by-laws can give a minority member the majority of votes (impossible in an S.A.).", "tags": ["midterm"], "explain": "S.L. is the **most used** company in Spain (lower minimum capital + flexibility)."}, {"id": "bl-u3-min-capital", "unit_no": 3, "section": "3.1 S.A. vs S.L. – choosing", "front": "Minimum share capital: **S.A.** vs **S.L.**?", "back": "**S.A.: €60,000** · **S.L.: €3,000**", "tags": ["midterm", "numbers"], "explain": "Exam answer = the notes' figures. (Real-life update: Ley 18/2022 \"Crea y Crece\" allows an S.L. with **€1**, with extra safeguards – but answer **€3,000** in this course.)"}, {"id": "bl-u3-paid-up", "unit_no": 3, "section": "3.1 S.A. vs S.L. – choosing", "front": "How much capital must be **paid up at incorporation**?", "back": "**S.L.: 100%** (fully paid). **S.A.: at least 25%** of each share's par value – the rest is **called-up capital (dividendos pasivos)** paid later (art. 79 LSC).", "tags": ["midterm", "numbers", "mock"], "explain": "Mock Q16(a) \"capital always needs to be fully paid-up\" → **false** (S.A. allows 25%)."}, {"id": "bl-u3-which-type", "unit_no": 3, "section": "3.1 S.A. vs S.L. – choosing", "front": "When **must** founders choose an S.A.?", "back": "- Capital **< €60,000** → must be an **S.L.**\n- Shares to be **listed** on a stock exchange → must be an **S.A.**\n- Otherwise free choice: S.A. = more formalities but **free transfer**; S.L. = fewer formalities, presumes **stable membership**.", "tags": ["midterm"]}, {"id": "bl-u3-quant-qual", "unit_no": 3, "section": "3.1 S.A. vs S.L. – choosing", "front": "S.L. vs S.A.: quantitative vs qualitative importance?", "back": "S.L. dominate **quantitatively** (SMEs, low capital, stable members). S.A. dominate **qualitatively** (large corporations, stock market, free transfer of shares).", "tags": ["midterm"]}, {"id": "bl-u3-annex-table", "unit_no": 3, "section": "3.1 S.A. vs S.L. – choosing", "front": "S.A. vs S.L. – non-cash contributions, transfer, attendance, votes?", "back": "- Non-cash: **S.A. expert report** required (as a rule); **S.L. no report**\n- Shares (S.A.) = **negotiable securities**; stakes (S.L.) **not**\n- Transfer: **S.A. free** (by-laws may restrict); **S.L. restricted**\n- Attendance: **S.L. cannot be restricted**; S.A. may require a **minimum number of shares**\n- Votes: **S.L. one per stake** (unless by-laws); **S.A. per nominal value**", "tags": ["midterm", "numbers"]}, {"id": "bl-u3-board-term", "unit_no": 3, "section": "3.1 S.A. vs S.L. – choosing", "front": "Board size and directors' term: S.A. vs S.L.?", "back": "Board: **min 3** in both; max **12 in S.L.**, **no max** in S.A.\nTerm: **S.A. max 6 years** (re-electable for the same max periods); **S.L. may be indefinite**.", "tags": ["midterm", "numbers"]}, {"id": "bl-u3-incorp", "unit_no": 3, "section": "3.2 Deed of incorporation & by-laws", "front": "How is a capital company incorporated?", "back": "By a **deed of incorporation** executed by the founders **before a notary public**, then **registered in the Mercantile Registry** (Registro Mercantil) of the province of the registered office → **legal personality** as a capital company.", "tags": ["midterm"], "explain": "Mind map steps: **name certificate** (Central Registry) → **tax number (NIF)** → **by-laws** → **notary** → **registry**."}, {"id": "bl-u3-founders", "unit_no": 3, "section": "3.2 Deed of incorporation & by-laws", "front": "Who are the **founders**? Minimum number of founders?", "back": "The persons (natural or legal) who **execute the deed** and **subscribe all shares / take up all stakes**. **No minimum** – one person can found an **S.A.U.** or **S.L.U.** (single-member company).", "tags": ["midterm", "trap"], "explain": "Wording: you **subscribe shares** (S.A.) but **take up / assume stakes** (S.L.)."}, {"id": "bl-u3-unipersonal", "unit_no": 3, "section": "3.2 Deed of incorporation & by-laws", "front": "Why do single-member companies exist? What if a company becomes single-member later?", "back": "To overcome the **universal liability** of the sole trader: one person runs a business but is liable only with the company's assets. If it becomes single-member later → **deed declaring sole proprietorship** + registration. Same regime, some **added formalities**.", "tags": ["midterm"]}, {"id": "bl-u3-deed-content", "unit_no": 3, "section": "3.2 Deed of incorporation & by-laws", "front": "Minimum content of the **deed of incorporation** (art. 22 LSC)?", "back": "- **Identity** of founders + will to form an S.A./S.L.\n- **Contributions** of each + numbering of shares/stakes\n- The **by-laws**\n- Initial organisation of the **administration** and identity of directors\n- S.A.: approximate **incorporation expenses**", "tags": ["midterm"]}, {"id": "bl-u3-bylaws", "unit_no": 3, "section": "3.2 Deed of incorporation & by-laws", "front": "What are the **by-laws** (estatutos sociales / articles of association)?", "back": "The **rules of organisation and operation** of the company; part of the deed, registered → **binding** on members and directors.", "tags": ["midterm"]}, {"id": "bl-u3-bylaws-content", "unit_no": 3, "section": "3.2 Deed of incorporation & by-laws", "front": "Minimum content of the **by-laws** (art. 23 LSC)?", "back": "1. **Company name** (+ S.A./S.L.)\n2. **Corporate purpose**\n3. **Registered office** (in Spain)\n4. **Capital** (in euros; S.A.: unpaid part)\n5. **Shares/stakes** (number, par value…)\n6. **Structure of management body** & GM operation\n7. **Ancillary commitments** (if any)", "tags": ["midterm"]}, {"id": "bl-u3-name", "unit_no": 3, "section": "3.2 Deed of incorporation & by-laws", "front": "Rules for the **company name**?", "back": "Must include **S.A.** or **S.R.L./S.L.**; must not be **identical** to an existing company's name nor contrary to public order → certificate from the **Central Mercantile Registry**.", "tags": ["midterm"]}, {"id": "bl-u3-office", "unit_no": 3, "section": "3.2 Deed of incorporation & by-laws", "front": "Where must the **registered office** be?", "back": "In **Spanish territory**, where the **effective administration and management** is, or where the main establishment/centre of operations is.", "tags": ["midterm"]}, {"id": "bl-u3-defaults", "unit_no": 3, "section": "3.2 Deed of incorporation & by-laws", "front": "Which defaults apply if the by-laws say nothing?", "back": "**Duration: unlimited**; **start of operations: date of the deed**; **fiscal year ends 31 December**.", "tags": ["midterm", "numbers"]}, {"id": "bl-u3-in-formation", "unit_no": 3, "section": "3.3 Company in formation & registration", "front": "What is a **company in formation**? Which acts bind the company after registration (art. 36 LSC)?", "back": "The period between the deed and registration. Acts **necessary for registration** bind the company automatically; **other acts** bind it only if it **expressly accepts** them after registration – otherwise those who acted are liable.", "tags": ["midterm"]}, {"id": "bl-u3-one-year", "unit_no": 3, "section": "3.3 Company in formation & registration", "front": "Deadline to register? Consequence of missing it?", "back": "**One year**. Otherwise it becomes an **irregular company**: any member may request **dissolution**, liquidation and refund of contributions (arts. 39–40 LSC). If it already started business: **general-partnership liability** of members for debts incurred before registration.", "tags": ["midterm", "numbers"]}, {"id": "bl-u3-registry-function", "unit_no": 3, "section": "3.3 Company in formation & registration", "front": "Why is publicity through the Registry so important for capital companies?", "back": "Because members are **not personally liable**, third parties can only rely on the **company's assets**. They need reliable info on **capital, directors, accounts** → transparency and **legal security**. Registry = **filter of lawfulness + publicity**.", "tags": ["midterm"]}, {"id": "bl-u3-register-what", "unit_no": 3, "section": "3.3 Company in formation & registration", "front": "Which later acts must also be registered?", "back": "**Amendments of by-laws**, **appointment/removal of directors**, **annual accounts** (deposit) and many other corporate acts.", "tags": ["midterm"]}, {"id": "bl-u3-contrib", "unit_no": 3, "section": "3.4 Contributions", "front": "What can be contributed to capital? What can **never** be?", "back": "**Cash** or any **asset/right with economic value** (real estate, machinery, trademarks, credit rights, goodwill…). **Never work or services** (art. **58.2 LSC**).", "tags": ["midterm", "mock", "trap"], "explain": "Mock Q10(b) \"work by a member can be a non-cash contribution in an S.L.\" → **false**. Correct: (d) cash or non-cash in both S.A. and S.L."}, {"id": "bl-u3-cash", "unit_no": 3, "section": "3.4 Contributions", "front": "How are **cash contributions** proven?", "back": "The notary attaches a **bank certificate** proving the deposit in an account in the name of the company in formation. Contributions in **euros**.", "tags": ["midterm"]}, {"id": "bl-u3-noncash", "unit_no": 3, "section": "3.4 Contributions", "front": "Valuation safeguards for **non-cash contributions**?", "back": "**S.A. & S.L.**: contributing member is **liable** to company, members and third parties for the **reality and value** (art. 30 LSC).\n**S.A. additionally**: **independent expert report** appointed by the **Registrar** (art. 67 LSC), annexed to the deed (exceptions art. 69).", "tags": ["midterm", "trap"]}, {"id": "bl-u3-ancillary", "unit_no": 3, "section": "3.4 Contributions", "front": "What are **ancillary commitments** (prestaciones accesorias)?", "back": "**Services** by members **beyond their capital contribution**, free or paid; **never part of capital** (art. 86 LSC). By-laws must set content, paid/free and consequences of breach.", "tags": ["midterm", "case"], "explain": "This is how Pedro's **work** can enter the company in Case 1 – not as capital, but as an ancillary commitment."}, {"id": "bl-u3-capital", "unit_no": 3, "section": "3.5 Capital, equity, reserves", "front": "What is **share capital** (capital social)?", "back": "The **total amount of members' contributions**, stated in the by-laws (\"nominal capital\"). Stable figure.", "tags": ["midterm"]}, {"id": "bl-u3-equity", "unit_no": 3, "section": "3.5 Capital, equity, reserves", "front": "What is **equity** (patrimonio neto / real capital)?", "back": "**Assets − liabilities (debts to third parties)** = Capital + reserves (undistributed profits) ± other items (grants, share premium, accumulated losses).", "tags": ["midterm", "mock"], "explain": "At incorporation **capital = equity**. Later they diverge: profits kept → equity > capital; losses → equity < capital. Mock Q11 → (d)."}, {"id": "bl-u3-principles", "unit_no": 3, "section": "3.5 Capital, equity, reserves", "front": "Four principles protecting capital?", "back": "1. **Determination** – always stated in the by-laws; changes only by amending by-laws\n2. **Full subscription & minimum payment** – all shares subscribed (S.A. min 25% paid)\n3. **Integrity** – par value must match an effective contribution\n4. **Minimum outlay** – not below €60,000 / €3,000, at incorporation **and during life**", "tags": ["midterm"]}, {"id": "bl-u3-reserves", "unit_no": 3, "section": "3.5 Capital, equity, reserves", "front": "Types of **reserves**?", "back": "**Legal** (imposed by law), **statutory** (by-laws), **voluntary** (decided by GM), other special reserves. All come from **undistributed profits** and increase equity.", "tags": ["midterm"]}, {"id": "bl-u3-member-obl", "unit_no": 3, "section": "3.6 Members' rights & obligations", "front": "Members' only basic **obligations** after contributing?", "back": "1. Pay **called-up capital** (S.A., if any)\n2. Perform **ancillary commitments** (if in by-laws)\nEverything else is a **right**, not an obligation.", "tags": ["midterm"]}, {"id": "bl-u3-member-rights", "unit_no": 3, "section": "3.6 Members' rights & obligations", "front": "Six basic **rights** of members?", "back": "1. **Dividends** (273 LSC)\n2. **Liquidation dividend** (391)\n3. **Pre-emptive (preferential subscription) right** (304)\n4. **Attend and vote** at GM (179)\n5. **Challenge** resolutions (204)\n6. **Information** (197)", "tags": ["midterm"], "explain": "Mnemonic **D-L-P-V-C-I**: \"**D**on't **L**et **P**eople **V**ote **C**areless **I**deas\"."}, {"id": "bl-u3-votes", "unit_no": 3, "section": "3.6 Members' rights & obligations", "front": "How are **votes** allocated in S.A. vs S.L.?", "back": "**S.A.**: strictly **proportional to par value** of shares (non-voting shares possible).\n**S.L.**: **one vote per stake**, but the by-laws may set a different system (e.g. extra votes for certain stakes).", "tags": ["midterm"]}, {"id": "bl-u3-par", "unit_no": 3, "section": "3.7 Par, book and fair value", "front": "Define **par (nominal) value**.", "back": "The value the founders **freely assign** to each share/stake in the deed (or in a capital increase deed).", "tags": ["midterm"]}, {"id": "bl-u3-book", "unit_no": 3, "section": "3.7 Par, book and fair value", "front": "Define **book value** (valor teórico). Formula?", "back": "The aliquot part of the **company's equity** per share: **Book value = Equity ÷ number of shares**.", "tags": ["midterm"]}, {"id": "bl-u3-fair", "unit_no": 3, "section": "3.7 Par, book and fair value", "front": "Define **fair (market) value**. Formula?", "back": "The value at which **two independent, informed and interested parties** would exchange the shares: **Fair value = Book value ± expectations** (business valuation).", "tags": ["midterm"], "explain": "Fair value is partly **subjective** (market expectations). Par value = objective fact; book value = accounting calculation."}, {"id": "bl-u3-annex-ex", "unit_no": 3, "section": "3.7 Par, book and fair value", "front": "Annex example: 75 members, €75,000 capital, 750 shares of €100. Retained earnings €100,000; expectations +€200,000. Book and fair value per share?", "back": "Equity = 75,000 + 100,000 = **€175,000** → BV = 175,000 ÷ 750 = **€233.33**/share (€2,333.33 per member's 10 shares).\nFV = 175,000 + 200,000 = **€375,000** → **€500**/share (€5,000 per member).", "tags": ["midterm", "numbers"], "explain": "Rules: no losses & retained earnings → **BV > PV**; positive expectations → **FV > BV**; negative → FV < BV."}, {"id": "bl-u4-bodies", "unit_no": 4, "section": "4.1 Two corporate bodies", "front": "What are the two **corporate bodies** of a capital company?", "back": "1. **General meeting** (junta general) – forms the **will of the members**\n2. **Managing body** (órgano de administración, \"directors\") – **manages and represents** the company", "tags": ["midterm"]}, {"id": "bl-u4-members-represent", "unit_no": 4, "section": "4.1 Two corporate bodies", "front": "Can members, as members, represent the company?", "back": "**No.** Members **choose the directors** who represent and manage it. Members sit higher in hierarchy but have **no power of representation**.", "tags": ["midterm", "trap"]}, {"id": "bl-u4-separation", "unit_no": 4, "section": "4.1 Two corporate bodies", "front": "Must directors be members?", "back": "**No** – unless the by-laws require it (art. **212.2 LSC**). Principle of **separation** between ownership (members) and management (directors). One person can be both, wearing two hats.", "tags": ["midterm"]}, {"id": "bl-u4-gm-def", "unit_no": 4, "section": "4.2 General meeting", "front": "Define the **general meeting**. Who is bound by its resolutions?", "back": "A **meeting of members** that adopts decisions **by majority** on matters within its competence. **All members** are bound – including **dissenting and absent** ones (they may challenge).", "tags": ["midterm"]}, {"id": "bl-u4-gm-single", "unit_no": 4, "section": "4.2 General meeting", "front": "Can a 70% member take GM decisions alone without a meeting?", "back": "**No** – formalities must be met to **protect minorities**. Only exception: a **single-member company** (the sole member exercises the GM's powers).", "tags": ["midterm", "trap"]}, {"id": "bl-u4-art160", "unit_no": 4, "section": "4.2 General meeting", "front": "Competences of the general meeting (art. 160 LSC)?", "back": "a) **Annual accounts**, distribution of profit, approval of management\nb) **Appoint/remove directors**, liquidators, auditors; **liability action** against them\nc) **Amend the by-laws**\nd) **Capital increase/reduction**\ne) **Remove/limit pre-emptive rights**\nf) Acquire/dispose/contribute **core assets** (> **25%** of total assets)\ng) **Transformation, merger, division, global assignment**, transfer of office **abroad**\nh) **Dissolution**\ni) **Final liquidation balance**\nj) Others set by law/by-laws", "tags": ["midterm", "numbers"], "explain": "Mnemonic: **A-D-B-C-P-C-S-D-L** → \"**A**ll **D**irectors **B**ring **C**offee, **P**artners **C**hoose **S**ugar, **D**ON'T **L**eave\". It's a **closed list** – the GM can't decide outside it."}, {"id": "bl-u4-core-assets", "unit_no": 4, "section": "4.2 General meeting", "front": "When is an asset a **core asset** requiring GM approval?", "back": "When the transaction amount exceeds **25% of the total assets** on the last approved balance sheet.", "tags": ["midterm", "numbers"]}, {"id": "bl-u4-ordinary", "unit_no": 4, "section": "4.2 General meeting", "front": "What is the **ordinary general meeting** and when must it be held (art. 164 LSC)?", "back": "The meeting to approve **management**, **annual accounts** of the previous year and **distribution of profit**; must meet within the **first six months** of each fiscal year. Everything else → **extraordinary** GM.", "tags": ["midterm", "numbers", "mock"], "explain": "Mock Q13 → (d): the GM is ordinary or extraordinary **depending on the matters** dealt with."}, {"id": "bl-u4-convene-who", "unit_no": 4, "section": "4.2 General meeting", "front": "Who **convenes** the GM and when must they?", "back": "The **directors**:\n- **Ordinary GM every year**\n- When **appropriate** for the company\n- When **law/by-laws** require\n- When requested by members with **≥ 5% of capital**\n- In case of a **mandatory dissolution** cause", "tags": ["midterm", "numbers"]}, {"id": "bl-u4-notice", "unit_no": 4, "section": "4.2 General meeting", "front": "How is a GM **announced** and with what notice period?", "back": "On the **company website** (or, if none, in the **BORME** + a widely-read newspaper of the province); by-laws may provide **individual written notice** to each member. Notice period: **S.A. ≥ 1 month**, **S.L. ≥ 15 days**.", "tags": ["midterm", "numbers"]}, {"id": "bl-u4-universal", "unit_no": 4, "section": "4.2 General meeting", "front": "What is a **universal meeting** (art. 178 LSC)?", "back": "A GM validly held **without prior notice** when **all the capital is present or represented** and attendees **unanimously** agree to hold it and on its agenda.", "tags": ["midterm"], "explain": "Typical of companies with **very few members** – you can only know it is universal when everybody is actually there."}, {"id": "bl-u4-steps", "unit_no": 4, "section": "4.2 General meeting", "front": "Three steps for valid GM decisions?", "back": "1. **Convene** the members\n2. **Constitute** the meeting (S.A.: minimum **quorum**)\n3. **Hold** it and **vote** with the legal/statutory **majorities** (different S.A./S.L.)", "tags": ["midterm"]}, {"id": "bl-u4-quorum", "unit_no": 4, "section": "4.2 General meeting", "front": "Is a minimum **quorum** required to constitute the GM?", "back": "**S.A.: yes** – % of capital present/represented; depends on the **matter** and on **first or second call** (arts. 193–194 LSC; stricter for by-law amendments, transformation, merger, division). **S.L.: no quorum.**", "tags": ["midterm", "numbers", "trap"], "explain": "S.A. quorum (LSC): ordinary matters **25%** 1st call / **any** 2nd call; special matters **50%** 1st / **25%** 2nd."}, {"id": "bl-u4-agenda", "unit_no": 4, "section": "4.2 General meeting", "front": "Can the GM decide on matters **not on the agenda**?", "back": "Only two exceptions: **removal of directors** and bringing a **liability action** against them.", "tags": ["midterm", "trap"]}, {"id": "bl-u4-majorities", "unit_no": 4, "section": "4.2 General meeting", "front": "How are GM **majorities** regulated?", "back": "Different regimes for **S.A.** (also depends on 1st/2nd call) and **S.L.**, and stricter majorities for important matters (arts. 198–201 LSC). Resolutions go into the **minutes book** legalised by the Registry.", "tags": ["midterm", "numbers"], "explain": "See the cheat-sheet table: S.L. ordinary = majority of votes cast ≥ **1/3** of all votes; by-law amendments/capital changes **> 1/2** of all votes; merger/transformation/exclusion of pre-emptive right **2/3**."}, {"id": "bl-u4-challenge", "unit_no": 4, "section": "4.2 General meeting", "front": "What can a member do if he disagrees with a GM resolution?", "back": "He is **bound** by it, but may **challenge** it in court if it violates the **law, the by-laws** or harms the **company's interest** (art. 204 LSC).", "tags": ["midterm"]}, {"id": "bl-u4-mb-def", "unit_no": 4, "section": "4.3 Managing body", "front": "Define the **managing body**.", "back": "The corporate body that **legally represents** the company and **manages** it under the law (art. **209 LSC**). Management isn't listed exhaustively – it covers all acts aimed at the **corporate purpose**.", "tags": ["midterm"]}, {"id": "bl-u4-who-director", "unit_no": 4, "section": "4.3 Managing body", "front": "Who **cannot** be a director?", "back": "Non-emancipated **minors**, the legally **incompetent**, persons **disqualified** under the Insolvency Act, persons **convicted** of certain offences (art. 213 LSC), and those with **incompatible public posts** (art. 14 CCom: judges, magistrates, heads of government…). Directors can be **natural or legal persons**.", "tags": ["midterm"]}, {"id": "bl-u4-gm-no-interfere", "unit_no": 4, "section": "4.3 Managing body", "front": "Can the GM interfere in management?", "back": "As a rule **no** – directors manage autonomously; the GM appoints/removes them and **evaluates** management annually. Directors are personally liable even if the GM **authorised or ratified** the act.", "tags": ["midterm", "trap"]}, {"id": "bl-u4-four-models", "unit_no": 4, "section": "4.3 Managing body", "front": "Four ways of organising the managing body (art. 210 LSC)?", "back": "1. **Sole director** (administrador único)\n2. **Joint and several directors** (solidarios) – **each acts alone** with full powers\n3. **Joint directors** (mancomunados) – must **act together**; **S.A.: max 2**\n4. **Board of directors** (consejo) – collegiate, majority; **min 3**, S.L. **max 12**", "tags": ["midterm", "numbers"], "explain": "Mind map shorthand: **SD, JD, J&SD, BoD**. Listed companies must have a board (art. 529 bis)."}, {"id": "bl-u4-solidarios", "unit_no": 4, "section": "4.3 Managing body", "front": "Joint **and several** directors vs **joint** directors – who can sign alone?", "back": "**Joint and several (solidarios)**: **each one alone**.\n**Joint (mancomunados)**: **together** – none alone.", "tags": ["midterm", "trap", "mock"], "explain": "Mock Q12(a) \"directors acting severally and jointly → all have to act jointly\" → **false**. Spanish: solidario = jeder allein; mancomunado = gemeinsam."}, {"id": "bl-u4-joint-sa", "unit_no": 4, "section": "4.3 Managing body", "front": "S.A. wants 3 directors acting **jointly**. Possible?", "back": "**No** – S.A. may have at most **2 joint directors**; with more than two acting jointly it must be a **board of directors**.", "tags": ["midterm", "trap", "numbers"]}, {"id": "bl-u4-change-model", "unit_no": 4, "section": "4.3 Managing body", "front": "How is the organisational model of the managing body changed?", "back": "The by-laws choose one of the 4 models; any change → **public deed** + **registration** in the Mercantile Registry (art. 210.4 LSC).", "tags": ["midterm"]}, {"id": "bl-u4-term", "unit_no": 4, "section": "4.3 Managing body", "front": "Directors' term of office?", "back": "**S.A.: max 6 years**, re-electable for periods of the same maximum length. **S.L.: indefinite** (unless the by-laws limit it). The GM can **remove** them at any time following formalities, even before the end of the term.", "tags": ["midterm", "mock", "numbers"], "explain": "Mock Q14: the **incorrect** statement is (b) – S.L. directors are **not \"always\"** indefinite \"on a mandatory basis\". Mock Q12 → (d) board acts collegia
