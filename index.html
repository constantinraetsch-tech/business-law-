tely."}, {"id": "bl-u5-art209", "unit_no": 5, "section": "5.1 Directors' obligations & duties", "front": "What is the general competence of directors (art. 209 LSC)?", "back": "To **manage and represent** the company. The law doesn't list specific acts – it sets **principles** for how they must act.", "tags": ["midterm"]}, {"id": "bl-u5-framework", "unit_no": 5, "section": "5.1 Directors' obligations & duties", "front": "Within which framework must directors act?", "back": "1. **Law** (legal provisions)\n2. **General meeting & by-laws** (instructions not contrary to law)\n3. **Duty of care** and **duty of loyalty** (arts. 225–232 LSC)", "tags": ["midterm"]}, {"id": "bl-u5-specific-obl", "unit_no": 5, "section": "5.1 Directors' obligations & duties", "front": "Examples of specific legal obligations of directors?", "back": "**Prepare annual accounts**, **convene the ordinary GM** yearly, convene the **extraordinary GM** when mandatory (e.g. dissolution cause), request **insolvency** in time.", "tags": ["midterm"]}, {"id": "bl-u5-care", "unit_no": 5, "section": "5.1 Directors' obligations & duties", "front": "**Duty of care / diligence** (art. 225 LSC)?", "back": "Act with the diligence of an **orderly entrepreneur** (ordenado empresario), considering the nature of the post; subordinate **personal interest** to the company's; **adequate dedication**; duty to **demand and right to obtain information**.", "tags": ["midterm"]}, {"id": "bl-u5-care-five", "unit_no": 5, "section": "5.1 Directors' obligations & duties", "front": "Five manifestations of the duty of care?", "back": "1. **Prudence**\n2. **Professional competence**\n3. **Dedication**\n4. **Information**\n5. **Surveillance & control** (vigilance)", "tags": ["midterm"], "explain": "Mnemonic **P-P-D-I-S**: \"**P**edro **P**lans **D**aily **I**n **S**ilence\"."}, {"id": "bl-u5-orderly", "unit_no": 5, "section": "5.1 Directors' obligations & duties", "front": "Two perspectives of the \"**orderly entrepreneur**\" standard?", "back": "1. **Prudence** – no risks beyond what's reasonable after planning/analysis\n2. **Professional competence** – expertise appropriate to the company's complexity (a bank's directors need more than a small shop's)", "tags": ["midterm"]}, {"id": "bl-u5-loyalty", "unit_no": 5, "section": "5.1 Directors' obligations & duties", "front": "**Duty of loyalty** (art. 227 LSC)?", "back": "Perform duties with the loyalty of a **faithful representative**, in **good faith** and in the **best interest of the company**.", "tags": ["midterm"]}, {"id": "bl-u5-loyalty-list", "unit_no": 5, "section": "5.1 Directors' obligations & duties", "front": "Basic obligations derived from loyalty (art. 228 LSC)?", "back": "1. Use powers only for their **purpose**\n2. **Secrecy** – even **after** leaving office\n3. **Abstain** in conflicts of interest (except own appointment/removal)\n4. **Personal responsibility**, independent judgement\n5. **Avoid conflicts of interest** – **no competing** with the company", "tags": ["midterm"]}, {"id": "bl-u5-loyalty-mandatory", "unit_no": 5, "section": "5.1 Directors' obligations & duties", "front": "Can the by-laws limit the duty of loyalty? Can directors be exempted?", "back": "The loyalty regime is **mandatory** – by-law clauses limiting it are void. But the **GM** may **exempt** a director in a specific case (use of assets, business opportunity, third-party advantage) when no damage to the company is expected (art. **230 LSC**).", "tags": ["midterm", "trap"]}, {"id": "bl-u5-bjr", "unit_no": 5, "section": "5.2 Business judgment rule & risk monitoring", "front": "What is the **business judgment rule** (art. 226 LSC)?", "back": "In **strategic and business decisions**, the orderly-entrepreneur standard is **deemed met** if the director acted:\n1. in **good faith**\n2. **without personal interest**\n3. with **sufficient information**\n4. following an **adequate decision procedure**", "tags": ["midterm"], "explain": "It protects **managerial discretion**: a bad *result* alone does not mean a breach. It is a **rebuttable presumption** – whoever sues must prove the standards weren't met. Mnemonic **G-N-I-P**: Good faith, No interest, Information, Procedure."}, {"id": "bl-u5-bjr-excl", "unit_no": 5, "section": "5.2 Business judgment rule & risk monitoring", "front": "Which decisions are **excluded** from the business judgment rule?", "back": "Decisions that **personally affect other directors or related persons**, especially those authorising **art. 230** operations (conflicts of interest).", "tags": ["midterm", "trap"]}, {"id": "bl-u5-bjr-why", "unit_no": 5, "section": "5.2 Business judgment rule & risk monitoring", "front": "Why does the law protect managerial discretion?", "back": "To **remove the fear** of liability for unsuccessful decisions, **encourage risk-taking**, and avoid members **interfering** in management via liability actions.", "tags": ["midterm"]}, {"id": "bl-u5-risk-mon", "unit_no": 5, "section": "5.2 Business judgment rule & risk monitoring", "front": "Why is **risk monitoring** part of the duty of care?", "back": "Directors must have an internal **information system** that detects gradual deterioration (profitability, finance) **in time**. No monitoring → possible **liability in vigilando** (breach of duty of care). **Unforeseeable** events (e.g. **Covid-19**) are **not** a breach.", "tags": ["midterm"]}, {"id": "bl-u5-dno", "unit_no": 5, "section": "5.2 Business judgment rule & risk monitoring", "front": "What is **D&O insurance** (mind map, Unit 5)?", "back": "**Directors & Officers liability insurance**: the company buys a policy covering directors' personal liability and **legal defence costs**; it has **coverage limits and exclusions** (typically intentional/fraudulent acts).", "tags": ["midterm"], "explain": "Not developed in the notes – just know what it is."}, {"id": "bl-u5-two-types", "unit_no": 5, "section": "5.3 Liability of directors", "front": "Two types of directors' financial liability?", "back": "1. **Liability for debts** (of the company, in crisis situations)\n2. **Liability for damages** (any damage caused by breach)\n(+ possible **criminal** liability, outside the course)", "tags": ["midterm"]}, {"id": "bl-u5-debts-nature", "unit_no": 5, "section": "5.3 Liability of directors", "front": "Is liability for company debts **direct** or **subsidiary**?", "back": "**Subsidiary** – creditors can claim from directors only if the company **cannot** pay (not merely doesn't want to).", "tags": ["midterm"]}, {"id": "bl-u5-debts-cases", "unit_no": 5, "section": "5.3 Liability of directors", "front": "Two cases of **liability for debts**?", "back": "1. Not filing for **insolvency** within **2 months** of insolvency → liable for debts arising **after** it should have been filed (culpable insolvency, art. 444 TRLC)\n2. Not **convening the GM** to dissolve when losses reduce **equity < ½ of capital** (art. 363.1.e LSC) → liable for debts arising **after** that point", "tags": ["midterm", "numbers"], "explain": "Key: only **later debts**, not earlier ones."}, {"id": "bl-u5-art236", "unit_no": 5, "section": "5.3 Liability of directors", "front": "Three requirements of liability for damages (art. 236 LSC)?", "back": "1. Act/omission **contrary to law/by-laws or duties**, with **fraud or fault**\n2. **Damage**\n3. **Causal link**\nFault is **presumed** if the act is contrary to law or by-laws.", "tags": ["midterm"]}, {"id": "bl-u5-gm-ratify", "unit_no": 5, "section": "5.3 Liability of directors", "front": "Director: \"The GM approved my decision, so I'm not liable.\" Correct?", "back": "**No.** Authorisation or ratification by the GM **never exonerates** (art. 236.2 LSC).", "tags": ["midterm", "trap"]}, {"id": "bl-u5-de-facto", "unit_no": 5, "section": "5.3 Liability of directors", "front": "Who is a **de facto director**? Are they liable?", "back": "A person who in reality performs director functions **without title**, with a **null/expired** title, or under another title, **or** the person whose **instructions** the directors follow. **Yes** – same liability as a de jure director (art. 236.3).", "tags": ["midterm"]}, {"id": "bl-u5-art237", "unit_no": 5, "section": "5.3 Liability of directors", "front": "Board adopts a harmful resolution. Who is liable (art. 237 LSC)?", "back": "**All members** who adopted/executed it, **jointly and severally** – except those who **prove** they (a) **expressly opposed** it, (b) were **unaware** of it, or (c) knowing it, did **everything possible** to avoid the damage.", "tags": ["midterm"], "explain": "Burden of proof is on the **director**."}, {"id": "bl-u5-actions", "unit_no": 5, "section": "5.4 Liability actions", "front": "Two **liability actions** against directors?", "back": "1. **Corporate action** (art. 238) – damage to the **company**\n2. **Individual action** (art. 241) – **direct** damage to **members or third parties**", "tags": ["midterm"]}, {"id": "bl-u5-corp-action", "unit_no": 5, "section": "5.4 Liability actions", "front": "Who can bring the **corporate liability action**, in which order?", "back": "1. The **company** (GM resolution – even **not on the agenda**; it implies **removal** of the directors)\n2. **Members with ≥ 5%** if: GM not convened when requested, company doesn't sue within **1 month**, or GM voted against (for **loyalty** breaches they may sue **directly**)\n3. **Creditors** if not brought by company/members and the company's assets are **insufficient** (art. 240)", "tags": ["midterm", "numbers"]}, {"id": "bl-u5-ind-action", "unit_no": 5, "section": "5.4 Liability actions", "front": "Requirements of the **individual action**?", "back": "- **Direct damage** to members/third parties\n- **Act of directors** in office\n- **Unlawfulness**\n- **Causal link** – burden of proof on the claimant", "tags": ["midterm"]}, {"id": "bl-u5-public", "unit_no": 5, "section": "5.4 Liability actions", "front": "Can **public bodies** (Tax Agency, Social Security) hold directors liable?", "back": "Yes – besides the commercial regime, **tax** and **labour law** have their own rules making directors liable for unpaid taxes/contributions in certain cases.", "tags": ["midterm"]}, {"id": "bl-u6-who-amends", "unit_no": 6, "section": "6.1 Amending the by-laws", "front": "Who amends the by-laws?", "back": "As a rule **only the general meeting** (art. 285.1 LSC). The GM may amend freely unless unlawful or against the principles of the company type (art. 28).", "tags": ["midterm"]}, {"id": "bl-u6-reqs", "unit_no": 6, "section": "6.1 Amending the by-laws", "front": "Requirements for a by-law amendment?", "back": "1. Points clearly stated in the **notice/agenda**\n2. Full **text** of the proposal (+ **written report** in the **S.A.**, art. 286)\n3. Notice states members' right to **examine/receive** the documents free\n4. Adopted with legal **quorum & majorities** (arts. 194, 201)\n5. **Public deed** + **Registry**", "tags": ["midterm"]}, {"id": "bl-u6-office-change", "unit_no": 6, "section": "6.1 Amending the by-laws", "front": "Who can move the **registered office**?", "back": "**Within Spain**: the **directors** (unless the by-laws expressly deny it) – art. **285.2 LSC**. **Abroad**: GM (structural change, RDL 5/2023).", "tags": ["midterm", "trap", "mock"], "explain": "Mock Q17(d) \"GM has no power to approve a transfer within Spain, exclusive competence of directors\" → **false**. Correct: (c)."}, {"id": "bl-u6-consent", "unit_no": 6, "section": "6.1 Amending the by-laws", "front": "When does an amendment need the **consent of the affected member**?", "back": "When it creates **new obligations** for members (e.g. payments to compensate losses, ancillary commitments) or, in the **S.A.**, restricts the **transfer** of registered shares or affects **classes** of shares (art. 291 ff.).", "tags": ["midterm"]}, {"id": "bl-u6-exit", "unit_no": 6, "section": "6.1 Amending the by-laws", "front": "What is the **right to exit** (derecho de separación) and when for a corporate purpose change?", "back": "The right to **leave** the company and get the **fair value** of the shares/stakes. Granted when the GM **substitutes or substantially modifies the corporate purpose** (art. **346 LSC**) – the nature of the investment changes.", "tags": ["midterm"]}, {"id": "bl-u6-inc-ways", "unit_no": 6, "section": "6.2 Capital increase", "front": "Two **ways** to increase capital?", "back": "1. **Issue new shares / create new stakes**\n2. **Increase the par value** of existing ones (art. 295.1 LSC)", "tags": ["midterm"]}, {"id": "bl-u6-inc-types", "unit_no": 6, "section": "6.2 Capital increase", "front": "Four types of capital increase by **exchange value** (contravalor)?", "back": "1. **Cash** contributions\n2. **Non-cash** contributions\n3. **Offsetting loans** (credit compensation)\n4. Charged to **profits or reserves**", "tags": ["midterm"], "explain": "Mind map: **Cash, Non-cash, Loans, Reserves**."}, {"id": "bl-u6-inc-who", "unit_no": 6, "section": "6.2 Capital increase", "front": "Who decides a capital increase? Can it be delegated?", "back": "The **GM** (by-law amendment). In the **S.A.**, the GM may **delegate** to the directors within limits (art. 297 LSC).", "tags": ["midterm"]}, {"id": "bl-u6-inc-steps", "unit_no": 6, "section": "6.2 Capital increase", "front": "Three general steps of a capital increase?", "back": "1. **Resolution** of the GM (directors' report, art. 286)\n2. **Execution** – subscription/take-up and payment\n3. **Registration** of resolution **and** execution **simultaneously** (art. 315)", "tags": ["midterm"]}, {"id": "bl-u6-art315", "unit_no": 6, "section": "6.2 Capital increase", "front": "Why must resolution and execution be registered **together**?", "back": "So the Registry publishes only increases that **actually happened** (who subscribed, how it was paid) – otherwise capital would lose credibility as a solvency indicator.", "tags": ["midterm"]}, {"id": "bl-u6-inc-cash", "unit_no": 6, "section": "6.2 Capital increase", "front": "Effect of a **cash** increase on equity and liquidity?", "back": "**+ cash → + capital → + equity**. More immediate liquidity and better long-term solvency. Need a **bank certificate**.", "tags": ["midterm"]}, {"id": "bl-u6-inc-noncash", "unit_no": 6, "section": "6.2 Capital increase", "front": "Effect of a **non-cash** increase? Extra requirement in S.A.?", "back": "**+ net assets → + capital → + equity**; liquidity not necessarily. **S.A.**: **independent expert report** (Registrar); not required in S.L.", "tags": ["midterm"]}, {"id": "bl-u6-inc-loans", "unit_no": 6, "section": "6.2 Capital increase", "front": "Capital increase by **offsetting loans**: effect and requirements?", "back": "**− debt → + capital → + equity** (no new cash). **S.A.**: ≥ **25%** of the loans **liquid, mature and payable** and the rest due within **5 years** + **auditor's certificate**. **S.L.**: **100%** liquid, mature and payable (art. 301).", "tags": ["midterm", "numbers", "mock"], "explain": "Mock Q20 → (c): increase by offsetting loans **does** increase equity."}, {"id": "bl-u6-inc-reserves", "unit_no": 6, "section": "6.2 Capital increase", "front": "Capital increase charged to **reserves**: effect on equity?", "back": "**Equity unchanged** – just a reclassification (reserves → capital). Requires a balance sheet (audited if mandatory) approved **≤ 6 months** before (art. 303). Effect: reserves become **unavailable** capital → stronger solvency image.", "tags": ["midterm", "trap", "numbers", "mock"], "explain": "Mock Q20(a) \"always increases equity\" → false; (d) \"increases equity if made by reserves\" → false."}, {"id": "bl-u6-premium", "unit_no": 6, "section": "6.2 Capital increase", "front": "What is a **share premium** (prima de emisión) and why use it?", "back": "Paying **more than par value** for new shares/stakes (art. 298), fully paid on subscription. Used when **new members** enter: compensates the old members for **reserves and expectations** built before → avoids **dilution of value**.", "tags": ["midterm"]}, {"id": "bl-u6-pre-emptive", "unit_no": 6, "section": "6.3 Pre-emptive right", "front": "What is the **pre-emptive right**? In which increases?", "back": "The old members' right to subscribe/take up new shares/stakes **in proportion** to their par value **before third parties** – in increases with **cash contributions** (art. 304 LSC). Called \"preferential subscription right\" in S.A.", "tags": ["midterm", "trap"], "explain": "Purpose: keep their **relative share** (% of capital)."}, {"id": "bl-u6-pre-period", "unit_no": 6, "section": "6.3 Pre-emptive right", "front": "Period to exercise the pre-emptive right?", "back": "Set by the directors, **not less than one month** (different for listed companies).", "tags": ["midterm", "numbers"]}, {"id": "bl-u6-pre-loss", "unit_no": 6, "section": "6.3 Pre-emptive right", "front": "What do members risk if they don't exercise the pre-emptive right?", "back": "Lower % → **smaller dividends**; drop in **book value** per share (unless a premium is charged); and they may fall **below 5%**, losing minority rights (e.g. requesting a GM, liability action).", "tags": ["midterm"]}, {"id": "bl-u6-pre-waive", "unit_no": 6, "section": "6.3 Pre-emptive right", "front": "How can the pre-emptive right be removed?", "back": "The **GM** may **exclude** it fully/partly (with specific requirements), or each member may **individually waive** it.", "tags": ["midterm"]}, {"id": "bl-u6-red-ways", "unit_no": 6, "section": "6.4 Capital reduction", "front": "Three ways to reduce capital (art. 317.2)?", "back": "1. **Reduce par value**\n2. **Redeem** (amortise) shares/stakes\n3. **Group** them to exchange them", "tags": ["midterm"]}, {"id": "bl-u6-red-purposes", "unit_no": 6, "section": "6.4 Capital reduction", "front": "Purposes of a capital reduction (art. 317.1)?", "back": "1. **Restore balance** between capital and equity reduced by **losses**\n2. Create/increase **legal or voluntary reserves**\n3. **Refund** contributions to members\n4. S.A.: **release** members from **called-up capital**", "tags": ["midterm"], "explain": "Mind map: balance restoration, reserve creation, refund contributions. Forms: voluntary, mandatory, **accordion**."}, {"id": "bl-u6-red-mandatory", "unit_no": 6, "section": "6.4 Capital reduction", "front": "When is a capital reduction **mandatory**?", "back": "Only in the **S.A.**: when losses reduce **equity below 2/3 of capital** and it isn't recovered within **one fiscal year** (art. **327 LSC**). It must affect all shares proportionally (art. 320).", "tags": ["midterm", "numbers", "trap"], "explain": "Don't mix up: **2/3 + 1 year → mandatory reduction (S.A.)** vs **½ → mandatory dissolution cause (S.A. and S.L.)**."}, {"id": "bl-u6-red-annex", "unit_no": 6, "section": "6.4 Capital reduction", "front": "Annex: S.A. capital €100,000, losses €50,000. Equity? Reduction of €30,000 – result?", "back": "Equity = €50,000 = 50% < 2/3 → after 1 year reduction mandatory. Reduce by €30,000: capital **€70,000**, losses **€20,000**, equity still **€50,000** = **71%** of capital > 2/3 ✔.\nBook entry: €30,000 (Capital) to (Accumulated losses) €30,000 – **no money moves**.", "tags": ["midterm", "numbers"]}, {"id": "bl-u6-red-steps", "unit_no": 6, "section": "6.4 Capital reduction", "front": "Steps of a capital reduction?", "back": "1. **GM resolution** (by-law amendment; directors' report justifying reason, amount, procedure…)\n2. **Execution**\n3. **Creditors' right to oppose** (S.A., certain cases)\n4. **Registration**", "tags": ["midterm"]}, {"id": "bl-u6-creditor-opp", "unit_no": 6, "section": "6.4 Capital reduction", "front": "When do creditors have a **right to oppose** a capital reduction?", "back": "In the **S.A.**, when the reduction **really reduces equity** (refund of contributions, release from called-up capital). **Not** when it restores the balance after losses or funds reserves (art. 335). Exercise within **1 month** of the last announcement; the reduction can't be executed until the debt is **secured** (e.g. bank guarantee).", "tags": ["midterm", "numbers", "mock", "trap"], "explain": "Mock Q15 → (a). (c) \"always granted\" → false; (b) \"directors decide\" → false."}, {"id": "bl-u6-accordion", "unit_no": 6, "section": "6.4 Capital reduction", "front": "What is the **\"accordion\"** operation (art. 343 LSC)?", "back": "A **reduction to compensate losses below the legal minimum** combined with a **simultaneous increase**. Conditions: (a) increased to **≥ legal minimum**, (b) **pre-emptive right** respected, (c) reduction **conditional** on the increase being executed, (d) **registered together**.", "tags": ["midterm"], "explain": "Alternative to avoid dissolution: **transform** the S.A. into an **S.L.** (min €3,000)."}, {"id": "bl-u7-sc-law", "unit_no": 7, "section": "7.1 Structural changes", "front": "Which law regulates **structural changes**?", "back": "**Real Decreto-ley 5/2023, of 28 June (RDLME)** – applies to all commercial companies (and partnerships).", "tags": ["midterm"]}, {"id": "bl-u7-sc-list", "unit_no": 7, "section": "7.1 Structural changes", "front": "Closed list of structural changes?", "back": "1. **Transformation**\n2. **Merger**\n3. **Division** (demerger)\n4. **Global assignment of assets and liabilities**\n(+ international transfer of registered office) – domestic and cross-border.", "tags": ["midterm"]}, {"id": "bl-u7-sc-phases", "unit_no": 7, "section": "7.1 Structural changes", "front": "Three phases of the merger procedure?", "back": "1. **Preparation**\n2. **Approval**\n3. **Execution**", "tags": ["midterm"]}, {"id": "bl-u7-merger-def", "unit_no": 7, "section": "7.2 Mergers", "front": "Legal definition of a **merger**?", "back": "A corporate operation affecting **two or more companies** that entails the **extinction of all or some** of them and the **integration of their assets and members** into a **single company**.", "tags": ["midterm"]}, {"id": "bl-u7-merger-types", "unit_no": 7, "section": "7.2 Mergers", "front": "Two types of merger?", "back": "1. **By creation of a new company** – **all** merging companies are extinguished; a new one acquires everything by universal succession\n2. **By absorption** – one company **absorbs** the others, which are dissolved and extinguished (absorber usually **increases capital**)", "tags": ["midterm"], "explain": "Mock Q18(d) merger by absorption is a distractor – the block transfer where the transferring company receives shares is **segregation**."}, {"id": "bl-u7-merger-why", "unit_no": 7, "section": "7.2 Mergers", "front": "Typical economic reasons for mergers?", "back": "**Synergies, economies of scale, vertical integration, optimised financing**, growth in size.", "tags": ["midterm"]}, {"id": "bl-u7-draft", "unit_no": 7, "section": "7.2 Mergers", "front": "What is the **common draft terms of merger** (art. 39 RDLME) and its timing?", "back": "Drawn up by the **managing bodies of all companies**; published in the **Registry or on each website** at least **1 month** before the GMs. Must be approved within **6 months** of signature, otherwise it **lapses**.", "tags": ["midterm", "numbers"]}, {"id": "bl-u7-reports", "unit_no": 7, "section": "7.2 Mergers", "front": "Which reports accompany the merger draft?", "back": "A **directors' report** of each company justifying it + an **independent expert** report – **mandatory when any company is an S.A.**", "tags": ["midterm"]}, {"id": "bl-u7-exchange", "unit_no": 7, "section": "7.2 Mergers", "front": "What is the **exchange ratio** (exchange equation)?", "back": "The number of shares/stakes in the absorbing/new company given to members of the extinguished companies **in proportion to their participation**, calculated at **fair value** – so members' equity value is **not diminished**.", "tags": ["midterm"]}, {"id": "bl-u7-approval", "unit_no": 7, "section": "7.2 Mergers", "front": "Approval phase of a merger?", "back": "**GM of every company** approves the **common draft** strictly (art. 47), with LSC quorums/majorities. Notice **≥ 1 month** before; **merger balance sheet** ≤ **6 months** old (audited if required). **Consent** needed from members who become **unlimitedly liable**.", "tags": ["midterm", "numbers"]}, {"id": "bl-u7-universal-merger", "unit_no": 7, "section": "7.2 Mergers", "front": "Can merger formalities be simplified by unanimity?", "back": "Yes: if approved at a **universal GM by unanimity** in **each** company → no prior publication/deposit and **no directors' report** needed.", "tags": ["midterm"]}, {"id": "bl-u7-publication", "unit_no": 7, "section": "7.2 Mergers", "front": "How is the adopted merger resolution published?", "back": "In the **BORME** and a leading **newspaper** of each province – or by **individual written notice** to all members **and creditors**.", "tags": ["midterm"]}, {"id": "bl-u7-execution", "unit_no": 7, "section": "7.2 Mergers", "front": "Execution phase of a merger? When is it legally effective?", "back": "After the **1-month creditor opposition** period → **public deed** → **registration** in the Mercantile Registry. The merger takes legal effect **upon registration**. Afterwards it can only be challenged for breach of the RDLME, within **3 months**.", "tags": ["midterm", "numbers"]}, {"id": "bl-u7-special", "unit_no": 7, "section": "7.2 Mergers", "front": "What are **special mergers** (art. 53 ff. RDLME)?", "back": "Simplified mergers where the **same persons decide** in all companies. Main case: **absorption of a wholly-owned (100%) subsidiary** – simplified draft, **no expert reports**, **no capital increase** of the absorber, **no GM approval** of the absorbed company.", "tags": ["midterm", "case"], "explain": "This is exactly **Case 2, Facts 3** (PATINETES absorbs PTEL S.L.U.)."}, {"id": "bl-u7-twins", "unit_no": 7, "section": "7.2 Mergers", "front": "What is a merger of **\"twin\" companies** (art. 49.2)?", "back": "Absorption where the absorbing company **indirectly** owns 100% of the absorbed one (a **common shareholder** owns both 100%). Simplified, but **capital increase** and **expert report** are still required. Simplifications also from **90%** ownership (art. 54).", "tags": ["midterm", "numbers"]}, {"id": "bl-u7-division-why", "unit_no": 7, "section": "7.3 Divisions", "front": "Why divide a company?", "back": "To **reorganise**: separate activities or production phases into different companies, or distribute assets according to different financial needs. The inverse of a merger; merger rules apply (art. 63).", "tags": ["midterm"]}, {"id": "bl-u7-total", "unit_no": 7, "section": "7.3 Divisions", "front": "**Total demerger** (split-up), art. 59?", "back": "The company is **extinguished**; all its assets are divided into **two or more blocks**, each transferred to a new or existing company; the **members** receive shares of the beneficiaries in proportion.", "tags": ["midterm", "mock"], "explain": "Mock Q4 → (d): members of the divided company become members of the beneficiaries and the divided company is **extinguished**."}, {"id": "bl-u7-partial", "unit_no": 7, "section": "7.3 Divisions", "front": "**Partial demerger** (spin-off), art. 60?", "back": "Block transfer of **one or more parts** of the assets to beneficiaries; the **members** receive their shares; the divided company **survives** but **reduces its capital**.", "tags": ["midterm"]}, {"id": "bl-u7-segregation", "unit_no": 7, "section": "7.3 Divisions", "front": "**Segregation**, art. 61?", "back": "Block transfer of one or more parts of the assets to beneficiaries, but the **transferring company itself** receives the shares → **parent–subsidiary** relationship.", "tags": ["midterm", "mock", "trap"], "explain": "Mock Q18 → (a) segregation. Mock Q4(b) is wrong: in segregation members do **not** become direct owners of the beneficiaries' shares."}, {"id": "bl-u7-who-receives", "unit_no": 7, "section": "7.3 Divisions", "front": "Quick test: who receives the beneficiary's shares, and does the original company survive?", "back": "- **Total demerger**: members · company **extinguished**\n- **Partial demerger**: members · company **survives** (capital ↓)\n- **Segregation**: **the company itself** · company **survives**", "tags": ["midterm"]}, {"id": "bl-u7-group", "unit_no": 7, "section": "7.3 Divisions", "front": "What is a **group of companies** (art. 42 CCom)?", "back": "Companies under **single management** of a **parent** company over **subsidiaries**. Control is presumed when the parent holds (or can hold by agreement) the **majority of votes** or can **appoint/remove the majority of directors**. Consequences: **consolidated accounts**, tax consolidation, related-party valuation.", "tags": ["midterm"]}, {"id": "bl-u7-three-phases-end", "unit_no": 7, "section": "7.4 Dissolution, liquidation, extinction", "front": "Three phases of company termination?", "back": "1. **Dissolution** (declaratory act)\n2. **Liquidation**\n3. **Extinction** (termination)", "tags": ["midterm", "trap"], "explain": "The company does **not** end in a single act. Mock Q19(d) → false."}, {"id": "bl-u7-causes", "unit_no": 7, "section": "7.4 Dissolution, liquidation, extinction", "front": "Causes of dissolution (art. 363 LSC + voluntary)?", "back": "1. **Term** in by-laws expires\n2. **GM resolution**\n3. **Cessation** of the activity / **impossibility** of the corporate purpose\n4. **Paralysis** of corporate bodies\n5. **Losses** → equity **< ½ of capital** (unless capital increased/reduced enough, and if insolvency isn't due)\n6. Capital **below the legal minimum**", "tags": ["midterm", "mock"], "explain": "Mock Q19 → (b): the law sets **legal causes** of mandatory dissolution."}, {"id": "bl-u7-paralysis", "unit_no": 7, "section": "7.4 Dissolution, liquidation, extinction", "front": "Example of **paralysis of corporate bodies**?", "back": "Two members with **50% each** who always vote opposite → no resolutions possible in GM or managing body → legal cause of dissolution.", "tags": ["midterm", "case"], "explain": "Very relevant for Case 1 (Pedro & María 50/50!) → use a shareholders' agreement with a deadlock clause."}, {"id": "bl-u7-dissolution-who", "unit_no": 7, "section": "7.4 Dissolution, liquidation, extinction", "front": "Who declares dissolution and what if the GM doesn't?", "back": "The **GM**. With a legal cause, directors **must convene** it (any member may request it, art. 365.1). If the GM rejects or can't agree → directors must request **judicial dissolution**. Failure → directors liable for debts arising **after** the cause. Formalised in **public deed + Registry** (or court judgment).", "tags": ["midterm"]}, {"id": "bl-u7-liquidation", "unit_no": 7, "section": "7.4 Dissolution, liquidation, extinction", "front": "What happens in **liquidation**?", "back": "The company **keeps legal personality**, adds \"**en liquidación**\" to its name, stops its corporate purpose. **Directors cease**; **liquidators** take over (art. 375). Tasks: **inventory & balance** within **3 months**, **pay creditors**, final balance, **distribute** the remainder to members in proportion to their capital.", "tags": ["midterm", "numbers"]}, {"id": "bl-u7-distribution-challenge", "unit_no": 7, "section": "7.4 Dissolution, liquidation, extinction", "front": "Can the distribution proposal be challenged?", "back": "Yes – members who **didn't vote in favour** can challenge the GM approval within **2 months** (art. 390). And **nothing** may be distributed to members until **all debts** are paid (otherwise → insolvency rules).", "tags": ["midterm", "numbers", "trap"]}, {"id": "bl-u7-extinction", "unit_no": 7, "section": "7.4 Dissolution, liquidation, extinction", "front": "When is the company **extinguished**?", "back": "When, after liquidation and distribution, the liquidators grant a **public deed of extinction** and its entries are **cancelled** in the Registry; books are deposited there. → **End of legal personality**.", "tags": ["midterm"]}, {"id": "bl-u7-simplified-end", "unit_no": 7, "section": "7.4 Dissolution, liquidation, extinction", "front": "Can dissolution, liquidation and extinction happen in one act?", "back": "Yes – if there are **no assets or liabilities** left, a deed of **dissolution and extinction** can be granted in the same act (initial balance = final balance).", "tags": ["midterm"]}, {"id": "bl-u8-ip-split", "unit_no": 8, "section": "8.1 Intellectual property", "front": "Two categories of **intellectual property** law?", "back": "1. **Copyright** – literary/artistic works, software, films, performers\n2. **Industrial property** – creations with **industrial application**: **distinctive signs** (trademarks, trade names) and **industrial creations** (patents, utility models, industrial designs)", "tags": ["midterm"]}, {"id": "bl-u8-ip-why", "unit_no": 8, "section": "8.1 Intellectual property", "front": "Double economic function of industrial property law?", "back": "1. **Private interest**: reward and incentivise the author's effort\n2. **General interest**: distinctive signs → **market transparency**; patents → inventions are **disclosed** and help progress", "tags": ["midterm"]}, {"id": "bl-u8-ip-how", "unit_no": 8, "section": "8.1 Intellectual property", "front": "How does the law protect industrial property?", "back": "By granting the author an **exclusive right of use**, which means **others are prohibited** from using it unless authorised.", "tags": ["midterm"]}, {"id": "bl-u8-ip-laws", "unit_no": 8, "section": "8.1 Intellectual property", "front": "Which laws regulate trademarks and patents in Spain?", "back": "**Trademarks Act 17/2001** (LM) for trademarks & trade names; **Patents Act 24/2015** (LP) for patents & utility models.", "tags": ["midterm"]}, {"id": "bl-u8-tm-def", "unit_no": 8, "section": "8.2 Trademarks", "front": "Define a **trademark** (art. 4.1 LM).", "back": "**Any sign** (words, names, drawings, letters, numbers, colours, shape/packaging, sounds…) **capable of distinguishing the products or services** of one company from those of others.", "tags": ["midterm"], "explain": "Essential element: **distinctiveness**."}, {"id": "bl-u8-tm-vs-name", "unit_no": 8, "section": "8.2 Trademarks", "front": "Trademark vs **trade name** vs company name?", "back": "**Trademark** → distinguishes **products/services** (Zara, Bershka).\n**Trade name** (art. 87 LM) → identifies **the business/entrepreneur** in trade (GRUPO INDITEX).\n**Company name** → legal name (Industria de Diseño Textil, S.A.).\nA trade name does **not** let you mark products – you need a trademark.", "tags": ["midterm", "trap"]}, {"id": "bl-u8-shop-sign", "unit_no": 8, "section": "8.2 Trademarks", "front": "Are **shop signs** (rótulos) protected by the Trademarks Act?", "back": "**No.** Using a shop sign to the detriment of an earlier one can be **unfair competition** (misleading act).", "tags": ["midterm", "trap"]}, {"id": "bl-u8-specialty", "unit_no": 8, "section": "8.2 Trademarks", "front": "What is the **principle of specialty**?", "back": "A trademark is registered for specific **classes** of goods/services (**Nice Classification**) and protected only within them – except **renowned** trademarks.", "tags": ["midterm"]}, {"id": "bl-u8-tm-types", "unit_no": 8, "section": "8.2 Trademarks", "front": "Five types of trademarks?", "back": "1. **Collective** – members of an **association** (owner = association), e.g. Barcelona Bar\n2. **Guarantee/warranty** – certifies common **quality/requirements** (e.g. CE marking)\n3. **Known / renowned** (art. 8) – generally known; protected **even unregistered** and **beyond its class**\n4. **EU trademark** – Reg. 2017/1001, whole EU\n5. **International** – protected in Spain on request (art. 79)", "tags": ["midterm"]}, {"id": "bl-u8-renowned", "unit_no": 8, "section": "8.2 Trademarks", "front": "How are **renowned** trademarks protected? Example?", "back": "Owner can prohibit use **even for other classes** (and protection even without registration in Spain). **ZARA vs \"Zara Tanzania Adventures\"**: EUIPO let Inditex win against a travel company.", "tags": ["midterm"]}, {"id": "bl-u8-tm-birth", "unit_no": 8, "section": "8.2 Trademarks", "front": "How is the **right to a trademark** acquired?", "back": "By **valid registration** at the **OEPM** (Spanish Patent & Trademark Office) – **constitutive** effect. After a **2-month opposition period**, the grant is published in the official gazette.", "tags": ["midterm", "numbers"]}, {"id": "bl-u8-tm-content", "unit_no": 8, "section": "8.2 Trademarks", "front": "Content of the trademark right (art. 34 LM)?", "back": "1. **Exclusive use** in trade\n2. **Prohibit** others from using identical/similar signs for the same/similar goods\n3. **Legal standing** to oppose registrations and seek **nullity** of confusing later marks", "tags": ["midterm"]}, {"id": "bl-u8-tm-duration", "unit_no": 8, "section": "8.2 Trademarks", "front": "Duration of a trademark?", "back": "**10 years from application**, **renewable indefinitely** for 10-year periods (art. 31).", "tags": ["midterm", "numbers", "trap"], "explain": "Trademark can live forever; patent can't (20 years, no renewal)."}, {"id": "bl-u8-tm-use", "unit_no": 8, "section": "8.2 Trademarks", "front": "Obligation to use a trademark?", "back": "**Effective and real use in Spain**. Not used for **5 years** after registration (or **5 uninterrupted years**) → **lapse (caducidad)**, registration cancelled (art. 39).", "tags": ["midterm", "numbers"]}, {"id": "bl-u8-tm-license", "unit_no": 8, "section": "8.2 Trademarks", "front": "Can a trademark be transferred or licensed?", "back": "Yes – it's an **intangible asset** (value = prestige + customer loyalty). **Licence** (art. 48): licensor authorises licensee for a **royalty**; for all/part of Spain, all/some classes, **exclusive or non-exclusive**.", "tags": ["midterm"]}, {"id": "bl-u8-abs-rel", "unit_no": 8, "section": "8.2 Trademarks", "front": "**Absolute** vs **relative** prohibitions – the key difference for nullity actions?", "back": "**Absolute** (art. 5): sign itself unfit / contrary to public order → nullity action **imprescriptible** (no time limit).\n**Relative** (art. 6 ff.): conflict with **earlier rights of others** → nullity action within **5 years**.", "tags": ["midterm", "numbers", "trap"]}, {"id": "bl-u8-absolute-list", "unit_no": 8, "section": "8.2 Trademarks", "front": "Main **absolute** prohibitions (art. 5 LM)?", "back": "1. Not a valid sign (art. 4)\n2. **Devoid of distinctive character**\n3. Exclusively **descriptive** (kind, quality, geographical origin…)\n4. Exclusively **customary** in current language/trade\n5. Contrary to **public policy/morality**\n6. Reproduce **flags/emblems** of Spain, regions, towns without consent\n7. **Deceptive** (nature, quality, geographical origin)", "tags": ["midterm"], "explain": "Examples from class: \"ECO PURE\", \"BioFresh 100%\", \"Barcelona Tapas\" → descriptive/deceptive (absolute)."}, {"id": "bl-u8-relative-list", "unit_no": 8, "section": "8.2 Trademarks", "front": "Main **relative** prohibitions?", "back": "Signs **confusable** with **earlier registered** trademarks/trade names for identical/similar goods, or taking **unfair advantage** of a **renowned** mark.", "tags": ["midterm"], "explain": "Class examples: \"Coca-Kola\", \"GOOGLE for Kids\" → relative. Apple Corps vs Apple Computer (iTunes)."}, {"id": "bl-u8-geo", "unit_no": 8, "section": "8.2 Trademarks", "front": "How are **designations of origin / geographical indications** protected?", "back": "Deceptive geographic signs are an absolute prohibition; unauthorised use of a designation of origin can even be a **criminal offence** (art. 275 Criminal Code).", "tags": ["midterm"]}, {"id": "bl-u8-tn-def", "unit_no": 8, "section": "8.2 Trademarks", "front": "Define a **trade name** (art. 87 LM). What can it consist of?", "back": "Any sign capable of graphic representation that **identifies a business** in trade and distinguishes it from businesses with identical/similar activities. Can be: personal names, company names, **imaginary** names, names alluding to the activity, anagrams, logos, images… Need not equal the company name. Specialty applies; **trademark rules apply** where compatible.", "tags": ["midterm"]}, {"id": "bl-u8-ind-creation", "unit_no": 8, "section": "8.3 Industrial creations & patents", "front": "What is an **industrial creation**? Invention vs discovery?", "back": "The result of human activity offering a **new technical solution** to a problem or improving an industrial process. A **discovery** doesn't necessarily have direct industrial application → **not** an invention.", "tags": ["midterm"]}, {"id": "bl-u8-creation-types", "unit_no": 8, "section": "8.3 Industrial creations & patents", "front": "Types of industrial creations?", "back": "a) **Inventions** (patents) – substantive\nb) **Utility models** – configuration with a practical advantage\nc) **Industrial designs** – aesthetic/ornamental appearance", "tags": ["midterm"]}, {"id": "bl-u8-monopoly-why", "unit_no": 8, "section": "8.3 Industrial creations & patents", "front": "Why does the law grant an exclusive right, if it restricts free competition?", "back": "To protect a **higher good**: without reward, less inventive effort. A **temporary** monopoly fosters **technological progress**; afterwards the invention enters the **public domain**.", "tags": ["midterm"]}, {"id": "bl-u8-patent-def", "unit_no": 8, "section": "8.3 Industrial creations & patents", "front": "What is a **patent**?", "back": "A **title** granted by the State recognising an **invention capable of industrial application** and the rights derived from it – the inventor's **exclusive** right to exploit it.", "tags": ["midterm"]}, {"id": "bl-u8-patentability", "unit_no": 8, "section": "8.3 Industrial creations & patents", "front": "Three requirements for patentability (art. 4.1 LP)?", "back": "1. **Novelty**\n2. **Inventive step**\n3. **Industrial application**", "tags": ["midterm"], "explain": "Mnemonic **N-I-I**: \"**N**ew **I**dea, **I**ndustrial\"."}, {"id": "bl-u8-novelty", "unit_no": 8, "section": "8.3 Industrial creations & patents", "front": "When is an invention **new** (art. 6)?", "back": "When it's not part of the **state of the art** = everything made **available to the public in Spain or abroad** (written, oral, use…) before the filing date. **Absolute, worldwide** novelty.", "tags": ["midterm"]}, {"id": "bl-u8-inv-step", "unit_no": 8, "section": "8.3 Industrial creations & patents", "front": "When is there an **inventive step** (art. 8)?", "back": "When it **doesn't follow obviously** from the state of the art for a **person skilled** in the field.", "tags": ["midterm"]}, {"id": "bl-u8-ind-app", "unit_no": 8, "section": "8.3 Industrial creations & patents", "front": "When is it capable of **industrial application** (art. 9)?", "back": "When it can be manufactured or used in **any kind of industry, including agriculture**.", "tags": ["midterm"]}, {"id": "bl-u8-not-inventions", "unit_no": 8, "section": "8.3 Industrial creations & patents", "front": "What is **not** considered an invention (art. 4)?", "back": "**Discoveries, scientific theories, mathematical methods**; literary/artistic/aesthetic works; schemes/rules/methods for mental acts, games or **business**; **computer programs**; presentations of information. (May be protected otherwise, e.g. copyright.)", "tags": ["midterm", "trap"]}, {"id": "bl-u8-non-patentable", "unit_no": 8, "section": "8.3 Industrial creations & patents", "front": "Inventions **excluded** from patents even if they meet the requirements (art. 5)?", "back": "Contrary to **public order/morality**; **plant varieties and animal breeds**; essentially biological processes; **surgical/therapeutic/diagnostic methods** on humans/animals; **human cloning**, commercial use of human embryos.", "tags": ["midterm"]}, {"id": "bl-u8-owner", "unit_no": 8, "section": "8.3 Industrial creations & patents", "front": "Who owns the right to a patent?", "back": "The **inventor** (or heirs/successors); several inventors → **in common**. If a non-entitled person applies → action before the OEPM (before grant) or **claim of ownership** in court (after grant), arts. 11–12.", "tags": ["midterm"]}, {"id": "bl-u8-employee-inv", "unit_no": 8, "section": "8.3 Industrial creations & patents", "front": "Employee inventions – three types (art. 15 ff.)?", "back": "1. **Service/employer** inventions – research is the **object of the contract** → belong to the **employer**\n2. **Mixed** – employee not hired to research, but used **company knowledge/resources** → employer **can claim** ownership or use, **paying compensation**\n3. **Free** – otherwise → belong to the **employee**", "tags": ["midterm", "trap"], "explain": "EcoTech case (researcher invents at home with company lab equipment): he *is* a researcher → if it falls within his research duties = **service** invention; if outside them but using company equipment = **mixed**."}, {"id": "bl-u8-patent-content", "unit_no": 8, "section": "8.3 Industrial creations & patents", "front": "Content of the patent right?", "back": "**Exclusive right to exploit** + prevent others from manufacturing, offering, introducing on the market or using; for **process patents** also covers the **products directly obtained**.", "tags": ["midterm"]}, {"id": "bl-u8-patent-duration", "unit_no": 8, "section": "8.3 Industrial creations & patents", "front": "Duration and territory of a patent?", "back": "**20 years, NOT renewable**, limited to **Spanish territory**. Then → public domain.", "tags": ["midterm", "numbers", "trap"]}, {"id": "bl-u8-exploit", "unit_no": 8, "section": "8.3 Industrial creations & patents", "front": "Obligation to **exploit** a patent?", "back": "Exploit (directly or via licensee) within **3 years from publication of the grant** or **4 years from filing**, enough to supply the Spanish market (art. 90). Otherwise → **compulsory licence**.", "tags": ["midterm", "numbers"], "explain": "Content guide shorthand: \"loss due to no exploitation (3 years)\"."}, {"id": "bl-u8-compulsory", "unit_no": 8, "section": "8.3 Industrial creations & patents", "front": "When can a **compulsory licence** be imposed (art. 91)?", "back": "**Lack or insufficient exploitation**; **public interest** (public health, national defence); to stop practices contrary to **competition law**.", "tags": ["midterm"]}, {"id": "bl-u8-patent-invalid", "unit_no": 8, "section": "8.3 Industrial creations & patents", "front": "Grounds of **patent invalidity**?", "back": "Patentability requirements not met; invention **insufficiently described**; subject goes **beyond the application**; holder **not entitled**.", "tags": ["midterm"]}, {"id": "bl-u8-patent-transfer", "unit_no": 8, "section": "8.3 Industrial creations & patents", "front": "How can patent rights be transferred?", "back": "Sold, **licensed** (contractual licence – licensor keeps ownership; exclusive or not; royalties), given as security (usufruct, chattel mortgage).", "tags": ["midterm"]}, {"id": "bl-u9-why-compete", "unit_no": 9, "section": "9.1 Free competition", "front": "Why protect free competition?", "back": "Market economy (art. **38 CE**) assumes competition allocates resources **most efficiently** → **lower prices, more quantity, variety and quality** for consumers. Pure freedom leads firms to **agree not to compete**, so the law must intervene.", "tags": ["midterm"]}, {"id": "bl-u9-ldc", "unit_no": 9, "section": "9.1 Free competition", "front": "Main Spanish competition law? Four controlled conducts?", "back": "**Act 15/2007 on the Defence of Competition (LDC)**.\n**Prohibited**: 1. **Collusive practices**, 2. **Abuse of dominant position**.\n**Controlled**: 3. **Economic concentrations**, 4. **State aid**.", "tags": ["midterm", "trap"]}, {"id": "bl-u9-collusion-def", "unit_no": 9, "section": "9.2 Collusive practices & abuse", "front": "What does art. 1 LDC prohibit?", "back": "Any **agreement, collective decision or recommendation, or concerted or consciously parallel practice** that has the **object or effect** (actual or potential) of **preventing, restricting or distorting competition** in all or part of the **national market**.", "tags": ["midterm"]}, {"id": "bl-u9-collusion-3", "unit_no": 9, "section": "9.2 Collusive practices & abuse", "front": "Three conditions of a prohibited collusive practice?", "back": "1. A **collusive practice** exists\n2. **Actual or potential** restriction of competition\n3. Effect on all/part of the **national market**", "tags": ["midterm"]}, {"id": "bl-u9-collusion-list", "unit_no": 9, "section": "9.2 Collusive practices & abuse", "front": "Expressly prohibited collusive practices (art. 1)?", "back": "a) **Fixing prices** or trading conditions\nb) **Limiting** production, distribution, development, investment\nc) **Sharing markets** or sources of supply\nd) **Discriminatory** conditions for equivalent transactions\ne) **Tying** – supplementary obligations unrelated to the contract", "tags": ["midterm"]}, {"id": "bl-u9-objective", "unit_no": 9, "section": "9.2 Collusive practices & abuse", "front": "Is intention relevant for a collusive practice?", "back": "**No** – it's an **objective** prohibition: the mere **agreement capable** of restricting competition suffices; intent and actual effect are irrelevant. Also applies to foreign firms/acts **if effects reach the Spanish market**.", "tags": ["midterm", "trap"]}, {"id": "bl-u9-null", "unit_no": 9, "section": "9.2 Collusive practices & abuse", "front": "Consequence of a prohibited agreement? Exemption?", "back": "**Null and void**. Exempted if it improves production/distribution or promotes **technical/economic progress**, with consumers getting a **fair share** of the benefits.", "tags": ["midterm"]}, {"id": "bl-u9-dominance", "unit_no": 9, "section": "9.2 Collusive practices & abuse", "front": "Is having a **dominant position** illegal?", "back": "**No** – only its **abusive exploitation** (art. 2 LDC), even of a legal monopoly. Dominance = factual market power (market share), to be proven.", "tags": ["midterm", "trap"]}, {"id": "bl-u9-abuse-list", "unit_no": 9, "section": "9.2 Collusive practices & abuse", "front": "Examples of **abuse** of dominant position (art. 2)?", "back": "a) Imposing **unfair prices** or conditions\nb) **Limiting** production/development to the detriment of firms/consumers\nc) Unjustified **refusal to supply**\nd) **Unequal conditions** for equivalent services\ne) **Tying** unrelated services\n(Non-exhaustive list)", "tags": ["midterm"]}, {"id": "bl-u9-exempt", "unit_no": 9, "section": "9.2 Collusive practices & abuse", "front": "Conducts **exempted** from the prohibitions (arts. 4–6)?", "back": "1. Conduct resulting from **application of a law**\n2. Conduct of **minor importance** (de minimis)", "tags": ["midterm"]}, {"id": "bl-u9-deminimis", "unit_no": 9, "section": "9.2 Collusive practices & abuse", "front": "**De minimis** thresholds (LDC Regulation, art. 1)?", "back": "- **Competitors**: combined share **≤ 10%**\n- **Non-competitors**: each **≤ 15%**\n- Unclear: **10%** each\n- **Cumulative** parallel networks: **5%** (only if networks cover ≥ **30%** of the market)", "tags": ["midterm", "numbers"]}, {"id": "bl-u9-hardcore", "unit_no": 9, "section": "9.2 Collusive practices & abuse", "front": "Which conducts are **never** of minor importance?", "back": "**Price fixing, limiting production/sales, sharing markets/customers** between competitors, and **fixed or minimum resale prices** imposed on buyers (even between non-competitors).", "tags": ["midterm", "trap"]}, {"id": "bl-u9-concentration", "unit_no": 9, "section": "9.3 Concentrations & State aid", "front": "What is an **economic concentration** (art. 7 LDC)? Is it prohibited?", "back": "A **stable change of control** of all or part of one or more companies (mergers, acquisitions). **Not prohibited** – but **controlled** if it may restrict competition.", "tags": ["midterm"]}, {"id": "bl-u9-thresholds", "unit_no": 9, "section": "9.3 Concentrations & State aid", "front": "When must a concentration be notified (art. 8 LDC)?", "back": "If **either**:\na) it acquires/increases a market share **≥ 30%**, or\nb) combined Spanish turnover **> €240 million** and at least **two** participants each **> €60 million**", "tags": ["midterm", "numbers"]}, {"id": "bl-u9-procedure", "unit_no": 9, "section": "9.3 Concentrations & State aid", "front": "Concentration control procedure?", "back": "1. **Notify the CNMC** before execution\n2. **Suspension** – can't execute until authorised\n3. CNMC **authorises**, authorises **with conditions**, or **prohibits**\nNot notifying = **administrative offence**.", "tags": ["midterm"]}, {"id": "bl-u9-aid", "unit_no": 9, "section": "9.3 Concentrations & State aid", "front": "State aid under EU law?", "back": "In principle **incompatible** with the internal market (privileged position). Automatically allowed: aid of a **social** nature or for **natural disasters**/exceptional events (art. 107.2 TFEU); possible for regional development, projects of common European interest, serious economic disturbance. **De minimis: ≤ €200,000 over 3 fiscal years.**", "tags": ["midterm", "numbers"]}, {"id": "bl-u9-aid-spain", "unit_no": 9, "section": "9.3 Concentrations & State aid", "front": "What does the Spanish LDC do about State aid?", "back": "It does **not prohibit** it – the **CNMC** may **analyse** aid and its effects on competition and report. Breaches by a State can be taken to the **CJEU** by the Commission or another State.", "tags": ["midterm"]}, {"id": "bl-u9-bodies", "unit_no": 9, "section": "9.4 Supervisory bodies & sanctions", "front": "Who supervises competition?", "back": "**National** market → **CNMC** (Comisión Nacional de los Mercados y la Competencia); appeals to the **Audiencia Nacional**.\n**Cross-border/EU** market → **European Commission** (DG Competition); appeals to the **General Court**, then the **Court of Justice**.", "tags": ["midterm"]}, {"id": "bl-u9-fines", "unit_no": 9, "section": "9.4 Supervisory bodies & sanctions", "front": "Sanctions under the LDC?", "back": "Graduated: **minor** up to **1%**, … **very serious** up to **10%** of total **turnover** of the previous year. Plus up to **€60,000** for **legal representatives/managers** involved (art. 63).", "tags": ["midterm", "numbers"]}, {"id": "bl-u9-leniency", "unit_no": 9, "section": "9.4 Supervisory bodies & sanctions", "front": "What is the **leniency** programme?", "back": "The **first** cartel member to provide decisive evidence gets **full immunity** from the fine; later ones can get a **reduction** (arts. 65–66 LDC).", "tags": ["midterm"]}, {"id": "bl-u9-lcd", "unit_no": 9, "section": "9.5 Unfair competition", "front": "Which law regulates **unfair competition**? Purpose?", "back": "**Act 3/1991 on Unfair Competition (LCD)**. Not against *intense* competition, but against competition by **dishonest means** harming competitors, the market or consumers.", "tags": ["midterm"]}, {"id": "bl-u9-scope", "unit_no": 9, "section": "9.5 Unfair competition", "front": "Objective and subjective scope of the LCD?", "back": "Any unfair act **before, during or after** a transaction, **whether or not the contract is concluded** (art. 2). Applies to entrepreneurs, professionals **and any person** acting in the market.", "tags": ["midterm"]}, {"id": "bl-u9-general-clause", "unit_no": 9, "section": "9.5 Unfair competition", "front": "General clause of unfair competition (art. 4 LCD)?", "back": "Any conduct **objectively contrary to good faith** (intention irrelevant). Presumed towards consumers if: (1) contrary to **professional diligence** and (2) it **distorts or may distort** the economic behaviour of the **average consumer**.", "tags": ["midterm"]}, {"id": "bl-u9-open-list", "unit_no": 9, "section": "9.5 Unfair competition", "front": "Is the list of unfair acts closed?", "back": "**No** – listed acts are unfair per se; others are judged under the **general good-faith clause**.", "tags": ["midterm"]}, {"id": "bl-u9-competitor-acts", "unit_no": 9, "section": "9.5 Unfair competition", "front": "Unfair acts addressed to a **specific competitor**?", "back": "1. **Defamation** (denigration)\n2. **Comparison**\n3. **Imitation**\n4. Exploiting another's **reputation**\n5. Violation of **business secrets**\n6. **Inducing breach** of contract", "tags": ["midterm"]}, {"id": "bl-u9-defamation", "unit_no": 9, "section": "9.5 Unfair competition", "front": "When is a statement about a competitor **defamation**?", "back": "Public statements that may **harm its reputation**, unless **true, accurate and appropriate**. Statements on **personal matters** are unfair **even if true**.", "tags": ["midterm", "trap"]}, {"id": "bl-u9-comparison", "unit_no": 9, "section": "9.5 Unfair competition", "front": "When is **comparative advertising** lawful?", "back": "(a) compares goods with the **same purpose**, (b) refers **objectively** to **essential, relevant** features, (c) is **true** and doesn't exploit the competitor's **reputation**.", "tags": ["midterm", "case"], "explain": "Case 3: the KFC vs McDonald's tweet."}, {"id": "bl-u9-imitation", "unit_no": 9, "section": "9.5 Unfair competition", "front": "When is **imitation** unfair?", "back": "Imitation of non-exclusive creations is in principle free, but unfair if it creates **risk of association** by consumers or **unfairly exploits** the competitor's reputation or effort.", "tags": ["midterm"]}, {"id": "bl-u9-secrets", "unit_no": 9, "section": "9.5 Unfair competition", "front": "Violation of **business secrets** – which special law?", "back": "Disclosing/using trade secrets under a duty of confidentiality or obtained unfairly. Special law: **Act 1/2019 on Trade Secrets** (implements Directive 2016/943).", "tags": ["midterm"]}, {"id": "bl-u9-induction", "unit_no": 9, "section": "9.5 Unfair competition", "front": "When is **inducing breach of contract** unfair?", "back": "Inducing workers, suppliers or customers to breach basic contractual duties. Inducing a *regular* termination is unfair only if aimed at **secrets**, uses **deception**, or aims to **eliminate a competitor**.", "tags": ["midterm"]}, {"id": "bl-u9-market-acts", "unit_no": 9, "section": "9.5 Unfair competition", "front": "Unfair acts against the **proper functioning of the market**?", "back": "1. **Misleading acts**\n2. Acts of **confusion**\n3. **Misleading omissions**\n4. **Aggressive practices**\n5. **Infringement of laws** (gaining a significant advantage)\n6. **Sale below cost**", "tags": ["midterm"]}, {"id": "bl-u9-misleading", "unit_no": 9, "section": "9.5 Unfair competition", "front": "Misleading **act** vs act of **confusion**?", "back": "**Misleading**: false info, or true info that can induce **error** about **essential characteristics**, influencing economic behaviour.\n**Confusion**: creating confusion with a **competitor's** activity, products or establishment (incl. **risk of association**).", "tags": ["midterm", "trap"]}, {"id": "bl-u9-omissions", "unit_no": 9, "section": "9.5 Unfair competition", "front": "What are **misleading omissions**?", "back": "Advertising inducing error by **omitting/hiding** necessary info, or giving it **unclear, unintelligible, ambiguous**, **at the wrong time**, or **subliminal** advertising.", "tags": ["midterm"]}, {"id": "bl-u9-below-cost", "unit_no": 9, "section": "9.5 Unfair competition", "front": "When is **selling below cost** unfair?", "back": "Only when done **systematically** and it **misleads** consumers about the price level of other products in the same store, or aims to **eliminate a competitor**.", "tags": ["midterm", "trap"]}, {"id": "bl-u9-consumer-practices", "unit_no": 9, "section": "9.5 Unfair competition", "front": "Two groups of **unfair practices towards consumers** (arts. 19–31 LCD)?", "back": "**Misleading** practices (arts. 20–27) and **aggressive** practices (arts. 28–31). Purpose: protect consumers' **freedom of choice**.", "tags": ["midterm"]}, {"id": "bl-u9-misleading-cons", "unit_no": 9, "section": "9.5 Unfair competition", "front": "Examples of **misleading practices** towards consumers?", "back": "1. Causing **confusion** with competitors' marks\n2. False claims of **codes of conduct / quality marks**\n3. **Bait advertising** (\"Barcelona for €1\" with almost no seats)\n4. False claims about **properties** (\"cures diseases\")\n5. **Pyramid schemes** (Ponzi/Madoff)\n6. **Covert advertising** (advertorials not marked as ads)", "tags": ["midterm"]}, {"id": "bl-u9-aggressive-cons", "unit_no": 9, "section": "9.5 Unfair competition", "front": "Examples of **aggressive practices** towards consumers?", "back": "1. **Coercion** – making consumers believe they can't leave without buying\n2. **Harassment** – home visits ignoring requests to leave\n3. **Unsolicited, repeated** offers by phone/e-mail (Margus newsletter example)", "tags": ["midterm"]}, {"id": "bl-u10-c1-form", "unit_no": 10, "section": "Case 1 – Setting up the start-up", "front": "Case 1: Pedro & María want to grow, attract Business Angels then VC, and sell. Which company type?", "back": "A **capital company** – most likely an **S.L.** now (low capital, flexible, cheap), possibly **transformed into an S.A.** later (many investors, free transfer, listing).", "tags": ["midterm"], "explain": "Growth + investors + exit ⇒ limited liability and a capital split into transferable units. A partnership doesn't fit (unlimited liability, no transfer without consent)."}, {"id": "bl-u10-c1-why-capital", "unit_no": 10, "section": "Case 1 – Setting up the start-up", "front": "Case 1: why a capital company rather than a partnership (María wants to protect her wealth)?", "back": "- Members **not personally liable** (art. 1 LSC) – María risks only her contribution\n- Easier **entry of investors** and **transfer** of shares/stakes\n- **Separation** of ownership/management (investors don't need to manage)\n- Credibility, standard for VC", "tags": ["midterm"], "explain": "In a general partnership she would be **personally, unlimitedly, jointly & severally** liable."}, {"id": "bl-u10-c1-sl-sa", "unit_no": 10, "section": "Case 1 – Setting up the start-up", "front": "Case 1: S.L. or S.A.? Arguments.", "back": "**S.L.**: min **€3,000**, 100% paid, **no expert report**, fewer formalities, flexible by-laws (vote allocation, transfer restrictions keep control).\n**S.A.**: min **€60,000**, shares **freely transferable**, needed for **listing**, more formalities.\n→ **S.L. now**, transform later if needed.", "tags": ["midterm"]}, {"id": "bl-u10-c1-steps", "unit_no": 10, "section": "Case 1 – Setting up the start-up", "front": "Case 1: main steps to set up the S.L.?", "back": "1. **Name certificate** (Central Mercantile Registry)\n2. **Bank account** + deposit capital → **bank certificate**\n3. Provisional **NIF** (tax ID)\n4. Draft **by-laws**\n5. **Deed of incorporation before a notary**\n6. Tax formalities\n7. **Register** in the Mercantile Registry of the province (within 1 year) → legal personality; definitive NIF", "tags": ["midterm"]}, {"id": "bl-u10-c1-capital", "unit_no": 10, "section": "Case 1 – Setting up the start-up", "front": "Case 1: capital amount, proportions, Pedro's work, investing via a company?", "back": "- Capital: at least **€3,000** (more for credibility/needs)\n- Proportions: **free** (e.g. 50/50 – but beware **deadlock = paralysis**; add a deadlock clause)\n- Pedro's **work** can't be capital (art. 58.2) → **ancillary commitment** (art. 86)\n- **Yes**, they can invest through their own S.L. (legal persons can be members/founders)", "tags": ["midterm"]}, {"id": "bl-u10-c1-sha", "unit_no": 10, "section": "Case 1 – Setting up the start-up", "front": "Case 1: what is a **shareholders' agreement** (pacto de socios)?", "back": "A **private contract** between (some) shareholders regulating their relationship beyond the by-laws. Binds **only signatories** (not the company/third parties), **confidential**, not registered.", "tags": ["midterm"], "explain": "Not in the unit notes – needed for the case answer."}, {"id": "bl-u10-c1-sha-content", "unit_no": 10, "section": "Case 1 – Setting up the start-up", "front": "Case 1: typical content of a shareholders' agreement + when to sign?", "back": "Governance (board seats, **reserved matters/veto**), **transfer restrictions** (lock-up, **right of first refusal**, **tag-along**, **drag-along**), **anti-dilution**, founders' **dedication & non-compete**, **vesting / good & bad leaver**, **deadlock** resolution, exit.\nSign **at incorporation** (founders) and **renegotiate** when investors enter.", "tags": ["midterm"]}, {"id": "bl-u10-c2-impair", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: equity €30,000, capital €90,000 (S.L.). Legal situation?", "back": "Equity = **33% < ½ of capital** → **legal cause of mandatory dissolution** (art. 363.1.e LSC), unless capital is increased/reduced enough (or insolvency applies). (The **2/3 mandatory reduction** applies only to the **S.A.**)", "tags": ["midterm", "numbers"], "explain": "Calculation: 30,000 ÷ 90,000 = 0.33; threshold ½ × 90,000 = 45,000 > 30,000."}, {"id": "bl-u10-c2-liab", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: are Pedro & María liable – as directors? as shareholders?", "back": "**As directors**: yes, if they don't **convene the GM** (within **2 months**) to dissolve or fix the situation (or request judicial dissolution) → **liable for company debts arising after** the cause (subsidiary, joint & several).\n**As shareholders**: **no** – capital company.", "tags": ["midterm"]}, {"id": "bl-u10-c2-models", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: other management systems? Would a board change their liability?", "back": "S.L./S.A.: **sole director, joint & several, joint (S.A. max 2), board** (min 3; S.L. max 12). On a board the regime is the same: **all members who adopted** the harmful decision are **jointly and severally liable** unless they prove they opposed, didn't know, or did everything to avoid it (art. 237).", "tags": ["midterm"]}, {"id": "bl-u10-c2-fix", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: how to reverse the capital impairment?", "back": "- **Capital increase** (e.g. the Business Angel's €100,000 in cash; or offsetting shareholder loans)\n- **Capital reduction to compensate losses** (S.L. capital ≥ €3,000)\n- **Accordion** (reduction + simultaneous increase)\n- Members' **contributions to equity** / returning to profit\nGoal: equity **≥ ½ of capital**.", "tags": ["midterm"]}, {"id": "bl-u10-c2-type", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: type of capital increase for the Business Angel? Steps?", "back": "A **cash** increase by **creating new stakes with a share premium**. Steps: **directors' report** & proposal → **GM resolution** (by-law amendment, S.L. > ½ of all votes) → **pre-emptive right** handled (waiver) → **subscription & payment** (bank certificate) → **public deed** → **registration** of resolution + execution.", "tags": ["midterm"]}, {"id": "bl-u10-c2-preempt", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: do Pedro & María have a pre-emptive right? How to manage it?", "back": "**Yes** – cash increase. They **individually waive** it (or the GM **excludes** it) so the stakes can go to the Business Angel.", "tags": ["midterm"]}, {"id": "bl-u10-c2-valuation", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: BA invests €100,000 for 10%. Pre-money value?", "back": "Post-money = 100,000 ÷ 10% = **€1,000,000** → pre-money = **€900,000** → **€10 per existing stake** (900,000 ÷ 90,000).", "tags": ["midterm", "numbers"]}, {"id": "bl-u10-c2-numbers", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: capital €90,000 in €1 stakes. Fill in the capital increase for 10% at €100,000.", "back": "New stakes N: N ÷ (90,000 + N) = 10% → **N = 10,000**.\n- Increase: **€10,000**, 10,000 new stakes numbered **90,001–100,000**\n- Total stakes **100,000** of €1\n- Premium: **€90,000** total = **€9 per stake**\n- Capital + premium = **€100,000**\n- New capital **€100,000** (stakes 1–100,000)", "tags": ["midterm", "numbers"], "explain": "The **share premium** is the anti-dilution mechanism: the BA pays €10 per stake (€1 par + €9 premium) = the real value, so the founders' value isn't diluted. Bonus: equity becomes 30,000 + 100,000 = **€130,000 > ½ × 100,000** → impairment cured."}, {"id": "bl-u10-c2-absorber", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: which company should absorb which?", "back": "**PATINETES ELÉCTRICOS S.L. absorbs PTEL S.L.U.** – Patinetes holds the 40 employees, all client/supplier contracts, IP rights and **licences/permits**; absorbing the other way would require transferring all of these (and licences may not be transferable).", "tags": ["midterm"]}, {"id": "bl-u10-c2-merger-type", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: what type of merger, and what can be avoided?", "back": "**Merger by absorption of a wholly-owned subsidiary** (special merger, art. 53 RDLME): simplified draft; **no exchange ratio**, **no directors' and experts' reports**, **no capital increase** of the absorber, **no approval by the absorbed company's GM**.", "tags": ["midterm"]}, {"id": "bl-u10-c2-procedure", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: order of the merger procedure?", "back": "1. **Common draft terms** signed by both managing bodies\n2. **Publication/deposit** (Registry or websites) ≥ **1 month** before the GM\n3. **Merger balance sheets** (≤ 6 months)\n4. **GM approval** of Patinetes (within 6 months of the draft)\n5. **Publication** of the resolution (BORME + newspaper, or individual notice)\n6. **1-month creditor opposition** period\n7. **Public deed** of merger\n8. **Registration** → effective; PTEL extinguished & cancelled", "tags": ["midterm"]}, {"id": "bl-u10-c2-effective", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: when is the merger effective – legally and for accounting?", "back": "**Legally**: on **registration** in the Mercantile Registry. **Accounting**: from the **date set in the merger draft** (per accounting rules; typically retroactive to the start of the financial year for group companies).", "tags": ["midterm"]}, {"id": "bl-u10-c2-reasons", "unit_no": 10, "section": "Case 2 – Patinetes Eléctricos S.L.", "front": "Case 2: reasons for the merger?", "back": "PTEL lost its purpose (only serves the parent): **simplify the structure**, **cut costs** (one set of accounts, filings, governance), **synergies**, concentrate employees/assets. Stating them (draft/report) helps **transparency** and justifies **valid economic reasons** (e.g. for tax neutrality).", "tags": ["midterm"]}, {"id": "bl-u10-c3-kfc", "unit_no": 10, "section": "Case 3 – Competition & IP", "front": "Case 3: KFC's \"nuclear button\" tweet mocking Ronald McDonald – what advertising, lawful?", "back": "**Comparative advertising** (implicit reference to a competitor). Lawful only if it compares goods with the **same purpose**, **objectively** on **essential, verifiable** features, is **true**, not **denigrating**, doesn't exploit the competitor's **mark/reputation** (Dir. 2006/114 art. 4). \"Bigger and more powerful\" isn't verifiable and it ridicules McDonald's mascot → arguably **unlawful**; counter-argument: obvious humour/puffery no consumer takes literally.", "tags": ["midterm"]}, {"id": "bl-u10-c3-natural", "unit_no": 10, "section": "Case 3 – Competition & IP", "front": "Case 3: products labelled \"100% natural\" contain chemicals. What is it and what actions exist?", "back": "**Misleading advertising** (misleading act/practice about essential characteristics). Actions (art. 32 LCD): **declaratory**, **cessation/prohibition**, **removal of effects**, **rectification**, **damages** (if fault), **unjust enrichment**; consumers' associations can sue; complaints to consumer authorities.", "tags": ["midterm"]}, {"id": "bl-u10-c3-cartel", "unit_no": 10, "section": "Case 3 – Competition & IP", "front": "Case 3: what is a **cartel**? Examples.", "back": "A secret **agreement between competitors** to **fix prices**, **share markets/customers**, or **limit output** (art. 101 TFEU / art. 1 LDC). Examples: price-fixing cartels (e.g. EU truck makers), bid rigging, market sharing.", "tags": ["midterm"]}, {"id": "bl-u10-c3-algo", "unit_no": 10, "section": "Case 3 – Competition & IP", "front": "Case 3: travel agencies' software caps discounts at 3%; poster seller uses repricing algorithm. Sanctionable?", "back": "**Travel agencies**: common cap known and applied by competitors = **concerted practice** (price fixing) → sanctionable (EU *Eturas* case). **Posters**: a purely **unilateral** pricing algorithm is lawful; it becomes a **cartel** if used to implement an **agreement not to undercut** competitors (UK posters case on Amazon). Fines up to **10% of turnover**, nullity, leniency.", "tags": ["midterm"]}, {"id": "bl-u10-c3-blackfriday", "unit_no": 10, "section": "Case 3 – Competition & IP", "front": "Case 3: a company claims royalties for its registered \"Black Friday\" trademark. Can shops ignore it?", "back": "**Yes, largely**: \"Black Friday\" is a **generic/descriptive** term for a sales event – an **absolute** prohibition (no distinctiveness, customary in trade) → **nullity action** (**no time limit**); using it **descriptively** isn't trademark use. (Spanish courts did annul most of that registration.) Famous marks = Zara, Coca-Cola – broader protection (art. 8 LM).", "tags": ["midterm"]}, {"id": "bl-u10-c3-design", "unit_no": 10, "section": "Case 3 – Competition & IP", "front": "Case 3: competitors copy a start-up's registered EU design (webcam cover). Measures?", "back": "**Prevent**: register **designs** (EU), **trademark**, **patent/utility model** if technical, NDAs. **After copying**: cease-and-desist letter, **infringement action** (cessation, removal/seizure of copies, damages, publication), **interim measures**, **customs** measures; alternatively **unfair imitation** under the LCD.", "tags": ["midterm"]}, {"id": "bl-u10-c3-secrets", "unit_no": 10, "section": "Case 3 – Competition & IP", "front": "Case 3: legal mechanisms to protect innovations – differences?", "back": "- **Patent**: public, registered, **20 years**, absolute exclusivity\n- **Utility model / design**: registered, shorter, for practical/aesthetic creations\n- **Trademark**: signs, **10 years renewable**\n- **Copyright**: works/software, no registration\n- **Trade secret** (Act 1/2019): **no registration, unlimited** while secret + **reasonable measures** (NDAs), but no protection against **independent discovery / reverse engineering**\n- **Unfair competition** as a backstop", "tags": ["midterm"]}];
const MCQ=[{"id": "b101", "unit": 1, "q": "A Royal Decree appointing Mr. García as Director-General of a ministry:", "opts": ["Is a legal rule because it is enacted by the Government.", "Is not a legal rule because it lacks generality.", "Is a legal rule because it is published in the BOE.", "Is not a legal rule because it lacks coercibility."], "ans": 1, "why": "It addresses one specific person → no generality. Publication or the author doesn't make it a rule.", "src": "bank"}, {"id": "b102", "unit": 1, "q": "Unless the rule provides otherwise, a Spanish state rule enters into force:", "opts": ["On the day of its publication in the BOE.", "20 days after its publication in the BOE.", "One month after its approval by Parliament.", "When the citizens affected have been notified."], "ans": 1, "why": "20 days after publication = default vacatio legis.", "src": "bank"}, {"id": "b103", "unit": 1, "q": "The period between the publication of a rule and its entry into force is called:", "opts": ["Vacatio legis.", "Tacit repeal.", "Purposive approach.", "Lex specialis."], "ans": 0, "why": "Vacatio legis.", "src": "bank"}, {"id": "b104", "unit": 1, "q": "A new act regulates the same matter as an older act of the same rank in a different way, without mentioning it:", "opts": ["Both remain fully in force until the older one is expressly repealed.", "The older act is tacitly repealed in everything inconsistent.", "The older act prevails because it was first.", "A court must decide which applies through case law, which is a source of law."], "ans": 1, "why": "Tacit repeal: same or higher rank rule regulating differently invalidates the old one where inconsistent.", "src": "bank"}, {"id": "b105", "unit": 1, "q": "According to art. 1 CC, the sources of the Spanish legal system are:", "opts": ["Law, case law and custom.", "Law, custom and general principles of law.", "Constitution, acts and regulations.", "Law, custom, general principles and Supreme Court case law."], "ans": 1, "why": "Case law only complements the system.", "src": "bank"}, {"id": "b106", "unit": 1, "q": "Custom applies:", "opts": ["Always before the law, given Business Law's customary origins.", "Only in the absence of applicable law, if not contrary to morals or public order and if proven.", "Only if it has been confirmed by the Supreme Court.", "Never, since it has been replaced by general principles."], "ans": 1, "why": "Art. 1.3 CC.", "src": "bank"}, {"id": "b107", "unit": 1, "q": "Which statement about mandatory rules is correct?", "opts": ["They apply only if the parties have not agreed otherwise.", "Acts contrary to them are void by operation of law.", "Art. 314 CCom on interest on loans is an example.", "They can be excluded by a written contract."], "ans": 1, "why": "Art. 6.3 CC. Art. 314 CCom is dispositive.", "src": "bank"}, {"id": "b108", "unit": 1, "q": "A Royal Decree contradicts a Royal Legislative Decree. Which is correct?", "opts": ["The Royal Decree prevails because it is more recent.", "The contradicting precept of the Royal Decree is null and void.", "Both have the same rank, so the later one prevails.", "The Autonomous Communities decide which applies."], "ans": 1, "why": "RLD has the status of an act; a Royal Decree is lower.", "src": "bank"}, {"id": "b109", "unit": 1, "q": "A Royal Decree-Law is:", "opts": ["A rule of the Government with the status of an act, for cases of extraordinary and urgent need.", "A rule of Parliament delegating power to the Government.", "A regulation developing an act, below it in rank.", "An EU rule directly applicable in Spain."], "ans": 0, "why": "RDL = urgency; RLD = express delegation through a framework law.", "src": "bank"}, {"id": "b110", "unit": 1, "q": "An international treaty containing stipulations contrary to the Spanish Constitution:", "opts": ["Prevails over the Constitution, as supranational law.", "Requires prior amendment of the Constitution (art. 95 CE).", "Is automatically void.", "Applies only in the Autono
