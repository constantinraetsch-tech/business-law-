oves</small></div></div>\n <p><b>Creditors (S.A.)</b> can oppose within <b>1 month</b> of the last announcement when equity really falls (refunds, release of called-up capital) – <b>not</b> for loss compensation or reserves. Reduction waits until their debt is secured (e.g. bank guarantee).</p>\n <p><b>Accordion</b> (art. 343): reduce below the minimum to absorb losses + <b>simultaneous increase</b> ≥ minimum; pre-emptive right respected; reduction conditional on the increase; registered together. Alternative: transform S.A. → S.L.</p>"}], "traps": ["A capital increase always increases equity → <b>false</b> (reserves).", "Directors alone can amend the by-laws → <b>false</b> (except the office within Spain).", "The GM can't move the office within Spain → <b>false</b>.", "Creditors can always oppose a reduction → <b>false</b>.", "Mandatory reduction applies to S.L. → <b>false</b> (S.A. only, 2/3)."], "check": [["Which increase doesn't change equity?", "Charged to reserves."], ["Pre-emptive right – which increases, how long?", "Cash increases, at least 1 month."], ["S.A.: equity 60% of capital for over a year – consequence?", "Mandatory capital reduction (below 2/3)."]]}, {"u": 7, "title": "Structural Changes & Company Termination", "tldr": "RDL 5/2023 lists <b>transformation, merger, division, global assignment</b> (+ office abroad). Mergers: <b>new company</b> or <b>absorption</b>; phases <b>preparation → approval → execution</b>; effective on <b>registration</b>. Divisions: <b>total</b> (company dies, members get shares), <b>partial</b> (company lives, members get shares), <b>segregation</b> (company itself gets shares). End of a company: <b>dissolution → liquidation → extinction</b>.", "sections": [{"h": "Structural changes", "body": "<p>Bigger than a by-law amendment: they change the company's legal identity and assets. Closed list in the <b>RDLME (RDL 5/2023)</b>: <b>transformation, merger, division, global assignment of assets & liabilities</b>, plus international transfer of office.</p>"}, {"h": "Mergers: types", "body": "\n <div class=\"dia merge\"><div><h5>By creation</h5><span class=\"co\">A</span> + <span class=\"co\">B</span> → <span class=\"co new\">NEW</span><small>A and B extinguished</small></div><div><h5>By absorption</h5><span class=\"co\">A</span> + <span class=\"co\">B</span> → <span class=\"co new\">A</span><small>B extinguished, A increases capital</small></div></div>\n <p>Members of the extinguished companies become members of the new/absorbing company. Motives: synergies, scale, vertical integration, financing, growth.</p>"}, {"h": "Merger procedure", "body": "\n <div class=\"dia steps\"><div><b>1 Preparation</b><small>Common draft by all managing bodies · published ≥ <b>1 month</b> before GMs · directors' reports · expert report if any <b>S.A.</b> · <b>exchange ratio</b> at fair value</small></div><div><b>2 Approval</b><small>GM of <b>each</b> company within <b>6 months</b> of the draft · merger balance ≤ <b>6 months</b> · consent of members becoming unlimitedly liable · publish in BORME + newspaper (or individual notice)</small></div><div><b>3 Execution</b><small><b>1-month</b> creditor opposition · public deed · <b>registration = legal effect</b> · challenge only within <b>3 months</b> for RDLME breaches</small></div></div>\n <p>Universal GM + unanimity in each company → no prior publication and no directors' report.</p>"}, {"h": "Special (simplified) mergers", "body": "\n <p>When the <b>same people decide</b> on both sides. Main case: absorbing a <b>100%-owned subsidiary</b> (art. 53): simplified draft, <b>no expert reports, no capital increase, no GM of the absorbed</b>. Simplifications also from <b>90%</b> (art. 54).</p>\n <p class=\"tip\">Case 2 Facts 3: PATINETES absorbs its 100% subsidiary PTEL S.L.U. → art. 53.</p>"}, {"h": "Divisions", "body": "\n <div class=\"dia divs\"><div><h5>Total demerger</h5><span class=\"co dead\">X</span> → <span class=\"co\">B1</span> <span class=\"co\">B2</span><small>X <b>extinguished</b> · <b>members</b> get shares</small></div><div><h5>Partial demerger</h5><span class=\"co\">X</span> → <span class=\"co\">B1</span><small>X <b>survives</b> (capital ↓) · <b>members</b> get shares</small></div><div><h5>Segregation</h5><span class=\"co\">X</span> → <span class=\"co\">B1</span><small>X survives · <b>X itself</b> gets shares → parent/subsidiary</small></div></div>\n <p>Divisions reorganise (separate activities). Merger rules apply.</p>"}, {"h": "Dissolution → liquidation → extinction", "body": "\n <p><b>Causes</b> (art. 363 + voluntary): term expired · GM resolution · activity ceased/impossible · <b>paralysis</b> (50/50 deadlock) · <b>equity &lt; ½ capital</b> (unless fixed, and if insolvency isn't due) · capital below legal minimum.</p>\n <div class=\"dia flow\"><span><b>Dissolution</b><small>GM (directors must convene; else court) · deed + registry</small></span><span><b>Liquidation</b><small>\"en liquidación\" · liquidators replace directors · inventory in <b>3 months</b> · pay creditors · distribute rest</small></span><span><b>Extinction</b><small>deed · entries cancelled · books deposited · personality ends</small></span></div>\n <p>Personality <b>continues</b> during liquidation. Nothing goes to members before <b>all debts</b> are paid. Members who didn't vote for the distribution can challenge it within <b>2 months</b>. No assets/debts left → dissolution and extinction in <b>one deed</b>.</p>"}], "traps": ["A merger is effective when the GMs approve → <b>false</b> (registration).", "In segregation the members receive the shares → <b>false</b> (the company).", "Dissolution ends legal personality → <b>false</b> (extinction does).", "Directors decide dissolution → <b>false</b> (GM).", "Partial demerger extinguishes the company → <b>false</b>."], "check": [["Who receives the beneficiary's shares in a segregation?", "The transferring company itself."], ["Three phases of a merger?", "Preparation, approval, execution."], ["When does the legal personality end?", "With the cancellation of entries (extinction)."]]}];
const CASES = [{"id": "c1", "title": "Case 1 · Pedro & María's scooter start-up", "units": "Units 2–3", "facts": "Pedro and María want to launch an e-scooter rental platform (GPS app, mobile payment, park on public roads). Strategy: (a) launch, (b) expand, (c) maximise value, (d) <b>sell to a third party</b>. They need <b>Business Angels</b> first and later <b>venture capital</b>. María has an important personal wealth and wants to <b>limit her liability</b>.", "qs": [{"q": "(1) What type of company could they create, given their strategy?", "a": "A <b>capital company</b> (S.L. or S.A.). Their plan needs (i) <b>limited liability</b>, (ii) a capital divided into units that investors can <b>enter</b> and that can be <b>sold</b> at exit, and (iii) separation of <b>ownership and management</b> so investors don't have to run the business. A personalistic partnership (general or limited) fits none of this.", "keys": ["Capital company", "Limited liability", "Entry of investors / exit", "Partnership doesn't fit"]}, {"q": "(2) Why is a capital company more advisable than a partnership? (María wants to protect her wealth)", "a": "<ul><li><b>Liability</b>: in a general partnership partners answer for company debts <b>personally, unlimitedly, subsidiarily and jointly & severally</b> (arts. 127, 148 CCom). In an S.L./S.A. members are <b>not personally liable</b> (art. 1 LSC) – María risks only her contribution.</li><li><b>Transferability</b>: partnership status can't be transferred without the others' consent (art. 143 CCom); shares/stakes can be transferred (S.A. freely, S.L. with restrictions) → needed for the sale.</li><li><b>Management</b> is separated from ownership (directors), so investors can join without managing.</li><li>Capital companies are the standard vehicle for investors; partnerships are rarely used today.</li></ul>\n  <p class=\"tip\">But note: limited liability only works after <b>registration</b> (otherwise irregular company) and if they don't abuse the company (<b>veil lifting</b>).</p>", "keys": ["Art. 1 LSC – no personal liability", "Partnership: personal, unlimited, subsidiary, joint & several", "Transfer of status", "Registration needed"]}, {"q": "(3) S.L. or S.A.? Why?", "a": "<b>Recommendation: S.L. now.</b><ul><li>Minimum capital <b>€3,000</b> (S.A. €60,000), 100% paid but small.</li><li>No independent expert for non-cash contributions; fewer formalities, cheaper.</li><li><b>Flexible by-laws</b> (hybrid): founders can keep control (e.g. vote allocation, transfer restrictions, pre-emptive rights) while bringing in Business Angels.</li></ul>An <b>S.A.</b> becomes attractive if they need many investors, <b>free transferability</b> of shares or a <b>stock-market listing</b> (only S.A. can list). The S.L. can later be <b>transformed</b> into an S.A. (structural change).", "keys": ["€3,000 vs €60,000", "Fewer formalities", "Control through flexible by-laws", "Transform later / listing → S.A."]}, {"q": "(4) Main steps to set up the S.L.? Capital amount? Proportions? Can Pedro contribute his work? Can they invest through a company?", "a": "<b>Steps</b>: 1. Negative <b>name certificate</b> from the Central Mercantile Registry · 2. Open a <b>bank account</b> in the name of the company in formation and deposit the capital (bank certificate) · 3. Obtain a provisional <b>NIF</b> · 4. Draft the <b>by-laws</b> (name, purpose, office, capital, stakes, management body…) · 5. Execute the <b>deed of incorporation before a notary</b> · 6. Tax formalities · 7. <b>Register</b> in the Mercantile Registry of the province (max 1 year) → legal personality; definitive NIF; tax/social security registrations.<br>\n  <b>Capital</b>: at least <b>€3,000</b> (in the notes); in practice enough to fund the first phase and look credible to investors.<br>\n  <b>Proportions</b>: free. A 50/50 split is common but risks <b>deadlock = paralysis of corporate bodies</b>, a legal cause of dissolution → if 50/50, add a deadlock clause in a shareholders' agreement (or e.g. 51/49).<br>\n  <b>Pedro's work</b>: <b>cannot</b> be a capital contribution (art. 58.2 LSC). He can commit to work as an <b>ancillary commitment</b> (art. 86 LSC), free or paid, outside capital.<br>\n  <b>Through a company</b>: <b>yes</b> – legal persons can be founders/members (e.g. each founder's own holding S.L.).", "keys": ["Notary + Registry", "€3,000", "50/50 → paralysis risk", "Work = ancillary commitment (art. 58.2, 86)", "Holding company possible"]}, {"q": "(5) What is a shareholders' agreement, its content, should she sign it, and when?", "a": "A <b>shareholders' agreement</b> (pacto de socios / parasocial) is a <b>private contract</b> between some or all shareholders regulating their relationship <b>beyond the by-laws</b>. It is <b>confidential</b>, not registered, and binds <b>only the signatories</b> (not the company or third parties) – that's why key points are often mirrored in the by-laws where possible.<br>\n  <b>Typical content</b>: governance (board seats, <b>reserved matters / veto rights</b>, information rights) · <b>transfer restrictions</b>: lock-up, right of first refusal, <b>tag-along</b>, <b>drag-along</b> · <b>anti-dilution</b> & pre-emption · founders' dedication, <b>non-compete</b>, IP assignment · <b>vesting</b>, good/bad leaver · <b>deadlock</b> resolution · dividend policy · exit/sale provisions.<br>\n  <b>Recommendation</b>: yes – sign one <b>at incorporation</b> between the founders (dedication, leaver, deadlock), and <b>amend/replace</b> it when investors enter (they will demand their own terms).", "keys": ["Private contract, binds signatories", "Governance & vetoes", "Transfer clauses (ROFR, tag, drag)", "Sign at incorporation + update with investors"]}]}, {"id": "c2", "title": "Case 2 · Patinetes Eléctricos S.L.", "units": "Units 4–7", "facts": "<b>Facts 1</b>: after 2 years of losses, <b>equity €30,000</b> vs <b>share capital €90,000</b>. Pedro and María are <b>joint directors</b>.<br><b>Facts 2</b>: a <b>Business Angel</b> will invest <b>€100,000</b>; founders want to give <b>max 10%</b>. Capital €90,000 in <b>€1 par</b> stakes.<br><b>Facts 3</b>: subsidiary <b>PTEL S.L.U.</b> (100% owned, 5 employees, only serves the parent, no significant assets). Patinetes has 40 employees, all contracts, IP and licences. They will <b>merge</b>.", "qs": [{"q": "1. Could Pedro and María be held liable for the capital impairment – as directors? as shareholders? What should they do?", "a": "Equity €30,000 = <b>33% of capital</b> &lt; <b>½</b> (€45,000) → <b>legal cause of dissolution</b> (art. 363.1.e LSC) unless capital is increased or reduced sufficiently (and provided insolvency isn't due). The 2/3 mandatory reduction rule is only for S.A.<br>\n  <b>As directors</b>: they must <b>convene the GM</b> (within <b>2 months</b>) to dissolve or adopt measures that fix the situation; if the GM doesn't agree, request <b>judicial dissolution</b>. Otherwise → <b>liability for company debts arising after the cause</b> (subsidiary, joint & several). If the company is <b>insolvent</b>, they must file within <b>2 months</b> or be liable for later debts (culpable insolvency).<br>\n  <b>As shareholders</b>: <b>no</b> personal liability (capital company, art. 1 LSC).", "keys": ["33% < 50% → dissolution cause", "Convene GM (2 months)", "Liable for later debts", "Not as shareholders"]}, {"q": "2. Other management systems in S.L. and S.A.? Would liability change on a board?", "a": "Four models (art. 210 LSC): <b>sole director</b>; <b>joint & several</b> (each acts alone); <b>joint</b> (act together; S.A. max 2); <b>board</b> (min 3; S.L. max 12; collegiate). <br>On a board the regime is the <b>same</b>: all members who adopted or executed the harmful act/omission are <b>jointly & severally liable</b> (art. 237), unless they prove they <b>expressly opposed</b>, <b>didn't know</b>, or did <b>everything possible</b> to avoid the damage. As joint directors both must act together, so both are equally responsible.", "keys": ["4 models", "Art. 237 joint & several", "Exoneration: opposed / unaware / did everything"]}, {"q": "3. Measures to reverse the capital impairment?", "a": "Goal: equity ≥ ½ capital.<ul><li><b>Capital increase</b> with new money – the BA's €100,000 (cash) → equity 130,000 vs capital 100,000 ✔.</li><li><b>Increase by offsetting loans</b> (shareholder loans turned into capital – S.L.: 100% liquid, mature, payable).</li><li><b>Capital reduction to compensate losses</b> (S.L. capital stays ≥ €3,000): e.g. reduce capital to €50,000 → equity 30,000 ≥ 25,000 ✔.</li><li><b>Accordion</b>: reduction + simultaneous increase.</li><li>Members' contributions to equity / return to profit.</li></ul>", "keys": ["Cash increase (BA)", "Loans → capital", "Reduction for losses", "Accordion"]}, {"q": "4. Main legal obligations of directors? Liabilities if breached?", "a": "<b>Obligations</b>: act within law, by-laws and GM instructions; <b>duty of care</b> (orderly entrepreneur: prudence, competence, dedication, information, vigilance – incl. risk monitoring); <b>duty of loyalty</b> (no conflicts, secrecy, no competition); prepare <b>annual accounts</b>; convene the <b>ordinary GM</b> yearly and extraordinary GMs when required (dissolution causes); request <b>insolvency</b> on time.<br><b>Liabilities</b>: for <b>debts</b> (insolvency not filed / dissolution GM not convened → later debts) and for <b>damages</b> (art. 236: fault + damage + causal link; GM approval doesn't exonerate) via the <b>corporate</b> or <b>individual</b> action; plus <b>tax, labour and criminal</b> liability.", "keys": ["Care + loyalty", "Accounts, GM, insolvency", "Debts vs damages", "Corporate & individual actions"]}, {"q": "5 (i–iii). Type of capital increase? Other contributions? S.L. vs S.A.? Steps? Pre-emptive right?", "a": "<b>Type</b>: increase with <b>cash contributions</b>, creating <b>new stakes</b> with a <b>share premium</b>. Others: <b>non-cash</b>, <b>offsetting loans</b>, <b>reserves</b>. Differences: S.A. needs an <b>expert report</b> for non-cash and <b>auditor's certificate</b> for loans (≥25% due, rest ≤5 years) and may <b>delegate</b> the increase to directors; S.L. needs 100% of loans due.<br>\n  <b>Steps</b>: directors' proposal/report → GM convened (15 days, agenda + full text) → GM resolution (S.L.: <b>&gt; ½ of all votes</b>) → handling the pre-emptive right → subscription & payment (bank certificate) → <b>public deed</b> → <b>registration</b> of resolution + execution together.<br>\n  <b>Pre-emptive right</b>: <b>yes</b>, Pedro and María have it (cash increase, ≥ 1 month). To let the BA in, they <b>waive it individually</b> (simplest, e.g. in a universal meeting) or the GM <b>excludes</b> it.", "keys": ["Cash + new stakes + premium", "Steps: report → GM → subscription → deed → registry", "Pre-emptive right → waiver"]}, {"q": "5 (iv–vi). Pre-money valuation, anti-dilution mechanism and the figures of the resolution", "a": "<div class=\"dia calc\"><div>10% for €100,000 → post-money <b>€1,000,000</b> → <b>pre-money €900,000</b></div><div>Per existing stake: 900,000 ÷ 90,000 = <b>€10</b></div><div>New stakes N: N ÷ (90,000 + N) = 10% → <b>N = 10,000</b></div><div>Premium per stake = 10 − 1 = <b>€9</b> → total premium <b>€90,000</b></div></div>\n  <b>Mechanism</b>: the <b>share premium</b> – the BA pays the real value (€10) instead of par (€1), so the founders' stakes aren't diluted in value.<br><br>\n  <i>\"To increase the corporate capital of the Company, currently € 90,000, by € <b>10,000</b>, by creating <b>10,000</b> new shares, numbered from 90,001 to <b>100,000</b>, both inclusive. Consequently, the number of shares shall be <b>100,000</b>, with a face value of € 1 each. The new shares are created with a total issue premium of € <b>90,000</b>, resulting in an issue premium of € <b>9</b> per share. Therefore, the issued share capital and issue premium total € <b>100,000</b>. Consequently, the corporate capital shall be € <b>100,000</b>, represented by <b>100,000</b> shares, with a face value of € 1 each, numbered from 1 to <b>100,000</b>, both inclusive.\"</i>", "keys": ["Pre-money €900,000", "10,000 new stakes", "€9 premium / €90,000", "Capital €100,000"]}, {"q": "6. Which company should absorb which?", "a": "<b>PATINETES ELÉCTRICOS, S.L. absorbs PTEL, S.L.U.</b> Patinetes holds the 40 employees, all client and supplier contracts, the IP (trademarks, patents, domains) and the <b>licences and permits</b>. If PTEL absorbed Patinetes, all of these would have to pass to PTEL by universal succession – administrative licences may not be transferable, contracts may contain change-of-control clauses, and registrations would have to be updated. Absorbing the small subsidiary moves almost nothing (5 employees, no significant assets).", "keys": ["Patinetes = absorbing", "Licences/contracts/IP stay put", "PTEL extinguished"]}, {"q": "7. Type of merger and requirements avoided?", "a": "<b>Merger by absorption of a wholly-owned subsidiary</b> – a <b>special merger</b> (art. 53 RDLME). Avoided: <b>exchange ratio</b> (no new shares to PTEL's member – it's Patinetes itself), <b>capital increase</b> of the absorbing company, <b>directors' report</b> and <b>independent expert report</b>, and <b>approval by the GM of the absorbed company</b>. A simplified common draft is enough.", "keys": ["Absorption of 100% subsidiary", "Art. 53 RDLME", "No exchange ratio / capital increase / reports / absorbed GM"]}, {"q": "8. Procedure in chronological order", "a": "<ol><li>Directors of both companies draw up and sign the (simplified) <b>common draft terms of merger</b>.</li><li><b>Publication/deposit</b> of the draft in the Registry or on the websites, at least <b>1 month</b> before the GM (or individual notice; unanimous universal GM avoids it).</li><li><b>Merger balance sheets</b> (≤ 6 months; audited if required).</li><li><b>GM of Patinetes approves</b> the merger within <b>6 months</b> of the draft (PTEL's GM not needed).</li><li><b>Publication</b> of the resolution in the BORME + a newspaper, or individual written notice to members and creditors.</li><li><b>1-month creditors' opposition</b> period.</li><li><b>Public deed</b> of merger before a notary.</li><li><b>Registration</b> in the Mercantile Registry → merger effective, PTEL <b>extinguished</b> and its entries cancelled.</li></ol>", "keys": ["Draft → publish → balance → GM → publish → 1 month → deed → registry"]}, {"q": "9. When is the merger effective legally and for accounting?", "a": "<b>Legally</b>: on <b>registration</b> of the merger deed in the Mercantile Registry (universal succession, extinction of PTEL).<br><b>Accounting</b>: from the date stated in the merger draft from which PTEL's operations are considered carried out on behalf of Patinetes – it can be <b>earlier</b> than the legal effect.", "keys": ["Legal: registration", "Accounting: date in the draft (retroactive)"]}, {"q": "10. Reasons for the merger? Should they be recorded in the merger project?", "a": "<b>Reasons</b>: PTEL lost its purpose (only serves the parent) → <b>simplify</b> the group, <b>cut costs</b> (one set of accounts, audits, tax filings, governance), integrate the marketing team, synergies, single brand/contract holder.<br><b>Recording them</b>: not a mandatory item of the simplified draft, but <b>convenient</b>: it explains the economic reasons to members and creditors (transparency) and documents <b>valid economic reasons</b>, relevant e.g. for the tax-neutral merger regime.", "keys": ["Simplification & cost savings", "Transparency", "Valid economic reasons (tax)"]}]}];

const VIDEOS = [{"id": "v1", "u": 1, "title": "Which rule wins? The legal pyramid", "scenes": [{"v": "<div class=\"sv-big\">§</div><div class=\"sv-t\">Which rule wins?</div>", "s": "Imagine two rules say different things. Which one do you follow? Spanish law answers with a pyramid."}, {"v": "<div class=\"dia pyr anim\"><div style=\"--w:30%\">Constitution</div><div style=\"--w:46%\">Treaties · EU law</div><div style=\"--w:62%\">Acts</div><div style=\"--w:76%\">RDL · RLD</div><div style=\"--w:88%\">Royal Decrees</div><div style=\"--w:100%\">Orders</div></div>", "s": "At the top sits the Constitution. Just below: international treaties and EU law. Then the acts of Parliament, with Royal Decree-Laws and Royal Legislative Decrees, which the Government makes but which have the force of an act. Then Royal Decrees, and finally ministerial orders."}, {"v": "<div class=\"sv-rule\">Lower ✘ Higher</div><div class=\"sv-s\">A Royal Decree that contradicts an act is <b>null</b></div>", "s": "The golden rule: a lower rule can never contradict, invalidate or repeal a higher one. A Royal Decree against an act is simply void."}, {"v": "<div class=\"dia vs\"><div><h5>State</h5>Madrid</div><div><h5>Regions</h5>Catalonia, Andalusia…</div></div><div class=\"sv-s\">Competence, <b>not</b> hierarchy</div>", "s": "Careful with a classic trap: State law does not sit above regional law. Their relationship is one of competence. The Constitution and each Statute of Autonomy decide who regulates what."}, {"v": "<div class=\"dia vs\"><div><h5>Regulation</h5>applies directly to everyone</div><div><h5>Directive</h5>States must transpose it</div></div>", "s": "From Brussels come two main tools. A Regulation, like the GDPR, applies directly to everyone. A Directive is addressed to the Member States, which must transpose it into national law. And if EU and national law clash, EU law prevails."}, {"v": "<div class=\"sv-t\">Law → Custom → Principles</div><div class=\"sv-s\">Case law only <b>complements</b></div>", "s": "Finally, the order of sources: first the law, then custom, then general principles. Supreme Court case law is not a source; it only complements the system. That's Unit 1 in a minute."}]}, {"id": "v2", "u": 3, "title": "S.A. or S.L.? Founding a capital company", "scenes": [{"v": "<div class=\"sv-big\">S.L.</div><div class=\"sv-t\">Pedro & María start a company</div>", "s": "Pedro and María want to launch a scooter start-up without risking their personal wealth. They need a capital company. But which one: an S.A. or an S.L.?"}, {"v": "<table class=\"tbl\"><tr><th></th><th>S.L.</th><th>S.A.</th></tr><tr><td>Min capital</td><td>€3,000</td><td>€60,000</td></tr><tr><td>Paid at start</td><td>100%</td><td>25%</td></tr><tr><td>Units</td><td>stakes</td><td>shares</td></tr></table>", "s": "An S.L. needs three thousand euros, fully paid. An S.A. needs sixty thousand, but only twenty-five percent must be paid at the start; the rest is called-up capital. The S.L. is divided into stakes, the S.A. into shares, which are negotiable securities."}, {"v": "<div class=\"dia flow\"><span>Name cert.</span><span>Bank deposit</span><span>Notary deed</span><span>Registry</span></div>", "s": "To incorporate: get a name certificate, deposit the money and get a bank certificate, sign the deed with the by-laws before a notary, and register it in the Mercantile Registry within one year. Only registration gives the company its legal personality and limits the members' liability."}, {"v": "<div class=\"sv-rule\">Work ✘ capital</div><div class=\"sv-s\">→ ancillary commitment</div>", "s": "Pedro wants to contribute his work instead of money. Not possible: work or services can never be capital, under article fifty-eight point two of the LSC. He can commit to work as an ancillary commitment instead."}, {"v": "<div class=\"dia steps\"><div><b>Par</b><small>€100</small></div><div><b>Book</b><small>equity ÷ shares</small></div><div><b>Fair</b><small>book ± expectations</small></div></div>", "s": "And one share can have three values. Par value, chosen by the founders. Book value, equity divided by the number of shares. And fair value: book value plus or minus the market's expectations."}]}, {"id": "v3", "u": 4, "title": "Who runs the company? GM vs directors", "scenes": [{"v": "<div class=\"dia vs\"><div><h5>General meeting</h5>members decide</div><div><h5>Directors</h5>manage & represent</div></div>", "s": "Every capital company has two bodies. The general meeting, where members form their will. And the managing body, the directors, who manage the company and represent it to the outside world. Members cannot sign for the company."}, {"v": "<div class=\"sv-t\">Art. 160 LSC</div><div class=\"sv-s\">accounts · directors · by-laws · capital · core assets &gt;25% · mergers · dissolution</div>", "s": "The general meeting decides only what article one-sixty lists: accounts, appointing and removing directors, by-law changes, capital increases and reductions, selling core assets above twenty-five percent of total assets, mergers and dissolution."}, {"v": "<div class=\"dia flow\"><span>Convene<small>1 month S.A. · 15 days S.L.</small></span><span>Quorum<small>S.A. only</small></span><span>Vote</span></div>", "s": "Directors convene the meeting: one month ahead in an S.A., fifteen days in an S.L. Only the S.A. needs a quorum to constitute it. If all the capital is present and everyone agrees, a universal meeting needs no notice at all."}, {"v": "<div class=\"dia four\"><div><h5>Sole</h5></div><div><h5>Joint & several</h5>each alone</div><div><h5>Joint</h5>together · S.A. max 2</div><div><h5>Board</h5>3–12 (S.L.)</div></div>", "s": "Directors can be organised four ways. A sole director. Joint and several directors, where each can act alone. Joint directors, who must act together, with a maximum of two in an S.A. Or a board, minimum three members, maximum twelve in an S.L."}, {"v": "<div class=\"sv-t\">Term</div><div class=\"sv-s\">S.A. max 6 years · S.L. may be indefinite</div>", "s": "Last detail: in an S.A. directors serve at most six years, re-electable. In an S.L. their term can be indefinite. And the general meeting can remove them at any time."}]}, {"id": "v4", "u": 5, "title": "When are directors personally liable?", "scenes": [{"v": "<div class=\"dia steps\"><div><b>Law</b></div><div><b>GM & by-laws</b></div><div><b>Care</b><small>orderly entrepreneur</small></div><div><b>Loyalty</b><small>faithful representative</small></div></div>", "s": "Directors must act within the law, the by-laws and the meeting's instructions, with two duties: care, the diligence of an orderly entrepreneur; and loyalty, acting like a faithful representative in the company's best interest."}, {"v": "<div class=\"dia check\"><div>✔ Good faith</div><div>✔ No personal interest</div><div>✔ Sufficient information</div><div>✔ Adequate procedure</div></div>", "s": "A bad result alone doesn't make a director liable. The business judgment rule says: if you decided in good faith, without personal interest, with enough information and a proper procedure, you met the standard."}, {"v": "<div class=\"dia vs\"><div><h5>Debts</h5>insolvency not filed (2 months) · GM not convened when equity &lt; ½</div><div><h5>Damages</h5>fault + damage + causal link</div></div>", "s": "Liability comes in two kinds. Liability for debts, in a crisis: if directors don't file for insolvency within two months, or don't convene the meeting when equity falls below half the capital, they pay the debts that arise afterwards. And liability for damages: fault, damage and a causal link."}, {"v": "<div class=\"sv-rule\">GM approval ✘ excuse</div>", "s": "Two traps. Approval by the general meeting never exonerates a director. And a hidden boss giving orders to someone who only acts as director on paper is a de facto director, liable just the same."}, {"v": "<div class=\"dia vs\"><div><h5>Corporate action</h5>company → 5% → creditors</div><div><h5>Individual action</h5>member / third party directly harmed</div></div>", "s": "Who sues? If the company was harmed: first the company, then members with five percent, then creditors. If a member or third party was harmed directly: the individual action. Board members who opposed the decision can escape liability, but they must prove it."}]}, {"id": "v5", "u": 6, "title": "Capital increase with a share premium", "scenes": [{"v": "<div class=\"sv-big\">€</div><div class=\"sv-t\">€100,000 for 10%</div>", "s": "A business angel offers Patinetes Eléctricos one hundred thousand euros for ten percent. The company has ninety thousand stakes of one euro each. How do we do the numbers?"}, {"v": "<div class=\"dia calc\"><div>Post-money = 100,000 ÷ 10% = <b>1,000,000</b></div><div>Pre-money = <b>900,000</b></div><div>Per stake = 900,000 ÷ 90,000 = <b>€10</b></div></div>", "s": "If ten percent is worth one hundred thousand, the whole company after the deal is worth one million. So before the deal it's worth nine hundred thousand: ten euros per existing stake."}, {"v": "<div class=\"dia calc\"><div>N ÷ (90,000 + N) = 10%</div><div><b>N = 10,000</b> new stakes</div><div>€1 capital + <b>€9 premium</b></div></div>", "s": "To get ten percent, the angel needs ten thousand new stakes. Each costs ten euros: one euro of capital and nine euros of share premium. Capital rises by ten thousand; the premium totals ninety thousand."}, {"v": "<div class=\"sv-t\">Why the premium?</div><div class=\"sv-s\">Old members keep their value</div>", "s": "Why the premium? Without it, the angel would pay one euro for something worth ten, and the founders' value would be diluted. The premium makes newcomers pay for the reserves and expectations already built."}, {"v": "<table class=\"tbl\"><tr><th>Type</th><th>Equity</th></tr><tr><td>Cash</td><td>↑</td></tr><tr><td>Non-cash</td><td>↑</td></tr><tr><td>Offset loans</td><td>↑</td></tr><tr><td>Reserves</td><td>=</td></tr></table>", "s": "Remember the four types of increase: cash, non-cash, offsetting loans, and reserves. All increase equity except reserves, which are only a reclassification. And in cash increases, old members have a pre-emptive right for at least one month."}]}, {"id": "v5r", "u": 6, "title": "Capital reduction & the 2/3 rule", "scenes": [{"v": "<div class=\"sv-big\">↓</div><div class=\"sv-t\">Capital reduction</div><div class=\"sv-s\">Usually no money moves</div>", "s": "Reducing capital sounds like the company is losing money. But in most cases, not a single euro moves. To see why, you need to know what capital really is."}, {"v": "<table class=\"tbl\"><tr><th>What the company has</th><th>Where it came from</th></tr><tr><td>Cash, machines, buildings</td><td>Debts<br>Equity = capital + reserves − losses</td></tr></table>", "s": "A balance sheet has two sides. On the left, what the company owns: cash, machines, buildings. On the right, where it came from: debts and equity. Capital is just a number on the right side. The real money is on the left. So reducing capital means changing a number, not taking money out."}, {"v": "<table class=\"tbl\"><tr><th>Purpose</th><th>Money leaves?</th><th>Equity</th></tr><tr><td>Restore balance after losses</td><td>No</td><td>=</td></tr><tr><td>Create reserves</td><td>No</td><td>=</td></tr><tr><td>Refund contributions</td><td>Yes</td><td>↓</td></tr><tr><td>Release called-up capital (S.A.)</td><td>No cash, claim cancelled</td><td>↓</td></tr></table>", "s": "There are four purposes. One: wipe out losses so capital matches reality again. Two: move part of the capital into reserves. In both cases nothing leaves the company and equity stays the same. Three: refund contributions to members, paid from the company's bank account. Four, only in an S.A.: members no longer have to pay the rest of their shares. Only in three and four does equity really fall."}, {"v": "<div class=\"dia calc\"><div>Capital 100,000 − losses 50,000 = equity <b>50,000</b></div><div>50,000 ÷ 100,000 = <b>50% &lt; 2/3</b> ✘</div><div>Reduce capital by 30,000 against losses</div><div>Capital 70,000 − losses 20,000 = equity <b>50,000</b></div><div>50,000 ÷ 70,000 = <b>71% &gt; 2/3</b> ✔</div></div>", "s": "The annex example. An S.A. has one hundred thousand capital and fifty thousand losses, so equity is fifty thousand: only half the capital. If equity stays below two thirds of capital for a whole financial year, the S.A. must reduce capital. So it reduces capital by thirty thousand against the losses. Capital becomes seventy thousand, losses twenty thousand, and equity is still fifty thousand. But now that's seventy-one percent of capital, above two thirds. It's just a book entry: capital down, losses down, no bank transfer."}, {"v": "<div class=\"dia steps\"><div><b>How</b><small>lower par value · redeem · group shares</small></div><div><b>Who</b><small>GM, like any by-law amendment</small></div><div><b>Creditors (S.A.)</b><small>can oppose within 1 month – only if money leaves</small></div><div><b>Accordion</b><small>reduce to absorb losses + increase at the same time</small></div></div>", "s": "How is it done? By lowering the par value, redeeming shares, or grouping them. The general meeting decides, like any by-law amendment. In an S.A., creditors can oppose within one month, but only when money really leaves, like a refund, not when losses are just wiped out. And the accordion: reduce capital, even below the legal minimum, to absorb losses, and increase it again at the same time, often with new investors."}]}, {"id": "v6", "u": 7, "title": "Mergers & divisions in 90 seconds", "scenes": [{"v": "<div class=\"dia merge\"><div><h5>Creation</h5><span class=\"co\">A</span>+<span class=\"co\">B</span>→<span class=\"co new\">NEW</span></div><div><h5>Absorption</h5><span class=\"co\">A</span>+<span class=\"co\">B</span>→<span class=\"co new\">A</span></div></div>", "s": "A merger joins companies. By creation: A and B both disappear into a new company. By absorption: A swallows B, and B disappears. Members of the disappearing companies receive shares according to the exchange ratio, calculated at fair value."}, {"v": "<div class=\"dia steps\"><div><b>Prepare</b><small>common draft, 1 month before GM</small></div><div><b>Approve</b><small>each GM within 6 months</small></div><div><b>Execute</b><small>1-month creditor period · deed · registry</small></div></div>", "s": "Three phases. Preparation: the directors write a common draft, published at least one month before the meetings. Approval: each general meeting approves it within six months. Execution: after a one-month creditor opposition period, a public deed, and registration. The merger is effective on registration."}, {"v": "<div class=\"dia divs\"><div><h5>Total</h5>company dies · members get shares</div><div><h5>Partial</h5>company lives · members get shares</div><div><h5>Segregation</h5>company lives · <b>company</b> gets shares</div></div>", "s": "Divisions go the other way. In a total demerger the company dies and its members receive shares of the beneficiaries. In a partial demerger the company survives with less capital, and the members get the shares. In a segregation, the company itself gets the shares, becoming a parent."}, {"v": "<div class=\"dia flow\"><span>Dissolution</span><span>Liquidation</span><span>Extinction</span></div>", "s": "And to end a company: dissolution, liquidation, extinction. The company keeps its legal personality during liquidation, liquidators replace the directors, creditors are paid first, and personality only ends when the entries are cancelled in the registry."}]}];
const WEAK = [{"k": "interp", "u": 1, "t": "Purposive interpretation (art. 3.1 CC)", "x": "Read a rule by its words, context, history and today's social reality, but <b>above all by its spirit and purpose</b>: why did the legislator make it? Use it when the words don't settle the case (gap, two meanings, absurd result). <i>Example: \"No vehicles in the park\" → an ambulance may enter (purpose = safety), an e-scooter may not.</i>", "cards": ["bl-u1-purposive", "bl-u1-art3cc"]}, {"k": "rdl", "u": 1, "t": "Royal Decree-Law vs Royal Legislative Decree", "x": "Both are made by the <b>Government</b> and have the <b>status of an act</b>. <b>Decree-Law</b> = Government acts alone because of <b>extraordinary and urgent need</b>; Congress must validate it within <b>30 days</b>. <b>Legislative Decree</b> = <b>Parliament delegates</b> first (framework law → <i>texto articulado</i>, or consolidation → <i>texto refundido</i>). The LSC is RLD 1/2010. Germany has no real equivalent (Weimar experience).", "cards": ["bl-u1-rdl", "bl-u1-pyramid"]}, {"k": "general", "u": 1, "t": "Generality & coercibility", "x": "<b>Generality</b>: the rule targets a <b>category</b> (all S.A.s), not one named person (a decree appointing Mr. García = not a legal rule). <b>Coercibility</b>: the <b>state</b> (courts) can force you to comply. \"Good morning\" in class is a <b>social norm</b>: only people judge you, no court can force you.", "cards": ["bl-u1-two-characters", "bl-u1-generality", "bl-u1-coercibility"]}, {"k": "treaty", "u": 1, "t": "International treaties (arts. 95–96 CE)", "x": "Once published in Spain, treaties are part of Spanish law: <b>above acts</b> (a later act can't change them) but <b>below the Constitution</b>. If a treaty contradicts the Constitution, the <b>Constitution must be amended first</b> (art. 95). The Constitutional Court can check this <b>before</b> ratification (Maastricht 1992 → art. 13.2 amended).", "cards": ["bl-u1-treaties", "bl-u1-pyramid"]}, {"k": "art2", "u": 2, "t": "Order for acts of commerce (art. 2 CCom)", "x": "1. <b>Commerce Code</b> + special commercial laws → 2. <b>business usage of each place</b> → 3. <b>civil law</b>. Usage comes <b>before</b> the Civil Code (in civil law, custom comes after written law). Applies whether or not the person is a merchant. Exception: for <b>contracts</b>, art. 50 CCom sends you to civil law directly.", "cards": ["bl-u2-art2ccom", "bl-u2-art50ccom"]}, {"k": "gp", "u": 2, "t": "General partnership", "x": "Partners are liable <b>personally</b> (own assets), <b>unlimitedly</b> (no cap), <b>subsidiarily</b> (company assets first) and <b>jointly & severally</b> (creditor can claim the whole rest from any one partner). Based on trust → <b>no transfer without the others' consent</b> (art. 143). Name: partners' names (+ \"y Cía.\") + S.C./S.R.C.; a <b>non-partner whose name appears is liable as a partner</b> (art. 126).", "cards": ["bl-u2-gp", "bl-u2-subsidiary"]}, {"k": "person", "u": 2, "t": "Effects of legal personality", "x": "Once incorporated, the company 1. <b>has its own rights and obligations</b>, 2. <b>is itself the entrepreneur</b>, 3. <b>owns its own assets</b>, separate from the members. That's the basis for separate liability – but whether members are <b>also</b> liable depends on the company type (S.L./S.A.: no; general partnership: yes).", "cards": ["bl-u2-personality-effects", "bl-u2-art116"]}, {"k": "office", "u": 3, "t": "Registered office", "x": "Must be <b>in Spain</b>, at a concrete address where the company is <b>actually run</b> or has its <b>main establishment</b>. It decides which Registry and which courts. If it doesn't match reality, <b>third parties may rely on either</b>. Moving within Spain: <b>directors</b> (unless by-laws say otherwise); abroad: <b>GM</b> (structural change).", "cards": ["bl-u3-office", "bl-u6-office-change"]}, {"k": "sasl", "u": 3, "t": "S.A. vs S.L.: transfer, attendance, votes", "x": "<b>Attendance</b> = right to attend the <b>general meeting</b>. S.L.: every member, can't be restricted. S.A.: by-laws may require a minimum number of shares (max <b>1/1000</b> of capital). Shares (S.A.) = negotiable securities, freely transferable; stakes (S.L.) = not securities, transfer restricted. Votes: S.A. by nominal value; S.L. one per stake (unless by-laws).", "cards": ["bl-u3-annex-table", "bl-u3-votes"]}, {"k": "defaults", "u": 3, "t": "By-law defaults", "x": "If the by-laws are silent, the <b>LSC fills the gap</b> (dispositive rules): <b>duration unlimited</b>, operations start on the <b>date of the deed</b>, financial year ends <b>31 December</b>. Missing these does <b>not</b> make the by-laws invalid. A fixed term that expires = cause of dissolution.", "cards": ["bl-u3-defaults"]}, {"k": "damages", "u": 5, "t": "Liability for damages (art. 236) & causal link", "x": "Three requirements: 1. <b>unlawful act/omission</b> with fault, 2. <b>damage</b>, 3. <b>causal link</b> = the damage must <b>come from that act</b> (without the act, would it have happened anyway?). Fault is <b>presumed</b> if the act is against law/by-laws; damage and causal link must still be proven.", "cards": ["bl-u5-art236", "bl-u5-gm-ratify"]}, {"k": "orderly", "u": 5, "t": "\"Orderly entrepreneur\" – two perspectives", "x": "Two angles of the duty of care: <b>prudence</b> (did you decide carefully, after analysis, without unreasonable risk?) and <b>professional competence</b> (do you have the know-how the job needs? A bank's directors need more than a bakery's).", "cards": ["bl-u5-orderly", "bl-u5-care-five", "bl-u5-care"]}, {"k": "indiv", "u": 5, "t": "Individual liability action", "x": "For a <b>member or third party</b> damaged <b>directly in their own assets</b> by a director <b>acting as director</b> (\"in office\" – not as a private person). Needs unlawful act + direct damage + causal link. Corporate action = the <b>company</b> was damaged.", "cards": ["bl-u5-ind-action", "bl-u5-actions"]}, {"k": "offset", "u": 6, "t": "Capital increase by offsetting loans", "x": "A loan is <b>turned into shares</b>: the company's debt and the lender's payment for the new shares cancel out. Debt ↓, capital & equity ↑, <b>no new cash</b>. Loans must be <b>liquid</b> (fixed amount), <b>mature</b> (due date reached) and <b>payable</b>: S.L. 100%; S.A. ≥ 25% + rest due within 5 years + auditor's certificate.", "cards": ["bl-u6-inc-loans", "bl-u6-inc-types"]}, {"k": "deleg", "u": 6, "t": "Delegating a capital increase (art. 297)", "x": "The GM decides, but in an S.A. it may delegate: a) directors only <b>carry out</b> an increase the GM approved → within <b>1 year</b>; b) <b>authorised capital</b>: directors decide themselves → max <b>50% of capital</b>, <b>cash only</b>, within <b>5 years</b>.", "cards": ["bl-u6-inc-who"]}, {"k": "reduct", "u": 6, "t": "Capital reduction – does money move?", "x": "Capital is a <b>number</b> on the right side of the balance sheet, not a pot of money. Reduction to <b>compensate losses</b> or <b>create reserves</b>: just a book entry, equity unchanged. <b>Refund</b> of contributions: cash leaves, equity ↓. <b>Release of called-up capital</b> (S.A.): claim cancelled, equity ↓. Creditors (S.A.) can oppose only when assets leave.", "cards": ["bl-u6-red-purposes", "bl-u6-creditor-opp", "bl-u6-red-ways"]}, {"k": "twothirds", "u": 6, "t": "The 2/3 rule & the annex example", "x": "S.A.: equity &lt; <b>2/3</b> of capital, not recovered within one financial year → <b>mandatory reduction</b>. Annex: capital 100,000 − losses 50,000 = equity 50,000 (50%). Reduce capital by 30,000 against losses → capital <b>70,000</b>, losses <b>20,000</b> (50,000 − 30,000), equity still <b>50,000 = 71%</b> ✔. Below <b>1/2</b> = cause of dissolution.", "cards": ["bl-u6-red-annex", "bl-u6-red-mandatory", "bl-u6-accordion"]}, {"k": "mreasons", "u": 7, "t": "Economic reasons for mergers", "x": "<b>Synergies</b> (together worth more), <b>economies of scale</b> (bigger volume → lower cost per unit), <b>vertical integration</b> (merge with supplier/customer), <b>optimised financing</b> (cheaper loans), <b>growth in size</b> (market share).", "cards": ["bl-u7-merger-why", "bl-u7-merger-types"]}];
const MOCKS = [{"id": "mockA", "title": "Mock exam A", "qs": ["b102", "b104", "xa1", "b213", "b219", "xa2", "b305", "b312", "xa3", "b406", "b408", "b413", "b501", "b508", "xa4", "b604", "b618", "xa5", "b707", "xa6"], "case": {"title": "Mesa Verde – from partnership to S.L.", "units": "Units 2–4", "facts": "Laura and Jordi run a vegetarian restaurant as a <b>general partnership</b> called <b>\"Puig, Soler y Cía., S.R.C.\"</b>. Laura Puig and Jordi are partners; <b>Marc Soler</b>, a friend, is <b>not</b> a partner but agreed to have his name in the firm name. The partnership owes a supplier <b>€80,000</b> and has only <b>€20,000</b> in assets.<br>They now want to start a new restaurant through an <b>S.L.</b>: Jordi will contribute his <b>kitchen equipment</b>, Laura cash. They both want to be able to <b>sign contracts alone</b>. An investor, Núria, will take a <b>2%</b> stake and wants to attend all general meetings.", "qs": [{"q": "1. Who can the supplier claim the €80,000 from, and how much from whom? What about Marc?", "a": "First the <b>partnership's assets</b> (€20,000) – liability is <b>subsidiary</b>. For the remaining <b>€60,000</b> the supplier can claim the <b>whole amount from any one partner</b> (personal, unlimited, joint & several); that partner then claims the others' shares internally. <b>Marc</b> is not a partner, but because he allowed his name in the firm name he is <b>liable as if he were a partner</b> (art. 126 CCom) – third parties rely on the name.", "keys": ["Company assets first (subsidiary)", "€60,000 from any one partner (joint & several)", "Personal and unlimited liability", "Internal claim between partners", "Marc liable as a partner (art. 126 CCom)"]}, {"q": "2. How do they set up the S.L.? Minimum capital, payment, and what about Jordi's equipment?", "a": "Name certificate → bank certificate for the cash → <b>deed with by-laws before a notary</b> → <b>Mercantile Registry</b> (legal personality on registration; register within 1 year or it becomes an irregular company). Minimum capital <b>€3,000</b> (notes), <b>fully subscribed and paid up</b>. Equipment = <b>non-cash contribution</b>: allowed, <b>no expert report</b> in an S.L., but the contributors are <b>liable for its real value</b>.", "keys": ["Deed + by-laws before a notary", "Registration → legal personality", "€3,000, 100% paid up", "Non-cash allowed, no expert report in S.L.", "Contributor liable for the value"]}, {"q": "3. Which management model lets both sign alone? Can the by-laws stop Núria (2%) from attending GMs?", "a": "<b>Joint and several directors</b> (administradores solidarios): each can act alone with full powers (art. 210 LSC). Changing the model later → public deed + Registry. Núria: in an <b>S.L.</b> every member can attend, <b>attendance can't be restricted</b> (only an S.A. may require up to 1/1000 of capital). She votes with <b>one vote per stake</b>, unless the by-laws say otherwise.", "keys": ["Joint & several directors – each acts alone", "Art. 210 LSC models", "S.L.: attendance can't be restricted", "(S.A. could require max 1/1000)", "One vote per stake"]}]}}, {"id": "mockB", "title": "Mock exam B", "qs": ["b108", "b111", "xb1", "b202", "b220", "xb2", "b304", "b309", "xb3", "b411", "b416", "xb4", "b507", "b513", "xb5", "b615", "b616", "xb6", "b702", "b704"], "case": {"title": "Clínica Sonrisa S.A. – directors' liability", "units": "Units 4–5", "facts": "<b>Clínica Sonrisa S.A.</b> (capital <b>€100,000</b>) is run by sole director <b>Carlos</b>. In March, Carlos buys dental equipment for the company from his <b>brother's company</b> at <b>twice the market price</b>; the GM later approves the purchase. Since June, losses have reduced equity to <b>€40,000</b>; Carlos hasn't convened any meeting. In September, to get materials on credit, Carlos tells a supplier that the clinic \"has never been healthier\"; the supplier is never paid.", "qs": [{"q": "1. Which duty did Carlos breach with the equipment purchase? Does the GM's approval protect him? Who can sue?", "a": "<b>Duty of loyalty</b> (arts. 227–228): conflict of interest with a related person – he had to <b>abstain</b> and put the company's interest first. <b>GM approval never exonerates</b> (art. 236.2). Liability for damages: unlawful act + damage (overpayment) + causal link; fault presumed as it breaches the law. <b>Corporate action</b>: the company (GM) → members with <b>5%</b> → creditors.", "keys": ["Duty of loyalty / conflict of interest", "Should have abstained", "GM approval doesn't exonerate", "Act + damage + causal link", "Corporate action: company → 5% → creditors"]}, {"q": "2. What is the legal situation with equity of €40,000? What must Carlos do, and what if he doesn't?", "a": "Equity €40,000 &lt; ½ of €100,000 → <b>legal cause of dissolution</b> (art. 363.1.e). Carlos must <b>convene the GM within 2 months</b> to dissolve or restore the balance (capital increase/reduction); if the GM doesn't agree → request <b>judicial dissolution</b>. Otherwise he is <b>liable for company debts arising after the cause</b> (subsidiary, joint & several). (Also below ⅔ → mandatory reduction if not recovered in a year.)", "keys": ["< ½ capital = cause of dissolution", "Convene GM within 2 months", "Options: dissolve / increase / reduce", "Else judicial dissolution", "Liable for later debts"]}, {"q": "3. What can the unpaid supplier do against Carlos personally?", "a": "<b>Individual liability action</b> (art. 241): the supplier suffered <b>direct damage</b> to its own assets, caused by Carlos <b>acting as director</b> (an unlawful, misleading statement), with a <b>causal link</b>. Possibly also liability for debts arising after the dissolution cause (the debt arose in September).", "keys": ["Individual action (art. 241)", "Direct damage to supplier", "Act as director in office", "Causal link", "Also: debts after dissolution cause"]}]}}, {"id": "mockC", "title": "Mock exam C", "qs": ["b112", "b113", "xc1", "b203", "b207", "xc2", "b311", "b318", "xc3", "b401", "b403", "b412", "b503", "b518", "xc4", "b617", "xc5", "xc6", "b709", "b714"], "case": {"title": "TecnoBici S.L. – bringing in an investor", "units": "Unit 6", "facts": "<b>TecnoBici S.L.</b> has capital of <b>€60,000</b> in <b>60,000 stakes of €1</b>, held 50/50 by founders Ana and Pau. An investor offers <b>€150,000 for 20%</b> of the company after the deal. Pau has also lent the company <b>€20,000</b>, already due, and wants to turn it into stakes.", "qs": [{"q": "1. Calculate the post-money and pre-money value, the value per existing stake, the number of new stakes and the share premium.", "a": "Post-money = 150,000 ÷ 20% = <b>€750,000</b> → pre-money <b>€600,000</b> → per stake 600,000 ÷ 60,000 = <b>€10</b>. New stakes N: N ÷ (60,000 + N) = 20% → <b>N = 15,000</b>. Each costs €10 = €1 capital + <b>€9 premium</b> → capital +€15,000 (new capital <b>€75,000</b>), premium <b>€135,000</b>.", "keys": ["Post-money €750,000", "Pre-money €600,000 / €10 per stake", "15,000 new stakes", "€9 premium per stake (€135,000)", "New capital €75,000"]}, {"q": "2. Do Ana and Pau have a pre-emptive right? How can the investor still enter?", "a": "Yes – in a <b>cash</b> increase existing members have a <b>pre-emptive right</b> in proportion to their stakes, for at least <b>one month</b>. For the investor to get all new stakes, Ana and Pau <b>waive it individually</b>, or the GM <b>excludes</b> it (with legal requirements; in an S.L. by 2/3 of votes). The <b>premium</b> protects them from value dilution.", "keys": ["Pre-emptive right in cash increases", "Period ≥ 1 month", "Individual waiver or GM exclusion", "Premium avoids value dilution"]}, {"q": "3. Can Pau's €20,000 loan become stakes? Effects and requirements?", "a": "Yes – capital increase by <b>offsetting loans</b> (debt-to-equity swap). Effects: <b>debt ↓, capital and equity ↑, no new cash</b>. In an <b>S.L.</b> the loan must be <b>100% liquid, mature and payable</b> (art. 301) – it is (fixed amount  (opposition only for refunds / release of called-up capital). €40,000 is <b>below the S.A. minimum (€60,000)</b> → only as an <b>accordion</b>: simultaneous increase to ≥ €60,000, reduction conditional on it, pre-emptive right respected, registered together (art. 343) – or <b>transform into an S.L.</b>", "keys": ["No opposition for loss compensation", "Opposition only when assets leave", "€40,000 < €60,000 minimum", "Accordion: reduce + increase together", "Alternative: transform into S.L."]}]}}, {"id": "mockE", "title": "Mock exam E", "qs": ["n05", "b106", "b107", "n16", "b215", "b211", "n19", "b303", "b308", "n30", "b405", "b410", "n45", "b510", "b512", "n50", "b601", "b602", "n63", "b716"], "case": {"title": "Grupo Olivo – two mergers", "units": "Unit 7", "facts": "<b>Aceites Olivo S.A.</b> owns <b>100%</b> of <b>Envases Olivo S.L.</b> and wants to absorb it. It also wants to absorb an independent company, <b>Molinos Sur S.L.</b> The fair value of an Aceites share is <b>€40</b>; of a Molinos stake <b>€10</b>.", "qs": [{"q": "1. What type of merger is the absorption of Envases Olivo, and which requirements can be skipped?", "a": "<b>Merger by absorption of a wholly-owned subsidiary</b> – a <b>special (simplified) merger</b> (art. 53 RDLME). Skipped: <b>exchange ratio</b> (no new shares – the parent already owns everything), <b>capital increase</b> of the absorbing company, <b>directors' and independent expert reports</b>, and <b>approval by the GM of the absorbed</b> company.", "keys": ["Absorption of 100% subsidiary = special merger", "No exchange ratio", "No capital increase", "No expert/directors' reports", "No GM of the absorbed"]}, {"q": "2. Absorbing Molinos Sur: what do its members receive? Which reports are needed?", "a": "Molinos members become Aceites shareholders according to the <b>exchange ratio at fair value</b>: 10 ÷ 40 → <b>1 Aceites share per 4 Molinos stakes</b>. Aceites <b>increases its capital</b>; Molinos is <b>extinguished without liquidation</b> (universal succession). Since an <b>S.A.</b> participates, an <b>independent expert report</b> on the draft is needed, plus the directors' report.", "keys": ["Exchange ratio at fair value", "1 share per 4 stakes", "Absorbing company increases capital", "Molinos extinguished, no liquidation", "Expert report (S.A. involved)"]}, {"q": "3. Describe the procedure. When is the merger effective, and until when can it be challenged?", "a": "<b>Preparation</b>: common draft terms, published ≥ 1 month before the GMs. <b>Approval</b>: GM of each company within <b>6 months</b> of the draft, merger balance sheet ≤ 6 months old. <b>Execution</b>: publication, <b>1-month creditor opposition</b>, public deed, <b>registration = legal effect</b>. After registration it can only be challenged for breach of the RDLME within <b>3 months</b>.", "keys": ["Draft → approval → execution", "GMs within 6 months", "1-month creditor opposition", "Effective on registration", "Challenge within 3 months"]}]}}, {"id": "mockF", "title": "Mock exam F", "qs": ["n07", "n01", "b101", "n14", "n11", "b216", "n20", "n22", "b310", "n29", "n36", "b407", "n44", "n43", "b514", "n53", "n48", "b603", "n55", "b717"], "case": {"title": "Ferretería Ruiz & Pixel Duo S.L. – mixed", "units": "Units 1–2, 7", "facts": "<b>Pablo, 17</b>, inherits his late father's hardware shop. A customer, a construction company, disputes a <b>commercial sale</b>: the Commerce Code says nothing on how quickly goods must be checked, but there is a <b>clear local trade usage</b> that differs from the Civil Code. Separately, <b>Pixel Duo S.L.</b> is owned <b>50/50</b> by two members who have <b>blocked every GM decision for a year</b>.", "qs": [{"q": "1. Can Pablo be an entrepreneur and continue the shop?", "a": "Normally an individual entrepreneur needs <b>legal age (18) and free disposal of assets</b> (art. 4 CCom) = capacity to operate. Pablo has legal capacity but not capacity to operate. <b>Exception</b>: a minor may <b>continue the business of his parents</b> (inheritance) acting through his <b>legal representatives</b>.", "keys": ["Art. 4 CCom: 18 + free disposal", "Legal capacity vs capacity to operate", "Exception: continuing parents' business", "Acts through legal representatives"]}, {"q": "2. Which rules decide the dispute, in which order?", "a": "Art. 2 CCom: 1. <b>Commerce Code</b> (and special laws) → 2. <b>business usage of the place</b> → 3. <b>civil law</b>. The CCom is silent, so the <b>local trade usage</b> applies before the Civil Code – in commerce, usage beats written civil law. (Note art. 50 CCom: for contract requirements/modification, civil law applies directly.)", "keys": ["Art. 2 CCom order", "CCom → usage → civil law", "Usage applies here", "Mention art. 50 limit"]}, {"q": "3. What is Pixel Duo's legal situation and what happens next?", "a": "A 50/50 deadlock = <b>paralysis of the corporate bodies</b> → <b>legal cause of dissolution</b> (art. 363). Directors must <b>convene the GM within 2 months</b>; if it doesn't agree → <b>judicial dissolution</b>, or directors become liable for later debts. Then <b>liquidation</b> (liquidators replace directors, inventory in 3 months, pay creditors, distribute rest; personality continues) → <b>extinction</b> on cancellation of entries. Prevention: deadlock clause in a shareholders' agreement.", "keys": ["Paralysis = cause of dissolution", "GM within 2 months / judicial", "Directors liable if they don't act", "Liquidation then extinction", "Prevent with deadlock clause"]}]}}];

     <div class="row" style="font-size:12.5px;color:var(--muted);margin-top:6px;gap:14px"><span>${sel.length} cards selected</span><span>unseen ${lv[0]}</span><span style="color:var(--bad)">learning ${lv[1]}</span><span style="color:var(--warn)">mastered ${lv[2]}</span><span style="color:var(--good)">solid ${lv[3]}</span></div></div>

function startCards(){
  let pool=CARDS.filter(c=>cardSel.has(c.unit_no));
  if(cardMode==="star") pool=pool.filter(c=>S.cards[c.id]&&S.cards[c.id].star);
  if(cardMode==="weak"){const W=new Set((cardOnly||WEAK.flatMap(w=>w.cards)));pool=CARDS.filter(c=>W.has(c.id));cardOnly=null;}
  if(cardMode==="numbers") pool=pool.filter(c=>c.tags.includes("numbers"));
  if(cardMode==="trap") pool=pool.filter(c=>c.tags.includes("trap")||c.tags.includes("mock"));
  if(cardMode==="new") pool=pool.filter(c=>cardLvl(c.id)<0);
  if(!pool.length){ M().querySelector(".panel").insertAdjacentHTML("beforeend",`<p class="tip">No cards match this selection.</p>`); return; }
  if(cardMode==="smart"){ pool=shuffle(pool).sort((a,b)=>{const la=cardLvl(a.id),lb=cardLvl(b.id); const ka=la<0?1.5:la, kb=lb<0?1.5:lb; return ka-kb;}); }
  else pool=shuffle(pool);
  if(cardSize) pool=pool.slice(0,cardSize);
  sess={q:pool.slice(),done:0,total:pool.length,stats:{again:0,hard:0,good:0,easy:0},flipped:false,seen2:new Set()};
  renderCard();
}
function renderCard(){
  if(!sess) return;
  if(!sess.q.length){ return cardSummary(); }
  const c=sess.q[0], st=S.cards[c.id]||{}, lvl=cardLvl(c.id);
  const lvlTxt=lvl<0?"new":lvl<2?"learning":lvl<4?"mastered":"solid";
  M().innerHTML=`<section class="view"><div class="fc-wrap">
    <div class="row" style="width:100%;max-width:720px;justify-content:space-between"><button class="btn sm ghost" id="quit">← End session</button><span class="muted" style="font-size:13px">${sess.done}/${sess.total} done · ${sess.q.length} left</span></div>
    <div class="bar" style="width:100%;max-width:720px"><i style="width:${pct(sess.done,sess.total)}%"></i></div>
    <article class="fc" style="--c:${ucol(c.unit_no)}">
      <div class="meta"><span><span class="dot" style="display:inline-block;--c:${ucol(c.unit_no)}"></span> ${c.unit_no===10?"Cases":"Unit "+c.unit_no} · ${esc(c.section)}</span><span>${lvlTxt} <button class="star" id="star" aria-pressed="${!!st.star}" aria-label="Star card">★</button></span></div>
      <div class="front">${md(c.front)}</div>
      <div id="backarea">${sess.flipped?`<div class="back">${md(c.back)}${c.explain?`<div class="explain"><b>Explain · </b>${md(c.explain)}</div>`:""}</div>`:""}</div>
    </article>
    ${sess.flipped?`<div class="rate"><button class="r-again" data-r="again">Again<small>1 · soon</small></button><button class="r-hard" data-r="hard">Hard<small>2 · later</small></button><button class="r-good" data-r="good">Good<small>3 · level up</small></button><button class="r-easy" data-r="easy">Easy<small>4 · +2</small></button></div>`
    :`<button class="flip" id="flip">Show answer <span class="kbd" style="color:inherit;border-color:currentColor">space</span></button>`}
  </div></section>`;
  $("#quit").onclick=()=>{sess=null;VIEWS.cards()};
  $("#star").onclick=()=>{const s=S.cards[c.id]||(S.cards[c.id]={l:-1});s.star=!s.star;save();$("#star").setAttribute("aria-pressed",!!s.star)};
  if(!sess.flipped) $("#flip").onclick=()=>{sess.flipped=true;renderCard()};
  else M().querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>rate(b.dataset.r));
}
function rate(r){
  const c=sess.q.shift(); const s=S.cards[c.id]||(S.cards[c.id]={l:-1});
  const l=Math.max(0,s.l); s.seen=(s.seen||0)+1; s.ts=Date.now(); sess.stats[r]++;
  const back=n=>sess.q.splice(Math.min(n,sess.q.length),0,c);
  if(r==="again"){ s.l=0; back(3); }
  else if(r==="hard"){ if(l>=2){ s.l=l-1; sess.done++; } else { s.l=1; back(8); } }
  else if(r==="good"){ s.l=Math.min(5,(s.l<0?0:l)+1); if(s.l<2&&!sess.seen2.has(c.id)){ sess.seen2.add(c.id); back(10);} else sess.done++; }
  else { s.l=Math.min(5,Math.max(2,l+2)); sess.done++; }
  save(); sess.flipped=false; renderCard();
}
function cardSummary(){
  const st=sess.stats; sess=null;
  M().innerHTML=`<section class="view"><div class="panel" style="text-align:center;display:grid;gap:12px;justify-items:center"><div class="eyebrow">Session complete</div><div class="score">${st.good+st.easy}<small style="font-size:20px"> good / easy</small></div>

}

function startNum(){ const items=shuffle(NUMBERS).slice(0,15).map(n=>{const others=shuffle(NUMBERS.filter(x=>x[1]!==n[1])).slice(0,3).map(x=>x[1]); return {n,opts:shuffle([n[1],...others])}}); dr={type:"num",items,i:0,ok:0,ans:null,streak:0,best:0}; renderNum(); }
function renderNum(){
  if(dr.i>=dr.items.length){ M().innerHTML=`<section class="view"><div class="panel" style="text-align:center;display:grid;gap:12px;justify-items:center"><div class="eyebrow">Numbers sprint</div><div class="score">${dr.ok}/15</div><small>best streak ${dr.best}</small><div class="row"><button class="btn primary" id="again">Another sprint</button><button class="btn" id="menu">All drills</button><button class="btn" id="tbl">See all numbers</button></div></div></section>`; $("#again").onclick=startNum; $("#menu").onclick=VIEWS.drills; $("#tbl").onclick=()=>go("sheet","numbers"); return; }
  const it=dr.items[dr.i];
  M().innerHTML=`<section class="view"><div class="row" style="justify-content:space-between"><button class="btn sm ghost" id="menu">← Drills</button><b>Numbers sprint</b><span class="muted">${dr.i+1}/15 · streak ${dr.streak}</span></div>
  <div class="panel" style="display:grid;gap:14px;border-top:6px solid ${ucol(it.n[0])}"><span class="eyebrow" style="color:${ucol(it.n[0])}">Unit ${it.n[0]}</span><div class="numq">${esc(it.n[2])}</div>
  <div class="numopts">${it.opts.map(o=>{let cls=""; if(dr.ans!==null){ if(o===it.n[1]) cls="ok"; else if(o===dr.ans) cls="no";} return `<button class="${cls}" data-o="${esc(o)}" ${dr.ans!==null?"disabled":""}>${esc(o)}</button>`}).join("")}</div>
  ${dr.ans!==null?`<div class="row" style="justify-content:flex-end"><button class="btn primary" id="nx">Next →</button></div>`:""}</div></section>`;
  $("#menu").onclick=VIEWS.drills;
  M().querySelectorAll(".numopts button").forEach(b=>b.onclick=()=>{dr.ans=b.dataset.o; if(dr.ans===it.n[1]){dr.ok++;dr.streak++;dr.best=Math.max(dr.best,dr.streak)} else dr.streak=0; renderNum();});
  if($("#nx")) $("#nx").onclick=()=>{dr.i++;dr.ans=null;renderNum()};
}

// ───────── EXPLAINERS ─────────
let vp=null;
const synth=("speechSynthesis" in window)?window.speechSynthesis:null;
let voice=null;
function pickVoice(){ if(!synth) return; const vs=synth.getVoices(); voice=vs.find(v=>/en[-_]GB/i.test(v.lang)&&/female|serena|kate|libby|sonia|google uk/i.test(v.name))||vs.find(v=>/en[-_](GB|US)/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null; }
if(synth){ pickVoice(); synth.onvoiceschanged=pickVoice; }
function stopVideo(){ if(vp){ vp.playing=false; clearTimeout(vp.tm); } if(synth) try{synth.cancel()}catch(e){} }
VIEWS.videos=function(id){
  stopVideo(); vp=null;
  if(!id){
    M().innerHTML=`<section class="view"><div><div class="eyebrow">Made for this course · narrated</div><h1 class="h1">Explainers</h1><p class="lead">Short animated explainers, one per big topic. Press play and listen (your device reads the narration aloud), or turn the voice off and read the captions. Each takes 1–2 minutes.</p></div>
    <div class="grid2">${VIDEOS.map(v=>`<button class="mode" data-v="${v.id}" style="border-top:6px solid ${ucol(v.u)}"><span class="eyebrow" style="color:${ucol(v.u)}">Unit ${v.u} · ${v.scenes.length} scenes · ~${Math.round(v.scenes.reduce((a,s)=>a+s.s.split(" ").length,0)/150*60/10)*10}s</span><h3>${v.title}</h3></button>`).join("")}</div>
    ${synth?"":`<p class="tip">Your browser doesn't offer text-to-speech here, so explainers play with captions only.</p>`}</section>`;
    M().querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>VIEWS.videos(b.dataset.v));
    return;
  }
  const v=VIDEOS.find(x=>x.id===id);
  vp={v,i:0,playing:false,tm:null,voiceOn:S.prefs.voice!==false&&!!synth,rate:S.prefs.rate||1};
  M().innerHTML=`<section class="view" style="--c:${ucol(v.u)};justify-items:center">
  <div class="row" style="width:100%;max-width:820px;justify-content:space-between"><button class="btn sm ghost" id="vback">← All explainers</button><b>${v.title}</b></div>
  <div class="stage" id="stage"></div>
  <div class="pdots" id="pdots"></div>
  <div class="caption" id="cap"></div>
  <div class="row" style="justify-content:center">
    <button class="btn" id="vprev">← Back</button><button class="btn primary" id="vplay">▶ Play</button><button class="btn" id="vnext">Next →</button>
    <button class="chip" id="vvoice" aria-pressed="${vp.voiceOn}" ${synth?"":"disabled"}>Voice</button>
    <select id="vrate" class="chip" aria-label="Speed">${[0.85,1,1.15,1.3].map(r=>`<option value="${r}" ${r==vp.rate?"selected":""}>${r}×</option>`).join("")}</select>
  </div>
  <div class="row" style="justify-content:center"><button class="btn sm ghost" id="vlearn">Read Unit ${v.u} lesson</button><button class="btn sm ghost" id="vcards">Unit ${v.u} flashcards</button></div></section>`;
  $("#vback").onclick=()=>VIEWS.videos(); $("#vprev").onclick=()=>vStep(-1); $("#vnext").onclick=()=>vStep(1); $("#vplay").onclick=togglePlay;
  $("#vvoice").onclick=()=>{vp.voiceOn=!vp.voiceOn;S.prefs.voice=vp.voiceOn;save();$("#vvoice").setAttribute("aria-pressed",vp.voiceOn); if(!vp.voiceOn&&synth)synth.cancel(); if(vp.playing){clearTimeout(vp.tm);playScene();}};
  $("#vrate").onchange=e=>{vp.rate=+e.target.value;S.prefs.rate=vp.rate;save()};
  $("#vlearn").onclick=()=>go("learn",v.u); $("#vcards").onclick=()=>{cardSel=new Set([v.u]);go("cards")};
  showScene();
};
function showScene(){
  const sc=vp.v.scenes[vp.i];
  $("#stage").innerHTML=`<div class="scene">${sc.v}</div>`;
  $("#cap").textContent=sc.s;
  $("#pdots").innerHTML=vp.v.scenes.map((_,j)=>`<i class="${j<=vp.i?"on":""}"></i>`).join("");
}
function playScene(){
  if(!vp||!vp.playing) return;
  const sc=vp.v.scenes[vp.i]; clearTimeout(vp.tm);
  const advance=()=>{ if(!vp||!vp.playing) return; if(vp.i<vp.v.scenes.length-1){ vp.i++; showScene(); vp.tm=setTimeout(playScene,500);} else { vp.playing=false; $("#vplay").textContent="↺ Replay"; } };
  if(vp.voiceOn&&synth){
    try{ synth.cancel(); const u=new SpeechSynthesisUtterance(sc.s); if(voice)u.voice=voice; u.lang=voice?voice.lang:"en-GB"; u.rate=vp.rate; let fired=false; const fin=()=>{if(fired)return;fired=true;advance()}; u.onend=fin; u.onerror=()=>{ if(!fired){fired=true; vp.tm=setTimeout(advance, readMs(sc.s));} }; synth.speak(u);
      vp.tm=setTimeout(()=>{ if(!fired&&!synth.speaking){fired=true;advance()} }, readMs(sc.s)+4000);
    }catch(e){ vp.tm=setTimeout(advance,readMs(sc.s)); }
  } else vp.tm=setTimeout(advance,readMs(sc.s));
}
const readMs=t=>Math.max(3500,t.split(/\s+/).length/ (2.6*(vp?vp.rate:1)) *1000);
function togglePlay(){
  if(!vp) return;
  if(vp.playing){ vp.playing=false; clearTimeout(vp.tm); if(synth)synth.cancel(); $("#vplay").textContent="▶ Play"; return; }
  if(vp.i>=vp.v.scenes.length-1&&$("#vplay").textContent.includes("Replay")){ vp.i=0; showScene(); }
  vp.playing=true; $("#vplay").textContent="❚❚ Pause"; playScene();
}
function vStep(d){ if(!vp) return; const n=vp.i+d; if(n<0||n>=vp.v.scenes.length) return; clearTimeout(vp.tm); if(synth)synth.cancel(); vp.i=n; showScene(); if(vp.playing) vp.tm=setTimeout(playScene,300); }

// ───────── CHEAT SHEET ─────────
VIEWS.sheet=function(sub){
  sub=sub||S.prefs.sheet||"compare"; S.prefs.sheet=sub; save();
  const subs=[["compare","S.A. vs S.L."],["numbers","Numbers"],["majorities","GM rules"],["confuse","Confusables"],["glossary","Glossary EN·ES·DE"]];
  let body="";
  if(sub==="compare") body=`<div class="panel tblwrap">${LESSONS[2].sections[0].body}</div><div class="panel tblwrap">${LESSONS[1].sections[5].body}</div>`;
  if(sub==="numbers") body=`<input class="search" id="nsearch" placeholder="Filter, e.g. month, 25%, S.A."><div class="panel tblwrap"><table class="tbl numtbl" id="ntbl"><tr><th>Unit</th><th>Number</th><th>What</th></tr>${NUMBERS.slice().sort((a,b)=>a[0]-b[0]).map(n=>`<tr><td><span class="dot" style="display:inline-block;--c:${ucol(n[0])}"></span> ${n[0]}</td><td>${esc(n[1])}</td><td>${esc(n[2])}</td></tr>`).join("")}</table></div>`;
  if(sub==="majorities") body=`<div class="panel tblwrap">${LESSONS[3].sections[3].body}</div><div class="panel">${LESSONS[3].sections[1].body}</div><div class="panel">${LESSONS[3].sections[4].body}</div>`;
  if(sub==="confuse") body=`<div class="conf">${CONFUSE.map(c=>`<div class="panel"><h4>${esc(c.t)}</h4><div class="tblwrap"><table class="tbl"><tr><th></th><th>${esc(c.a)}</th><th>${esc(c.b)}</th></tr>${c.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</table></div></div>`).join("")}</div>`;
  if(sub==="glossary") body=`<input class="search" id="gsearch" placeholder="Search a term in any language"><div class="panel tblwrap"><table class="tbl" id="gtbl"><tr><th>English (exam)</th><th>Español</th><th>Deutsch</th></tr>${GLOSSARY.map(g=>`<tr><td>${esc(g[0])}</td><td>${esc(g[1])}</td><td>${esc(g[2])}</td></tr>`).join("")}</table></div>`;
  M().innerHTML=`<section class="view"><div><div class="eyebrow">Wednesday morning</div><h1 class="h1">Cheat sheet</h1><p class="lead">The comparisons, numbers and look-alikes that decide multiple-choice questions.</p></div>
  <div class="subtabs">${subs.map(([k,l])=>`<button class="chip" aria-pressed="${k===sub}" data-s="${k}">${l}</button>`).join("")}</div>${body}</section>`;
  M().querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>VIEWS.sheet(b.dataset.s));
  const filt=(inp,tbl)=>{const i=$(inp); if(i) i.oninput=()=>{const v=i.value.toLowerCase(); $(tbl).querySelectorAll("tr").forEach((tr,k)=>{ if(k) tr.hidden=!tr.textContent.toLowerCase().includes(v)})}};
  filt("#nsearch","#ntbl"); filt("#gsearch","#gtbl");
};

// ───────── boot ─────────
new MutationObserver(()=>{M().querySelectorAll("table.tbl").forEach(t=>{ if(!t.parentElement.classList.contains("tblwrap")){ const w=document.createElement("div"); w.className="tblwrap"; t.replaceWith(w); w.appendChild(t);} })}).observe(M(),{childList:true,subtree:true});
renderTabs(); countdown(); setInterval(countdown,60000);
if(!VIEWS[current]) current="home";
go(current);
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
